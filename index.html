    // independently-swiveling gun+arm with the same M4-style rifle silhouette) but recolored
    // into a dark grey/black hostile uniform with red trim and a red helmet/visor.
    function drawEnemyOfficerFull(e, dirAngle){
      const r = e.r;
      const recoil = e.muzzleFlash > 0 ? r*0.22 : 0;
    ctx.save();

    // cinematic long shadow — offset further and softened in two layers, like a low raking sun,
    // instead of a flat cartoon blob glued to the feet
    ctx.fillStyle = 'rgba(0,0,0,0.16)';
    ctx.beginPath(); ctx.ellipse(r*0.9, r*0.7, r*2.0, r*0.7, 0.2, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,0.26)';
    ctx.beginPath(); ctx.ellipse(r*0.4, r*0.4, r*1.3, r*0.75, 0.15, 0, Math.PI*2); ctx.fill();

    // NOTE: body (legs/torso/head) is intentionally NOT rotated to face dirAngle anymore —
    // that used to spin the whole upright silhouette onto its side whenever the officer walked
    // or aimed away from due-east. The body always stays in its natural standing pose; only the
    // gun+firing arm (wrapped in its own rotate group below) swivels to track the aim direction.
    ctx.scale(1, PLAYER_HEIGHT_MULT); // taller, leaner officer than a plain bigger blob
    const crouch = 0;     // 0 = standing/walking, 1 = kneeling, 2 = full prone
    const lean = 0;         // 0..1 forward lean while moving — the "skating into it" feel
    const kneelF = Math.min(1, crouch);      // 0..1 progress into the kneel
    const proneF = Math.max(0, crouch - 1);  // 0..1 progress kneel -> prone

    // whole body sits lower the deeper the stance: a relaxed weight shift while moving,
    // a real drop onto one knee, then flat to the ground once fully prone
    ctx.translate(lean*r*0.14, kneelF*r*0.24 + proneF*r*0.5);

    // one shared "bone" segment so walking, kneeling and prone legs can all reuse the same draw call
    function limb(x1,y1,x2,y2,w,color){
      const dx=x2-x1, dy=y2-y1, len=Math.hypot(dx,dy)||0.0001;
      const nx=-dy/len*w, ny=dx/len*w;
      ctx.fillStyle=color;
      ctx.beginPath();
      ctx.moveTo(x1+nx,y1+ny); ctx.lineTo(x2+nx,y2+ny);
      ctx.lineTo(x2-nx,y2-ny); ctx.lineTo(x1-nx,y1-ny);
      ctx.closePath(); ctx.fill();
    }
    // blends smoothly across all three stances: t 0..1 = stand->kneel, t 1..2 = kneel->prone
    function mixPt(a,b,c,t){
      if (t<=1) return { x:a.x+(b.x-a.x)*t, y:a.y+(b.y-a.y)*t };
      const u=t-1; return { x:b.x+(c.x-b.x)*u, y:b.y+(c.y-b.y)*u };
    }

    // legs — two-segment (thigh+shin), continuously blended between three real firing
    // stances: standing/walking stride, kneeling on one knee, and fully prone on the ground.
    // Left/right turning still works in every stance since the whole body (this function
    // included) is rotated to face aimAngle before any of this is drawn.
    function drawLeg(side, phase){
      const baseX = side*r*0.25;
      const hip = { x:baseX, y:r*0.28 };

      // duty-cycle gait: a quick lifted swing (foot leaves the ground and snaps
      // to the next footfall) followed by a longer flat-footed stance (foot stays
      // planted while the body's weight carries over it) — reads as real alternating
      // footsteps instead of a smooth pendulum that looks like the foot is dragging.
      const cyc = ((phase % (Math.PI*2)) + Math.PI*2) % (Math.PI*2);
      const gaitT = cyc / (Math.PI*2);
      const swingFrac = 0.35; // fraction of the cycle spent airborne/swinging forward
      let stride, lift;
      if (gaitT < swingFrac){
        const u = gaitT/swingFrac;
        const ease = u<0.5 ? 2*u*u : 1-Math.pow(-2*u+2,2)/2; // ease-in-out
        stride = (-1 + 2*ease)*r*0.26;
        lift = Math.sin(u*Math.PI)*r*0.19; // arcs up then back down mid-swing
      } else {
        const u = (gaitT-swingFrac)/(1-swingFrac);
        stride = (1 - 2*u)*r*0.26; // planted foot slides back as the body moves over it
        lift = 0;
      }
      const kneeStand = { x:baseX+stride*0.3, y:hip.y+r*0.42-lift };
      const footStand = { x:baseX+stride,     y:hip.y+r*0.95-lift*0.4 };

      // kneeling: support leg's knee drops to the ground, the other leg plants
      // forward bent up — the classic tactical one-knee firing position
      const kneeKneel = side<0 ? { x:baseX-r*0.05, y:hip.y+r*0.42 } : { x:baseX+r*0.22, y:hip.y+r*0.24 };
      const footKneel = side<0 ? { x:baseX+r*0.2,  y:hip.y+r*0.58 } : { x:baseX+r*0.44, y:hip.y+r*0.02 };

      // prone: both legs splayed flat and trailing low, close to the ground
      const kneeProne = { x:baseX+side*r*0.12, y:hip.y-r*0.05 };
      const footProne = { x:baseX+side*r*0.34, y:hip.y+r*0.28 };

      const knee = mixPt(kneeStand, kneeKneel, kneeProne, crouch);
      const foot = mixPt(footStand, footKneel, footProne, crouch);

      limb(hip.x, hip.y, knee.x, knee.y, r*0.12, '#262626');       // thigh
      ctx.fillStyle = '#141414';
      ctx.beginPath(); ctx.ellipse(knee.x, knee.y, r*0.13, r*0.09, 0, 0, Math.PI*2); ctx.fill(); // knee pad
      limb(knee.x, knee.y, foot.x, foot.y, r*0.11, '#1c0d0d');     // shin
      ctx.save();
      ctx.translate(foot.x, foot.y);
      ctx.rotate(Math.atan2(foot.y-knee.y, foot.x-knee.x));
      ctx.fillStyle = '#0d0d0d';
      ctx.fillRect(-r*0.1, -r*0.11, r*0.34, r*0.22);              // boot
      ctx.fillStyle = 'rgba(255,255,255,0.16)';
      ctx.fillRect(-r*0.1, -r*0.11, r*0.34, r*0.05);              // glossy leather highlight
      ctx.strokeStyle = 'rgba(0,0,0,0.55)'; ctx.lineWidth = 1;
      ctx.strokeRect(-r*0.1, -r*0.11, r*0.34, r*0.22);
      ctx.restore();
    }
    drawLeg(-1, (e.walkPhase||0));
    drawLeg(1, (e.walkPhase||0)+Math.PI);

    // tactical belt at the waist to break up torso/leg into a real body proportion
    ctx.fillStyle = '#0d0606';
    ctx.fillRect(-r*0.58, r*0.28, r*1.16, r*0.1);

    // off-hand arm — swings opposite the legs while walking, settles once kneeling/prone
    const offSwing = Math.sin((e.walkPhase||0)+Math.PI)*r*0.18*Math.max(0, 1-crouch);
    ctx.fillStyle = '#3a3a3a';
    ctx.save();
    ctx.translate(-r*0.55, -r*0.05);
    ctx.rotate(offSwing*0.05);
    ctx.fillRect(-r*0.09, 0, r*0.18, r*0.5);
    ctx.fillStyle = '#2a2a2a';
    ctx.fillRect(-r*0.1, r*0.44, r*0.2, r*0.14); // glove
    ctx.restore();

    // torso — shaded tactical vest over uniform
    const torsoGrad = ctx.createLinearGradient(0,-r*0.3,0,r*0.5);
    torsoGrad.addColorStop(0, '#3a3a3a');
    torsoGrad.addColorStop(1, '#141414');
    ctx.fillStyle = torsoGrad;
    ctx.fillRect(-r*0.58, -r*0.32, r*1.16, r*0.84);
    // chest rig / plate carrier
    ctx.fillStyle = 'rgba(10,10,12,0.85)';
    ctx.fillRect(-r*0.42, -r*0.24, r*0.84, r*0.5);
    // ammo pouches
    ctx.fillStyle = '#0d0606';
    ctx.fillRect(-r*0.34, -r*0.05, r*0.22, r*0.26);
    ctx.fillRect(r*0.12, -r*0.05, r*0.22, r*0.26);
    ctx.strokeStyle = 'rgba(255,255,255,0.08)'; ctx.lineWidth = 1;
    ctx.strokeRect(-r*0.34, -r*0.05, r*0.22, r*0.26);
    ctx.strokeRect(r*0.12, -r*0.05, r*0.22, r*0.26);
    // chest straps
    ctx.strokeStyle = 'rgba(0,0,0,0.35)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(-r*0.4,-r*0.3); ctx.lineTo(-r*0.15,r*0.4); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(r*0.4,-r*0.3); ctx.lineTo(r*0.15,r*0.4); ctx.stroke();
    ctx.strokeStyle = 'rgba(0,0,0,0.4)'; ctx.lineWidth = 1;
    ctx.strokeRect(-r*0.58, -r*0.32, r*1.16, r*0.84);
    // shoulder armor pads
    ctx.fillStyle = '#5e1a1a';
    ctx.beginPath(); ctx.ellipse(-r*0.58,-r*0.28,r*0.16,r*0.13,0,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(r*0.58,-r*0.28,r*0.16,r*0.13,0,0,Math.PI*2); ctx.fill();

    // backpack (rucksack)
    ctx.fillStyle = '#1a0d0d';
    ctx.fillRect(-r*0.5, -r*0.2, r*0.4, r*0.6);
    ctx.strokeStyle = 'rgba(255,255,255,0.1)'; ctx.lineWidth = 0.5; ctx.stroke();

    // gun + firing arm swivel independently of the body to track the aim direction — this is the
    // one part of the officer that should turn freely. The gun's local +x axis is already the
    // "0 degrees = aim right" reference, so it rotates by dirAngle directly (no extra offset).
    ctx.save();
    ctx.rotate(dirAngle);

    // arms (with gun) — tactical glove + sleeve
    ctx.fillStyle = '#3a3a3a';
    ctx.fillRect(-r*0.72, -r*0.17, r*0.3, r*0.22);
    ctx.fillStyle = '#2a2a2a';
    ctx.fillRect(-r*0.46, -r*0.15, r*0.16, r*0.2); // glove
    
    // gun — shape, length and color now match the equipped weapon
    const gunColor = '#ff5555';
    let barrelLen = r*1.2;
    if ('rifle' === 'pistol') barrelLen = r*1.5;
    else if ('rifle' === 'smg') barrelLen = r*0.95;
    else if ('rifle' === 'shotgun') barrelLen = r*1.05;
    else if ('rifle' === 'rifle') barrelLen = r*1.5;
    else if ('rifle' === 'missile') barrelLen = r*1.15;
    else if ('rifle' === 'spear') barrelLen = r*1.9;
    else if ('rifle' === 'chakra') barrelLen = r*0.6;
    const barrelH = ('rifle' === 'shotgun' || 'rifle' === 'missile') ? r*0.26 : r*0.15;

    const rx = r*0.1 - recoil;

    if ('rifle' === 'chakra'){
      // spinning disc held at the hand instead of a gun barrel
      ctx.save();
      ctx.translate(rx+r*0.55, -r*0.12);
      ctx.rotate(performance.now()/130);
      ctx.strokeStyle = gunColor; ctx.lineWidth = 2.2;
      ctx.shadowColor = gunColor; ctx.shadowBlur = 9;
      ctx.beginPath(); ctx.arc(0,0,r*0.4,0,Math.PI*2); ctx.stroke();
      for (let k=0;k<6;k++){
        const a2 = (Math.PI*2/6)*k;
        ctx.beginPath();
        ctx.moveTo(Math.cos(a2)*r*0.14, Math.sin(a2)*r*0.14);
        ctx.lineTo(Math.cos(a2)*r*0.4, Math.sin(a2)*r*0.4);
        ctx.stroke();
      }
      ctx.shadowBlur = 0;
      ctx.restore();
    } else if ('rifle' === 'spear'){
      // long shaft with a triangular blade tip
      ctx.fillStyle = '#5a3d1f';
      ctx.fillRect(rx, -r*0.06, barrelLen, r*0.1);
      ctx.fillStyle = gunColor;
      ctx.shadowColor = gunColor; ctx.shadowBlur = 8;
      ctx.beginPath();
      ctx.moveTo(rx+barrelLen, 0);
      ctx.lineTo(rx+barrelLen*0.8, -r*0.18);
      ctx.lineTo(rx+barrelLen*0.8, r*0.18);
      ctx.closePath(); ctx.fill();
      ctx.shadowBlur = 0;
    } else {
      // barrel banded: trigger/receiver end gunmetal, middle red, muzzle end gunmetal
      const segBack = barrelLen*0.3, segMid = barrelLen*0.4, segFront = barrelLen*0.3;
      ctx.fillStyle = '#3a3d42';
      ctx.fillRect(rx, -r*0.2, segBack, barrelH); // trigger/receiver
      ctx.fillStyle = '#c81e2b';
      ctx.fillRect(rx+segBack, -r*0.2, segMid, barrelH); // middle
      ctx.fillStyle = '#3a3d42';
      ctx.fillRect(rx+segBack+segMid, -r*0.2, segFront, barrelH); // muzzle mouth
      // metallic shine — a thin bright streak along the top of the whole barrel
      ctx.fillStyle = 'rgba(255,255,255,0.28)';
      ctx.fillRect(rx, -r*0.2, barrelLen, barrelH*0.22);
      ctx.strokeStyle = gunColor; ctx.lineWidth = 1;
      ctx.shadowColor = gunColor; ctx.shadowBlur = 6;
      ctx.strokeRect(rx, -r*0.2, barrelLen, barrelH);
      ctx.shadowBlur = 0;

      // weapon-specific attachment so the silhouette reads differently at a glance
      if ('rifle' === 'rifle' || 'rifle' === 'pistol'){
        // M4-style carbine: ribbed handguard, carry handle, front sight post, curved mag
        ctx.fillStyle = '#16181c';
        ctx.fillRect(rx+barrelLen*0.08, -r*0.24, barrelLen*0.42, barrelH+r*0.08); // ribbed handguard block
        ctx.strokeStyle = 'rgba(0,0,0,0.5)'; ctx.lineWidth = 1;
        for (let rib=0; rib<5; rib++){
          const ribX = rx+barrelLen*0.1 + rib*(barrelLen*0.42/5);
          ctx.beginPath(); ctx.moveTo(ribX, -r*0.24); ctx.lineTo(ribX, -r*0.24+barrelH+r*0.08); ctx.stroke();
        }
        ctx.fillStyle = '#111';
        ctx.fillRect(rx+barrelLen*0.32, -r*0.42, barrelLen*0.16, r*0.2); // carry handle / rear sight
        ctx.fillStyle = gunColor;
        ctx.shadowColor = gunColor; ctx.shadowBlur = 5;
        ctx.fillRect(rx+barrelLen*0.86, -r*0.32, r*0.05, r*0.24); // front sight post
        ctx.shadowBlur = 0;
        // curved banana magazine hanging below the receiver
        ctx.fillStyle = '#2a2f38';
        ctx.beginPath();
        ctx.moveTo(rx+barrelLen*0.14, -r*0.05);
        ctx.quadraticCurveTo(rx+barrelLen*0.1, r*0.35, rx+barrelLen*0.05, r*0.5);
        ctx.lineTo(rx+barrelLen*0.24, r*0.5);
        ctx.quadraticCurveTo(rx+barrelLen*0.26, r*0.2, rx+barrelLen*0.26, -r*0.05);
        ctx.closePath(); ctx.fill();
        ctx.strokeStyle = 'rgba(0,0,0,0.4)'; ctx.lineWidth = 1; ctx.stroke();
        // stock
        ctx.fillStyle = '#1c1e22';
        ctx.fillRect(rx-barrelLen*0.18, -r*0.14, barrelLen*0.2, r*0.2);
      } else if ('rifle' === 'shotgun'){
        ctx.fillStyle = '#3a2a1a';
        ctx.fillRect(rx+barrelLen*0.2, -r*0.2+barrelH, barrelLen*0.4, r*0.11); // pump grip
      } else if ('rifle' === 'smg'){
        ctx.fillStyle = '#2a2f38';
        ctx.fillRect(rx+r*0.18, -r*0.2+barrelH, r*0.12, r*0.26); // hanging magazine
      } else if ('rifle' === 'missile'){
        // striped warhead tip on the launcher tube
        ctx.fillStyle = gunColor;
        ctx.fillRect(rx+barrelLen*0.78, -r*0.2, barrelLen*0.22, barrelH);
      }

      // holo gun sight (color matches equipped weapon)
      ctx.fillStyle = gunColor;
      ctx.shadowColor = gunColor; ctx.shadowBlur=8;
      ctx.fillRect(rx+barrelLen*0.67, -r*0.3, r*0.15, r*0.05);
      ctx.fillRect(rx+barrelLen*0.75, -r*0.28, r*0.05, r*0.15);
      ctx.shadowBlur=0;
    }

    // small muzzle glow when firing (no fire/spark effect, just a brief flash at the barrel tip)
    if (recoil > r*0.18 && 'rifle' !== 'spear' && 'rifle' !== 'chakra'){
      ctx.fillStyle = gunColor;
      ctx.shadowColor = gunColor; ctx.shadowBlur = 8;
      ctx.beginPath(); ctx.arc(rx+barrelLen+r*0.1, -r*0.2+barrelH/2, r*0.12, 0, Math.PI*2); ctx.fill();
      ctx.shadowBlur = 0;
    }

    ctx.restore(); // end gun+arm swivel group — head/helmet below stay in the body's fixed frame

    // counter the body's vertical stretch just for the head/helmet, anchored at the neckline,
    // so a taller PLAYER_HEIGHT_MULT gives a taller adult body with a normally-proportioned
    // round head (like a real grown officer) instead of an elongated egg-shaped head.
    ctx.save();
    const HEAD_ANCHOR_Y = -r*0.55; // roughly the neckline, in pre-counter-scale body coords
    ctx.translate(0, HEAD_ANCHOR_Y);
    ctx.scale(1, 1/PLAYER_HEIGHT_MULT);
    ctx.translate(0, -HEAD_ANCHOR_Y);

    // head/helmet appearance now depends on facing direction (dirAngle) — full face only
    // when aiming toward the camera (down), back of the helmet when moving/aiming away (up),
    // and a side profile with one goggle lens when aiming left or right
    let facingAngle = dirAngle;
    while (facingAngle > Math.PI) facingAngle -= Math.PI*2;
    while (facingAngle < -Math.PI) facingAngle += Math.PI*2;
    const facingDeg = facingAngle * 180 / Math.PI;
    let headFacing;
    if (facingDeg > -135 && facingDeg <= -45) headFacing = 'back';
    else if (facingDeg > 45 && facingDeg <= 135) headFacing = 'front';
    else if (facingDeg > -45 && facingDeg <= 45) headFacing = 'right';
    else headFacing = 'left';
    const sideMul = headFacing === 'left' ? -1 : 1; // mirrors the side-profile art for left vs right

    if (headFacing === 'front'){
      // head — shaded skin tone, slightly squared toward the jaw for a grown man's face, not a round toy head
      const headGrad = ctx.createRadialGradient(-r*0.12,-r*0.72,r*0.05,0,-r*0.65,r*0.42);
      headGrad.addColorStop(0, '#dcb488');
      headGrad.addColorStop(1, '#a9805a');
      ctx.fillStyle = headGrad;
      ctx.beginPath();
      ctx.ellipse(0, -r*0.66, r*0.38, r*0.42, 0, 0, Math.PI*2);
      ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,0.3)'; ctx.lineWidth = 1.5; ctx.stroke();
      // stronger jawline shading for a defined, mature jaw
      ctx.strokeStyle = 'rgba(0,0,0,0.22)'; ctx.lineWidth = 2.2;
      ctx.beginPath(); ctx.arc(0, -r*0.56, r*0.3, 0.15, Math.PI-0.15); ctx.stroke();
      // stubble/5-o'clock-shadow tone on the lower jaw — reads as a rugged adult officer
      ctx.fillStyle = 'rgba(50,35,25,0.22)';
      ctx.beginPath(); ctx.ellipse(0, -r*0.5, r*0.28, r*0.14, 0, 0, Math.PI); ctx.fill();
    } else if (headFacing === 'back'){
      // just a sliver of neck/nape skin peeking below the helmet — no face, we're looking at the back
      const napeGrad = ctx.createRadialGradient(0,-r*0.55,r*0.05,0,-r*0.55,r*0.3);
      napeGrad.addColorStop(0, '#c8a276');
      napeGrad.addColorStop(1, '#8f6c48');
      ctx.fillStyle = napeGrad;
      ctx.beginPath(); ctx.ellipse(0, -r*0.52, r*0.26, r*0.18, 0, 0, Math.PI*2); ctx.fill();
    } else {
      // side profile — skin only on the facing side, with a small nose bump toward that side
      const headGrad = ctx.createRadialGradient(sideMul*r*0.05,-r*0.72,r*0.05,0,-r*0.65,r*0.42);
      headGrad.addColorStop(0, '#dcb488');
      headGrad.addColorStop(1, '#a9805a');
      ctx.fillStyle = headGrad;
      ctx.beginPath();
      ctx.ellipse(sideMul*r*0.06, -r*0.66, r*0.34, r*0.42, 0, 0, Math.PI*2);
      ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,0.3)'; ctx.lineWidth = 1.5; ctx.stroke();
      ctx.fillStyle = '#c49a70';
      ctx.beginPath(); ctx.ellipse(sideMul*r*0.32, -r*0.62, r*0.08, r*0.1, 0, 0, Math.PI*2); ctx.fill(); // nose
      ctx.strokeStyle = 'rgba(0,0,0,0.22)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(sideMul*r*0.06, -r*0.56, r*0.26, 0.2, Math.PI-0.2); ctx.stroke();
    }

    // tactical helmet — full dome from behind (we see all the way around it), half-dome
    // brow-line otherwise; common shell so it reads consistently across every facing
    const helmGrad = ctx.createLinearGradient(0,-r*1.1,0,-r*0.6);
    helmGrad.addColorStop(0, '#5a1616');
    helmGrad.addColorStop(1, '#200a0a');
    ctx.fillStyle = helmGrad;
    ctx.beginPath();
    if (headFacing === 'back') ctx.arc(0, -r*0.72, r*0.5, 0, Math.PI*2);
    else ctx.arc(0, -r*0.7, r*0.48, 0, Math.PI, true);
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.4)'; ctx.lineWidth = 1; ctx.stroke();

    if (headFacing === 'back'){
      // center seam + nape strap read clearly as the back of the helmet
      ctx.strokeStyle = 'rgba(0,0,0,0.25)'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(0,-r*1.18); ctx.lineTo(0,-r*0.32); ctx.stroke();
      ctx.fillStyle = 'rgba(0,0,0,0.3)';
      ctx.fillRect(-r*0.16, -r*0.36, r*0.32, r*0.08);
    } else {
      // helmet side rail
      ctx.fillStyle = 'rgba(0,0,0,0.3)';
      ctx.fillRect(-r*0.48, -r*0.78, r*0.1, r*0.2);
      ctx.fillRect(r*0.38, -r*0.78, r*0.1, r*0.2);
    }

    if (headFacing === 'front'){
      // tactical goggles (band across both eyes instead of cartoon dot eyes)
      ctx.fillStyle = '#0d0d0d';
      ctx.fillRect(-r*0.32, -r*0.78, r*0.64, r*0.16);
      ctx.fillStyle = 'rgba(255,90,90,0.55)';
      ctx.shadowColor = 'rgba(255,90,90,0.7)'; ctx.shadowBlur = 5;
      ctx.beginPath(); ctx.ellipse(-r*0.15,-r*0.7,r*0.13,r*0.07,0,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(r*0.15,-r*0.7,r*0.13,r*0.07,0,0,Math.PI*2); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.strokeStyle = 'rgba(0,0,0,0.5)'; ctx.lineWidth = 1;
      ctx.strokeRect(-r*0.32, -r*0.78, r*0.64, r*0.16);
    } else if (headFacing === 'left' || headFacing === 'right'){
      // single goggle lens on the facing side only
      ctx.fillStyle = '#0d0d0d';
      ctx.fillRect(sideMul*r*0.36 - r*0.16, -r*0.78, r*0.32, r*0.16);
      ctx.fillStyle = 'rgba(255,90,90,0.55)';
      ctx.shadowColor = 'rgba(255,90,90,0.7)'; ctx.shadowBlur = 5;
      ctx.beginPath(); ctx.ellipse(sideMul*r*0.36,-r*0.7,r*0.11,r*0.07,0,0,Math.PI*2); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.strokeStyle = 'rgba(0,0,0,0.5)'; ctx.lineWidth = 1;
      ctx.strokeRect(sideMul*r*0.36 - r*0.16, -r*0.78, r*0.32, r*0.16);
    }
    // 'back' facing draws no goggles at all — just the helmet dome, as expected from behind

    ctx.restore(); // end head counter-scale
    ctx.restore(); // end enemy-officer transform (body height scale)
    }

    // enemies (hostiles) — concealed/hidden ones are drawn faint until they ambush
    for (const e of (demon ? [] : enemies)){ // v121: not drawn at all while the middle giant lives

      ctx.save();
      ctx.translate(e.x,e.y);
      ctx.scale(psm, psm); // match the player officer's restored size
      const depthFade = groundFade(e.y);
      if (e.hidden) ctx.globalAlpha = 0.32*depthFade;
      else ctx.globalAlpha = depthFade;

      // health bar (drawn upright, before rotation) — hidden while concealed
      if (!e.hidden){
        const w = e.r*2;
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fillRect(-w/2, -e.r-12, w, 5);
        ctx.fillStyle = '#ff2222';
        ctx.fillRect(-w/2, -e.r-12, w*Math.max(0,e.hp/e.maxHp), 5);
      }

      const angToPlayer = e.hidden ? 0 : Math.atan2(player.y-e.y, player.x-e.x);

      // body — the officer squad gets the full player-matching soldier rig (legs, belt,
      // vest, backpack, head/helmet, gun). Same as the player: the body stays upright and
      // is NEVER rotated (rotating it would stretch the PLAYER_HEIGHT_MULT height-scale
      // sideways and make it look like it's lying down whenever it faces left/right) —
      // only the gun+arm swivel and the front/back/left/right head-facing pick up the
      // actual direction, exactly mirroring how the player officer is drawn.
      const isElite = e.eliteOfficer;
      if (isElite){
        if (e.hidden){
          ctx.fillStyle = e.tint || '#3a1414';
          ctx.beginPath(); ctx.ellipse(0,0,e.r*0.6,e.r*0.5,0,0,Math.PI*2); ctx.fill();
        } else {
          drawEnemyOfficerFull(e, angToPlayer);
        }
      } else {
        ctx.rotate(angToPlayer);
        ctx.fillStyle = e.hidden ? (e.tint||'#2a1a1a') : '#221822';
        ctx.fillRect(-e.r*0.5, -e.r*0.5, e.r*1, e.r*1);
        ctx.strokeStyle = 'rgba(255,50,90,0.5)'; ctx.lineWidth=2; ctx.stroke();

        // enemy head with glowing visor
        ctx.fillStyle = '#2a1f28';
        ctx.beginPath(); ctx.arc(-e.r*0.15, 0, e.r*0.42, 0, Math.PI*2); ctx.fill();
        ctx.strokeStyle = 'rgba(255,50,90,0.4)'; ctx.lineWidth=1.5; ctx.stroke();
        if (!e.hidden){
          ctx.fillStyle = '#ff3355';
          ctx.shadowColor='rgba(255,50,90,0.9)'; ctx.shadowBlur=6;
          ctx.fillRect(-e.r*0.35, -e.r*0.08, e.r*0.4, e.r*0.16);
          ctx.shadowBlur=0;
        }

        // gun (aimed at player)
        ctx.fillStyle = '#1a1a1a';
        ctx.fillRect(e.r*0.1, -e.r*0.12, e.r*0.85, e.r*0.14);

        // chest power core
        ctx.fillStyle = 'rgba(255,60,90,0.85)';
        if (!e.hidden){ ctx.shadowColor='rgba(255,60,90,1)'; ctx.shadowBlur=5; }
        ctx.beginPath(); ctx.arc(-e.r*0.05,0,e.r*0.13,0,Math.PI*2); ctx.fill();
        ctx.shadowBlur=0;

        // muzzle flash (firing animation)
        if (e.muzzleFlash > 0){
          ctx.fillStyle = 'rgba(255,210,110,0.95)';
          ctx.beginPath(); ctx.arc(e.r*0.95, 0, e.r*0.28, 0, Math.PI*2); ctx.fill();
          ctx.fillStyle = 'rgba(255,255,255,0.85)';
          ctx.beginPath(); ctx.arc(e.r*0.95, 0, e.r*0.12, 0, Math.PI*2); ctx.fill();
        }
      }

      ctx.restore();
    }

    // particles
    for (const p of particles){
      ctx.globalAlpha = Math.max(0,p.life*2);
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x,p.y,3,0,Math.PI*2); ctx.fill();

    }

    // LIGHTNING BOLTS — sky strikes during giant landings
    for (const bolt of lightningBolts){
      const alphaMult = bolt.life / bolt.maxLife; // fade as life runs out
      ctx.save();
      ctx.globalCompositeOperation = 'lighter'; // additive blend for glow
      
      // multiple passes for thick, glowing lightning
      for (let pass = 0; pass < 3; pass++){
        if (pass === 0){
          ctx.strokeStyle = `rgba(100,150,255,${alphaMult * 0.3})`;
          ctx.lineWidth = bolt.width * 3;
          ctx.shadowColor = `rgba(100,150,255,${alphaMult * 0.5})`;

        ctx.lineJoin = 'round';

          const y = bolt.startY + (bolt.endY - bolt.startY) * t;

      }

    }

    // the single fire breath ball — one big sparking fireball, not a stream

      const fb = boss.fireBall;
      const flick = Math.sin(performance.now()/30)*0.5+0.5;
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      const fbGrad = ctx.createRadialGradient(fb.x,fb.y,0,fb.x,fb.y,fb.r*(1+0.15*flick));

      fbGrad.addColorStop(0.35, '#ffcf5a');
      fbGrad.addColorStop(0.7, '#ff6a1f');
      fbGrad.addColorStop(1, 'rgba(255,30,10,0)');

    // five-headed dragon breath — five simultaneous sparking fireballs, crimson to read as deadlier
    if (boss && boss.dragonBalls && boss.dragonBalls.length){

        const flick2 = Math.sin(performance.now()/30 + fb.x)*0.5+0.5;

        fbGrad2.addColorStop(0.35, '#ff5a8a');

    }

    if (boss && boss.warden && boss.cobraState && boss.cobraState !== 'idle' && boss.cobraLen > 0){

      ctx.strokeStyle = '#ff2a3f';
      ctx.lineWidth = 14;
      ctx.beginPath();
      cpts.forEach(function(p,i){ if (i===0) ctx.moveTo(p.x,p.y); else ctx.lineTo(p.x,p.y); });
      ctx.stroke();

      ctx.beginPath();

      ctx.restore();

    } // end !uw world layers

    ctx.save();
    ctx.translate(player.x,player.y);

    if (tornado && (tornado.state === 'spin' || tornado.state === 'crack' || tornado.state === 'blast' || tornado.state === 'swallow')){

    ctx.fillStyle = 'rgba(0,0,0,0.16)';
    ctx.beginPath(); ctx.ellipse(player.r*0.9, player.r*0.7, player.r*2.0, player.r*0.7, 0.2, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,0.26)';
    ctx.beginPath(); ctx.ellipse(player.r*0.4, player.r*0.4, player.r*1.3, player.r*0.75, 0.15, 0, Math.PI*2); ctx.fill();

    // or aimed away from due-east. The body always stays in its natural standing pose; only the
    // gun+firing arm (wrapped in its own rotate group below) swivels to track the aim direction.
    ctx.scale(1, PLAYER_HEIGHT_MULT * (1 + SIDE_HEIGHT_BOOST*(player.sideStretch||0))); // taller, leaner officer (v131: a little taller while walking left/right)
    const r = player.r;
    const crouch = player.crouch;     // 0 = standing/walking, 1 = kneeling, 2 = full prone
    const lean = player.tilt;         // 0..1 forward lean while moving — the "skating into it" feel
    const kneelF = Math.min(1, crouch);      // 0..1 progress into the kneel
    const proneF = Math.max(0, crouch - 1);  // 0..1 progress kneel -> prone

    ctx.translate(lean*r*0.14, kneelF*r*0.24 + proneF*r*0.5);

    function limb(x1,y1,x2,y2,w,color){

      const u=t-1; return { x:b.x+(c.x-b.x)*u, y:b.y+(c.y-b.y)*u };

    // legs — two-segment (thigh+shin), continuously blended between three real firing
    // stances: standing/walking stride, kneeling on one knee, and fully prone on the ground.
    // Left/right turning still works in every stance since the whole body (this function
    // included) is rotated to face aimAngle before any of this is drawn.
    function drawLeg(side, phase){
      const baseX = side*r*0.25;
      const hip = { x:baseX, y:r*0.28 };

      // duty-cycle gait: a quick lifted swing (foot leaves the ground and snaps
      // to the next footfall) followed by a longer flat-footed stance (foot stays
      // planted while the body's weight carries over it) — reads as real alternating
      // footsteps instead of a smooth pendulum that looks like the foot is dragging.
      const cyc = ((phase % (Math.PI*2)) + Math.PI*2) % (Math.PI*2);
      const gaitT = cyc / (Math.PI*2);
      const swingFrac = 0.35; // fraction of the cycle spent airborne/swinging forward
      let stride, lift;
      // mirror the whole stride horizontally to match the officer's actual movement
      // direction (player.moveDir) — without this the legs always swing to the right
      // no matter which way he's walking, which fought with the boot's own
      // direction-aware rotation further down and made the feet look like they were
      // planting on the wrong side while walking left.
      let mvFA = player.moveDir;
      while (mvFA > Math.PI) mvFA -= Math.PI*2;
      while (mvFA < -Math.PI) mvFA += Math.PI*2;
      const mvFADeg = mvFA * 180/Math.PI;
      const strideMult = (mvFADeg > -135 && mvFADeg <= -45) ? 1 : (Math.cos(mvFA) < 0 ? -1 : 1);
      if (gaitT < swingFrac){
        const u = gaitT/swingFrac;

        stride = strideMult*(-1 + 2*ease)*r*0.26;

      } else {

        stride = strideMult*(1 - 2*u)*r*0.26; // planted foot slides back as the body moves over it
        lift = 0;

      const footStand = { x:baseX+stride,     y:hip.y+r*0.95-lift*0.4 };

      // forward bent up — the classic tactical one-knee firing position
      const kneeKneel = side<0 ? { x:baseX-r*0.05, y:hip.y+r*0.42 } : { x:baseX+r*0.22, y:hip.y+r*0.24 };
      const footKneel = side<0 ? { x:baseX+r*0.2,  y:hip.y+r*0.58 } : { x:baseX+r*0.44, y:hip.y+r*0.02 };

      const kneeProne = { x:baseX+side*r*0.12, y:hip.y-r*0.05 };
      const footProne = { x:baseX+side*r*0.34, y:hip.y+r*0.28 };

      const knee = mixPt(kneeStand, kneeKneel, kneeProne, crouch);
      const foot = mixPt(footStand, footKneel, footProne, crouch);

      limb(hip.x, hip.y, knee.x, knee.y, r*0.26, '#33302a'); // v137: heavier thigh (was 0.19)       // thigh — thick, solid build
      ctx.fillStyle = '#1c1c1c';
      ctx.beginPath(); ctx.ellipse(knee.x, knee.y, r*0.23, r*0.16, 0, 0, Math.PI*2); ctx.fill(); // knee pad
      limb(knee.x, knee.y, foot.x, foot.y, r*0.205, '#2b2822'); // v137: heavier calf (was 0.165)     // shin — thick, solid build
      ctx.save();
      ctx.translate(foot.x, foot.y);
      // boot follows the officer's actual movement direction (player.moveDir), not the gun's
      // aim direction (player.dir) — those two split apart the moment auto-aim locks onto an
      // enemy on the opposite side, which used to make the boots point backward while walking
      // left. When he's walking AWAY (up-screen), pointing the toe fully "up" makes it fold
      // back along the same line as the shin and mostly disappear behind it — so for that one
      // facing we keep the boot continuing the shin's own natural downward line (the
      // knee->foot swing angle) instead, which reads as a real foot planting rather than a stub.
      let bootFA = player.moveDir;
      while (bootFA > Math.PI) bootFA -= Math.PI*2;
      while (bootFA < -Math.PI) bootFA += Math.PI*2;
      const bootFADeg = bootFA * 180/Math.PI;
      const walkingAway = bootFADeg > -135 && bootFADeg <= -45;
      if (walkingAway){
        ctx.rotate(Math.atan2(foot.y-knee.y, foot.x-knee.x));
      } else if (Math.cos(bootFA) < 0){
        // facing generally LEFT: rotating straight through ~180Β° would flip the boot upside
        // down (sole pointing up instead of down) since the shape was drawn assuming a
        // rightward-facing toe. Mirror it horizontally instead, which keeps the sole down
        // and just points the toe the other way, like a proper mirrored left boot.
        ctx.scale(-1, 1);

      } else {
        ctx.rotate(bootFA);

      ctx.moveTo(-r*0.14, -r*0.17);           // heel top

      ctx.lineTo(r*0.1, r*0.18);               // sole, heel to arch
      ctx.quadraticCurveTo(r*0.34, r*0.17, r*0.4, r*0.03);   // rounded toe underside

      ctx.strokeStyle = 'rgba(0,0,0,0.35)'; ctx.lineWidth = 1;

    ctx.fillRect(-r*0.58, r*0.28, r*1.16, r*0.1);

    ctx.save();
    ctx.translate(-r*0.82, -r*0.08);

    ctx.beginPath(); ctx.ellipse(0, r*0.13, r*0.2, r*0.22, 0, 0, Math.PI*2); ctx.fill(); // v137: bicep bulge
    ctx.fillRect(-r*0.14, r*0.12, r*0.28, r*0.4);   // v137: thick forearm (was 0.18 wide)
    ctx.fillStyle = '#2a2a2a';
    ctx.fillRect(-r*0.15, r*0.46, r*0.3, r*0.16); // glove
    ctx.restore();

    // torso — shaded tactical vest over uniform. Bulked up (head-to-waist / back build)
    // via a local scale anchored at the waist/belt line, so only this region grows —
    // legs stay put below and the head (drawn separately after) stays its normal size.
    ctx.save();
    const TORSO_SCALE = 1.2;
    const TORSO_SCALE_X = 1.36; // v137 muscular: broader chest / shoulders (V-taper below)
    const TORSO_ANCHOR_Y = r*0.36; // waist/belt line

    const torsoGrad = ctx.createLinearGradient(0,-r*0.3,0,r*0.5);
    torsoGrad.addColorStop(0, '#7a6844');
    torsoGrad.addColorStop(1, '#4a3d26');
    // v137: V-taper — wide shoulders narrowing to the waist (was a plain rectangle)
    const torsoPath = function(){ ctx.beginPath(); ctx.moveTo(-r*0.64,-r*0.32); ctx.lineTo(r*0.64,-r*0.32); ctx.lineTo(r*0.5,r*0.52); ctx.lineTo(-r*0.5,r*0.52); ctx.closePath(); };
    ctx.fillStyle = torsoGrad;
    torsoPath(); ctx.fill();
    // chest rig / plate carrier
    ctx.fillStyle = 'rgba(20,24,18,0.85)';
    ctx.fillRect(-r*0.42, -r*0.24, r*0.84, r*0.5);
    // ammo pouches
    ctx.fillStyle = '#171a14';
    ctx.fillRect(-r*0.34, -r*0.05, r*0.22, r*0.26);
    ctx.fillRect(r*0.12, -r*0.05, r*0.22, r*0.26);
    ctx.strokeStyle = 'rgba(255,255,255,0.08)'; ctx.lineWidth = 1;
    ctx.strokeRect(-r*0.34, -r*0.05, r*0.22, r*0.26);
    ctx.strokeRect(r*0.12, -r*0.05, r*0.22, r*0.26);
    // chest straps
    ctx.strokeStyle = 'rgba(0,0,0,0.35)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(-r*0.4,-r*0.3); ctx.lineTo(-r*0.15,r*0.4); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(r*0.4,-r*0.3); ctx.lineTo(r*0.15,r*0.4); ctx.stroke();
    ctx.strokeStyle = 'rgba(0,0,0,0.4)'; ctx.lineWidth = 1;
    torsoPath(); ctx.stroke();
    // shoulder armor pads
    ctx.fillStyle = '#5e4e30';
    ctx.beginPath(); ctx.ellipse(-r*0.64,-r*0.25,r*0.24,r*0.2,0,0,Math.PI*2); ctx.fill(); // v137: big rounded delts
    ctx.beginPath(); ctx.ellipse(r*0.64,-r*0.25,r*0.24,r*0.2,0,0,Math.PI*2); ctx.fill();
    // v137: chest (pec) definition
    ctx.fillStyle = 'rgba(255,235,190,0.10)';
    ctx.beginPath(); ctx.ellipse(-r*0.25,-r*0.12,r*0.28,r*0.16,0.12,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(r*0.25,-r*0.12,r*0.28,r*0.16,-0.12,0,Math.PI*2); ctx.fill();

    // v137: SHIELD ON -> SOLID green army jacket (opaque, not see-through) that shines: V-taper cut, big delts,

    if (player.shieldActive){

      ctx.beginPath(); ctx.ellipse(r*0.25,-r*0.12,r*0.28,r*0.16,-0.12,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = 'rgba(5,70,30,0.22)';
      ctx.beginPath(); ctx.ellipse(-r*0.28,r*0.06,r*0.24,r*0.1,0.1,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(r*0.28,r*0.06,r*0.24,r*0.1,-0.1,0,Math.PI*2); ctx.fill();

      ctx.beginPath(); ctx.moveTo(r*0.26,-r*0.32); ctx.lineTo(r*0.02,-r*0.32); ctx.lineTo(r*0.12,-r*0.15); ctx.closePath(); ctx.fill(); ctx.stroke();

    const NECK_W = r*0.42; // v133: thicker neck (was r*0.3)

    ctx.save();

    if (player.shieldActive){

    }

    if (headFacing === 'front'){
      // tactical goggles (band across both eyes instead of cartoon dot eyes) — widened to

      ctx.fillStyle = '#0d0d0d';
      ctx.fillRect(-r*0.38, -r*0.86, r*0.76, r*0.19);
      ctx.fillStyle = 'rgba(120,220,255,0.55)';
      ctx.shadowColor = 'rgba(120,220,255,0.7)'; ctx.shadowBlur = 5;
      ctx.beginPath(); ctx.ellipse(-r*0.18,-r*0.765,r*0.15,r*0.08,0,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(r*0.18,-r*0.765,r*0.15,r*0.08,0,0,Math.PI*2); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.strokeStyle = 'rgba(0,0,0,0.5)'; ctx.lineWidth = 1;
      ctx.strokeRect(-r*0.38, -r*0.86, r*0.76, r*0.19);
    } else if (headFacing === 'left' || headFacing === 'right'){
      // single goggle lens on the facing side only
      ctx.fillStyle = '#0d0d0d';
      ctx.fillRect(sideMul*r*0.40 - r*0.19, -r*0.86, r*0.38, r*0.19);
      ctx.fillStyle = 'rgba(120,220,255,0.55)';
      ctx.shadowColor = 'rgba(120,220,255,0.7)'; ctx.shadowBlur = 5;
      ctx.beginPath(); ctx.ellipse(sideMul*r*0.40,-r*0.765,r*0.13,r*0.08,0,0,Math.PI*2); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.strokeStyle = 'rgba(0,0,0,0.5)'; ctx.lineWidth = 1;
      ctx.strokeRect(sideMul*r*0.40 - r*0.19, -r*0.86, r*0.38, r*0.19);
    }
    // 'back' facing draws no goggles at all — just the helmet dome, as expected from behind

    // name tag removed from the officer sprite itself — now shown as a fixed HUD label
    // just below the centered HP pill (see #playerNameTag in the HTML/CSS above) so it
    // reads clearly no matter which way he's facing or how he's posed.

    ctx.restore(); // end head counter-scale
    ctx.restore(); // end player-soldier transform (position + body height scale)

    // poison overlay — sickly green glow while venom from a little giant's snake is ticking
    if (player.poisonTimer > 0){
      ctx.save();
      ctx.translate(player.x, player.y);
      const pAlpha = Math.min(1, player.poisonTimer/1.2);
      const pFlick = 0.6+Math.sin(performance.now()/90)*0.4;
      ctx.globalAlpha = pAlpha;
      ctx.fillStyle = `rgba(90,220,90,${0.3*pFlick})`;
      ctx.shadowColor = 'rgba(90,220,90,0.85)'; ctx.shadowBlur = 16;
      ctx.beginPath(); ctx.ellipse(0,-r*0.4,r*0.7,r*1.15,0,0,Math.PI*2); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.globalAlpha = 1;
      ctx.restore();
    }

    // burn overlay — flames wrapped around the officer's ENTIRE body (head to feet) while on fire
    if (player.burnTimer > 0){
      ctx.save();
      ctx.translate(player.x, player.y);
      const bAlpha = Math.min(1, player.burnTimer/0.45);
      const bFlick = 0.6+Math.sin(performance.now()/45)*0.4;
      const bFlick2 = 0.6+Math.sin(performance.now()/70+1.4)*0.4;
      ctx.globalAlpha = bAlpha;
      // tall full-body flame silhouette — from feet up past the head
      ctx.fillStyle = `rgba(255,120,30,${0.4*bFlick})`;
      ctx.shadowColor = 'rgba(255,90,20,0.95)'; ctx.shadowBlur = 22;
      ctx.beginPath(); ctx.ellipse(0,-r*0.3,r*1.05,r*1.9,0,0,Math.PI*2); ctx.fill();
      // inner hotter core, slightly offset for flicker
      ctx.fillStyle = `rgba(255,200,60,${0.45*bFlick2})`;
      ctx.beginPath(); ctx.ellipse(0,-r*0.5,r*0.65,r*1.4,0,0,Math.PI*2); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.globalAlpha = 1;
      ctx.restore();
    }


    // v135: no shield circle any more — while the shield is on, the officer's army jacket itself glows green (see the torso + sleeve drawing)

    // knife ring — true neon-tube red marking the auto-throw range while active
    if (player.knifeActive){
      ctx.save();
      ctx.translate(player.x, player.y);
      ctx.scale(psm, psm); // match the officer's own restored sprite size
      const kPulse = Math.sin(performance.now()/90)*1.5;
      const knR = player.r*KNIFE_RING_RADIUS_MULT + kPulse;
      // outer soft neon bloom
      ctx.strokeStyle = 'rgba(255,0,40,0.5)';
      ctx.lineWidth = 7;
      ctx.shadowColor = 'rgba(255,0,40,1)'; ctx.shadowBlur = 28;
      ctx.beginPath(); ctx.arc(0,0,knR,0,Math.PI*2); ctx.stroke();
      // bright neon core line
      ctx.strokeStyle = 'rgba(255,10,55,0.95)';
      ctx.lineWidth = 2;
      ctx.shadowColor = 'rgba(255,0,50,1)'; ctx.shadowBlur = 16;
      ctx.beginPath(); ctx.arc(0,0,knR,0,Math.PI*2); ctx.stroke();
      // hot white-red hairline — the glass-tube highlight that sells the neon look
      ctx.strokeStyle = 'rgba(255,190,200,0.9)';
      ctx.lineWidth = 1;
      ctx.shadowBlur = 0;
      ctx.beginPath(); ctx.arc(0,0,knR,0,Math.PI*2); ctx.stroke();
      ctx.fillStyle = 'rgba(255,0,40,0.06)';
      ctx.beginPath(); ctx.arc(0,0,knR,0,Math.PI*2); ctx.fill();
      ctx.restore();
    }

    // FRONT LAYER - trees/decor that are IN FRONT OF the officer (closer to camera)
    // Draw these AFTER all entities so officer appears to walk UNDER/BEHIND trees
    for (const d of (uw ? [] : groundDecor)){
      if (d.y <= player.y + decorFrontMargin(d)) continue; // only front trees (closer than officer)
      if (d.x < camera.x-40 || d.x > camera.x+VW+40 || d.y < camera.y-40 || d.y > camera.y+VH+40) continue;
      const vanishA = d.vanishT0 ? Math.max(0, 1 - (performance.now()-d.vanishT0)/900) : 1; // fades out when the guardian arrives
      if (vanishA <= 0) continue;
      const t = Math.max(0, Math.min(1, (d.y-fadeCamY)/VH));
      const pScale = 0.5 + 0.7*t;
      ctx.save();
      ctx.globalAlpha = (0.45 + 0.55*t) * groundFade(d.y) * vanishA;
      ctx.translate(d.x, d.y); ctx.scale(pScale, pScale); ctx.translate(-d.x, -d.y);
      drawDecor(d);
      ctx.restore();
    }

    // guardian HP pill — small, floating just above its head and following it
    if (boss && boss.hp > 0 && gameState === 'boss'){
      ctx.save();
      ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.shadowBlur = 0;
      const pw = 170, ph = 12;
      const px0 = boss.x - pw/2, py0 = boss.y - boss.r*2.35 - 26;
      const pf = Math.max(0, Math.min(1, boss.hp/boss.maxHp));
      ctx.font = '700 17px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
      ctx.fillStyle = '#ff8ad0'; ctx.shadowColor = 'rgba(255,60,150,0.9)'; ctx.shadowBlur = 8;
      ctx.fillText(BOSS_SKINS[(boss.skin||0) % BOSS_SKINS.length].name, boss.x, py0 - 5);
      ctx.shadowBlur = 0;
      roundRect(ctx, px0, py0, pw, ph, ph/2);
      ctx.fillStyle = 'rgba(10,8,14,0.78)'; ctx.fill();
      ctx.save();
      roundRect(ctx, px0, py0, pw, ph, ph/2); ctx.clip();
      const pg = ctx.createLinearGradient(px0, 0, px0+pw, 0);
      pg.addColorStop(0, '#ff2244'); pg.addColorStop(1, '#ff6ec7');
      ctx.fillStyle = pg; ctx.fillRect(px0, py0, pw*pf, ph);
      ctx.restore();
      roundRect(ctx, px0, py0, pw, ph, ph/2);
      ctx.strokeStyle = 'rgba(255,110,170,0.8)'; ctx.lineWidth = 2; ctx.stroke();
      ctx.restore();
    }

    ctx.restore(); // camera
    if (uw) drawUnderwaterHUD();

    // bunker clue — while it's off-screen, a warm glow bleeds in from whichever screen edge
    // it's hiding behind, brightening the closer the officer gets, like light leaking between
    // the trees; once it's actually in view the beacon beam above takes over
    for (const bk of (uw ? [] : bunkers)){
      const onScreen = (bk.x > camera.x-40 && bk.x < camera.x+VW+40 && bk.y > camera.y-40 && bk.y < camera.y+VH+40);
      if (onScreen) continue;
      const dx = bk.x - (camera.x + VW/2);
      const dy = bk.y - (camera.y + VH/2);
      const dist = Math.hypot(dx,dy);
      const maxDist = 1500;
      const strength = Math.max(0, 1 - dist/maxDist);
      if (strength <= 0.02) continue;
      const pulse = 0.7 + Math.sin(performance.now()/300)*0.3;
      const glowW = (40 + 110*strength) * pulse;
      ctx.save();
      let grad;
      if (dx < 0){ grad = ctx.createLinearGradient(0,0,glowW,0); }
      else { grad = ctx.createLinearGradient(W,0,W-glowW,0); }
      grad.addColorStop(0, `rgba(255,214,110,${0.5*strength})`);
      grad.addColorStop(1, 'rgba(255,214,110,0)');
      ctx.fillStyle = grad;
      ctx.fillRect(dx<0 ? 0 : W-glowW, 0, glowW, H);
      ctx.restore();
    }

    // mirror clue — while it's off-screen (hiding well off the edge of the road), a
    // silver glow bleeds in from whichever screen edge it's behind, brightening the
    // closer the officer gets — the only hint that pulls him toward the detour
    if (mirror){
      const onScreenM = (mirror.x > camera.x-40 && mirror.x < camera.x+VW+40 && mirror.y > camera.y-40 && mirror.y < camera.y+VH+40);
      if (!onScreenM){
        const dxm = mirror.x - (camera.x + VW/2);
        const dym = mirror.y - (camera.y + VH/2);
        const distm = Math.hypot(dxm,dym);
        const maxDistM = 1600;
        const strengthM = Math.max(0, 1 - distm/maxDistM);
        if (strengthM > 0.02){
          const pulseM = 0.7 + Math.sin(performance.now()/300)*0.3;
          const glowWM = (40 + 110*strengthM) * pulseM;
          ctx.save();
          let gradM;
          if (dxm < 0){ gradM = ctx.createLinearGradient(0,0,glowWM,0); }
          else { gradM = ctx.createLinearGradient(W,0,W-glowWM,0); }
          gradM.addColorStop(0, `rgba(216,246,255,${0.5*strengthM})`);
          gradM.addColorStop(1, 'rgba(216,246,255,0)');
          ctx.fillStyle = gradM;
          ctx.fillRect(dxm<0 ? 0 : W-glowWM, 0, glowWM, H);
          ctx.restore();
        }
      }
    }

    // progress indicator (distance climbed toward the gate)
    if (gameState === 'zone'){
      const prog = Math.max(0, Math.min(1, (zoneStartY - player.y) / Math.max(1, zoneStartY - gateY)));
      ctx.fillStyle = 'rgba(10,14,20,0.5)';
      ctx.fillRect(W/2-90, H-22, 180, 8);
      ctx.fillStyle = '#4fd0ff';
      ctx.fillRect(W/2-90, H-22, 180*prog, 8);
    }

    // v121: blackout beat between the gate shattering and the guardian's entrance — the arena swap hides behind it
    if (gameState === 'gateOpening'){
      const t = gateOpeningT;
      let ba = 0;
      if (t >= 0.25 && t < 0.9) ba = (t-0.25)/0.65;
      else if (t >= 0.9 && t < 1.3) ba = 1;
      else if (t >= 1.3) ba = Math.max(0, 1 - (t-1.3)/0.8);
      if (ba > 0){ ctx.save(); ctx.fillStyle = 'rgba(4,2,6,'+ba+')'; ctx.fillRect(0,0,W,H); ctx.restore(); }
    }

    // banner (zone intro / guardian warning / gate destroyed)
    if (banner.timer > 0){
      const a = banner.timer > banner.dur-0.4 ? (banner.dur-banner.timer)/0.4 : Math.min(1, banner.timer/0.6);
      ctx.save();
      ctx.globalAlpha = a;
      ctx.textAlign = 'center';
      ctx.fillStyle = 'rgba(6,8,14,0.5)';
      ctx.fillRect(0, H*0.32-38, W, banner.sub ? 74 : 50);
      ctx.fillStyle = '#eaf2ff';
      ctx.font = 'bold 24px Segoe UI, Arial';
      ctx.shadowColor='rgba(0,0,0,0.8)'; ctx.shadowBlur=6;
      ctx.fillText(banner.text, W/2, H*0.32);
      if (banner.sub){
        ctx.font = '13px Segoe UI, Arial';
        ctx.fillStyle = '#b8c4d9';
        ctx.fillText(banner.sub, W/2, H*0.32+26);
      }
      ctx.restore();
    }
    
    // Victory phase countdown timer — shows time remaining in the 20-second post-cobra-victory phase
    if (gameState === 'postCobraVictory'){
      const timeLeft = POST_COBRA_VICTORY_DURATION - postCobraVictoryTimer;
      const pulse = Math.sin(postCobraVictoryTimer * Math.PI * 3) * 0.5 + 0.5; // pulsing glow
      ctx.save();
      ctx.textAlign = 'center';
      ctx.fillStyle = `rgba(0,255,200,${0.3 + pulse * 0.4})`;
      ctx.font = 'bold 32px Segoe UI, Arial';
      ctx.shadowColor='rgba(0,200,180,0.8)'; ctx.shadowBlur=12;
      ctx.shadowOffsetX = 0; ctx.shadowOffsetY = 0;
      ctx.fillText(Math.ceil(timeLeft), W/2, H*0.15);
      ctx.font = '11px Segoe UI, Arial';
      ctx.fillStyle = 'rgba(0,255,200,0.6)';
      ctx.fillText('TIME REMAINING', W/2, H*0.15+18);
      ctx.restore();
    }
  }

  // ---------- Loop ----------
  let paused = false;
  function loop(ts){
    if (!running) return;
    if (!lastTime) lastTime = ts;
    if (paused){
      draw(); // keep the current frame visible so the structure can be studied while frozen
      lastTime = ts; // avoid a huge dt spike the moment it's unpaused
      requestAnimationFrame(loop);
      return;
    }
    let dt = (ts - lastTime)/1000;
    dt = Math.min(dt, 0.05);
    lastTime = ts;
    if (hitStop > 0){
      hitStop -= dt;
      // keep the officer free to walk into any corner even during the hit-stop freeze —
      // only the enemies/effects/particles pause; his own movement and the camera that
      // follows him keep working so the screen never feels "stuck" under him.
      if (joy.mag > 0.08 && !(tornado && (tornado.state === 'spin' || tornado.state === 'crack' || tornado.state === 'blast' || tornado.state === 'swallow'))){
        const moveMult = player.entangleTimer > 0 ? 0.4 : 1;
        player.x += joy.dx * joy.mag * player.speed * moveMult * dt;
        player.y += joy.dy * joy.mag * player.speed * moveMult * dt;
        player.moveDir = Math.atan2(joy.dy, joy.dx);
      }
      player.y = Math.min(player.y, zoneStartY + 150); // full freedom to retreat all the way back
      applyMirrorLock(dt);
      if (joy.mag > 0.08 && Math.abs(joy.dx) > 0.15){
        const lookTarget = joy.dx > 0 ? LOOK_FRAC_RIGHT : LOOK_FRAC_LEFT;
        const lookEase = 1 - Math.pow(0.3, dt);
        camLookFrac += (lookTarget - camLookFrac) * lookEase;
      }
      let camTargetX = camInit ? player.x - VW*camLookFrac : player.x - VW/2;
      let camTargetY = player.y - VH*PLAYER_SCREEN_Y_FRAC;
      let fadeCamTargetY = camTargetY;
      if (gate && ((gameState === 'zone' && gate.active) || gameState === 'gateOpening' || gameState === 'boss')){
        const gateTopMargin = 34;
        const camMaxForGateTop = (gateY - gateTopHeight()) - gateTopMargin;
        camTargetY = Math.min(camTargetY, camMaxForGateTop);
      }
      // v119: GATE STAYS GROUNDED is handled by updateGateGroundCam() right after the camera ease below.
      if ((gameState === 'boss' || gameState === 'gateOpening') && boss){
        const bossTopMargin = 60;
        const camMaxForBossTop = ((boss.homeY !== undefined ? boss.homeY : boss.y) - boss.r*2.3) - bossTopMargin;
        camTargetY = Math.min(camTargetY, camMaxForBossTop);
        camTargetY = Math.max(camTargetY, player.y - VH*0.9);
      }
      if (mirror && mirror.locked){
        camTargetX = Math.min(mirror.x - mirrorScreenX(), player.x - VW*0.05);
        camTargetY = Math.max(mirror.y - VH*MIRROR_SCREEN_Y, player.y - VH*0.88); // mirror sits lower, in the middle of the play area
      }
      if (!camInit){
        camera.x = camTargetX; camera.y = camTargetY; fadeCamY = fadeCamTargetY; camInit = true;
      } else {
        const camEase = 1 - Math.pow(0.0025, dt);
        camera.x += (camTargetX - camera.x) * camEase;
        camera.y += (camTargetY - camera.y) * camEase;
        fadeCamY += (fadeCamTargetY - fadeCamY) * camEase;
      }
      updateGateGroundCam(dt);
      draw(); // keep rendering the freeze-frame (with shake) so it reads as a punch, not a stutter
      requestAnimationFrame(loop);
      return;
    }
    if (uw){ // v123: underwater dive — the desert world is frozen, only the dive scene runs
      updateUnderwater(dt);
      draw();
      requestAnimationFrame(loop);
      return;
    }
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }
  document.getElementById('pauseBtn').addEventListener('click', function(){
    if (!running) return;
    paused = !paused;
    this.textContent = paused ? '▶' : '⏸';
    this.classList.toggle('active', paused);
    document.getElementById('pausedLabel').style.display = paused ? 'block' : 'none';
  });

  // Best Score Flash
  function showBestScoreFlash(){
    const flashEl = document.getElementById('bestScoreFlash');
    document.getElementById('bestScoreValue').textContent = score;
    flashEl.style.display = 'flex';
    flashEl.style.flexDirection = 'column';
    flashEl.style.alignItems = 'center';
    
    // Auto-hide after 3 seconds if not clicked
    setTimeout(() => {
      if (flashEl.style.display !== 'none'){
        flashEl.style.display = 'none';
      }
    }, 3000);
  }
  
  // Update centered HP bar
  function updateHPDisplay(){
    const hpFrac = Math.max(0, Math.min(1, player.hp / player.maxHp));
    const hpBarFill = document.getElementById('hpOnlyContainer').querySelector('#healthBarFill');
    if (hpBarFill){
      hpBarFill.style.width = (hpFrac*100) + '%';
    }
  }
  
  document.getElementById('bestScoreOkBtn').addEventListener('click', function(){
    document.getElementById('bestScoreFlash').style.display = 'none';
  });

  function endGame(){
    running = false;
    document.getElementById('finalScore').textContent = score;
    document.getElementById('finalWave').textContent = currentTheme().name + ' Zone ' + (zoneNum+1);
    const badge = document.getElementById('newBestBadge');
    if (score > bestScore){
      bestScore = score;
      saveBestScore(bestScore);
      document.getElementById('bestBox').textContent = 'BEST ' + bestScore;
      badge.classList.remove('hidden');
    } else {
      badge.classList.add('hidden');
    }
    document.getElementById('gameOverOverlay').classList.remove('hidden');
    SFX.gameOver();
    
    // Show best score flash on game end
    showBestScoreFlash();
  }

  document.getElementById('startBtn').addEventListener('click', function(){
    SFX.unlock();
    SFX.click();
    document.getElementById('startOverlay').classList.add('hidden');
    resetGame();
    paused = false;
    document.getElementById('pauseBtn').textContent = '⏸';
    document.getElementById('pauseBtn').classList.remove('active');
    document.getElementById('pausedLabel').style.display = 'none';
    running = true; lastTime = 0;
    requestAnimationFrame(loop);
  });
  document.getElementById('restartBtn').addEventListener('click', function(){
    SFX.unlock();
    SFX.click();
    document.getElementById('gameOverOverlay').classList.add('hidden');
    resetGame();
    paused = false;
    document.getElementById('pauseBtn').textContent = '⏸';
    document.getElementById('pauseBtn').classList.remove('active');
    document.getElementById('pausedLabel').style.display = 'none';
    running = true; lastTime = 0;
    requestAnimationFrame(loop);
  });

  // Prevent page scroll/zoom on mobile
  document.addEventListener('touchmove', function(e){ e.preventDefault(); }, {passive:false});
  document.addEventListener('gesturestart', function(e){ e.preventDefault(); });

})();
</script>
</body>
