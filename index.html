      // FIRE BREATH — warning stream during telegraph, then the real flame during breathing
      if (boss.fireState === 'telegraph'){
        const warnPulse = 0.6+Math.sin(performance.now()/60)*0.4;
        const mx0 = 0, my0 = -r*1.12;
        const fx = Math.cos(boss.fireAngle), fy = Math.sin(boss.fireAngle);
        ctx.save();
        // short aiming reticle only — NOT the fire itself, just a warning of the coming direction
        ctx.strokeStyle = `rgba(255,90,20,${0.25+0.3*warnPulse})`;
        ctx.lineWidth = 2;
        ctx.setLineDash([6,10]);
        ctx.beginPath();
        ctx.moveTo(mx0,my0);
        ctx.lineTo(mx0+fx*140, my0+fy*140);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle = `rgba(255,140,40,${0.6+0.4*warnPulse})`;
        ctx.shadowColor='rgba(255,120,30,1)'; ctx.shadowBlur=16;
        ctx.beginPath(); ctx.arc(mx0,my0,r*0.14*(1+0.2*warnPulse),0,Math.PI*2); ctx.fill();
        ctx.shadowBlur=0;
        ctx.restore();
      } else if (boss.fireState === 'breathing'){
        // the mouth itself just blasts light here — the actual flying fire is drawn
        // separately in world space as fireGouts, so it reads as real flame, not a beam
        const mx0 = 0, my0 = -r*1.12;
        const flick = Math.sin(performance.now()/35)*0.5+0.5;
        ctx.save();
        ctx.shadowColor='rgba(255,120,30,0.95)'; ctx.shadowBlur=26;
        ctx.fillStyle=`rgba(255,230,150,${0.75+0.25*flick})`;
        ctx.beginPath(); ctx.arc(mx0,my0,r*0.24*(0.9+0.2*flick),0,Math.PI*2); ctx.fill();
        ctx.shadowBlur=0;
        ctx.restore();
      }

      // telegraph ring before a charge attack
      if (boss.chargeState==='telegraph'){
        ctx.strokeStyle = 'rgba(255,240,80,0.9)'; ctx.lineWidth=5;
        ctx.shadowColor='rgba(255,240,80,1)'; ctx.shadowBlur=16;
        ctx.beginPath(); ctx.arc(0,-r*0.2,r+10+Math.sin(performance.now()/40)*4,0,Math.PI*2); ctx.stroke();
        ctx.shadowBlur=0;
      }
      // muzzle flash for its ranged burst
      if (boss.muzzleFlash>0){
        ctx.fillStyle='rgba(255,180,100,0.9)';
        ctx.shadowColor='rgba(255,180,100,1)'; ctx.shadowBlur=14;
        ctx.beginPath(); ctx.arc(0,-r*0.25,r*0.32,0,Math.PI*2); ctx.fill();
        ctx.shadowBlur=0;
      }

      // FIVE-HEADED DRAGON — five serpentine heads erupt from the guardian's back for its
      // last-resort ultimate, each mouth glowing and spitting fire
      if (boss.ultimateState === 'telegraph' || boss.ultimateState === 'breathing'){
        const dFlick = Math.sin(performance.now()/50)*0.5+0.5;
        for (let hIdx=0; hIdx<5; hIdx++){
          const hOff = (hIdx-2)*0.34;
          const hx = Math.sin(hOff)*r*0.9;
          const hy = -r*1.7 - Math.cos(hOff)*r*0.25;
          ctx.save();
          ctx.translate(hx,hy);
          ctx.rotate(hOff*0.4);
          // neck
          ctx.strokeStyle = '#3a0f18'; ctx.lineWidth = r*0.14;
          ctx.beginPath(); ctx.moveTo(0, r*0.55); ctx.lineTo(0,0); ctx.stroke();
          // head
          ctx.fillStyle = '#4a1420';
          ctx.beginPath(); ctx.ellipse(0,0,r*0.22,r*0.15,0,0,Math.PI*2); ctx.fill();
          ctx.strokeStyle = '#ff2e6b'; ctx.lineWidth=1.5;
          ctx.shadowColor='#ff2e6b'; ctx.shadowBlur=8; ctx.stroke(); ctx.shadowBlur=0;
          // glowing eye
          ctx.fillStyle='#fff23a'; ctx.shadowColor='rgba(255,240,60,1)'; ctx.shadowBlur=6;
          ctx.beginPath(); ctx.arc(-r*0.05,-r*0.04,r*0.035,0,Math.PI*2); ctx.fill();
          ctx.shadowBlur=0;
          // open fanged mouth glowing with fire
          ctx.fillStyle = `rgba(255,140,40,${0.7+0.3*dFlick})`;
          ctx.shadowColor='rgba(255,100,20,1)'; ctx.shadowBlur=12;
          ctx.beginPath(); ctx.ellipse(r*0.18,r*0.02,r*0.09*(1+0.3*dFlick),r*0.06,0,0,Math.PI*2); ctx.fill();
          ctx.shadowBlur=0;
          ctx.restore();
        }
      }
      ctx.restore();
    }

    // missile (fired after the guardian falls, to blast the gate open)
    if (missile && !missile.exploded){
      ctx.save();
      ctx.translate(missile.x, missile.y);
      ctx.fillStyle = '#dfe6ee';
      ctx.fillRect(-4,-14,8,28);
      ctx.fillStyle = '#ff8a3d';
      ctx.beginPath(); ctx.moveTo(0,14); ctx.lineTo(-6,26); ctx.lineTo(6,26); ctx.closePath(); ctx.fill();
      ctx.restore();
    }

    // air-strike missiles: warning reticle, then the missile falling in from above
    for (const s of airStrikes){
      if (s.state === 'telegraph'){
        const pulse = 0.6 + Math.sin(performance.now()/70)*0.4;
        ctx.save();
        ctx.translate(s.x, s.groundY);
        ctx.strokeStyle = `rgba(255,70,60,${0.55+0.35*pulse})`;
        ctx.lineWidth = 3;
        ctx.shadowColor = 'rgba(255,60,50,0.9)'; ctx.shadowBlur = 14;
        ctx.beginPath(); ctx.arc(0,0,s.blastR*(0.5+0.5*(1-s.timer/0.85)),0,Math.PI*2); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(-14,0); ctx.lineTo(14,0); ctx.moveTo(0,-14); ctx.lineTo(0,14); ctx.stroke();
        ctx.shadowBlur = 0;
        ctx.restore();
      } else if (s.state === 'falling'){
        ctx.save();
        ctx.translate(s.x, s.missileY);
        // flame trail
        const trailLen = 46;
        const tg = ctx.createLinearGradient(0,-trailLen,0,0);
        tg.addColorStop(0,'rgba(255,140,40,0)'); tg.addColorStop(1,'rgba(255,170,60,0.85)');
        ctx.fillStyle = tg;
        ctx.fillRect(-3,-trailLen,6,trailLen);
        // missile body
        ctx.fillStyle = '#c9d2de';
        ctx.fillRect(-5,-16,10,26);
        ctx.fillStyle = '#8a1f1f';
        ctx.beginPath(); ctx.moveTo(0,-22); ctx.lineTo(-5,-16); ctx.lineTo(5,-16); ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#ff8a3d';
        ctx.beginPath(); ctx.moveTo(-5,10); ctx.lineTo(-9,20); ctx.lineTo(9,20); ctx.lineTo(5,10); ctx.closePath(); ctx.fill();
        ctx.restore();
      }
    }

    // crates
    for (const c of crates){
      ctx.save();
      ctx.translate(c.x,c.y);
      ctx.globalAlpha = groundFade(c.y);
      if (c.neon){
        // glowing, glassy neon-blue ammo box — see-through body (not solid) so it reads
        // as an energy crate rather than a wooden one, plus a pulsing bloom around it
        const pulse = 0.6 + Math.sin(performance.now()/220)*0.4;
        const glowGrad = ctx.createRadialGradient(0,0,2, 0,0, c.r*4);
        glowGrad.addColorStop(0, `rgba(41,224,255,${0.6*pulse})`);
        glowGrad.addColorStop(1, 'rgba(41,224,255,0)');
        ctx.fillStyle = glowGrad;
        ctx.beginPath(); ctx.arc(0,0,c.r*4,0,Math.PI*2); ctx.fill();
        // translucent glass body — light fill so the glow shows through it, not opaque
        ctx.fillStyle = `rgba(41,224,255,${0.16 + 0.08*pulse})`;
        ctx.strokeStyle = '#7cf3ff';
        ctx.lineWidth = 2;
        ctx.shadowColor = '#29e0ff'; ctx.shadowBlur = 16*pulse;
        ctx.fillRect(-c.r,-c.r,c.r*2,c.r*2);
        ctx.strokeRect(-c.r,-c.r,c.r*2,c.r*2);
        // faint inner facet lines — sells the "glass box" read
        ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(-c.r*0.6,-c.r*0.6); ctx.lineTo(c.r*0.6,c.r*0.6); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(c.r*0.6,-c.r*0.6); ctx.lineTo(-c.r*0.6,c.r*0.6); ctx.stroke();
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#eafcff';
        ctx.shadowColor = '#29e0ff'; ctx.shadowBlur = 6;
        ctx.font = 'bold ' + (c.r*0.9) + 'px Segoe UI, Arial';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('13', 0, 1);
        ctx.shadowBlur = 0;
      } else {
        // every regular ammo/weapon crate is tinted to match that weapon's own bullet
        // color, with its name stenciled on the lid, so the box tells you what it holds
        // before you even pick it up — same pulsing warm-glow treatment as before.
        const wCol = (WEAPONS[c.weapon] && WEAPONS[c.weapon].color) || '#ffd166';
        const wRgb = hexToRgbTriplet(wCol);
        const cratePulse = 0.6 + Math.sin(performance.now()/220)*0.4;
        const crateGlow = ctx.createRadialGradient(0,0,2, 0,0, c.r*3.4);
        crateGlow.addColorStop(0, `rgba(${wRgb},${0.55*cratePulse})`);
        crateGlow.addColorStop(1, `rgba(${wRgb},0)`);
        ctx.fillStyle = crateGlow;
        ctx.beginPath(); ctx.arc(0,0,c.r*3.4,0,Math.PI*2); ctx.fill();
        ctx.fillStyle = `rgba(${wRgb},0.32)`;
        ctx.strokeStyle = wCol;
        ctx.lineWidth = 2;
        ctx.shadowColor = wCol; ctx.shadowBlur = 12*cratePulse;
        ctx.fillRect(-c.r,-c.r,c.r*2,c.r*2);
        ctx.strokeRect(-c.r,-c.r,c.r*2,c.r*2);
        ctx.shadowBlur = 0;
        ctx.beginPath(); ctx.moveTo(-c.r,0); ctx.lineTo(c.r,0); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0,-c.r); ctx.lineTo(0,c.r); ctx.stroke();
        // weapon name label, stamped on the box in its own bullet color
        const label = WEAPON_LABELS[c.weapon] || c.weapon.toUpperCase();
        ctx.fillStyle = '#fff';
        ctx.shadowColor = wCol; ctx.shadowBlur = 4;
        ctx.font = 'bold ' + Math.max(5, c.r*0.32) + 'px Segoe UI, Arial';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(label, 0, c.r*1.42);
        ctx.shadowBlur = 0;
      }
      ctx.restore();
    }

    // hidden weapon bunkers — a squat camo dome with sandbags and a dark entrance slit
    for (const bk of bunkers){
      ctx.save();
      ctx.translate(bk.x, bk.y);
      ctx.globalAlpha = groundFade(bk.y);
      // tall glowing beacon shooting up into the sky — the long-range clue that lets the
      // officer spot the bunker through the tree canopy well before it's actually in view
      const beamPulse = 0.55 + Math.sin(performance.now()/260)*0.3;
      const beamH = 1400;
      const beamGrad = ctx.createLinearGradient(0, -bk.r*0.5, 0, -beamH);
      beamGrad.addColorStop(0, `rgba(255,224,140,${0.75*beamPulse})`);
      beamGrad.addColorStop(0.5, `rgba(255,224,140,${0.28*beamPulse})`);
      beamGrad.addColorStop(1, 'rgba(255,224,140,0)');
      ctx.fillStyle = beamGrad;
      ctx.beginPath();
      ctx.moveTo(-16, -bk.r*0.5); ctx.lineTo(16, -bk.r*0.5);
      ctx.lineTo(5, -beamH); ctx.lineTo(-5, -beamH);
      ctx.closePath(); ctx.fill();
      // soft wide ground glow pooling around its base, so it also reads as a bloom of light
      // spilling out between the tree trunks rather than just a thin beam
      const poolGrad = ctx.createRadialGradient(0,0,4, 0,0, bk.r*4.2);
      poolGrad.addColorStop(0, `rgba(255,214,120,${0.32*beamPulse})`);
      poolGrad.addColorStop(1, 'rgba(255,214,120,0)');
      ctx.fillStyle = poolGrad;
      ctx.beginPath(); ctx.arc(0,0,bk.r*4.2,0,Math.PI*2); ctx.fill();
      // sandbag ring
      ctx.fillStyle = '#8a7a52';
      for (let s=0;s<8;s++){
        const a = (Math.PI*2/8)*s;
        ctx.beginPath(); ctx.ellipse(Math.cos(a)*bk.r*0.9, Math.sin(a)*bk.r*0.55, bk.r*0.32, bk.r*0.2, a, 0, Math.PI*2); ctx.fill();
      }
      // dome
      const grad = ctx.createRadialGradient(-bk.r*0.2,-bk.r*0.3,2, 0,0,bk.r);
      grad.addColorStop(0, '#5f7350'); grad.addColorStop(1, '#33422a');
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.ellipse(0,0,bk.r*0.85,bk.r*0.62,0,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,0.35)'; ctx.lineWidth = 2; ctx.stroke();
      // dark entrance slit
      ctx.fillStyle = '#12160f';
      ctx.beginPath(); ctx.ellipse(0,bk.r*0.12,bk.r*0.22,bk.r*0.16,0,0,Math.PI*2); ctx.fill();
      // glinting weapon icon pulsing above it
      const pulse = 0.6 + Math.sin(performance.now()/280)*0.4;
      ctx.shadowColor = 'rgba(255,209,102,0.9)'; ctx.shadowBlur = 12*pulse;
      ctx.fillStyle = 'rgba(255,209,102,' + (0.7+0.3*pulse) + ')';
      ctx.beginPath(); ctx.arc(0,-bk.r*1.15,4.5,0,Math.PI*2); ctx.fill();
      ctx.restore();
    }

    // guarded ammo depots — stacked ammo crates with a warning-red top crate
    for (const dp of depots){
      ctx.save();
      ctx.translate(dp.x, dp.y);
      ctx.globalAlpha = groundFade(dp.y);
      const pulse = 0.6 + Math.sin(performance.now()/260)*0.4;
      // pulsing glow bloom behind the whole crate stack, not just the beacon dot
      const depotGlow = ctx.createRadialGradient(0,0,2, 0,0, dp.r*3.6);
      depotGlow.addColorStop(0, `rgba(124,255,235,${0.45*pulse})`);
      depotGlow.addColorStop(1, 'rgba(124,255,235,0)');
      ctx.fillStyle = depotGlow;
      ctx.beginPath(); ctx.arc(0,0,dp.r*3.6,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle = '#5a1015'; ctx.lineWidth = 2;
      ctx.fillStyle = '#7a2027';
      ctx.shadowColor = 'rgba(124,255,235,0.7)'; ctx.shadowBlur = 10*pulse;
      ctx.fillRect(-dp.r*0.95, -dp.r*0.15, dp.r*1.9, dp.r*0.95);
      ctx.strokeRect(-dp.r*0.95, -dp.r*0.15, dp.r*1.9, dp.r*0.95);
      ctx.fillStyle = '#9c3038';
      ctx.fillRect(-dp.r*0.65, -dp.r*0.95, dp.r*1.3, dp.r*0.85);
      ctx.strokeRect(-dp.r*0.65, -dp.r*0.95, dp.r*1.3, dp.r*0.85);
      ctx.shadowBlur = 0;
      ctx.shadowColor = 'rgba(124,255,235,0.9)'; ctx.shadowBlur = 12*pulse;
      ctx.fillStyle = 'rgba(124,255,235,' + (0.7+0.3*pulse) + ')';
      ctx.beginPath(); ctx.arc(0,-dp.r*1.35,4.5,0,Math.PI*2); ctx.fill();
      ctx.restore();
    }

    // healing bottles — a little red potion bottle with a glowing white cross, bobbing in place
    for (const hpk of hpPacks){
      ctx.save();
      ctx.translate(hpk.x, hpk.y + Math.sin(hpk.bob)*3);
      ctx.globalAlpha = groundFade(hpk.y);
      const pulse = 0.75 + Math.sin(hpk.bob*1.5)*0.25;
      ctx.shadowColor = 'rgba(255,60,90,0.9)'; ctx.shadowBlur = 14*pulse;
      // bottle body
      ctx.fillStyle = '#ff3355';
      ctx.beginPath();
      ctx.moveTo(-hpk.r*0.55, hpk.r*0.9);
      ctx.quadraticCurveTo(-hpk.r*0.7, -hpk.r*0.2, -hpk.r*0.35, -hpk.r*0.5);
      ctx.lineTo(hpk.r*0.35, -hpk.r*0.5);
      ctx.quadraticCurveTo(hpk.r*0.7, -hpk.r*0.2, hpk.r*0.55, hpk.r*0.9);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.lineWidth = 1.5; ctx.stroke();
      // neck + cork
      ctx.fillStyle = '#caa15a';
      ctx.fillRect(-hpk.r*0.18, -hpk.r*0.9, hpk.r*0.36, hpk.r*0.4);
      ctx.shadowBlur = 0;
      // glowing white cross (universal "healing" symbol, easy for kids to read)
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(-hpk.r*0.09, -hpk.r*0.32, hpk.r*0.18, hpk.r*0.55);
      ctx.fillRect(-hpk.r*0.28, -hpk.r*0.14, hpk.r*0.56, hpk.r*0.18);
      ctx.restore();
    }

    // bullets (glowing energy bolts, plus special shapes for spear/chakra)
    ctx.save();
    ctx.shadowBlur = 10;
    for (const b of bullets){
      ctx.shadowColor = b.color;
      ctx.fillStyle = b.color;
      ctx.strokeStyle = b.color;
      ctx.globalAlpha = groundFade(b.y);
      if (b.shape === 'spear'){
        const ang = Math.atan2(b.vy, b.vx);
        ctx.save();
        ctx.translate(b.x, b.y); ctx.rotate(ang);
        ctx.beginPath();
        ctx.moveTo(b.r*3.4, 0);
        ctx.lineTo(-b.r*1.2, b.r*0.9);
        ctx.lineTo(-b.r*0.4, 0);
        ctx.lineTo(-b.r*1.2, -b.r*0.9);
        ctx.closePath(); ctx.fill();
        ctx.restore();
      } else if (b.shape === 'rocket'){
        // Big Rocket — auto-channeled at little giants once adopted: a stubby body,
        // fins, a pointed nose cone, and a bright flame trail streaming out the back
        const ang = Math.atan2(b.vy, b.vx);
        ctx.save();
        ctx.translate(b.x, b.y); ctx.rotate(ang);
        // flame trail
        const flick = 0.7 + Math.sin(performance.now()/40)*0.3;
        const flameGrad = ctx.createLinearGradient(-b.r*3.4,0,-b.r*1.1,0);
        flameGrad.addColorStop(0, 'rgba(255,120,20,0)');
        flameGrad.addColorStop(1, `rgba(255,200,80,${0.9*flick})`);
        ctx.fillStyle = flameGrad;
        ctx.beginPath();
        ctx.moveTo(-b.r*1.1, 0);
        ctx.lineTo(-b.r*3.4, b.r*0.55);
        ctx.lineTo(-b.r*3.4, -b.r*0.55);
        ctx.closePath(); ctx.fill();
        // body
        ctx.fillStyle = '#8a8f99';
        ctx.beginPath();
        ctx.moveTo(b.r*1.9, 0);
        ctx.lineTo(b.r*0.7, b.r*0.55);
        ctx.lineTo(-b.r*1.1, b.r*0.55);
        ctx.lineTo(-b.r*1.1, -b.r*0.55);
        ctx.lineTo(b.r*0.7, -b.r*0.55);
        ctx.closePath(); ctx.fill();
        // nose cone
        ctx.fillStyle = b.color;
        ctx.beginPath();
        ctx.moveTo(b.r*1.9, 0); ctx.lineTo(b.r*0.7, b.r*0.55); ctx.lineTo(b.r*0.7, -b.r*0.55);
        ctx.closePath(); ctx.fill();
        // fins
        ctx.fillStyle = '#3a3d44';
        ctx.beginPath(); ctx.moveTo(-b.r*0.6,b.r*0.55); ctx.lineTo(-b.r*1.3,b.r*1.1); ctx.lineTo(-b.r*1.1,b.r*0.55); ctx.closePath(); ctx.fill();
        ctx.beginPath(); ctx.moveTo(-b.r*0.6,-b.r*0.55); ctx.lineTo(-b.r*1.3,-b.r*1.1); ctx.lineTo(-b.r*1.1,-b.r*0.55); ctx.closePath(); ctx.fill();
        ctx.restore();
      } else if (b.shape === 'needle'){
        // burst-rifle bolt — thin, pure-red, sharply pointed at the front
        const ang = Math.atan2(b.vy, b.vx);
        ctx.save();
        ctx.translate(b.x, b.y); ctx.rotate(ang);
        ctx.fillStyle = '#ff0000';
        ctx.shadowColor = '#ff0000'; ctx.shadowBlur = 10;
        ctx.beginPath();
        ctx.moveTo(b.r*2.6, 0);
        ctx.lineTo(-b.r*0.3, b.r*0.45);
        ctx.lineTo(-b.r*1.6, 0);
        ctx.lineTo(-b.r*0.3, -b.r*0.45);
        ctx.closePath(); ctx.fill();
        ctx.shadowBlur = 0;
        ctx.restore();
      } else if (b.shape === 'chakra'){
        ctx.save();
        ctx.translate(b.x, b.y); ctx.rotate(b.spin||0);
        ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.arc(0,0,b.r,0,Math.PI*2); ctx.stroke();
        for (let k=0;k<6;k++){
          const a2 = (Math.PI*2/6)*k;
          ctx.beginPath();
          ctx.moveTo(Math.cos(a2)*b.r*0.3, Math.sin(a2)*b.r*0.3);
          ctx.lineTo(Math.cos(a2)*b.r*1.15, Math.sin(a2)*b.r*1.15);
          ctx.stroke();
        }
        ctx.beginPath(); ctx.arc(0,0,b.r*0.3,0,Math.PI*2); ctx.fill();
        ctx.restore();
      } else {
        // real bullet shape: pointed nose + tapered body — no flame, just the round fired off
        const ang = Math.atan2(b.vy, b.vx);
        ctx.save();
        ctx.translate(b.x, b.y); ctx.rotate(ang);
        ctx.fillStyle = b.color;
        ctx.beginPath();
        ctx.moveTo(b.r*1.6, 0);
        ctx.lineTo(b.r*0.2, b.r*0.55);
        ctx.lineTo(-b.r*0.9, b.r*0.5);
        ctx.quadraticCurveTo(-b.r*1.3, 0, -b.r*0.9, -b.r*0.5);
        ctx.lineTo(b.r*0.2, -b.r*0.55);
        ctx.closePath(); ctx.fill();
        // glint highlight
        ctx.fillStyle = 'rgba(255,255,255,0.55)';
        ctx.beginPath(); ctx.ellipse(-b.r*0.4,-b.r*0.15,b.r*0.3,b.r*0.12,0,0,Math.PI*2); ctx.fill();
        ctx.restore();
      }
    }
    ctx.restore();

    // flying knives — thrown from the ring, tumbling toward their target
    ctx.save();
    for (const kn of knives){
      const ang = Math.atan2(kn.vy, kn.vx);
      ctx.save();
      ctx.translate(kn.x, kn.y);
      ctx.rotate(ang + Math.PI/2 + kn.spin*0.3);
      ctx.shadowColor = 'rgba(255,50,65,0.75)'; ctx.shadowBlur = 7;
      // blade — tapered diamond profile with a metallic gradient, not a flat triangle
      const bladeGrad = ctx.createLinearGradient(-2.6,-11,2.6,3.2);
      bladeGrad.addColorStop(0, '#f5f8fb');
      bladeGrad.addColorStop(0.5, '#c4ccd6');
      bladeGrad.addColorStop(1, '#868d97');
      ctx.fillStyle = bladeGrad;
      ctx.beginPath();
      ctx.moveTo(0,-11);
      ctx.lineTo(2.3,-2.3);
      ctx.lineTo(2.7,3.2);
      ctx.lineTo(0,2.0);
      ctx.lineTo(-2.7,3.2);
      ctx.lineTo(-2.3,-2.3);
      ctx.closePath(); ctx.fill();
      ctx.shadowBlur = 0;
      // fuller (blood groove) running down the center of the blade
      ctx.strokeStyle = 'rgba(55,60,68,0.55)'; ctx.lineWidth = 0.6;
      ctx.beginPath(); ctx.moveTo(0,-9.3); ctx.lineTo(0,2.1); ctx.stroke();
      // steel glint highlight along one edge
      ctx.strokeStyle = 'rgba(255,255,255,0.85)'; ctx.lineWidth = 0.7;
      ctx.beginPath(); ctx.moveTo(-1.1,-8.8); ctx.lineTo(-0.6,1.4); ctx.stroke();
      // crossguard
      ctx.fillStyle = '#2b2b2f';
      ctx.fillRect(-3.4,3.2,6.8,1.3);
      // wrapped grip
      ctx.fillStyle = '#3a2417';
      ctx.fillRect(-1.7,4.5,3.4,5.2);
      ctx.strokeStyle = 'rgba(0,0,0,0.5)'; ctx.lineWidth = 0.5;
      for (let wgi=0; wgi<3; wgi++){
        const wy = 5.2+wgi*1.5;
        ctx.beginPath(); ctx.moveTo(-1.7,wy); ctx.lineTo(1.7,wy); ctx.stroke();
      }
      // pommel cap
      ctx.fillStyle = '#5a5a60';
      ctx.beginPath(); ctx.arc(0,9.9,1.1,0,Math.PI*2); ctx.fill();
      ctx.restore();
    }
    ctx.restore();

    // the gothic backdrop wall behind the cobra is drawn separately, much earlier in this pass
    // (right after the ground/decor layer, before bullets/entities) — see the comment there for
    // why. This block just draws the cobra itself, its ground crack, and its health bar.
    if (cobra){
      const cb = cobra;
      ctx.save();
      // same reasoning as the wall above — the cobra itself stays fully solid, not haze-faded
      ctx.globalAlpha = 1;

      // ground crack the cobra rose out of — dark fissures with a green glow bleeding through.
      // Only drawn while it's actually rising out of the ground — this used to keep drawing
      // every single frame for the entire fight (with shadowBlur on 9 cracks!), which is what
      // was hanging the game the whole time the cobra was up.
      if (cb.cracks && cb.crackReveal > 0 && cb.state === 'rising' && cb.crackReveal > 0.2){
        ctx.save();
        ctx.globalAlpha *= cb.crackReveal;
        for (const pts of cb.cracks){
          ctx.beginPath();
          ctx.moveTo(pts[0].x, pts[0].y);
          for (let i=1;i<pts.length;i++) ctx.lineTo(pts[i].x, pts[i].y);
          ctx.strokeStyle = 'rgba(61,255,110,0.4)'; ctx.lineWidth = 5; ctx.shadowColor='rgba(61,255,110,0.2)'; ctx.shadowBlur=2;
          ctx.stroke();
          ctx.strokeStyle = 'rgba(8,10,10,0.8)'; ctx.lineWidth = 2.2; ctx.shadowBlur = 0;
          ctx.stroke();
        }
        ctx.restore();
      }
      // dust/dirt mound at the base
      ctx.fillStyle = 'rgba(20,14,10,0.6)';
      ctx.beginPath(); ctx.ellipse(cb.x, cb.y, cb.r*1.4, cb.r*0.4, 0, 0, Math.PI*2); ctx.fill();

      // solid black cobra — same build as the reference: one solid bezier body, a solid
      // flared bezier hood, a solid head with glowing eyes, and a bezier mouth with fangs.
      const riseFrac = cb.state === 'rising' ? Math.min(1, cb.riseT/cb.riseDur) : 1;
      const S = cb.r/105; // uniform scale so the reference's fixed-pixel art fits this cobra's size (r)
      const HEIGHT_SCALE = COBRA_HEIGHT_SCALE; // stretches the cobra taller without widening it, so it looms more
      const bodyLen = 690*S*HEIGHT_SCALE; // used below for the health-bar position
      ctx.save();
      ctx.translate(cb.x, cb.y);
      ctx.scale(1, Math.max(0.02, riseFrac)); // rises up out of the ground
      if (cb.hitFlash > 0) ctx.globalAlpha = Math.min(1, 0.5 + cb.hitFlash*2); // fast alternative to filter
      ctx.scale(S, S);
      ctx.scale(1, HEIGHT_SCALE); // extra vertical stretch — taller hood/body/head, same girth
      ctx.translate(Math.sin(cb.sway*1.7)*7, -Math.abs(Math.sin(cb.sway*1.4))*12); // gentle live sway

      // solid body — emerges from the earth
      const body = ctx.createLinearGradient(-120,0,120,0);
      body.addColorStop(0,'#050505'); body.addColorStop(0.5,'#1a1a1a'); body.addColorStop(1,'#020202');
      ctx.fillStyle = body; 
      // NO hard outline — instead, use a shadow to blend with ground
      ctx.shadowColor = 'rgba(0,0,0,0.6)';
      ctx.shadowBlur = 18;
      ctx.shadowOffsetY = 8;
      ctx.beginPath(); ctx.moveTo(-115,0); ctx.bezierCurveTo(-155,-220,-100,-430,-62,-585);
      ctx.bezierCurveTo(-35,-670,35,-670,62,-585);
      ctx.bezierCurveTo(100,-430,155,-220,115,0); ctx.closePath(); ctx.fill();
      
      // ADD GROUND EMERGENCE EFFECT — soil particles clinging to the base
      ctx.shadowBlur = 0;
      ctx.shadowOffsetY = 0;
      ctx.fillStyle = 'rgba(40,28,18,0.5)'; // dark earth tone
      for (let i = 0; i < 12; i++){
        const angle = (Math.PI * 2 * i) / 12;
        const dist = 80 + Math.sin(cb.sway + i)*15;
        const px = Math.cos(angle) * dist;
        const py = Math.sin(angle) * dist + 20;
        ctx.beginPath(); ctx.arc(px, py, 8 + Math.random()*6, 0, Math.PI*2); ctx.fill();
      }
      // Add subtle ground glow at base
      const groundBlend = ctx.createRadialGradient(0,0,50,0,0,140);
      groundBlend.addColorStop(0,'rgba(30,24,16,0.4)');
      groundBlend.addColorStop(1,'rgba(20,14,10,0)');
      ctx.fillStyle = groundBlend;
      ctx.beginPath(); ctx.arc(0, 30, 140, 0, Math.PI*2); ctx.fill();

      // scales — drawn on the neck/body surface, so this stays outside the head-weave
      // rotation below (the head sways, the neck skin underneath doesn't)
      ctx.strokeStyle = 'rgba(100,100,100,.28)'; ctx.lineWidth = 2;
      for (let y=-520;y<0;y+=28){ ctx.beginPath(); ctx.arc(0,y,75,0,Math.PI); ctx.stroke(); }

      // head weave — a real cobra doesn't hold its head dead still, it slowly weaves the
      // whole head+hood side to side AND nods/leans toward and away from its target. The
      // left-right part is a rotation around the neck; the front-back part is a small nod
      // (shift + scale, both together) so it visibly moves toward the player and pulls back,
      // not just a barely-noticeable size pulse — on a different rhythm from the sideways
      // sway so the two don't cancel into a flat line.
      const headWave = Math.sin(cb.sway*0.9) * 0.045; // left-right — kept minimal, this is not the main motion
      const forwardT = Math.sin(cb.sway*0.55 + 1.2); // -1..1 front-back rhythm — the main, dominant motion
      const headForwardScale = 1 + forwardT*0.16;
      const headForwardShift = forwardT*42; // + = nodding toward the player, - = pulling back
      ctx.save();
      ctx.translate(0,-500);
      ctx.rotate(headWave);
      ctx.translate(0, headForwardShift);
      ctx.scale(headForwardScale, headForwardScale);
      ctx.translate(0,500);

      // giant hood — flares open once the cobra is fully risen and active. A real cobra's
      // hood is skin stretched over a fan of rib bones, so instead of one smooth blob this
      // is a scalloped rim (small lobes between each rib) plus the ribs themselves drawn as
      // faint lines radiating out from the neck — that's what reads as a real hood shape.
      const HOOD_SCALE = 1.85; // BIGGER: increased from 1.55 for massive imposing hood
      const hoodOpen = cb.state === 'active' ? cb.hoodT : 0;
      
      // MULTI-LAYER HOOD GLOW — outer bloom then solid body
      ctx.save();
      ctx.translate(0,-505); ctx.scale(HOOD_SCALE, HOOD_SCALE); ctx.translate(0,505);
      ctx.scale(0.3 + 0.7*hoodOpen, 1); // hood starts folded, flares wide once active
      
      // OUTER SHIMMER AURA — jet black polished shine
      if (hoodOpen > 0.2){
        const glowGrad = ctx.createRadialGradient(0,-600,150,0,-600,320+100*hoodOpen);
        glowGrad.addColorStop(0,'rgba(40,40,50,0.25)');
        glowGrad.addColorStop(0.5,'rgba(20,20,30,0.12)');
        glowGrad.addColorStop(1,'rgba(10,10,15,0)');
        ctx.fillStyle = glowGrad;
        ctx.beginPath(); ctx.arc(0,-600, 320+100*hoodOpen, 0, Math.PI*2); ctx.fill();
      }
      
      // MAIN HOOD BODY with deep black gradient
      const hood = ctx.createRadialGradient(0,-600,20,0,-600,220+60*hoodOpen);
      hood.addColorStop(0,'#1a1a1a'); 
      hood.addColorStop(0.4,'#0a0a0a'); 
      hood.addColorStop(0.8,'#050505');
      hood.addColorStop(1,'#000000');
      
      ctx.fillStyle = hood; 
      ctx.strokeStyle = '#1a1a1a'; // shining jet black outline
      ctx.lineWidth = 7;
      ctx.shadowColor = 'rgba(255,255,255,0.4)'; // bright white shine on edges
      ctx.shadowBlur = 12;
      
      const hoodRim = [
        {x:-70,  y:-505}, {x:-160, y:-470}, {x:-270, y:-540}, {x:-330, y:-650},
        {x:-300, y:-740}, {x:-205, y:-770}, {x:-125, y:-745}, {x:-45,  y:-770},
        {x:0,    y:-755}, {x:45,   y:-770}, {x:125,  y:-745}, {x:205,  y:-770},
        {x:300,  y:-740}, {x:330,  y:-650}, {x:270,  y:-540}, {x:160,  y:-470},
        {x:70,   y:-505}
      ];
      ctx.beginPath();
      ctx.moveTo(hoodRim[0].x, hoodRim[0].y);
      for (let i=1;i<hoodRim.length;i++){
        const p = hoodRim[i], prev = hoodRim[i-1];
        const mx = (prev.x+p.x)/2, my = (prev.y+p.y)/2;
        ctx.quadraticCurveTo(prev.x, prev.y, mx, my);

      ctx.lineTo(hoodRim[hoodRim.length-1].x, hoodRim[hoodRim.length-1].y);
      ctx.closePath();

      ctx.shadowColor = 'rgba(255,255,255,0.6)';
      ctx.shadowBlur = 8;
      ctx.lineWidth = 2;
      ctx.strokeStyle = 'rgba(180,180,200,0.4)'; // bright silvery edge

      ctx.shadowBlur = 6;
      for (let ribIdx = 0; ribIdx < hoodRim.length; ribIdx += 2){

        ribGrad.addColorStop(0,'rgba(60,60,80,0.3)'); // darker ribs with subtle shine
        ribGrad.addColorStop(0.4,'rgba(40,40,60,0.15)');
        ribGrad.addColorStop(1,'rgba(20,20,40,0)');

      // ADDITIONAL METALLIC ACCENTS — subtle glimmer along scallops
      ctx.strokeStyle = 'rgba(80,80,100,0.2)';
      ctx.lineWidth = 1.5;
      for (let i = 0; i < hoodRim.length - 1; i++){
        const p1 = hoodRim[i], p2 = hoodRim[i+1];
        const mx = (p1.x + p2.x) / 2, my = (p1.y + p2.y) / 2;
        ctx.beginPath(); ctx.moveTo(mx, my); ctx.lineTo(mx*0.85, my*0.9); ctx.stroke();
      }
      
      ctx.shadowBlur = 0;
      ctx.restore();

      // head — larger, more imposing
      ctx.save();
      ctx.shadowColor = 'rgba(0,0,0,0.8)';
      ctx.shadowBlur = 25;
      ctx.fillStyle = '#050505';
      ctx.beginPath(); ctx.ellipse(0,-690,140,165,0,0,Math.PI*2); ctx.fill(); // increased from 115,135

      // FANGS — longer, more menacing, with metallic shine

      for (const x of [-38,38]){

        // FANG SHINE — metallic gloss
        ctx.fillStyle = 'rgba(255,255,255,0.5)';
        ctx.beginPath(); ctx.ellipse(x+(x<0?8:-8),-590, 2.5, 10, 0, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#f5f5f5';
      }

      // mouth burst — the flame breaks apart into chunks right as it leaves the jaws (a quick

      // the way to the officer as real fireGouts, spawned off the actual bullet in update()
      if (cb.mouthT > 0.28){
        const burstA = Math.max(0, 1 - (cb.mouthT-0.28)/0.17);
        if (burstA > 0.02){
          ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = burstA;
          for (let i=0;i<9;i++){
            const ang = Math.PI/2 + (Math.random()-0.5)*1.3;
            const len = 20 + Math.random()*80;
            const ex = Math.cos(ang)*len, ey = -600 + Math.sin(ang)*len;
            const rr = 4+Math.random()*7;
            ctx.fillStyle = '#e0e0e8'; // metallic white spark
            ctx.beginPath(); ctx.arc(ex, ey, rr, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#ffffff'; // bright white core
            ctx.beginPath(); ctx.arc(ex, ey, rr*0.4, 0, Math.PI*2); ctx.fill();

        }
      }

      ctx.restore(); // head weave rotation
      ctx.restore(); // rise scale + size scale

      // (the little green health-bar line that used to sit at the cobra's forehead was removed on request)
      ctx.restore();
    }

    // enemy bullets (glowing) — plain glowing bolts, except thrown axes which get a spinning blade shape
    ctx.save();
    ctx.shadowBlur = 8;
    for (const b of enemyBullets){
      ctx.shadowColor = b.color;

        ctx.beginPath(); ctx.ellipse(0,0,b.r,b.r*0.4,0,0,Math.PI*2); ctx.fill();

        ctx.restore();
      } else if (b.shape === 'gspear'){
        // little-giant's thrown spear — a long yellow shaft with a sharp tip, oriented along flight
        ctx.save();
        ctx.translate(b.x, b.y);
        ctx.rotate(b.spin||0);
        ctx.fillStyle = '#8a6a2f';
        ctx.fillRect(-b.r*2.6, -b.r*0.16, b.r*3.2, b.r*0.32);
        ctx.fillStyle = b.color;
        ctx.beginPath();
        ctx.moveTo(b.r*0.6, 0); ctx.lineTo(-b.r*0.2, -b.r*0.55); ctx.lineTo(-b.r*0.2, b.r*0.55);
        ctx.closePath(); ctx.fill();
        ctx.restore();
      } else if (b.shape === 'fspear'){
        // hidden archer's fiery arrow — built to match the reference art: a real layered
        // flame tail, fiery fletching, a steel/gold shaft, and an ornate gold arrowhead.
        // Tumbles with a continuous horizontal spin as it flies, long and lean.
        ctx.save();
        ctx.translate(b.x, b.y);
        ctx.rotate(b.spin||0);
        ctx.scale(1, Math.cos(b.roll||0)); // fast axial roll — arrow stays pointed straight, but visibly spins around its own shaft like a real arrow in flight
        const L = b.r;
        const S = L*4.6; // length scale — makes the arrow visibly longer without touching its hit radius
        const W = L*2.1; // width scale — makes the arrow visibly thicker without touching its hit radius

        // flame tail — soft outer glow
        ctx.shadowColor = 'rgba(255,80,0,0.9)'; ctx.shadowBlur = 12;
        const tailGrad = ctx.createLinearGradient(-S*4.2, 0, -S*1.0, 0);
        tailGrad.addColorStop(0, 'rgba(142,13,0,0)');
        tailGrad.addColorStop(0.45, 'rgba(255,61,0,0.55)');
        tailGrad.addColorStop(1, 'rgba(255,176,0,0.9)');
        ctx.fillStyle = tailGrad;
        ctx.beginPath();
        ctx.moveTo(-S*4.2, -W*0.6);
        ctx.quadraticCurveTo(-S*2.3, -W*0.22, -S*1.0, -W*0.14);
        ctx.quadraticCurveTo(-S*2.4, 0, -S*0.9, 0);
        ctx.quadraticCurveTo(-S*2.3, W*0.22, -S*1.0, W*0.14);
        ctx.quadraticCurveTo(-S*2.5, W*0.55, -S*4.2, W*0.6);
        ctx.closePath(); ctx.fill();
        ctx.shadowBlur = 0;

        // brighter flame core, riding closer to the shaft
        const coreGrad = ctx.createLinearGradient(-S*2.6, 0, -S*0.9, 0);
        coreGrad.addColorStop(0, 'rgba(255,246,160,0)');
        coreGrad.addColorStop(0.5, 'rgba(255,176,0,0.9)');
        coreGrad.addColorStop(1, 'rgba(255,224,140,0.95)');
        ctx.fillStyle = coreGrad;
        ctx.beginPath();
        ctx.moveTo(-S*2.6, -W*0.26); ctx.quadraticCurveTo(-S*1.3, -W*0.08, -S*0.9, -W*0.06);
        ctx.quadraticCurveTo(-S*1.4, W*0.1, -S*0.9, W*0.06); ctx.quadraticCurveTo(-S*1.5, W*0.3, -S*2.6, W*0.26);
        ctx.closePath(); ctx.fill();

        // fiery fletching feathers at the tail
        ctx.strokeStyle = '#ff9d16'; ctx.lineWidth = 1.4;
        ctx.fillStyle = 'rgba(108,37,5,0.85)';
        ctx.beginPath();
        ctx.moveTo(-S*1.3, 0); ctx.quadraticCurveTo(-S*1.9, -W*0.5, -S*2.55, -W*0.32);
        ctx.quadraticCurveTo(-S*2.05, -W*0.12, -S*1.6, 0);

        ctx.moveTo(-S*1.3, 0); ctx.quadraticCurveTo(-S*1.9, W*0.5, -S*2.55, W*0.32);

        ctx.restore();
      } else if (b.shape === 'mgtracer'){

      } else if (b.shape === 'garrow'){

      } else if (b.shape === 'demonfire'){

      } else if (b.shape === 'demonbreath'){

        ctx.save();

        if (b.poison){
          cg.addColorStop(0, '#fffef5'); // white hot center
          cg.addColorStop(0.3, '#ffff00'); // yellow
          cg.addColorStop(0.5, '#ffaa00'); // orange burning
          cg.addColorStop(0.75, '#5dff6e'); // green
          cg.addColorStop(1, 'rgba(45,255,95,0.1)'); // fade to transparent
        } else if (b.blue){
          cg.addColorStop(0, '#f0fbff'); cg.addColorStop(0.5, '#4fb0ff'); cg.addColorStop(1, 'rgba(20,90,200,0)');
        } else {
          cg.addColorStop(0, '#fff6d0'); cg.addColorStop(0.5, '#ff7a2e'); cg.addColorStop(1, 'rgba(200,30,10,0)');
        }
        ctx.fillStyle = cg;
        ctx.beginPath(); ctx.arc(b.r*0.1, 0, b.r*1.15*flick, 0, Math.PI*2); ctx.fill();
        ctx.restore();
      } else if (b.shape === 'tankshell'){
        // giant tank's heavy shell — stubby glowing round, oriented along flight
        ctx.save();
        ctx.translate(b.x, b.y);
        ctx.rotate(Math.atan2(b.vy,b.vx));
        ctx.shadowColor = '#ffb347'; ctx.shadowBlur = 16;
        ctx.fillStyle = '#ffb347';
        ctx.beginPath(); ctx.ellipse(0,0,b.r*1.3,b.r*0.75,0,0,Math.PI*2); ctx.fill();
        ctx.fillStyle = '#7a4a1a';
        ctx.beginPath(); ctx.ellipse(-b.r*0.7,0,b.r*0.55,b.r*0.55,0,0,Math.PI*2); ctx.fill();
        ctx.restore();
      } else if (b.shape === 'fireball'){
        // little-giant's thrown fireball — flickering orange orb, sets the officer briefly ablaze
        ctx.save();
        ctx.translate(b.x, b.y);
        const flick = 0.75 + Math.sin(performance.now()/45)*0.25;
        ctx.shadowColor = 'rgba(255,120,40,1)'; ctx.shadowBlur = 18*flick;
        const fg = ctx.createRadialGradient(0,0,1, 0,0,b.r*1.3);
        fg.addColorStop(0, '#fff2c0'); fg.addColorStop(0.5, '#ff9a3d'); fg.addColorStop(1, 'rgba(255,80,20,0)');
        ctx.fillStyle = fg;
        ctx.beginPath(); ctx.arc(0,0,b.r*1.3,0,Math.PI*2); ctx.fill();
        ctx.restore();
      } else if (b.shape === 'snake'){
        // slithering poisonous snake — a wavy green body with a small raised head
        ctx.save();
        ctx.translate(b.x, b.y);
        const ang = Math.atan2(b.vy,b.vx);
        ctx.rotate(ang);
        ctx.strokeStyle = b.color; ctx.lineWidth = b.r*0.7; ctx.lineCap = 'round';
        ctx.beginPath();
        for (let s=-3;s<=0;s++){
          const px = s*b.r*1.3, py = Math.sin((b.wiggle||0)+s*1.3)*b.r*0.7;
          if (s===-3) ctx.moveTo(px,py); else ctx.lineTo(px,py);
        }
        ctx.stroke();
        ctx.fillStyle = '#3a8f45';
        ctx.beginPath(); ctx.ellipse(b.r*0.3, 0, b.r*0.4, b.r*0.35, 0, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#ff3333'; ctx.shadowColor = '#ff0000'; ctx.shadowBlur = 6;
        ctx.beginPath(); ctx.arc(b.r*0.5, -b.r*0.08, b.r*0.08, 0, Math.PI*2); ctx.fill();
        ctx.shadowBlur = 0;
        ctx.restore();
      } else if (b.shape === 'poisondrip'){
        // demon dog's mouth spit — a trail of glowing green poison droplets, not a solid beam
        ctx.save();
        ctx.translate(b.x, b.y);
        const ang = Math.atan2(b.vy,b.vx);
        ctx.shadowColor = 'rgba(80,255,90,0.9)'; ctx.shadowBlur = 10;
        for (let s=0; s<4; s++){
          const dx = -Math.cos(ang)*s*b.r*0.9, dy = -Math.sin(ang)*s*b.r*0.9;
          const wob = Math.sin(performance.now()/70 + s*1.7 + b.x)*b.r*0.18;
          const dotR = b.r*(0.62 - s*0.11);
          ctx.globalAlpha = groundFade(b.y) * (1 - s*0.2);
          ctx.fillStyle = s===0 ? '#c8ffb0' : '#4fdc5a';
          ctx.beginPath(); ctx.arc(dx, dy+wob, Math.max(1,dotR), 0, Math.PI*2); ctx.fill();
        }
        ctx.restore();
      } else {
        ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,Math.PI*2); ctx.fill();
      }
    }
    ctx.restore();

    // desert tornado — distant warning ring while it telegraphs, a chasing funnel while it
    // hunts, then the "big power" catch sequence: earth cracks open, a blast rips out, and
    // the officer is dragged down and swallowed into the ground
    if (tornado){
      const T = tornado, timeNow = performance.now()/1000;
      ctx.save();
      if (T.state === 'telegraph'){
        const pulse = 0.5 + 0.5*Math.sin(timeNow*6);
        ctx.strokeStyle = `rgba(255,30,20,${0.4+0.4*pulse})`;
        ctx.lineWidth = 6;
        ctx.shadowColor = 'rgba(255,20,10,0.9)'; ctx.shadowBlur = 22;
        ctx.beginPath(); ctx.arc(T.x, T.y, (150+pulse*36)*0.7, 0, Math.PI*2); ctx.stroke();
        ctx.shadowBlur = 0;
        ctx.fillStyle = `rgba(255,90,70,${0.65+0.3*pulse})`;
        ctx.font = 'bold 42px sans-serif'; ctx.textAlign = 'center';
        ctx.fillText('⚠', T.x, T.y-140);
      } else if (T.state === 'chasing' || T.state === 'spin'){
        const isSpin = T.state === 'spin';
        const fx = isSpin ? T.lockX : T.x, fy = isSpin ? T.lockY : T.y;
        const spinBoost = isSpin ? 2.4 : 1; // whips around much faster once it has him
        // 3D approach feel — far away it reads small and distant, then visibly grows as the
        // gap to the officer closes, like it's coming AT the camera rather than just sliding in
        const distToPlayer = isSpin ? 0 : Math.hypot(player.x-T.x, player.y-T.y);
        const distScale = Math.max(0.5, Math.min(1.9, 1.9 - distToPlayer/650)) * 0.7; // *0.7 shrinks the overall funnel size
        // ground dust cloud at the base — huge now, this thing is enormous
        const dustGrad = ctx.createRadialGradient(fx,fy,0,fx,fy,300*distScale);
        dustGrad.addColorStop(0,'rgba(230,40,25,0.46)');
        dustGrad.addColorStop(1,'rgba(230,40,25,0)');
        ctx.fillStyle = dustGrad;
        ctx.beginPath(); ctx.ellipse(fx,fy,300*distScale,82*distScale,0,0,Math.PI*2); ctx.fill();
        // pale grey mist swirling around the base and lower body, mixed in with the red
        for (let i=0;i<10;i++){
          const mAng = T.spin*1.5 + i*(Math.PI*2/10);
          const mR = (120 + (i%3)*55) * distScale;
          const mx = fx + Math.cos(mAng)*mR;
          const my = fy - 30*distScale + Math.sin(mAng)*mR*0.4;
          const mGrad = ctx.createRadialGradient(mx,my,0,mx,my,70*distScale);
          mGrad.addColorStop(0,'rgba(225,225,230,0.22)');
          mGrad.addColorStop(1,'rgba(225,225,230,0)');
          ctx.fillStyle = mGrad;
          ctx.beginPath(); ctx.ellipse(mx,my,70*distScale,34*distScale,0,0,Math.PI*2); ctx.fill();
        }
        // layered funnel bands rising into the sky — colossal and blood-red, scaled by distance
        const height = TORNADO_FUNNEL_H * distScale;
        const bands = 30;
        for (let b=0;b<bands;b++){
          const bt = b/(bands-1);
          const by = fy - bt*height;
          const wobble = Math.sin(timeNow*2.4 + bt*7 + T.spin*spinBoost)*(14+bt*22)*distScale;
          const width = (40 + (1-bt)*190) * distScale;
          const cx = fx + wobble;
          const shade = 150+bt*70;
          ctx.fillStyle = `rgba(${Math.min(255,shade+60)|0},${(shade*0.18)|0},${(shade*0.14)|0},${(0.18+(1-bt)*0.16).toFixed(3)})`;
          ctx.beginPath();
          ctx.ellipse(cx, by, Math.max(1,width), (22+bt*9)*distScale, 0, 0, Math.PI*2);
          ctx.fill();
          // wispy mist streak riding along the same band, higher up where it thins to haze
          if (bt > 0.35){
            ctx.fillStyle = `rgba(230,230,235,${(0.05+(1-bt)*0.07).toFixed(3)})`;
            ctx.beginPath();
            ctx.ellipse(cx, by, Math.max(1,width*1.15), (14+bt*6)*distScale, 0, 0, Math.PI*2);
            ctx.fill();
          }
        }
        // spinning debris ring near the base
        for (let i=0;i<22;i++){
          const ang = T.spin*3.2*spinBoost + i*(Math.PI*2/22);
          const rr = (100+(i%3)*40) * distScale;
          const px = fx + Math.cos(ang)*rr;
          const py = fy + Math.sin(ang)*rr*0.3 - 12*distScale;
          ctx.fillStyle = 'rgba(255,70,50,0.6)';
          ctx.beginPath(); ctx.arc(px,py,6.4*distScale,0,Math.PI*2); ctx.fill();
        }
        // while spinning, a tight bright vortex core plus a trailing streak of debris
        // spiraling around the officer himself, right where he actually is, so he clearly
        // reads as caught INSIDE the swirling mass and not standing outside it
        if (isSpin){
          const coreGrad = ctx.createRadialGradient(fx,fy,0,fx,fy,95);
          coreGrad.addColorStop(0,'rgba(255,235,210,0.6)');
          coreGrad.addColorStop(0.4,'rgba(255,40,25,0.42)');
          coreGrad.addColorStop(1,'rgba(255,40,25,0)');
          ctx.fillStyle = coreGrad;
          ctx.beginPath(); ctx.arc(fx,fy,95,0,Math.PI*2); ctx.fill();
          for (let i=0;i<12;i++){
            const ang = T.spinOrbitStart + T.spin*2.6 - i*0.32;
            const spinT = Math.min(1, T.phaseT/4.0);
            const rr = 34*(1-spinT*0.95) + i*3;
            const px = fx + Math.cos(ang)*rr;
            const py = fy + Math.sin(ang)*rr*0.55;
            ctx.fillStyle = `rgba(255,220,180,${(0.55*(1-i/12)).toFixed(3)})`;
            ctx.beginPath(); ctx.arc(px,py,3.8,0,Math.PI*2); ctx.fill();
          }
        }
      } else if (T.state === 'crack' || T.state === 'blast' || T.state === 'swallow'){
        const reveal = T.state === 'crack' ? T.crackReveal : 1;
        // one shared 0..1 progress across blast+swallow — funnel and officer sink together
        const collapseT = tornadoCollapseFrac(T);
        // ---- the funnel stays put and fully visible while the ground cracks open beneath
        // it, then sinks smoothly down into the pit over the blast+swallow — drawn FIRST so
        // it always reads as still standing there, never popping away before the descent ----
        {
          const funnelScale = Math.max(0, 1 - collapseT) * 0.7; // matches the shrunk chasing/spin funnel size
          const dropY = collapseT * 340; // drags the whole funnel down into the earth with him
          if (funnelScale > 0.02){
            const height = TORNADO_FUNNEL_H * funnelScale;
            const bands = 22;
            for (let b=0;b<bands;b++){
              const bt = b/(bands-1);
              const by = T.lockY + dropY - bt*height;
              const wobble = Math.sin(timeNow*2.4 + bt*7 + T.spin)*(14+bt*22)*funnelScale;
              const width = (40 + (1-bt)*190) * funnelScale;
              const cx = T.lockX + wobble;
              const shade = 150+bt*70;
              ctx.fillStyle = `rgba(${Math.min(255,shade+60)|0},${(shade*0.18)|0},${(shade*0.14)|0},${(0.18+(1-bt)*0.16).toFixed(3)})`;
              ctx.beginPath();
              ctx.ellipse(cx, by, Math.max(1,width), 22+bt*9, 0, 0, Math.PI*2);
              ctx.fill();
            }
            // dust skirt where the shrinking funnel still meets the ground
            const skirtGrad = ctx.createRadialGradient(T.lockX,T.lockY+dropY,0,T.lockX,T.lockY+dropY,220*funnelScale);
            skirtGrad.addColorStop(0,'rgba(230,40,25,0.35)');
            skirtGrad.addColorStop(1,'rgba(230,40,25,0)');
            ctx.fillStyle = skirtGrad;
            ctx.beginPath(); ctx.ellipse(T.lockX,T.lockY+dropY,220*funnelScale,60*funnelScale,0,0,Math.PI*2); ctx.fill();
          }
        }
        // ---- glowing molten earth cracks radiating from the catch point ----
        if (T.cracks){
          T.cracks.forEach(function(pts){
            const revealCount = Math.max(1, Math.floor(pts.length*reveal));
            ctx.save();
            ctx.strokeStyle = 'rgba(10,6,3,0.9)';
            ctx.lineWidth = 6;
            ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y);
            for (let i=1;i<revealCount;i++) ctx.lineTo(pts[i].x, pts[i].y);
            ctx.stroke();
            ctx.shadowColor = 'rgba(255,110,30,0.9)'; ctx.shadowBlur = 16;
            ctx.strokeStyle = `rgba(255,120,40,${(0.6*reveal).toFixed(3)})`;
            ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y);
            for (let j=1;j<revealCount;j++) ctx.lineTo(pts[j].x, pts[j].y);
            ctx.stroke();
            ctx.restore();
          });
        }
        // ---- the abyss opening up under the catch point — keeps widening through the
        // whole collapse so the pit visibly swallows both the officer and the tornado ----
        const holeFactor = T.state === 'crack' ? reveal : 1;
        const holeR = (T.state === 'blast' || T.state === 'swallow') ? (150 + collapseT*110) : (22 + holeFactor*110);
        const hGrad = ctx.createRadialGradient(T.lockX,T.lockY,0,T.lockX,T.lockY,holeR);
        hGrad.addColorStop(0, `rgba(255,120,40,${(0.5*holeFactor).toFixed(3)})`);
        hGrad.addColorStop(0.35, 'rgba(15,7,4,0.95)');
        hGrad.addColorStop(1, 'rgba(5,5,4,0)');
        ctx.fillStyle = hGrad;
        ctx.beginPath(); ctx.ellipse(T.lockX,T.lockY, holeR, holeR*0.35, 0, 0, Math.PI*2); ctx.fill();
        // ---- shockwave ring from the blast ----
        if (T.state === 'blast'){
          const ringAlpha = Math.max(0, 1-T.phaseT/0.4)*0.6;
          ctx.strokeStyle = `rgba(255,140,60,${ringAlpha.toFixed(3)})`;
          ctx.lineWidth = 7;
          ctx.beginPath(); ctx.ellipse(T.lockX,T.lockY, T.shockR, T.shockR*0.3, 0, 0, Math.PI*2); ctx.stroke();
        }
        // ---- the whole blast radius turns black and smoky — scorched earth left behind
        // by the explosion, growing to match the shockwave and lingering through the sink ----
        if (T.state === 'blast' || T.state === 'swallow'){
          const smokeR = Math.max(T.shockR, 90) + (T.state === 'swallow' ? collapseT*100 : 0);
          const smokeAlpha = T.state === 'blast' ? Math.min(1, T.phaseT/0.35) : Math.max(0, 1-collapseT*0.55);
          const scorchGrad = ctx.createRadialGradient(T.lockX,T.lockY,0,T.lockX,T.lockY,smokeR);
          scorchGrad.addColorStop(0, `rgba(10,9,9,${(0.7*smokeAlpha).toFixed(3)})`);
          scorchGrad.addColorStop(0.65, `rgba(10,9,9,${(0.4*smokeAlpha).toFixed(3)})`);
          scorchGrad.addColorStop(1, 'rgba(10,9,9,0)');
          ctx.fillStyle = scorchGrad;
          ctx.beginPath(); ctx.ellipse(T.lockX,T.lockY,smokeR,smokeR*0.34,0,0,Math.PI*2); ctx.fill();
          // billowing smoke puffs drifting up off the scorched patch
          for (let i=0;i<9;i++){
            const ang = (i/9)*Math.PI*2 + T.spin*0.4;
            const rr = smokeR*(0.35+0.5*((i*37)%5)/5);
            const rise = T.state === 'swallow' ? collapseT*40 : T.phaseT*60;
            const sx = T.lockX + Math.cos(ang)*rr*0.9;
            const sy = T.lockY + Math.sin(ang)*rr*0.32 - rise;
            const puffR = smokeR*0.4;
            const pGrad = ctx.createRadialGradient(sx,sy,0,sx,sy,puffR);
            pGrad.addColorStop(0, `rgba(28,26,25,${(0.5*smokeAlpha).toFixed(3)})`);
            pGrad.addColorStop(1, 'rgba(28,26,25,0)');
            ctx.fillStyle = pGrad;
            ctx.beginPath(); ctx.ellipse(sx,sy,puffR,puffR*0.7,0,0,Math.PI*2); ctx.fill();
          }
        }
        // ---- flying debris from the blast ----
        for (const p of T.blastParticles){
          if (p.life <= 0) continue;
          ctx.fillStyle = `rgba(150,100,60,${Math.max(0,p.life).toFixed(3)})`;
          ctx.fillRect(p.x-p.size/2, p.y-p.size/2, p.size, p.size);
        }
        // ---- full-frame flash the instant it slams shut ----
        if (T.flash > 0.01){
          ctx.fillStyle = `rgba(255,150,70,${Math.min(1,T.flash).toFixed(3)})`;
          ctx.fillRect(camera.x, camera.y, VW, VH);
        }
      }
      ctx.restore();
    }

    // desert gunship — black/orange attack helicopter hovering high overhead, main rotor
    // a spinning blur, tail rotor buzzing, muzzle flash under the nose while it fires
    if (heli){
      const hx = heli.x, hy = heli.y;
      const face = heli.facing; // -1 or 1, which way the nose points
      ctx.save();
      // soft ground shadow far below, sells the altitude
      const shadowY = hy + 610;
      const shGrad = ctx.createRadialGradient(hx, shadowY, 0, hx, shadowY, 90*1.6);
      shGrad.addColorStop(0, 'rgba(0,0,0,0.35)');
      shGrad.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = shGrad;
      ctx.beginPath(); ctx.ellipse(hx, shadowY, 90*1.6, 18*1.6, 0, 0, Math.PI*2); ctx.fill();

      ctx.translate(hx, hy);
      const HELI_SCALE = 1.6; // bumped up so the gunship reads as a real threat overhead, not a speck
      ctx.scale(face*HELI_SCALE, HELI_SCALE);
      // tail boom
      ctx.fillStyle = '#181a1c';
      ctx.beginPath();
      ctx.moveTo(-8, -6); ctx.lineTo(-78, 4); ctx.lineTo(-78, 12); ctx.lineTo(-8, 14);
      ctx.closePath(); ctx.fill();
      // orange stripe along the tail/body
      ctx.fillStyle = '#ff8a1f';
      ctx.fillRect(-70, 5, 55, 4);
      // tail fin + spinning tail rotor blur
      ctx.fillStyle = '#181a1c';
      ctx.beginPath(); ctx.moveTo(-78,4); ctx.lineTo(-92,-16); ctx.lineTo(-82,6); ctx.closePath(); ctx.fill();
      ctx.save();
      ctx.translate(-84,-6);
      ctx.rotate(heli.rotor*3);
      ctx.fillStyle = 'rgba(40,40,40,0.55)';
      ctx.beginPath(); ctx.ellipse(0,0, 14, 3, 0, 0, Math.PI*2); ctx.fill();
      ctx.restore();
      // main body
      ctx.fillStyle = '#1c1e20';
      ctx.beginPath();
      ctx.ellipse(0, 2, 34, 16, 0, 0, Math.PI*2); ctx.fill();
      // orange nose stripe
      ctx.fillStyle = '#ff8a1f';
      ctx.beginPath(); ctx.ellipse(20, 4, 12, 9, 0, 0, Math.PI*2); ctx.fill();
      // cockpit bubble
      ctx.fillStyle = '#bfe4ef';
      ctx.beginPath(); ctx.ellipse(14, -4, 13, 8, 0, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = '#0c0d0e'; ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.moveTo(14,-11); ctx.lineTo(14,3); ctx.stroke();
      // skids
      ctx.strokeStyle = '#0c0d0e'; ctx.lineWidth = 3; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(-20,20); ctx.lineTo(24,20); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-14,14); ctx.lineTo(-14,20); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(16,14); ctx.lineTo(16,20); ctx.stroke();
      // rotor mast + spinning main rotor blur (wide, thin ellipse, slight wobble)
      ctx.fillStyle = '#0c0d0e'; ctx.fillRect(-3,-18,6,10);
      ctx.save();
      ctx.translate(0,-18);
      ctx.rotate(Math.sin(heli.rotor*0.3)*0.02);
      ctx.fillStyle = 'rgba(20,20,20,0.45)';
      ctx.beginPath(); ctx.ellipse(0,0, 92, 5, 0, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = 'rgba(20,20,20,0.7)'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.ellipse(0,0, 92, 5, 0, 0, Math.PI*2); ctx.stroke();
      ctx.restore();
      // muzzle flash under the nose while actively bursting
      if (heli.burstLeft > 0){
        const flick = Math.random();
        ctx.fillStyle = flick > 0.5 ? '#fff4c2' : '#ffcf6e';
        ctx.beginPath(); ctx.arc(22, 14, 5+flick*2, 0, Math.PI*2); ctx.fill();
      }
      ctx.restore();
    }

    // shockwaves (Titan Ground Slam) — expanding danger ring
    ctx.save();
    for (const s of shockwaves){
      const fade = Math.max(0, 1 - s.r/s.maxR);
      ctx.strokeStyle = 'rgba(255,140,60,' + (0.75*fade) + ')';
      ctx.lineWidth = 8;
      ctx.shadowColor = 'rgba(255,120,40,0.9)'; ctx.shadowBlur = 16;
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI*2); ctx.stroke();
      ctx.shadowBlur = 0;
    }
    ctx.restore();

    // little giants — each zone's road is guarded by a different breed of demon, so the
    // road ahead always looks like a fresh threat instead of a reskinned reused clone
    // landing-spot shadow — grows and darkens on the ground as each giant slowly comes down,
    // so the officer can see exactly who is arriving and where
    {
      const descenders = littleGiants.concat(demon ? [demon] : []);
      for (const dg of descenders){
        if (!dg.isDescending) continue;
        const p = Math.min(1, dg.descendTimer / dg.descendDuration);
        ctx.save();
        ctx.globalAlpha = 0.12 + 0.45*p;
        ctx.fillStyle = '#000';
        ctx.beginPath();
        ctx.ellipse(dg.x, dg.targetY + dg.r*0.9, dg.r*(0.7 + 1.5*p), dg.r*(0.25 + 0.5*p), 0, 0, Math.PI*2);
        ctx.fill();
        ctx.restore();
      }
    }
    const GIANT_ATK_COLOR = { knife:'#ff5566', club:'#ff9f43', spear:'#ffe27a', arrow:'#ff2a2a', fireball:'#ff7a3d', snake:'#5fdc6a', sword:'#fff6c9' };
    const GIANT_SKINS = [
      { name:'HUGE DINOSAUR', bodyLight:'#8fae4a', bodyDark:'#4f6b26', headCol:'#5c7a2c', hornCol:'#2c3a14',
        hornStyle:'none', eyeCol:'#ffe64a', wings:false, wingCol:null, headdress:false, tusks:false,
        scales:true, shoulderSpikes:false, weaponRest:'#2c3a14', tailCol:'#3f5a20', skirtCol:'#3a4a20',
        dinoHead:true },
      { name:'FIVE-HEADED DRAGON', bodyLight:'#9a5bd6', bodyDark:'#5a2c8a', headCol:'#6d34a0', hornCol:'#2a1240',
        hornStyle:'curved', eyeCol:'#ff5ec7', wings:true, wingCol:'rgba(150,70,210,0.88)', headdress:false, tusks:false,
        scales:true, shoulderSpikes:false, weaponRest:'#2a1240', tailCol:'#3a1a5a', skirtCol:'#2a1240',
        fiveHeads:true },
      { name:'SCALED LEVIATHAN', bodyLight:'#3fb8c2', bodyDark:'#1c6d78', headCol:'#227c86', hornCol:'#0e3a40',
        hornStyle:'fin', eyeCol:'#baffef', wings:false, wingCol:null, headdress:false, tusks:false,
        scales:true, shoulderSpikes:false, weaponRest:'#0e3a40', tailCol:'#0e3a40', skirtCol:'#123840' },
      { name:'STONE WYRM', bodyLight:'#9a94a3', bodyDark:'#6b6570', headCol:'#7a7482', hornCol:'#2c2830',
        hornStyle:'long', eyeCol:'#ffb84a', wings:true, wingCol:'rgba(96,90,102,0.92)', headdress:false, tusks:false,
        scales:false, shoulderSpikes:true, weaponRest:'#2c2830', tailCol:'#2c2830', skirtCol:'#2c2830' },
      { name:'TRIDENT DEVIL', bodyLight:'#ff5b4a', bodyDark:'#c2261f', headCol:'#b3241f', hornCol:'#3a0d0d',
        hornStyle:'curved', eyeCol:'#ffe066', wings:true, wingCol:'rgba(200,60,50,0.88)', headdress:false, tusks:false,
        scales:false, shoulderSpikes:false, weaponRest:'#ffaa2a', tailCol:'#3a0d0d', skirtCol:'#241318' }
    ];
    // fire demon's color identity per zone breed — index 1 is the new second-stage cosmic
    // blue energy being (matches the standalone illustration); other breeds keep the
    // original red devil look for now.
    const DEMON_SKINS = [
      { body:'#c8332a', bodyDark:'#7a1712', bodyLight:'#e8564a', horn:'#8a0f0f', hornLight:'#c22222',
        eyeBase:'#ffde6e', glow:'rgba(255,180,40,0.95)', lick1:'rgba(255,150,40,0.95)', lick2:'rgba(255,220,120,0)',
        teeth:'#f4ead9', goatee:'#241010', mouthDark:'#1a0503' },
      { body:'#3f9de0', bodyDark:'#123a6e', bodyLight:'#a9e6ff', horn:'#0f3060', hornLight:'#7fd4ff',
        eyeBase:'#eafcff', glow:'rgba(120,210,255,0.95)', lick1:'rgba(140,220,255,0.95)', lick2:'rgba(220,250,255,0)',
        teeth:'#eafcff', goatee:'#0a1c33', mouthDark:'#081326' }
    ];
    // fire demon — planted on the road exactly between the two little giants; muscular red
    // devil with curved horns, pointed ears and a goatee, standing tall so it reads as a real
    // obstacle. Thin fire streams from both eyes at all times, surging into a pair of longer
    // fire-beam attacks whenever it isn't cooling down.
    if (demon){
      const gt = demon;
      ctx.save();
      ctx.translate(gt.x, gt.y);
      ctx.globalAlpha = 1; // v106: middle giant (fire demon) always fully solid — never horizon-hazed

      const tFlash = gt.hitFlash > 0;
      const sway = Math.sin(gt.idle*1.4)*0.04;
      // stands upright on the road at all times — no turret-style body rotation to face the
      // officer (that used to flip the whole demon upside-down whenever the officer was below
      // it, which is most of the fight). Only a tiny idle sway remains.
      const dSkin = DEMON_SKINS[(gt.skin===1) ? 1 : 0];
      const red = dSkin.body, redDark = dSkin.bodyDark, redLight = dSkin.bodyLight, horn = dSkin.horn, hornLight = dSkin.hornLight;

      // ground contact shadow — drawn before the body rotation so it always stays flat on the ground
      ctx.fillStyle = 'rgba(0,0,0,0.42)';
      ctx.beginPath(); ctx.ellipse(0, gt.r*0.98, gt.r*1.15, gt.r*0.34, 0, 0, Math.PI*2); ctx.fill();

      // taller body — stretched vertically only, anchored at the feet so it doesn't float/sink
      const demonFootY = gt.r*0.9;
      ctx.translate(0, demonFootY);
      ctx.scale(1, DEMON_HEIGHT_MULT);
      ctx.translate(0, -demonFootY);

      ctx.rotate(sway);

      // legs
      ctx.fillStyle = tFlash ? '#ffffff' : redDark;
      ctx.fillRect(-gt.r*0.42, gt.r*0.05, gt.r*0.34, gt.r*0.78);
      ctx.fillRect(gt.r*0.08, gt.r*0.05, gt.r*0.34, gt.r*0.78);

      // torso — broad, muscular, tapering to the waist
      const torsoTopY = -gt.r*1.05;
      ctx.fillStyle = tFlash ? '#ffffff' : red;
      ctx.beginPath();
      ctx.moveTo(-gt.r*0.72, torsoTopY+gt.r*0.15);
      ctx.quadraticCurveTo(-gt.r*0.95, torsoTopY+gt.r*0.8, -gt.r*0.5, gt.r*0.12);
      ctx.lineTo(gt.r*0.5, gt.r*0.12);
      ctx.quadraticCurveTo(gt.r*0.95, torsoTopY+gt.r*0.8, gt.r*0.72, torsoTopY+gt.r*0.15);
      ctx.quadraticCurveTo(0, torsoTopY-gt.r*0.15, -gt.r*0.72, torsoTopY+gt.r*0.15);
      ctx.fill();
      // pectoral/ab shading for a muscular read
      ctx.fillStyle = 'rgba(0,0,0,0.22)';
      ctx.beginPath(); ctx.ellipse(gt.r*0.28, torsoTopY+gt.r*0.55, gt.r*0.3, gt.r*0.5, 0, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.14)';
      ctx.beginPath(); ctx.ellipse(-gt.r*0.3, torsoTopY+gt.r*0.4, gt.r*0.22, gt.r*0.42, 0, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,0.3)'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(0, torsoTopY+gt.r*0.15); ctx.lineTo(0, gt.r*0.05); ctx.stroke();

      // head
      const headY = torsoTopY - gt.r*0.42;
      ctx.fillStyle = tFlash ? '#ffffff' : red;
      ctx.beginPath(); ctx.ellipse(0, headY, gt.r*0.5, gt.r*0.56, 0, 0, Math.PI*2); ctx.fill();

      // pointed ears
      ctx.fillStyle = tFlash ? '#ffffff' : redDark;
      ctx.beginPath();
      ctx.moveTo(-gt.r*0.46, headY-gt.r*0.05); ctx.lineTo(-gt.r*0.92, headY-gt.r*0.22); ctx.lineTo(-gt.r*0.42, headY+gt.r*0.28); ctx.closePath(); ctx.fill();
      ctx.beginPath();
      ctx.moveTo(gt.r*0.46, headY-gt.r*0.05); ctx.lineTo(gt.r*0.92, headY-gt.r*0.22); ctx.lineTo(gt.r*0.42, headY+gt.r*0.28); ctx.closePath(); ctx.fill();

      // curved horns rising off the brow
      ctx.fillStyle = tFlash ? '#ffffff' : horn;
      [-1,1].forEach(function(s){
        ctx.beginPath();
        ctx.moveTo(s*gt.r*0.28, headY-gt.r*0.4);
        ctx.quadraticCurveTo(s*gt.r*0.75, headY-gt.r*1.0, s*gt.r*0.42, headY-gt.r*1.42);
        ctx.quadraticCurveTo(s*gt.r*0.3, headY-gt.r*0.95, s*gt.r*0.1, headY-gt.r*0.42);
        ctx.closePath(); ctx.fill();
      });
      if (!tFlash){
        ctx.fillStyle = hornLight;
        [-1,1].forEach(function(s){
          ctx.beginPath();
          ctx.moveTo(s*gt.r*0.22, headY-gt.r*0.42);
          ctx.quadraticCurveTo(s*gt.r*0.5, headY-gt.r*0.9, s*gt.r*0.3, headY-gt.r*1.3);
          ctx.quadraticCurveTo(s*gt.r*0.24, headY-gt.r*0.9, s*gt.r*0.14, headY-gt.r*0.44);
          ctx.closePath(); ctx.fill();
        });
      }

      // furrowed brow + angry grin with teeth
      ctx.strokeStyle = redDark; ctx.lineWidth = gt.r*0.07; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(-gt.r*0.3, headY-gt.r*0.14); ctx.lineTo(-gt.r*0.06, headY-gt.r*0.06); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(gt.r*0.3, headY-gt.r*0.14); ctx.lineTo(gt.r*0.06, headY-gt.r*0.06); ctx.stroke();
      const mouthOpen = gt.r*(0.14 + (gt.mouthT>0 ? 0.16 : 0));
      ctx.fillStyle = dSkin.mouthDark;
      ctx.beginPath(); ctx.ellipse(0, headY+gt.r*0.32, gt.r*0.3, mouthOpen, 0, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = dSkin.teeth;
      for (let tth=-2; tth<=2; tth++){
        ctx.beginPath();
        ctx.moveTo(tth*gt.r*0.11, headY+gt.r*0.32-mouthOpen*0.7);
        ctx.lineTo(tth*gt.r*0.11-gt.r*0.05, headY+gt.r*0.32-mouthOpen*0.1);
        ctx.lineTo(tth*gt.r*0.11+gt.r*0.05, headY+gt.r*0.32-mouthOpen*0.1);
        ctx.closePath(); ctx.fill();
      }
      // goatee
      ctx.fillStyle = dSkin.goatee;
      ctx.beginPath();
      ctx.moveTo(-gt.r*0.14, headY+gt.r*0.5); ctx.lineTo(gt.r*0.14, headY+gt.r*0.5); ctx.lineTo(0, headY+gt.r*0.82); ctx.closePath(); ctx.fill();

      // glowing eyes with thin fire always licking off them — grow bright white-hot and swell
      // right before firing, so the wind-up is unmistakable, then surge into full beams
      const flick = 0.6 + Math.sin(performance.now()/50)*0.4;
      let eyeCharge = gt.eyeTelegraph > 0 ? 1 - (gt.eyeTelegraph/0.5) : 0; // 0 -> 1 through the wind-up
      if (gt.eyeBursting) eyeCharge = 0.75; // eyes stay lit hot through the whole burst
      const eyeMuzzle = gt.eyeFlash > 0; // extra bright pop on the exact firing frame of each round
      [-1,1].forEach(function(s){
        const ex = s*gt.r*0.2, ey = headY - gt.r*0.04;
        ctx.fillStyle = tFlash ? '#ffffff' : (eyeCharge>0 || eyeMuzzle ? '#ffffff' : dSkin.eyeBase);
        ctx.shadowColor = dSkin.glow; ctx.shadowBlur = 10 + eyeCharge*18 + (eyeMuzzle?10:0);
        const eyeGrow = 1 + eyeCharge*0.9 + (eyeMuzzle?0.4:0);
        ctx.beginPath(); ctx.ellipse(ex, ey, gt.r*0.1*eyeGrow, gt.r*0.07*eyeGrow, 0, 0, Math.PI*2); ctx.fill();
        ctx.shadowBlur = 0;
        if (!tFlash){
          // ambient fire lick, always present, pointed away from the face — flares longer as
          // the eyes charge up toward firing
          ctx.save();
          ctx.translate(ex, ey);
          ctx.rotate(Math.atan2(-1, s*0.6));
          const lickLen = gt.r*(0.55 + flick*0.25) * (1 + eyeCharge*1.6);
          const lg = ctx.createLinearGradient(0,0,0,-lickLen);
          lg.addColorStop(0, dSkin.lick1); lg.addColorStop(1, dSkin.lick2);
          ctx.strokeStyle = lg; ctx.lineWidth = gt.r*0.09*(1+eyeCharge*0.5); ctx.lineCap = 'round';
          ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(0,-lickLen); ctx.stroke();
          ctx.restore();
        }
      });

      // telegraph glow just before an attack surges — either eyes or mouth winding up
      if (gt.eyeTelegraph > 0 || gt.mouthTelegraph > 0 || gt.eyeBursting){
        const tp = 0.5 + Math.sin(performance.now()/60)*0.5;
        const ringCol = gt.skin===1 ? '120,210,255' : '255,120,40';
        ctx.strokeStyle = 'rgba('+ringCol+','+(0.7*tp)+')';
        ctx.lineWidth = 3;
        ctx.shadowColor = 'rgba('+ringCol+',0.9)'; ctx.shadowBlur = 16;
        ctx.beginPath(); ctx.arc(0, headY, gt.r*0.9, 0, Math.PI*2); ctx.stroke();
        ctx.shadowBlur = 0;
      }

      // hit-count bar, parked above the head — fills as it survives fewer of the 50 hits
      const tw = gt.r*2.4;
      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      ctx.fillRect(-tw/2, headY-gt.r*1.5-12, tw, 6);
      ctx.fillStyle = '#ff8a3d';
      ctx.fillRect(-tw/2, headY-gt.r*1.5-12, tw*Math.max(0, (gt.maxHits-gt.hits)/gt.maxHits), 6);

      ctx.restore();
    }

    for (const g of littleGiants){
      const skin = GIANT_SKINS[(g.skin || 0) % GIANT_SKINS.length];
      ctx.save();
      ctx.translate(g.x, g.y);
      ctx.globalAlpha = 1; // v106: little giants always fully solid — never horizon-hazed
      const breathe = Math.sin((g.idle||0)*1.4)*1.5; // subtle static idle breathing, no locomotion

      // armored ward — a faint rune-etched shimmer that marks their hide as resistant to
      // anything but the Big Rocket; still shown after it's adopted as a reminder of its power
      if (g.armored){
        const wPulse = 0.4 + Math.sin(performance.now()/300 + g.x)*0.25;
        ctx.strokeStyle = rocketAdopted ? 'rgba(255,138,76,0.5)' : 'rgba(160,90,220,0.55)';
        ctx.lineWidth = 2;
        ctx.shadowColor = rocketAdopted ? 'rgba(255,138,76,0.6)' : 'rgba(160,90,220,0.7)';
        ctx.shadowBlur = 10*wPulse;
        ctx.beginPath(); ctx.arc(0, -g.r*0.4, g.r*1.15, 0, Math.PI*2); ctx.stroke();
        ctx.shadowBlur = 0;
      }

      // health bar
      const gw = g.r*2.3;
      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      ctx.fillRect(-gw/2, -g.r*2.5-16, gw, 6);
      ctx.fillStyle = '#ff2a2a';
      ctx.fillRect(-gw/2, -g.r*2.5-16, gw*Math.max(0,g.hp/g.maxHp), 6);

      // telegraph ring — pulses in the color of the incoming attack while winding up
      if (g.telegraph > 0 && g.pendingAttack){
        const tPulse = 0.6 + Math.sin(performance.now()/70)*0.4;
        ctx.strokeStyle = GIANT_ATK_COLOR[g.pendingAttack];
        ctx.lineWidth = 3;
        ctx.shadowColor = GIANT_ATK_COLOR[g.pendingAttack]; ctx.shadowBlur = 14*tPulse;
        ctx.beginPath(); ctx.arc(0,-g.r*1.1, g.r*1.35, 0, Math.PI*2); ctx.stroke();
        ctx.shadowBlur = 0;
      }

      ctx.translate(0, breathe);
      const flashMix = g.hitFlash > 0;

      // tail
      ctx.strokeStyle = flashMix ? '#ffffff' : skin.tailCol; ctx.lineWidth = g.r*0.22; ctx.lineCap='round';
      ctx.beginPath();
      ctx.moveTo(-g.faceDir*g.r*0.3, g.r*1.4);
      ctx.quadraticCurveTo(-g.faceDir*g.r*1.3, g.r*1.9, -g.faceDir*g.r*1.7, g.r*1.5);
      ctx.stroke();

      // bat wings — large, leathery, fanned out behind the torso (Stone Wyrm & Trident Devil)
      if (skin.wings){
        const wingFlap = Math.sin((g.idle||0)*1.1)*0.08;
        [-1,1].forEach(function(side){
          ctx.save();
          ctx.fillStyle = skin.wingCol;
          ctx.beginPath();
          ctx.moveTo(side*g.r*0.3, -g.r*0.5);
          ctx.quadraticCurveTo(side*g.r*(2.2+wingFlap), -g.r*1.3, side*g.r*2.6, -g.r*0.2);
          ctx.quadraticCurveTo(side*g.r*1.9, g.r*0.1, side*g.r*1.7, g.r*0.5);
          ctx.quadraticCurveTo(side*g.r*1.2, g.r*0.15, side*g.r*0.3, g.r*0.35);
          ctx.closePath(); ctx.fill();
          ctx.strokeStyle = 'rgba(0,0,0,0.35)'; ctx.lineWidth = 1.5;
          ctx.beginPath(); ctx.moveTo(side*g.r*0.3,-g.r*0.5); ctx.lineTo(side*g.r*2.0,-g.r*0.3); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(side*g.r*0.3,-g.r*0.5); ctx.lineTo(side*g.r*1.7,g.r*0.4); ctx.stroke();
          ctx.restore();
        });
      }

      // dark skirt/cloth lower body
      ctx.fillStyle = skin.skirtCol;
      ctx.beginPath();
      ctx.moveTo(-g.r*0.85, g.r*0.5); ctx.lineTo(g.r*0.85, g.r*0.5);
      ctx.lineTo(g.r*0.65, g.r*1.75); ctx.lineTo(-g.r*0.65, g.r*1.75);
      ctx.closePath(); ctx.fill();
      // skull belt buckle
      ctx.fillStyle = '#e8e2d8';
      ctx.beginPath(); ctx.arc(0, g.r*0.55, g.r*0.16, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#241318';
      ctx.beginPath(); ctx.arc(-g.r*0.06,g.r*0.53,g.r*0.045,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(g.r*0.06,g.r*0.53,g.r*0.045,0,Math.PI*2); ctx.fill();

      // muscular torso, flashes white when freshly hit
      const bodyCol = flashMix ? '#ffffff' : skin.bodyDark;
      const grad = ctx.createRadialGradient(-g.r*0.2,-g.r*0.5,2, 0,0,g.r*1.1);
      grad.addColorStop(0, flashMix ? '#ffffff' : skin.bodyLight); grad.addColorStop(1, bodyCol);
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.ellipse(0, -g.r*0.15, g.r*0.82, g.r*0.95, 0, 0, Math.PI*2); ctx.fill();
      if (!flashMix){
        if (skin.scales){
          // overlapping scale ridges instead of tribal cracks
          ctx.strokeStyle = 'rgba(10,30,32,0.6)'; ctx.lineWidth = 1.6;
          for (let sy=-0.55; sy<0.6; sy+=0.28){
            ctx.beginPath();
            for (let sx=-0.6; sx<=0.6; sx+=0.2){
              const py = g.r*sy + Math.sin(sx*8)*g.r*0.03;
              if (sx===-0.6) ctx.moveTo(g.r*sx, py); else ctx.lineTo(g.r*sx, py);
            }
            ctx.stroke();
          }
        } else {
          ctx.strokeStyle = 'rgba(20,4,4,0.75)'; ctx.lineWidth = 2;
          ctx.beginPath(); ctx.moveTo(-g.r*0.4,-g.r*0.7); ctx.lineTo(-g.r*0.15,-g.r*0.1); ctx.lineTo(-g.r*0.35,g.r*0.4); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(g.r*0.4,-g.r*0.65); ctx.lineTo(g.r*0.15,-g.r*0.05); ctx.lineTo(g.r*0.35,g.r*0.4); ctx.stroke();
        }
      }
      // shoulder spikes (Stone Wyrm) — jagged ridge plates jutting off each shoulder
      if (skin.shoulderSpikes){
        ctx.fillStyle = skin.hornCol;
        [-1,1].forEach(function(side){
          for (let k=0;k<3;k++){
            const bx = side*g.r*(0.35+k*0.22), by = -g.r*(0.55-k*0.04);
            ctx.beginPath();
            ctx.moveTo(bx, by); ctx.lineTo(bx+side*g.r*0.08, by-g.r*0.32); ctx.lineTo(bx+side*g.r*0.2, by+g.r*0.05);
            ctx.closePath(); ctx.fill();
          }
        });
      }
      // glowing chest rune (diamond)
      const runePulse = 0.6+Math.sin(performance.now()/220)*0.4;
      ctx.fillStyle = `rgba(255,214,80,${0.85*runePulse+0.15})`;
      ctx.shadowColor = 'rgba(255,214,80,0.9)'; ctx.shadowBlur = 10*runePulse;
      ctx.beginPath();
      ctx.moveTo(0,-g.r*0.45); ctx.lineTo(g.r*0.16,-g.r*0.15); ctx.lineTo(0,g.r*0.15); ctx.lineTo(-g.r*0.16,-g.r*0.15);
      ctx.closePath(); ctx.fill();
      ctx.shadowBlur = 0;

      // head and glowing eyes
      ctx.fillStyle = flashMix ? '#ffffff' : skin.headCol;
      ctx.beginPath(); ctx.arc(0, -g.r*1.05, g.r*0.46, 0, Math.PI*2); ctx.fill();

      if (skin.dinoHead){
        // front-facing crocodile-style snout, symmetric left/right so the nose, teeth and
        // lips all line up on the face's centerline instead of drifting to one side
        ctx.fillStyle = flashMix ? '#ffffff' : skin.headCol;
        ctx.beginPath();
        ctx.moveTo(-g.r*0.4, -g.r*0.95);
        ctx.quadraticCurveTo(0, -g.r*1.36, g.r*0.4, -g.r*0.95);
        ctx.quadraticCurveTo(g.r*0.3, -g.r*0.66, 0, -g.r*0.6);
        ctx.quadraticCurveTo(-g.r*0.3, -g.r*0.66, -g.r*0.4, -g.r*0.95);
        ctx.closePath(); ctx.fill();

        // solid nose — centered right between the eyes and the mouth, with two nostril dots
        ctx.fillStyle = flashMix ? '#ffffff' : '#1a0d0d';
        ctx.beginPath(); ctx.ellipse(0, -g.r*0.88, g.r*0.09, g.r*0.06, 0, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = flashMix ? 'rgba(255,255,255,0.7)' : '#000000';
        ctx.beginPath(); ctx.arc(-g.r*0.05, -g.r*0.87, g.r*0.02, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(g.r*0.05, -g.r*0.87, g.r*0.02, 0, Math.PI*2); ctx.fill();

        // teeth — centered row directly under the nose, not shoved off to one side
        ctx.fillStyle = '#f5f0e0';
        for (let ti=0; ti<4; ti++){
          const tx0 = -g.r*0.27 + ti*g.r*0.18;
          ctx.beginPath();
          ctx.moveTo(tx0, -g.r*0.68); ctx.lineTo(tx0+g.r*0.09, -g.r*0.52); ctx.lineTo(tx0+g.r*0.18, -g.r*0.68);
          ctx.closePath(); ctx.fill();
        }

        // brow horn, centered above the nose
        ctx.fillStyle = skin.hornCol;
        ctx.beginPath();
        ctx.moveTo(-g.r*0.3,-g.r*1.2); ctx.lineTo(0,-g.r*1.34); ctx.lineTo(g.r*0.3,-g.r*1.2); ctx.lineTo(0,-g.r*1.02);
        ctx.closePath(); ctx.fill();

        // reptilian lower lip — a solid red line centered under the teeth so the mouth
        // reads as an actual mouth, not just a row of teeth stuck on a bare blob
        ctx.strokeStyle = flashMix ? 'rgba(255,255,255,0.85)' : '#c23a3a';
        ctx.lineWidth = g.r*0.05; ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(-g.r*0.3, -g.r*0.66); ctx.quadraticCurveTo(0, -g.r*0.58, g.r*0.3, -g.r*0.66);
        ctx.stroke();
      } else {
      // tusks (Ogre Chief) — small white fangs poking up from the lower jaw
      if (skin.tusks){
        ctx.fillStyle = '#f5f0e0';
        [-1,1].forEach(function(side){
          ctx.beginPath();
          ctx.moveTo(side*g.r*0.22,-g.r*0.72); ctx.lineTo(side*g.r*0.32,-g.r*0.5); ctx.lineTo(side*g.r*0.14,-g.r*0.58);
          ctx.closePath(); ctx.fill();
        });
      }

      // head ornament: curved horns, dragon horns, a dorsal fin, or a wild-haired gold headdress
      if (skin.hornStyle === 'none'){
        // wild spiky hair tufts + a gold Thai-style headdress band across the brow (Ogre Chief)
        ctx.fillStyle = '#241812';
        for (let hi=-2; hi<=2; hi++){

    // Enemy Army Officer — anatomically identical rig to the player officer (same two-bone
