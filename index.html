          if (tornado && tornado.state === 'chasing' && !desertFight.pondSpawned){
            desertFight.tornadoChaseT += dt;
            if (!pond && desertFight.tornadoChaseT >= 25){
              pond = { x: player.x - 850, y: Math.max(player.y, gateY + 340), rx: POND_RX, ry: POND_RY, fade: 0, used: false };
              desertFight.pondSpawned = true;
              showBanner('🌊 बाईं ओर बड़ा तालाब!', 'तालाब में कूदो — नीचे हीरे का तीर है!', 2.6);
            }
          }
          if (pond){
            pond.fade = Math.min(1, (pond.fade || 0) + dt/1.6);
            if (!pond.used && !uw){
              const pnx = (player.x - pond.x)/pond.rx, pny = (player.y - pond.y)/pond.ry;
              if (pnx*pnx + pny*pny < 0.45) startUnderwater(); // stepped into the water
            }
          }
          if (desertFight.t <= 0){
            desertFight.state = 2;
            showBanner('BREAKER LINE CLEARED!', 'Break the gate now!', 1.8);
            SFX.unlock();
          }
        }
      }
      if (gate && !gate.active && !gate.hidden && player.y <= gateY + GATE_TRIGGER && littleGiantsSpawned && littleGiants.length === 0 && !demon && cobraSpawned && !cobra){
        gate.active = true;
        showBanner('SECTOR GATE AHEAD', 'Shoot it down to reveal the guardian!', 2.2);
      }
      // Gothic gate's eye whips out the Skull Chain at the officer (and reels it back) while the gate stands
      if (gameState === 'zone' && gate && gate.active && !gate.broken && currentTheme().name === 'GOTHIC CITY'){
        if (updateGateChain(dt) === 'dead') return;
      } else if (gateChain){
        gateChain = null;
      }
    } else if (gameState === 'gateOpening'){
      // v121: gate shatters -> screen blacks out -> arena swaps in -> guardian climbs out of the ground
      gateOpeningT += dt;
      if (!boss && gateOpeningT >= BOSS_ENTRANCE.swapT) spawnBoss();
      if (boss && boss.entering) updateBossEntrance(dt);
    } else if (gameState === 'postCobraVictory'){
      // 20 seconds after cobra dies — player keeps fighting enhanced enemy waves, racking up score
      postCobraVictoryTimer += dt;
      if (postCobraVictoryTimer >= POST_COBRA_VICTORY_DURATION){
        endPostCobraVictory();
      }
    } else if (gameState === 'gateBreak'){
      gateBreakTimer -= dt;
      if (gateBreakTimer <= 0){
        nextZone();
      }
    }

    // camera follows player vertically (endless upward scroll). Horizontally the officer's
    // screen position leans gently toward the edge in the direction he's walking — walking
    // right pulls him toward left-of-center (more road visible ahead to the right), walking
    // left pulls him toward right-of-center — so oncoming enemies are visible with enough
    // distance to react instead of appearing right on top of him. The ease is deliberately
    // slow (half a second or so) so quick joystick flicks don't yank the whole screen —
    // that fast-snap version was the "screen shake" bug. Standing still holds whatever side
    // he last leaned to, instead of snapping back to dead-center.
    if (joy.mag > 0.08 && Math.abs(joy.dx) > 0.15){
      const lookTarget = joy.dx > 0 ? LOOK_FRAC_RIGHT : LOOK_FRAC_LEFT;
      const lookEase = 1 - Math.pow(0.3, dt);
      camLookFrac += (lookTarget - camLookFrac) * lookEase;
    }
    let camTargetX;
    if (!camInit){
      camTargetX = player.x - VW/2;
    } else {
      camTargetX = player.x - VW*camLookFrac;
    }
    // officer sits lower in frame (PLAYER_SCREEN_Y_FRAC down the screen, not dead-center) so
    // the player can see much further up the road instead of enemies feeling far away; the
    // giant guardian is much taller than a normal enemy (its horns reach roughly 1.9x its
    // radius above its own center) — if that would poke off the top of the screen, pull the
    // camera up so the whole giant stays visible, even if that means the officer sits a bit
    // lower in frame than usual
    let camTargetY = player.y - VH*PLAYER_SCREEN_Y_FRAC;
    let fadeCamTargetY = camTargetY; // unlifted target — depth-haze math follows this, not the lifted camera
    // once the sealed gate is in play (being shot at, opening, or already fought past to the
    // guardian) pull the camera up so the whole tall gothic gate — spire and all — stays in frame
    if (gate && ((gameState === 'zone' && gate.active) || gameState === 'gateOpening' || gameState === 'boss')){
      const gateTopMargin = 34;
      const camMaxForGateTop = (gateY - gateTopHeight()) - gateTopMargin;
      camTargetY = Math.min(camTargetY, camMaxForGateTop);
    }
    // v126: keep the cobra's whole body + hood in frame (its head was cut off at the top on short/landscape screens)
    if (cobra && gameState === 'zone'){
      const cobraTopY = cobra.y - (cobra.r/105)*COBRA_HEIGHT_SCALE*700 - 110;
      camTargetY = Math.min(camTargetY, cobraTopY);
      camTargetY = Math.max(camTargetY, player.y - VH*0.9); // never lift so far the officer slips off the bottom
    }
    // v119: GATE STAYS GROUNDED is handled by updateGateGroundCam() right after the camera ease below.
    if ((gameState === 'boss' || gameState === 'gateOpening') && boss){ // v121: frame the full guardian before it even rises
      const bossTopMargin = 60;
      const camMaxForBossTop = ((boss.homeY !== undefined ? boss.homeY : boss.y) - boss.r*2.3) - bossTopMargin;
      camTargetY = Math.min(camTargetY, camMaxForBossTop);
      camTargetY = Math.max(camTargetY, player.y - VH*0.9); // never lift so far the officer slips off the bottom
    }
    if (mirror && mirror.locked){
      // showdown frame: mirror pinned to the right corner, officer along the left edge
      // frame holds the mirror in the right corner; if the officer retreats, the camera follows him back
      camTargetX = Math.min(mirror.x - mirrorScreenX(), player.x - VW*0.05);
      camTargetY = Math.max(mirror.y - VH*MIRROR_SCREEN_Y, player.y - VH*0.88); // mirror sits lower, in the middle of the play area
    }
    if (!camInit){
      camera.x = camTargetX; camera.y = camTargetY; fadeCamY = fadeCamTargetY; camInit = true;
    } else {
      // frame-rate independent ease so a fast frame and a slow frame lerp the same amount
      const camEase = 1 - Math.pow(0.0025, dt);
      camera.x += (camTargetX - camera.x) * camEase;
      camera.y += (camTargetY - camera.y) * camEase;
      fadeCamY += (fadeCamTargetY - fadeCamY) * camEase;
    }
    updateGateGroundCam(dt);

    // shake decay
    if (shake.t > 0){
      shake.t -= dt;
      if (shake.t <= 0){ shake.t = 0; shake.mag = 0; }
    }
    // kill-streak combo window decay
    if (comboTimer > 0){
      comboTimer -= dt;
      if (comboTimer <= 0){ comboTimer = 0; comboCount = 0; }
    }
    // floating damage/combo text
    for (let i=floatTexts.length-1;i>=0;i--){
      const ft = floatTexts[i];
      ft.y += ft.vy*dt; ft.vy *= 0.94; ft.life -= dt;
      if (ft.life <= 0) floatTexts.splice(i,1);
    }

    // HUD
    document.getElementById('healthBarFill').style.width = Math.max(0,(player.hp/player.maxHp*100))+'%';
    document.getElementById('scoreBox').textContent = 'SCORE ' + score;
    if (boss){
      document.getElementById('bossHpFill').style.width = Math.max(0,(boss.hp/boss.maxHp*100))+'%';
    }
  }

  // ---------- Helpers ----------
  function roundRect(ctx,x,y,w,h,r){
    ctx.beginPath();
    if (ctx.roundRect){ ctx.roundRect(x,y,w,h,r); return; }
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }

  // ---------- Draw ----------
  // How far past the officer a piece of decor's base must be before it's allowed to draw
  // IN FRONT of him. A tall tree's canopy reaches way above its ground point, so a big tree
  // needs a much bigger buffer than a low bush — otherwise its leaves would still render on
  // top of the officer's face/head even though its trunk is only just past him.
  function decorFrontMargin(d){
    if (d.shape !== 'tree') return 30;
    return Math.max(30, (d.visualReach || d.r*1.7) - 30);
  }

  function drawDecor(d){
    ctx.save();
    ctx.translate(d.x + (d.offX||0), d.y + (d.offY||0));
    if (d.flip) ctx.scale(-1,1);
    ctx.fillStyle = d.c;
    ctx.strokeStyle = d.c;
    switch(d.shape){
      case 'tree': {
        if (d.treeKind === 'pine'){
          // tall narrow conifer — bare thin trunk all the way up, tiers only at the top
          const trunkH = d.trunkH || d.r*2.5;
          const trunkTop = d.r*1.1 - trunkH;
          ctx.fillStyle = 'rgba(0,0,0,0.3)';
          ctx.beginPath(); ctx.ellipse(d.r*0.1, d.r*1.15, d.r*0.5, d.r*0.2, 0, 0, Math.PI*2); ctx.fill();
          ctx.fillStyle = d.trunk || '#40301e';
          ctx.fillRect(-d.r*0.045, trunkTop, d.r*0.09, d.r*1.1-trunkTop);
          const swayP = Math.sin(performance.now()/1700 + (d.sway||0))*0.04;
          ctx.save();
          ctx.translate(0, trunkTop);
          ctx.scale(1, d.heightMult||1); // stretch the tiers upward for a taller conifer, trunk untouched
          ctx.rotate(swayP);
          ctx.fillStyle = d.c;
          const tiers = [ [d.r*0.9, -d.r*0.1, d.r*0.8], [d.r*0.68, -d.r*0.72, d.r*0.66], [d.r*0.48, -d.r*1.28, d.r*0.5] ];
          for (const t of tiers){
            ctx.beginPath();
            ctx.moveTo(0, t[1]-t[2]);
            ctx.lineTo(-t[0], t[1]+t[2]*0.5);
            ctx.lineTo(t[0], t[1]+t[2]*0.5);
            ctx.closePath(); ctx.fill();
          }
          ctx.fillStyle = d.cLight || d.c;
          ctx.beginPath();
          ctx.moveTo(0, -d.r*1.28-d.r*0.5);
          ctx.lineTo(-d.r*0.22, -d.r*1.28-d.r*0.08);
          ctx.lineTo(d.r*0.22, -d.r*1.28-d.r*0.08);
          ctx.closePath(); ctx.fill();
          ctx.restore();
          break;
        }
        if (d.treeKind === 'palm'){
          // tropical palm — tall thin leaning trunk, fanned fronds only at the very top
          const trunkH = d.trunkH || d.r*2.5;
          const topX = d.r*0.15, topY = d.r*1.1 - trunkH;
          ctx.fillStyle = 'rgba(0,0,0,0.3)';
          ctx.beginPath(); ctx.ellipse(d.r*0.15, d.r*1.15, d.r*0.55, d.r*0.2, 0, 0, Math.PI*2); ctx.fill();
          ctx.strokeStyle = d.trunk || '#8a6a3a'; ctx.lineWidth = Math.max(1.2, d.r*0.07);
          ctx.beginPath();
          ctx.moveTo(0, d.r*1.1);
          ctx.quadraticCurveTo(d.r*0.55, d.r*0.3, topX, topY);
          ctx.stroke();
          const swayF = Math.sin(performance.now()/1500 + (d.sway||0))*0.12;
          ctx.save();
          ctx.translate(topX, topY);
          ctx.rotate(swayF);
          ctx.fillStyle = d.c;
          for (let f=0; f<6; f++){
            const a = (Math.PI*2/6)*f - Math.PI/2;
            ctx.save();
            ctx.rotate(a);
            ctx.beginPath();
            ctx.ellipse(0, -d.r*0.62, d.r*0.22, d.r*0.68, 0, 0, Math.PI*2);
            ctx.fill();
            ctx.restore();
          }
          ctx.fillStyle = d.cLight || d.c;
          ctx.beginPath(); ctx.arc(0,0,d.r*0.22,0,Math.PI*2); ctx.fill();
          ctx.restore();
          break;
        }
        // 'leafy' (default) and 'autumn' (same silhouette, warmer colors) share this shape
        const depth = d.depth || 1;
        const trunkH = d.trunkH || d.r*2.5;
        const trunkTop = d.r*1.1 - trunkH;
        // soft contact shadow so the trunk feels planted in the ground, not floating
        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        ctx.beginPath(); ctx.ellipse(d.r*0.1, d.r*1.15, d.r*0.6, d.r*0.22, 0, 0, Math.PI*2); ctx.fill();
        // tall thin bare-wood stem — real trunk height, no leaves anywhere along it
        ctx.fillStyle = d.trunk || '#3b2a1a';
        ctx.beginPath();
        ctx.moveTo(-d.r*0.16, d.r*1.1);
        ctx.lineTo(-d.r*0.05, trunkTop);
        ctx.lineTo(d.r*0.05, trunkTop);
        ctx.lineTo(d.r*0.14, d.r*1.1);
        ctx.closePath(); ctx.fill();
        // bark texture lines running the full length of the stem
        ctx.strokeStyle = 'rgba(0,0,0,0.35)'; ctx.lineWidth = Math.max(1, d.r*0.025);
        ctx.beginPath(); ctx.moveTo(-d.r*0.04, d.r*1.05); ctx.lineTo(-d.r*0.06, trunkTop+d.r*0.15); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(d.r*0.05, d.r*1.0); ctx.lineTo(d.r*0.07, trunkTop+d.r*0.2); ctx.stroke();
        // gentle breeze sway on the canopy only, which sits entirely above the bare trunk
        const swayAng = Math.sin(performance.now()/1700 + (d.sway||0))*0.05;
        ctx.save();
        ctx.translate(0, trunkTop);
        ctx.scale(1, d.heightMult||1); // stretch canopy upward for a taller tree, trunk/ground untouched
        ctx.rotate(swayAng);
        // layered rounded canopy clumps for a bushy, natural silhouette — a couple extra
        // clumps and slight darkening on far-depth trees gives real spatial layering
        ctx.globalAlpha = 0.55 + 0.45*depth;
        ctx.fillStyle = d.c;
        ctx.beginPath(); ctx.ellipse(0,-d.r*0.5,d.r*0.95,d.r*0.88,0,0,Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(-d.r*0.55,-d.r*0.15,d.r*0.56,d.r*0.5,0,0,Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(d.r*0.55,-d.r*0.1,d.r*0.52,d.r*0.48,0,0,Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(0,-d.r*0.85,d.r*0.46,d.r*0.42,0,0,Math.PI*2); ctx.fill();
        // extra apex tier — taller, more dramatic canopy silhouette
        ctx.beginPath(); ctx.ellipse(0,-d.r*1.2,d.r*0.27,d.r*0.25,0,0,Math.PI*2); ctx.fill();
        // deeper shadowed underside for volume
        ctx.fillStyle = 'rgba(0,0,0,0.18)';
        ctx.beginPath(); ctx.ellipse(d.r*0.12,-d.r*0.1,d.r*0.58,d.r*0.34,0,0,Math.PI*2); ctx.fill();
        // lighter highlight clump catching the light
        ctx.fillStyle = d.cLight || d.c;
        ctx.beginPath(); ctx.ellipse(-d.r*0.15,-d.r*0.92,d.r*0.5,d.r*0.46,0,0,Math.PI*2); ctx.fill();
        ctx.globalAlpha = 1;
        ctx.restore();
        break;
      }
      case 'bush': {
        // low leafy clump beside the path — no trunk, sits right on the ground
        ctx.fillStyle = 'rgba(0,0,0,0.25)';
        ctx.beginPath(); ctx.ellipse(d.r*0.05, d.r*0.55, d.r*0.85, d.r*0.24, 0, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = d.c;
        ctx.beginPath(); ctx.ellipse(-d.r*0.4,-d.r*0.05,d.r*0.55,d.r*0.48,0,0,Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(d.r*0.35,0,d.r*0.5,d.r*0.44,0,0,Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(0,-d.r*0.35,d.r*0.6,d.r*0.5,0,0,Math.PI*2); ctx.fill();
        ctx.fillStyle = d.cLight || d.c;
        ctx.beginPath(); ctx.ellipse(-d.r*0.1,-d.r*0.4,d.r*0.35,d.r*0.28,0,0,Math.PI*2); ctx.fill();
        break;
      }
      case 'grass': {
        // tiny tuft of a few thin blades — sits right at ground level beside bushes
        ctx.fillStyle = 'rgba(0,0,0,0.2)';
        ctx.beginPath(); ctx.ellipse(0, d.r*0.35, d.r*0.7, d.r*0.18, 0, 0, Math.PI*2); ctx.fill();
        const swayG = Math.sin(performance.now()/900 + (d.sway||0))*0.15;
        ctx.strokeStyle = d.c; ctx.lineWidth = Math.max(1, d.r*0.16);
        for (let b=-2; b<=2; b++){
          ctx.beginPath();
          ctx.moveTo(b*d.r*0.28, d.r*0.3);
          ctx.quadraticCurveTo(b*d.r*0.28 + swayG*d.r, -d.r*0.2, b*d.r*0.22 + swayG*d.r*1.6, -d.r*0.95);
          ctx.stroke();
        }
        break;
      }
      case 'cactus':
        ctx.fillRect(-d.r*0.28, -d.r*1.6, d.r*0.56, d.r*1.9);
        ctx.fillRect(-d.r*0.9, -d.r*0.5, d.r*0.5, d.r*0.28);
        ctx.fillRect(d.r*0.4, -d.r*0.9, d.r*0.5, d.r*0.28);
        break;
      case 'wave':
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        for(let i=-1;i<=1;i++){ ctx.moveTo(-d.r*1.4, i*d.r*0.7); ctx.quadraticCurveTo(0, i*d.r*0.7+d.r*0.7, d.r*1.4, i*d.r*0.7); }
        ctx.stroke();
        break;
      case 'rock':
        ctx.beginPath(); ctx.moveTo(-d.r,d.r*0.6); ctx.lineTo(-d.r*0.5,-d.r); ctx.lineTo(d.r*0.4,-d.r*0.7); ctx.lineTo(d.r,d.r*0.6); ctx.closePath(); ctx.fill();
        break;
      case 'building': {
        const w = d.r*1.3;
        const bodyH = d.r*1.8*(d.heightMult||1);
        const frontW = w*0.64, sideW = w*0.36; // split into a lit front face + a darker receding side face

        // ground contact shadow
        ctx.fillStyle = 'rgba(0,0,0,0.32)';
        ctx.beginPath(); ctx.ellipse(0, 4, w*0.55, w*0.16, 0, 0, Math.PI*2); ctx.fill();

        // slightly wider stone plinth/foundation so the tower looks planted in the ground
        // instead of just floating on a flat-bottomed rectangle
        ctx.fillStyle = 'rgba(0,0,0,0.22)';
        ctx.fillRect(-w/2-w*0.05, -bodyH*0.06, w*1.1, bodyH*0.06);

        // main front face — a real vertical gradient (brighter near the top catching the
        // moonlight, settling to the base colour lower down) instead of one flat fill, so the
        // block reads as a lit volume rather than a paper cutout
        const faceGrad = ctx.createLinearGradient(0,-bodyH,0,0);
        faceGrad.addColorStop(0, d.cLight || d.c);
        faceGrad.addColorStop(0.35, d.c);
        faceGrad.addColorStop(1, 'rgba(0,0,0,0.18)');
        ctx.save();
        ctx.globalCompositeOperation = 'source-over';
        ctx.fillStyle = d.c;
        ctx.fillRect(-w/2, -bodyH, w, bodyH);
        ctx.fillStyle = faceGrad;
        ctx.globalAlpha = 0.85;
        ctx.fillRect(-w/2, -bodyH, frontW - w/2 + w/2, bodyH); // front portion only
        ctx.restore();

        // darker receding side face with its own subtler gradient (fake 3D turn of the block)
        const sideGrad = ctx.createLinearGradient(0,-bodyH,0,0);
        sideGrad.addColorStop(0, 'rgba(0,0,0,0.18)');
        sideGrad.addColorStop(1, 'rgba(0,0,0,0.42)');
        ctx.fillStyle = sideGrad;
        ctx.fillRect(w/2-sideW, -bodyH, sideW, bodyH);

        // crisp silhouette outline so the block reads as one solid mass, not a flat wash
        ctx.strokeStyle = 'rgba(0,0,0,0.5)';
        ctx.lineWidth = 1.2;
        ctx.strokeRect(-w/2, -bodyH, w, bodyH);

        // thin horizontal cornice ledges every few floors — breaks up a plain flat block into
        // a real stacked structure
        const ledgeGap = Math.max(bodyH/6, 22);
        ctx.fillStyle = 'rgba(0,0,0,0.28)';
        for (let ly = -bodyH+ledgeGap; ly < -bodyH*0.08; ly += ledgeGap){
          ctx.fillRect(-w/2-w*0.02, ly, w*1.04, Math.max(1.4, w*0.02));
        }

        // rooftop cap block, like a plain city tower top
        const roofC = d.cLight || d.c;
        ctx.fillStyle = roofC;
        ctx.fillRect(-w*0.28, -bodyH-bodyH*0.045, w*0.56, bodyH*0.05);
        // parapet trim line right under the cap, for a defined roofline edge
        ctx.strokeStyle = 'rgba(0,0,0,0.45)';
        ctx.lineWidth = 1;
        ctx.strokeRect(-w*0.28, -bodyH-bodyH*0.045, w*0.56, bodyH*0.05);
        // occasional rooftop antenna/water-tank silhouette so the skyline isn't just flat caps
        if (d.hasRoofProp){
          ctx.fillStyle = 'rgba(10,12,18,0.85)';
          if (d.roofPropTall){
            ctx.fillRect(-w*0.02, -bodyH-bodyH*0.045-w*0.5, w*0.04, w*0.5);
          } else {
            ctx.fillRect(-w*0.12, -bodyH-bodyH*0.045-w*0.16, w*0.24, w*0.16);
          }
        }

        // simple grid of windows — mix of lit and dark cells, deterministic per building —
        // confined to the front face only so they don't spill onto the darker side wall
        const cols = Math.max(2, Math.min(5, Math.round(frontW/16)));
        const rowH = Math.max(9, d.r*0.32);
        const rows = Math.max(2, Math.min(12, Math.floor((bodyH*0.82)/rowH)));
        const gridTop = -bodyH*0.9;
        const frontLeft = -w/2 + w*0.03;
        const cellW = (frontW*0.86)/cols, cellH = (bodyH*0.8)/rows;
        // Skip bottom 2 rows to avoid windows touching ground (0 when the building's too
        // short to have any row above the ground band — short houses get no windows at all
        // rather than forcing a lit window right at the base)
        const maxRows = Math.max(0, rows - 2);
        for (let ri=0; ri<maxRows; ri++){
          for (let ci=0; ci<cols; ci++){
            const seedV = Math.sin(d.winSeed + ri*78.233 + ci*37.719)*43758.5453;
            const lit = (seedV - Math.floor(seedV)) < 0.4;
            const wx = frontLeft + ci*cellW;
            const wy = gridTop + ri*cellH;
            if (lit){
              ctx.shadowColor = d.windowColor || 'rgba(255,210,120,0.55)';
              ctx.shadowBlur = 3;
              ctx.fillStyle = d.windowColor || 'rgba(255,210,120,0.55)';
            } else {
              ctx.shadowBlur = 0;
              ctx.fillStyle = 'rgba(10,14,22,0.6)';
            }
            ctx.fillRect(wx, wy, cellW*0.68, cellH*0.6);
            // faint frame so each window reads as a real recessed pane, not a flat sticker
            ctx.shadowBlur = 0;
            ctx.strokeStyle = 'rgba(0,0,0,0.3)';
            ctx.lineWidth = 0.6;
            ctx.strokeRect(wx, wy, cellW*0.68, cellH*0.6);
          }
        }
        // a couple of faint window slits on the side face too, so it doesn't read as a blank wall
        ctx.shadowBlur = 0;
        const sideRows = Math.max(1, Math.floor(maxRows*0.7));
        for (let ri=0; ri<sideRows; ri++){
          ctx.fillStyle = 'rgba(10,14,22,0.5)';
          ctx.fillRect(w/2-sideW*0.55, gridTop + ri*cellH*1.4, sideW*0.3, cellH*0.4);
        }


        break;
      }
      default:
        ctx.beginPath(); ctx.arc(0,0,d.r,0,Math.PI*2); ctx.fill();
    }
    ctx.restore();
  }

  // real visible sky band above the forest road — fixed to the screen (like a horizon), opaque,
  // with a moon, clearly-visible drifting clouds, and a distant tree-line silhouette
  const SKY_BAND_FRAC = 0.3; // more sky above the horizon so the ground reads as flat receding distance instead of a steep upward slope
  const FOREST_CLOUDS = [
    { yFrac:0.22, speed:9,  seed:0,   scale:1.5, alpha:0.9 },
    { yFrac:0.42, speed:5,  seed:340, scale:1.0, alpha:0.75 },
    { yFrac:0.14, speed:13, seed:640, scale:1.15,alpha:0.8 },
    { yFrac:0.58, speed:7,  seed:900, scale:0.75,alpha:0.65 }
  ];
  function drawMistCloud(x,y,scale,alpha,fillColor,glowColor){
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = fillColor || '#f4f9f6';
    ctx.shadowColor = glowColor || 'rgba(255,255,255,0.5)'; ctx.shadowBlur = 14;
    ctx.beginPath();
    ctx.ellipse(x,y,34*scale,14*scale,0,0,Math.PI*2);
    ctx.ellipse(x-26*scale,y+4*scale,20*scale,11*scale,0,0,Math.PI*2);
    ctx.ellipse(x+28*scale,y+3*scale,23*scale,12*scale,0,0,Math.PI*2);
    ctx.ellipse(x+3*scale,y-11*scale,19*scale,13*scale,0,0,Math.PI*2);
    ctx.fill();
    ctx.restore();
  }
  function drawForestSky(W,H){
    const skyH = H*SKY_BAND_FRAC;
    // opaque night-sky gradient — painted fully over whatever the world drew up there
    const skyGrad = ctx.createLinearGradient(0,0,0,skyH);
    skyGrad.addColorStop(0,'#16335c');
    skyGrad.addColorStop(0.6,'#2f6478');
    skyGrad.addColorStop(1,'#74ac95');
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0,0,W,skyH);
    // moon with soft glow
    const mx = W*0.78, my = skyH*0.3, mr = Math.max(18, Math.min(W,H)*0.045);
    const moonGlow = ctx.createRadialGradient(mx,my,0,mx,my,mr*3.2);
    moonGlow.addColorStop(0,'rgba(235,244,255,0.55)');
    moonGlow.addColorStop(1,'rgba(235,244,255,0)');
    ctx.fillStyle = moonGlow;
    ctx.beginPath(); ctx.arc(mx,my,mr*3.2,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#f2f6ff';
    ctx.shadowColor='rgba(255,255,255,0.7)'; ctx.shadowBlur=18;
    ctx.beginPath(); ctx.arc(mx,my,mr,0,Math.PI*2); ctx.fill();
    ctx.shadowBlur=0;
    // clearly-visible drifting clouds within the sky band
    const tNow = performance.now()/1000;
    for (const c of FOREST_CLOUDS){
      const span = W + 400;
      const cx2 = ((tNow*c.speed + c.seed) % span) - 200;
      drawMistCloud(cx2, skyH*c.yFrac, c.scale, c.alpha);
    }
    // distant tree-line silhouette sitting right on the horizon, blending sky into ground
    ctx.fillStyle = '#0c2013';
    ctx.beginPath();
    ctx.moveTo(0, skyH);
    const steps = 16;
    for (let i=0;i<=steps;i++){
      const x = (W/steps)*i;
      const y = skyH - 12 - Math.abs(Math.sin(i*1.7+2))*22 - Math.abs(Math.sin(i*0.5+5))*16;
      ctx.lineTo(x,y);
    }
    ctx.lineTo(W, skyH);
    ctx.closePath();
    ctx.fill();
    // soft glowing seam where sky meets the road
    const seamGrad = ctx.createLinearGradient(0,skyH-4,0,skyH+46);
    seamGrad.addColorStop(0,'rgba(180,230,190,0.35)');
    seamGrad.addColorStop(1,'rgba(180,230,190,0)');
    ctx.fillStyle = seamGrad;
    ctx.fillRect(0,skyH-4,W,50);
  }

  // sky band for the Gothic City road — cold storm clouds over a pale moon, with a jagged
  // spire-and-tower skyline sitting on the horizon instead of a forest tree-line
  const CITY_CLOUDS = [
    { yFrac:0.20, speed:7,  seed:0,   scale:1.6, alpha:0.55 },
    { yFrac:0.44, speed:4,  seed:340, scale:1.1, alpha:0.4 },
    { yFrac:0.12, speed:10, seed:640, scale:1.25,alpha:0.5 },
    { yFrac:0.60, speed:5.5,seed:900, scale:0.8, alpha:0.35 }
  ];
  // three depth layers of stars — far/small/dim/slow-twinkle up top, near/large/bright/fast
  // twinkle lower down — the size+twinkle-rate spread is what sells the sky as a volume with
  // depth rather than a flat painted backdrop
  const CITY_STARS = (function(){
    const layers = [
      { count:22, yMax:0.4,  rMin:0.4, rMax:0.9, twMin:0.4, twMax:0.9,  aMax:0.55 },
      { count:16, yMax:0.65, rMin:0.8, rMax:1.4, twMin:0.8, twMax:1.6,  aMax:0.75 },
      { count:9,  yMax:0.85, rMin:1.2, rMax:2.0, twMin:1.4, twMax:2.6,  aMax:0.95 }
    ];
    const stars = [];
    let seed = 1;
    const rnd = () => { seed = (seed*9301+49297) % 233280; return seed/233280; };
    for (const L of layers){
      for (let i=0;i<L.count;i++){
        stars.push({
          x: rnd(), yFrac: rnd()*L.yMax, r: L.rMin+rnd()*(L.rMax-L.rMin),
          tw: L.twMin+rnd()*(L.twMax-L.twMin), phase: rnd()*Math.PI*2, aMax: L.aMax
        });
      }
    }
    return stars;
  })();
  function drawGothicSky(W,H){
    const skyH = H*SKY_BAND_FRAC;
    const skyGrad = ctx.createLinearGradient(0,0,0,skyH);
    skyGrad.addColorStop(0,'#12131f');
    skyGrad.addColorStop(0.6,'#242741');
    skyGrad.addColorStop(1,'#4a4d68');
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0,0,W,skyH);
    // depth-layered twinkling stars — small/dim near the top (far), larger/brighter lower
    // in the band (closer), each pulsing at its own rate
    const twNow = performance.now()/1000;
    for (const st of CITY_STARS){
      const a = st.aMax * (0.5 + 0.5*Math.sin(twNow*st.tw + st.phase));
      ctx.fillStyle = `rgba(235,240,255,${a.toFixed(3)})`;
      ctx.beginPath(); ctx.arc(st.x*W, st.yFrac*skyH, st.r, 0, Math.PI*2); ctx.fill();
    }
    // pale cold moon
    const mx = W*0.74, my = skyH*0.28, mr = Math.max(16, Math.min(W,H)*0.04);
    const moonGlow = ctx.createRadialGradient(mx,my,0,mx,my,mr*3);
    moonGlow.addColorStop(0,'rgba(200,210,255,0.4)');
    moonGlow.addColorStop(1,'rgba(200,210,255,0)');
    ctx.fillStyle = moonGlow;
    ctx.beginPath(); ctx.arc(mx,my,mr*3,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#eef0ff';
    ctx.shadowColor='rgba(210,220,255,0.6)'; ctx.shadowBlur=16;
    ctx.beginPath(); ctx.arc(mx,my,mr,0,Math.PI*2); ctx.fill();
    ctx.shadowBlur=0;
    // storm clouds drifting through the band
    const tNow = performance.now()/1000;
    for (const c of CITY_CLOUDS){
      const span = W + 400;
      const cx2 = ((tNow*c.speed + c.seed) % span) - 200;
      drawMistCloud(cx2, skyH*c.yFrac, c.scale, c.alpha, '#8890ab', 'rgba(150,160,200,0.4)');
    }
    // jagged gothic skyline silhouette on the horizon — towers, spires, crenellations
    const skylineSegs = [];
    ctx.fillStyle = '#08080f';
    ctx.beginPath();
    ctx.moveTo(0, skyH);
    let sx = 0;
    let seedI = 0;
    while (sx < W){
      const segW = 26 + Math.abs(Math.sin(seedI*1.7+2))*30;
      const kind = Math.abs(Math.sin(seedI*2.3+1)) ;
      const h = 14 + kind*46;
      const hasSpire = kind > 0.72;
      ctx.lineTo(sx, skyH-h);
      if (hasSpire){ // occasional spire tip
        ctx.lineTo(sx+segW*0.5, skyH-h-22);
      }
      ctx.lineTo(sx+segW, skyH-h);
      skylineSegs.push({sx, segW, h, hasSpire, seedI});
      sx += segW;
      seedI++;
    }
    ctx.lineTo(W, skyH);
    ctx.closePath();
    ctx.fill();

    // lit windows scattered across the black silhouette, plus a torch glow atop each spire —
    // small warm points of life so the horizon houses don't read as flat dead cutouts
    for (const seg of skylineSegs){
      const rows = Math.max(1, Math.floor((seg.h-10)/12));
      const cols = Math.max(1, Math.floor((seg.segW-8)/10));
      // r=0 sits right at the ground/road seam (wy = skyH - 6 - r*12, so smaller r = lower).
      // Start at r=1 to skip that ground-touching row entirely — windows only appear on the
      // wall higher up. Short segments (rows <= 1) end up with no windows at all, which is right.
      for (let r=1; r<rows; r++){
        for (let c=0; c<cols; c++){
          const wSeed = Math.abs(Math.sin(seg.seedI*7.13 + r*3.71 + c*5.29));
          if (wSeed > 0.62){ // lit window — small stylish gothic pane, not a plain blob
            const wx = seg.sx + 4 + c*10;
            const wy = skyH - 6 - r*12;
            const ww = 5, wh = 7;
            const bright = wSeed > 0.85;
            // soft warm glow behind the glass
            const glow = ctx.createRadialGradient(wx+ww/2,wy+wh/2,0,wx+ww/2,wy+wh/2,7);
            glow.addColorStop(0, bright ? 'rgba(255,214,140,0.55)' : 'rgba(255,190,110,0.35)');
            glow.addColorStop(1,'rgba(255,190,110,0)');
            ctx.fillStyle = glow;
            ctx.fillRect(wx-3.5, wy-3.5, ww+7, wh+7);
            // lit glass pane
            ctx.fillStyle = bright ? '#ffe3a8' : '#ffc98a';
            ctx.fillRect(wx, wy, ww, wh);
            // dark frame outline
            ctx.strokeStyle = 'rgba(8,8,15,0.95)';
            ctx.lineWidth = 0.6;
            ctx.strokeRect(wx, wy, ww, wh);
            // cross mullion — gives the classic paned-window look
            ctx.beginPath();
            ctx.moveTo(wx+ww/2, wy); ctx.lineTo(wx+ww/2, wy+wh);
            ctx.moveTo(wx, wy+wh/2); ctx.lineTo(wx+ww, wy+wh/2);
            ctx.stroke();
          }
        }
      }
      if (seg.hasSpire){
        const tx = seg.sx + seg.segW*0.5, ty = skyH - seg.h - 22;
        const torchGlow = ctx.createRadialGradient(tx,ty,0,tx,ty,10);
        torchGlow.addColorStop(0,'rgba(255,170,80,0.85)');
        torchGlow.addColorStop(1,'rgba(255,170,80,0)');
        ctx.fillStyle = torchGlow;
        ctx.beginPath(); ctx.arc(tx,ty,10,0,Math.PI*2); ctx.fill();
        ctx.fillStyle = '#ffcf8a';
        ctx.beginPath(); ctx.arc(tx,ty,1.6,0,Math.PI*2); ctx.fill();
      }
    }
    // cold glowing seam where sky meets the road
    const seamGrad = ctx.createLinearGradient(0,skyH-4,0,skyH+46);
    seamGrad.addColorStop(0,'rgba(160,190,255,0.3)');
    seamGrad.addColorStop(1,'rgba(160,190,255,0)');
    ctx.fillStyle = seamGrad;
    ctx.fillRect(0,skyH-4,W,50);
  }

  // red glossy dotted outline — traced over a shape's current path (call right after fill(),
  // before beginPath() clears it) or used with strokeRect for rect-based limbs
  function dottedRedOutline(){
    ctx.save();
    ctx.strokeStyle = '#ff2e2e';
    ctx.lineWidth = 2.4;
    ctx.setLineDash([5, 4]);
    ctx.shadowColor = 'rgba(255,40,40,0.9)';
    ctx.shadowBlur = 7;
    ctx.stroke();
    ctx.restore();
  }
  function dottedRedOutlineRect(x, y, w, h){
    ctx.save();
    ctx.strokeStyle = '#ff2e2e';
    ctx.lineWidth = 2.4;
    ctx.setLineDash([5, 4]);
    ctx.shadowColor = 'rgba(255,40,40,0.9)';
    ctx.shadowBlur = 7;
    ctx.strokeRect(x, y, w, h);
    ctx.restore();
  }
  function draw(){
    ctx.clearRect(0,0,W,H);
    const theme = currentTheme();
    // once the gate breaks and the danav is revealed, the whole forest/theme ground gives
    // way to a horrible black misty floor for the fight — restored the moment the guardian falls
    const inBossFight = (gameState === 'boss' || gameState === 'gateBreak' || (gameState === 'gateOpening' && !!boss)); // v121: arena is in place from the moment it swaps in

    // background (themed per zone) — layered so it reads as depth (a far sky dome behind
    // a nearer haze) instead of one flat wash from top to bottom
    const grad = ctx.createLinearGradient(0,0,0,H);
    grad.addColorStop(0,theme.sky[0]);
    grad.addColorStop(0.55,theme.sky[0]);
    grad.addColorStop(1,theme.sky[1]);
    ctx.fillStyle = grad;
    ctx.fillRect(0,0,W,H);
    // atmospheric depth glow — a soft radial haze low in the frame, brighter and warmer than
    // the flat gradient beneath it, the classic cue for "far away" vs "close" in a painted sky
    const depthGlow = ctx.createRadialGradient(W*0.5, H*0.62, 0, W*0.5, H*0.62, Math.max(W,H)*0.75);
    depthGlow.addColorStop(0, 'rgba(120,140,200,0.16)');
    depthGlow.addColorStop(0.5, 'rgba(80,90,140,0.07)');
    depthGlow.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = depthGlow;
    ctx.fillRect(0,0,W,H);

    // real visible sky band, moon, clouds and a horizon tree-line for the forest road — drawn
    // here (before the world/camera content) so trees, the gate, and its label still layer on
    // top of it correctly instead of being hidden underneath an overlay
    if (theme.decorShape === 'tree' && !inBossFight){
      drawForestSky(W,H);
    } else if (theme.name === 'GOTHIC CITY' && !inBossFight){
      drawGothicSky(W,H);
    }

    // screen shake offset — falls off as shake.t depletes, so it eases out rather than cutting off
    let shakeX = 0, shakeY = 0;
    if (shake.t > 0){
      const falloff = shake.t / shake.dur;
      const curMag = shake.mag * falloff;
      shakeX = (Math.random()-0.5) * 2 * curMag;
      shakeY = (Math.random()-0.5) * 2 * curMag;
    }

    ctx.save();
    ctx.scale(viewZoom, viewZoom); // wide-angle: zoom the whole world out so much more left/right is visible
    ctx.translate(-camera.x + shakeX, -camera.y + shakeY);
    if (uw) drawUnderwaterScene(); // v123: solid underwater world replaces the desert while the officer is in the pond

    // how far the forest's hazy horizon reaches — nothing (ground, road, decor, enemies,
    // pickups) is visible above this line at all; they pop in right at/below it and ease
    // up to full opacity over a short ramp, so nothing is ever seen floating in open sky
    const skyH = ((theme.decorShape === 'tree' || theme.name === 'GOTHIC CITY') && !inBossFight) ? VH*SKY_BAND_FRAC : 0;
    const horizonY = fadeCamY + skyH;
    const fadeRamp = Math.max(40, skyH*0.6);
    function groundFade(wy){
      if (skyH <= 0) return 1;
      if (wy <= horizonY) return 0;
      return Math.max(0, Math.min(1, (wy-horizonY)/fadeRamp));
    }
    const fadeStop0 = skyH>0 ? skyH/VH : 0;
    const fadeStop1 = skyH>0 ? Math.min(0.98, (skyH+fadeRamp)/VH) : 0;

    if (!uw){ // v123: desert world layers are skipped entirely while underwater
    // ground base tint — invisible above the horizon, fades in just below it
    {
      ctx.fillStyle = theme.ground;
      if (skyH > 0){
        const gg = ctx.createLinearGradient(0,camera.y,0,camera.y+VH);
        gg.addColorStop(0, 'rgba(0,0,0,0)');
        gg.addColorStop(fadeStop0, 'rgba(0,0,0,0)');
        gg.addColorStop(fadeStop1, theme.ground);
        gg.addColorStop(1, theme.ground);
        ctx.save(); ctx.fillStyle = gg; ctx.globalAlpha = 0.35;
        ctx.fillRect(camera.x, camera.y, VW, VH);
        ctx.restore();
      } else {
        ctx.globalAlpha = 0.35;
        ctx.fillRect(camera.x, camera.y, VW, VH);
        ctx.globalAlpha = 1;
      }
    }

    // a real forward-perspective road through the forest — narrower toward the top of the
    // screen (the horizon ahead) and wider at the bottom (closest to the officer). It's fully
    // invisible above the horizon line and fades in right below it, so it never looks like it
    // cuts through the mountains, and nothing floats over bare sky either
    if (theme.decorShape === 'tree' || theme.name === 'GOTHIC CITY'){
      const rB = theme.roadBed || 'rgba(85,64,40', rBa = theme.roadBedAlpha!=null ? theme.roadBedAlpha : 0.44;
      const rR = theme.roadRut || 'rgba(130,102,64', rRa = theme.roadRutAlpha!=null ? theme.roadRutAlpha : 0.2;
      const rC = theme.roadCurb || 'rgba(0,0,0', rCa = theme.roadCurbAlpha!=null ? theme.roadCurbAlpha : 0.3;
      const rD = theme.roadDash || 'rgba(255,225,170,0.4)';
      const cx = WORLD.w/2, nearHalf = WORLD.w*0.24, farHalf = WORLD.w*0.012, steps = 24;
      // a real road actually narrows almost to a single point right at the horizon (that's
      // what makes it read as receding into the distance instead of two parallel lines just
      // running up into the sky) — so farHalf is kept tiny (near-vanishing-point), not a big
      // floor width, and nearHalf stays wide close to the officer for a proper converging cone
      function roadHalfAt(t){
        const wy = camera.y + t*VH;
        const span = Math.max(1, (camera.y+VH) - horizonY);
        const depthT = Math.max(0, Math.min(1, (wy - horizonY) / span));
        // slight curve (>1) so the road stays reasonably wide through the middle distance and
        // only pinches down to the vanishing point right near the horizon itself
        return farHalf + (nearHalf-farHalf) * Math.pow(depthT, 1.15);
      }
      function tracePath(widthMul){
        ctx.beginPath();
        for (let i=0;i<=steps;i++){ const t=i/steps, wy=camera.y+t*VH, half=roadHalfAt(t)*widthMul;
          if (i===0) ctx.moveTo(cx-half, wy); else ctx.lineTo(cx-half, wy); }
        for (let i=steps;i>=0;i--){ const t=i/steps, wy=camera.y+t*VH, half=roadHalfAt(t)*widthMul;
          ctx.lineTo(cx+half, wy); }
        ctx.closePath();
      }
      function fadedGrad(colorNoAlpha, alphaFull){
        const g = ctx.createLinearGradient(0,camera.y,0,camera.y+VH);
        if (skyH>0){
          g.addColorStop(0, colorNoAlpha+',0)');
          g.addColorStop(fadeStop0, colorNoAlpha+',0)');
          g.addColorStop(fadeStop1, colorNoAlpha+','+alphaFull+')');
        } else {
          g.addColorStop(0, colorNoAlpha+','+alphaFull+')');
        }
        g.addColorStop(1, colorNoAlpha+','+alphaFull+')');
        return g;
      }
      // road bed
      tracePath(1); ctx.fillStyle = fadedGrad(rB, rBa); ctx.fill();
      // worn centre rut, same taper
      tracePath(0.32); ctx.fillStyle = fadedGrad(rR, rRa); ctx.fill();
      // dark curb edges either side of the road for a real road-like boundary
      ctx.strokeStyle = fadedGrad(rC, rCa); ctx.lineWidth = 2.5;
      ctx.beginPath();
      for (let i=0;i<=steps;i++){ const t=i/steps, wy=camera.y+t*VH, half=roadHalfAt(t);
        if (i===0) ctx.moveTo(cx-half, wy); else ctx.lineTo(cx-half, wy); }
      ctx.stroke();
      ctx.beginPath();
      for (let i=0;i<=steps;i++){ const t=i/steps, wy=camera.y+t*VH, half=roadHalfAt(t);
        if (i===0) ctx.moveTo(cx+half, wy); else ctx.lineTo(cx+half, wy); }
      ctx.stroke();
      // dashed centre line, tapering thinner + fainter toward the horizon
      const dashLen = 26, gapLen = 22, cycle = dashLen+gapLen;
      const dashOff = ((camera.y % cycle)+cycle)%cycle;
      for (let wy = camera.y - dashOff; wy < camera.y+VH; wy += cycle){
        if (wy+dashLen <= horizonY) continue; // fully above the horizon — skip entirely
        const t = Math.max(0, Math.min(1, (wy-camera.y)/VH));
        ctx.lineWidth = 1.2 + t*2.6;
        ctx.globalAlpha = groundFade(Math.max(wy, horizonY));
        ctx.strokeStyle = rD;
        ctx.beginPath(); ctx.moveTo(cx, Math.max(wy,horizonY)); ctx.lineTo(cx, Math.min(wy+dashLen, camera.y+VH)); ctx.stroke();
      }
      ctx.globalAlpha = 1;
    }

    // ground decor (themed: trees / cacti / waves / rocks / buildings) — scaled and hazed by
    // screen depth (smaller + fainter near the top, bigger + clearer near the bottom) so the
    // whole forest reads with real forward perspective instead of flat top-down cutouts
    // Split into TWO passes: back trees first, then entities, then front trees
    // This gives proper depth so officer appears to walk ON the ground, not float through trees
    
    // BACK LAYER - trees/decor that are BEHIND the officer
    for (const d of groundDecor){
      if (d.y > player.y + decorFrontMargin(d)) continue; // only back trees
      if (d.x < camera.x-40 || d.x > camera.x+VW+40 || d.y < camera.y-40 || d.y > camera.y+VH+40) continue;
      const vanishA = d.vanishT0 ? Math.max(0, 1 - (performance.now()-d.vanishT0)/900) : 1; // fades out when the guardian arrives
      if (vanishA <= 0) continue;
      const t = Math.max(0, Math.min(1, (d.y-fadeCamY)/VH));
      const pScale = 0.5 + 0.7*t;
      ctx.save();
      ctx.globalAlpha = (0.45 + 0.55*t) * groundFade(d.y) * vanishA;
      ctx.translate(d.x, d.y); ctx.scale(pScale, pScale); ctx.translate(-d.x, -d.y);
      drawDecor(d);
      ctx.restore();
    }
    
    // MIDDLE LAYER - will be filled by entities (player, giants, enemies, etc) after this decor section

    drawPond(); // v123: the big pond lies on the ground, under every entity

    // gothic backdrop wall behind the cobra — drawn here, right after the ground/decor layer and
    // BEFORE every entity (player bullets included). It used to be drawn much later, right before
    // the cobra's own body — which meant it painted its opaque fill straight over bullets that had
    // already been drawn earlier in this same pass, hiding them completely. Backdrops belong behind
    // everything, so it moved up here. It deliberately does NOT use groundFade (that horizon-haze
    // is tuned for far-off decor and was fading this wall to near-zero, letting the real distant
    // skyline show through it) — it just stays solid so the cobra reads as a clear silhouette in
    // front of a real backdrop, base flush on the ground, instead of blending into open sky.
    if (cobra){
      const cb = cobra;
      ctx.save();
      ctx.globalAlpha = 1;
      // the wall's fill always spans the FULL current viewport (camera.y to camera.y+VH), not a
      // fixed offset from the cobra — that way, no matter how far the officer retreats, the wall
      // still fully covers the screen behind the cobra instead of its bottom edge lagging behind
      // and "lifting off" the ground as the camera scrolls away. The parapet stays pinned at a
      // fixed height above the cobra's own base so it doesn't smear across the screen while the
      // fill scrolls under it.
      const parapetY = cb.y - Math.max(620, cb.r*13);
      const wallTop = camera.y - 100;
      const wallBottom = camera.y + VH + 100;
      // solid ceiling-style panel wall — flat base color like the UFO ceiling, not a gradient
      ctx.fillStyle = '#1b1e27';
      ctx.fillRect(camera.x - 40, wallTop, VW + 80, wallBottom - wallTop);
      // soft central glow, echoing the ceiling's radial highlight
      const wallGlowCY = parapetY + 180;
      const wallGlow = ctx.createRadialGradient(cb.x, wallGlowCY, 20, cb.x, wallGlowCY, 460);
      wallGlow.addColorStop(0, 'rgba(40,52,70,0.75)');
      wallGlow.addColorStop(1, 'rgba(40,52,70,0)');
      ctx.fillStyle = wallGlow;
      ctx.fillRect(camera.x - 40, wallTop, VW + 80, wallBottom - wallTop);
      // faint concentric panel rings, echoing the ceiling's repeating-ring texture
      ctx.strokeStyle = 'rgba(255,255,255,0.035)';
      ctx.lineWidth = 1;
      for (let rr = 70; rr < 620; rr += 70){
        ctx.beginPath();
        ctx.ellipse(cb.x, wallGlowCY, rr*1.35, rr*0.55, 0, 0, Math.PI*2);
        ctx.stroke();
      }
      // a handful of bright cyan-glow points, matching the ceiling's scattered lights
      ctx.shadowColor = 'rgba(158,231,255,0.95)'; ctx.shadowBlur = 15;
      ctx.fillStyle = '#fff';
      const lightSeed = Math.floor(cb.x/50);
      const lightSpots = [[0.09,0.26],[0.9,0.23],[0.23,0.13],[0.75,0.15],[0.5,0.34],[0.35,0.42],[0.65,0.44]];
      for (let li=0; li<lightSpots.length; li++){
        const wx = camera.x + lightSpots[li][0]*VW;
        const wy = parapetY + 10 + lightSpots[li][1]*(wallBottom-parapetY-20);
        if (wy < wallTop || wy > wallBottom) continue;
        ctx.beginPath(); ctx.arc(wx, wy, 4, 0, Math.PI*2); ctx.fill();
      }
      ctx.shadowBlur = 0;
      ctx.restore();
    }

    // fog-of-the-zone tint overlay (adds atmosphere per theme)
    ctx.fillStyle = theme.fog;
    ctx.fillRect(camera.x, camera.y, VW, VH);

    // the giant's arena floor — beyond the gate the forest/theme ground gives way to a dark
    // stone floor, so the officer reads clearly against it instead of blending into green foliage.
    // Once the gate is actually broken and the danav fight is on, this swallows the ENTIRE
    // visible ground in a horrible black misty ground — a real uneven rock floor tapering away
    // into the dark like an actual 3D path, not a flat grid — the forest is gone till he falls.
    {
      const palaceBottom = inBossFight ? (camera.y + VH + 20) : (gateY + 70); // overlaps a little into the gate line for a seamless edge
      if (palaceBottom > camera.y - 10){
        const pTop = camera.y - 10;
        const pBottom = Math.min(palaceBottom, camera.y + VH + 10);
        if (pBottom > pTop){
          ctx.save();
          const pGrad = ctx.createLinearGradient(0,pTop,0,pBottom);
          if (inBossFight){
            pGrad.addColorStop(0, '#050307');
            pGrad.addColorStop(1, '#0d0710');
          } else {
            pGrad.addColorStop(0, '#120f16');
            pGrad.addColorStop(1, '#241c26');
          }
          ctx.fillStyle = pGrad;
          ctx.fillRect(camera.x, pTop, VW, pBottom-pTop);

          if (inBossFight && arenaFloor){
            // a real uneven rock path tapering into the distance — near-wide, far-narrow — so the
            // arena reads with actual forward depth instead of a flat overhead tile pattern
            const nearHalf = WORLD.w*0.52, farHalf = WORLD.w*0.2, steps = 20;
            function haloAt(t){ return farHalf + (nearHalf-farHalf)*t; }
            function tracePathEl(){
              ctx.beginPath();
              for (let i=0;i<=steps;i++){ const t=i/steps, wy=camera.y+t*VH, half=haloAt(t);
                if (i===0) ctx.moveTo(WORLD.w/2-half, wy); else ctx.lineTo(WORLD.w/2-half, wy); }
              for (let i=steps;i>=0;i--){ const t=i/steps, wy=camera.y+t*VH, half=haloAt(t);
                ctx.lineTo(WORLD.w/2+half, wy); }
              ctx.closePath();
            }
            // lit path bed, slightly warmer than the surrounding void so it reads as ground, not empty screen
            tracePathEl();
            const bedGrad = ctx.createLinearGradient(0,pTop,0,pBottom);
            bedGrad.addColorStop(0,'#0a0611'); bedGrad.addColorStop(1,'#150c1c');
            ctx.fillStyle = bedGrad; ctx.fill();
            // ledge rim — a faint broken highlight along the path edge, like real cracked ground meeting the dark
            ctx.save(); tracePathEl(); ctx.clip();
            ctx.strokeStyle = 'rgba(120,60,80,0.35)'; ctx.lineWidth = 3;
            for (let i=0;i<=steps;i++){ const t=i/steps, wy=camera.y+t*VH, half=haloAt(t);
              ctx.beginPath(); ctx.arc(WORLD.w/2-half, wy, 1.6, 0, Math.PI*2); ctx.fill(); }
            ctx.restore();

            ctx.save();
            tracePathEl(); ctx.clip();

            // uneven rock plates — deterministic per-fight so they hold still under the camera,
            // each shaded like a real bump (dark underside, faint highlight) instead of a flat tile
            for (const b of arenaFloor.blotches){
              if (b.x < camera.x-90 || b.x > camera.x+VW+90 || b.y < camera.y-90 || b.y > camera.y+VH+90) continue;
              const t = Math.max(0, Math.min(1, (b.y-camera.y)/VH));
              const depthA = 0.3 + 0.6*t;
              const rg = ctx.createRadialGradient(b.x-b.r*0.25, b.y-b.r*0.25, 0, b.x, b.y, b.r);
              rg.addColorStop(0, `rgba(${40+b.shade*30},${28+b.shade*18},${34+b.shade*22},${0.5*depthA})`);
              rg.addColorStop(1, 'rgba(5,3,6,0)');
              ctx.fillStyle = rg;
              ctx.beginPath(); ctx.ellipse(b.x,b.y,b.r,b.r*0.62,0,0,Math.PI*2); ctx.fill();
              // shadow underside for a real embossed feel
              ctx.fillStyle = `rgba(0,0,0,${0.22*depthA})`;
              ctx.beginPath(); ctx.ellipse(b.x+b.r*0.18,b.y+b.r*0.22,b.r*0.7,b.r*0.4,0,0,Math.PI*2); ctx.fill();
            }

            // static red stone rubble near the gate threshold — solid rock, no glow or pulse
            for (const rs of arenaFloor.redStones){
              if (rs.y < camera.y-200 || rs.y > camera.y+VH+200) continue;
              ctx.save();
              ctx.translate(rs.x, rs.y); ctx.rotate(rs.rot);
              const rg2 = ctx.createLinearGradient(-rs.r,-rs.r,rs.r,rs.r);
              rg2.addColorStop(0, `rgba(${120+rs.shade*40},${30+rs.shade*10},${28+rs.shade*8},0.9)`);
              rg2.addColorStop(1, `rgba(${70+rs.shade*30},${16+rs.shade*8},${14+rs.shade*6},0.9)`);
              ctx.fillStyle = rg2;
              ctx.beginPath();
              ctx.moveTo(-rs.r, -rs.r*0.4);
              ctx.lineTo(-rs.r*0.3, -rs.r);
              ctx.lineTo(rs.r*0.6, -rs.r*0.6);
              ctx.lineTo(rs.r, rs.r*0.3);
              ctx.lineTo(rs.r*0.2, rs.r);
              ctx.lineTo(-rs.r*0.7, rs.r*0.6);
              ctx.closePath();
              ctx.fill();
              ctx.strokeStyle = 'rgba(0,0,0,0.4)'; ctx.lineWidth = 1.5;
              ctx.stroke();
              ctx.restore();
            }
            ctx.restore();

            // rolling black mist, drifting slowly across the whole arena floor
            const mistStep = 220;
            const mOffY = ((pTop % mistStep)+mistStep)%mistStep;
            for (let my = pTop-mOffY; my < pBottom; my += mistStep){
              const baseX = camera.x + VW*0.5 + Math.sin(my*0.011)*VW*0.55;
              const drift = Math.sin(performance.now()/2600 + my*0.017)*46;
              const mr = 150 + Math.sin(my*0.043)*50;
              const mg = ctx.createRadialGradient(baseX+drift, my, 0, baseX+drift, my, mr);
              mg.addColorStop(0, 'rgba(18,10,22,0.55)');
              mg.addColorStop(1, 'rgba(18,10,22,0)');
              ctx.fillStyle = mg;
              ctx.fillRect(baseX+drift-mr, my-mr, mr*2, mr*2);
            }
          } else {
            // stone tile grid (brief strip near the gate before the boss fight begins)
            ctx.strokeStyle = 'rgba(0,0,0,0.4)'; ctx.lineWidth = 2;
            const tile = 70;
            const offX = ((camera.x % tile)+tile)%tile;
            for (let gx = camera.x-offX; gx < camera.x+VW; gx += tile){
              ctx.beginPath(); ctx.moveTo(gx, pTop); ctx.lineTo(gx, pBottom); ctx.stroke();
            }
            const offY = ((pTop % tile)+tile)%tile;
            for (let gy = pTop-offY; gy < pBottom; gy += tile){
              ctx.beginPath(); ctx.moveTo(camera.x, gy); ctx.lineTo(camera.x+VW, gy); ctx.stroke();
            }
            ctx.strokeStyle = 'rgba(255,255,255,0.04)'; ctx.lineWidth = 1;
            for (let gx = camera.x-offX+tile/2; gx < camera.x+VW; gx += tile){
              ctx.beginPath(); ctx.moveTo(gx, pTop); ctx.lineTo(gx, pBottom); ctx.stroke();
            }
            // warm rim glow near the gate threshold, tying it back to the zone's energy color
            const rimGrad = ctx.createLinearGradient(0,pBottom-90,0,pBottom);
            rimGrad.addColorStop(0,'rgba(0,0,0,0)');
            rimGrad.addColorStop(1, theme.neon+'22');
            ctx.fillStyle = rimGrad;
            ctx.fillRect(camera.x, pBottom-90, VW, 90);
          }
          ctx.restore();
        }
      }
    }

    // (the corridor's neon side-walls were removed entirely — see above — so no re-draw needed here)

    // the gate — a cursed spinning blade-chakra with a watching demon eye (v116), on a bone-studded
    // pedestal between two tall skull pillars; blocks the zone until shot down
    if (gateY > camera.y-560 && gateY < camera.y+VH+380 && !cobra && !(gate && gate.hidden)){
      const gateBroken = !!(gate && gate.broken);
      const tNow = performance.now()/1000, TAU2 = Math.PI*2;
      const cx = WORLD.w/2, cy = -180;             // wheel centre (local to the gate line)
      const RR = CHAKRA_R*CHAKRA_SCALE;            // on-screen blade-tip radius (~218)
      ctx.save();
      ctx.translate(0, gateY);
      if (gateVisScale !== 1){ ctx.translate(WORLD.w/2, 0); ctx.scale(gateVisScale, gateVisScale); ctx.translate(-WORLD.w/2, 0); } // v119: gate never shrinks on screen
      if (gate && gate.revealAt) ctx.globalAlpha = Math.min(1, (performance.now()-gate.revealAt)/2000); // Desert: fades up out of the sand
      const isDesertGate = currentTheme().name === 'DESERT';
      if (!gateBroken && isDesertGate){
        // ===== Desert ring-portal gate (bigger, amber-gold neon on black bronze) =====
        if (!desertGateFrame){ desertGateFrame = buildDesertGateFrame(); desertGateInner = buildDesertGateInner(); }
        const dcy = DESERT_GATE_CY, DR = DESERT_GATE_R;
        const flash = (gate && gate.flashUntil && performance.now() < gate.flashUntil) ? 1 : 0;
        const pulse = 0.5 + 0.5*Math.sin(tNow*1.6);
        // ground shadow
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.beginPath(); ctx.ellipse(cx, 74, 450, 22, 0, 0, TAU2); ctx.fill();
        // amber halo + slow counter-turning heat rays behind the ring
        const halo = ctx.createRadialGradient(cx, dcy, DR*0.55, cx, dcy, DR*1.7);
        halo.addColorStop(0, 'rgba(255,150,30,'+(0.34+0.14*pulse+0.25*flash)+')');
        halo.addColorStop(1, 'rgba(200,80,10,0)');
        ctx.fillStyle = halo; ctx.beginPath(); ctx.arc(cx, dcy, DR*1.7, 0, TAU2); ctx.fill();
        ctx.save(); ctx.globalCompositeOperation = 'lighter';
        ctx.translate(cx, dcy); ctx.rotate(-tNow*0.06);
        const rg2 = ctx.createRadialGradient(0,0,DR*0.6,0,0,DR*1.6);
        rg2.addColorStop(0,'rgba(255,190,70,0.15)'); rg2.addColorStop(1,'rgba(255,150,40,0)');
        ctx.fillStyle = rg2;
        for (let i=0;i<16;i++){
          const a = i*TAU2/16, hw = 0.05;
          ctx.beginPath(); ctx.moveTo(0,0);
          ctx.lineTo(Math.cos(a-hw)*DR*1.6, Math.sin(a-hw)*DR*1.6);
          ctx.lineTo(Math.cos(a+hw)*DR*1.6, Math.sin(a+hw)*DR*1.6);
          ctx.closePath(); ctx.fill();
        }
        ctx.restore();
        // armoured frame (rings, buttresses, base)
        ctx.drawImage(desertGateFrame, 0, DESERT_GATE_TOP);
        // inner ring turns slowly
        ctx.save(); ctx.translate(cx, dcy); ctx.rotate(tNow*0.22);
        ctx.drawImage(desertGateInner, -240, -240, 480, 480);
        ctx.restore();
        // dark portal hollow with a pulsing molten core and a slow swirl
        const hollow = ctx.createRadialGradient(cx, dcy, 10, cx, dcy, 160);
        hollow.addColorStop(0, 'rgba(60,24,6,'+(0.75+0.15*pulse)+')');
        hollow.addColorStop(0.45, 'rgba(8,4,2,0.97)');
        hollow.addColorStop(1, 'rgba(0,0,0,1)');
        ctx.fillStyle = hollow; ctx.beginPath(); ctx.arc(cx, dcy, 158, 0, TAU2); ctx.fill();
        ctx.save(); ctx.globalCompositeOperation = 'lighter';
        ctx.beginPath(); ctx.arc(cx, dcy, 156, 0, TAU2); ctx.clip();
        ctx.translate(cx, dcy); ctx.rotate(tNow*0.5);
        ctx.lineCap = 'round';
        for (let i=0;i<5;i++){
          ctx.strokeStyle = 'rgba(255,'+(140+i*15)+',40,'+(0.16+0.08*pulse)+')'; ctx.lineWidth = 3;
          ctx.beginPath(); ctx.arc(0,0,40+i*24, i*1.3, i*1.3+2.2); ctx.stroke();
        }
        const core = ctx.createRadialGradient(0,0,2,0,0,70);
        core.addColorStop(0,'rgba(255,200,90,'+(0.55+0.25*pulse+0.3*flash)+')'); core.addColorStop(1,'rgba(255,120,20,0)');
        ctx.fillStyle = core; ctx.beginPath(); ctx.arc(0,0,70,0,TAU2); ctx.fill();
        ctx.restore();
        // impact flash — the whole armour lights up for a beat when shot
        if (flash){
          ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 0.35;
          ctx.drawImage(desertGateFrame, 0, DESERT_GATE_TOP);
          ctx.restore();
        }
        // sand-glow embers rising off the ring
        ctx.save(); ctx.globalCompositeOperation = 'lighter';
        for (let i=0;i<22;i++){
          const life = ((tNow*0.10 + i*0.117) % 1);
          const ex2 = cx + Math.sin(i*6.1 + tNow*0.5)*DR*(0.5+0.6*((i*37)%10)/10);
          const ey2 = dcy + DR*0.9 - life*DR*2.2;
          ctx.fillStyle = 'rgba(255,'+(150+((i*53)%80))+',50,'+(0.7*(1-life))+')';
          ctx.beginPath(); ctx.arc(ex2, ey2, 1.6+((i*11)%3), 0, TAU2); ctx.fill();
        }
        ctx.restore();
        ctx.fillStyle = 'rgba(255,214,120,0.95)';
        ctx.font = '600 13px Segoe UI, Arial'; ctx.textAlign = 'center';
        ctx.shadowColor = 'rgba(0,0,0,0.9)'; ctx.shadowBlur = 4;
        ctx.fillText('SECTOR GATE', cx, 96);
        ctx.shadowBlur = 0;
      } else if (!gateBroken){
        if (!chakraGateCanvas) chakraGateCanvas = buildChakraGateCanvas();
        if (!gatePillarCanvas) gatePillarCanvas = buildGatePillarCanvas();
        const flash = (gate && gate.flashUntil && performance.now() < gate.flashUntil) ? 1 : 0;
        const pulse = 0.5 + 0.5*Math.sin(tNow*1.6);

        // ground shadow
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.beginPath(); ctx.ellipse(cx, 70, 240, 16, 0, 0, TAU2); ctx.fill();

        // tall pillars, drawn behind the wheel
        for (const sdir of [-1,1]){
          const bx = cx + sdir*GATE_PILLAR_DX;
          ctx.drawImage(gatePillarCanvas, bx-60, -446, 120, 520);
          ctx.save(); ctx.globalCompositeOperation = 'lighter';
          const pg = ctx.createRadialGradient(bx,-386,1,bx,-386,46);
          pg.addColorStop(0,'rgba(255,50,30,'+(0.45+0.3*pulse)+')'); pg.addColorStop(1,'rgba(255,30,10,0)');
          ctx.fillStyle = pg; ctx.beginPath(); ctx.arc(bx,-386,46,0,TAU2); ctx.fill();
          const vg = ctx.createLinearGradient(bx-22,0,bx+22,0);
          vg.addColorStop(0,'rgba(255,30,20,0)'); vg.addColorStop(0.5,'rgba(255,40,25,'+(0.10+0.12*pulse)+')'); vg.addColorStop(1,'rgba(255,30,20,0)');
          ctx.fillStyle = vg; ctx.fillRect(bx-22,-336,44,378);
          ctx.restore();
        }

        // blood-red halo + slow counter-turning crimson rays behind the wheel
        const halo = ctx.createRadialGradient(cx, cy, RR*0.6, cx, cy, RR*1.55);
        halo.addColorStop(0, 'rgba(190,20,20,'+(0.42+0.16*pulse+0.25*flash)+')');
        halo.addColorStop(1, 'rgba(120,0,10,0)');
        ctx.fillStyle = halo; ctx.beginPath(); ctx.arc(cx, cy, RR*1.55, 0, TAU2); ctx.fill();
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        ctx.translate(cx, cy); ctx.rotate(-tNow*0.07);
        const rayG = ctx.createRadialGradient(0, 0, RR*0.6, 0, 0, RR*1.5);
        rayG.addColorStop(0, 'rgba(255,50,40,0.17)'); rayG.addColorStop(1, 'rgba(255,50,40,0)');
        ctx.fillStyle = rayG;
        for (let i=0;i<14;i++){
          const a = i*TAU2/14, hw = 0.055;
          ctx.beginPath(); ctx.moveTo(0,0);
          ctx.lineTo(Math.cos(a-hw)*RR*1.5, Math.sin(a-hw)*RR*1.5);
          ctx.lineTo(Math.cos(a+hw)*RR*1.5, Math.sin(a+hw)*RR*1.5);
          ctx.closePath(); ctx.fill();
        }
        ctx.restore();

        // pedestal — black stone tiers, iron spike row, a row of skulls, blood-red glow line
        function pedTier(x0, y0, w, h){
          const pg = ctx.createLinearGradient(0, y0, 0, y0+h);
          pg.addColorStop(0, '#4a4856'); pg.addColorStop(0.5, '#17151c'); pg.addColorStop(1, '#050308');
          ctx.fillStyle = pg; roundRect(ctx, x0, y0, w, h, 4); ctx.fill();
          ctx.strokeStyle = '#030204'; ctx.lineWidth = 1.5; ctx.stroke();
          ctx.strokeStyle = 'rgba(255,50,30,'+(0.35+0.3*pulse)+')'; ctx.lineWidth = 1.2;
          ctx.beginPath(); ctx.moveTo(x0+6, y0+2.5); ctx.lineTo(x0+w-6, y0+2.5); ctx.stroke();
        }
        pedTier(cx-170, 30, 340, 20);
        pedTier(cx-215, 50, 430, 22);
        ctx.fillStyle = '#23212a'; ctx.strokeStyle = '#030204'; ctx.lineWidth = 1;
        for (let i=0;i<22;i++){
          const sx = cx-160 + i*15.2;
          ctx.beginPath(); ctx.moveTo(sx-5,30); ctx.lineTo(sx,19); ctx.lineTo(sx+5,30); ctx.closePath(); ctx.fill(); ctx.stroke();
        }
        for (let i=0;i<11;i++) drawSkull(ctx, cx-190 + i*38, 62, 6.2, 0, false);

        // the wheel — slow spin (~0.3 rad/s, one turn about every 21s)
        ctx.save();
        ctx.translate(cx, cy); ctx.rotate(tNow*0.3);
        const dsz = CHAKRA_HALF*2*CHAKRA_SCALE;
        ctx.drawImage(chakraGateCanvas, -dsz/2, -dsz/2, dsz, dsz);
        if (flash){
          ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 0.35;
          ctx.drawImage(chakraGateCanvas, -dsz/2, -dsz/2, dsz, dsz);
        }
        ctx.restore();

        // the demon eye in the hub — does not spin, blinks now and then, and stares at the officer
        {
          const pdx = player.x - cx, pdy = player.y - (gateY+cy), pa = Math.atan2(pdy, pdx);
          const look = Math.min(10, Math.hypot(pdx, pdy)/40);
          const ipx = cx + Math.cos(pa)*look, ipy = cy + Math.sin(pa)*look;
          const bt = tNow % 5.3, blink = 1 - Math.max(0, 1 - Math.abs(bt-0.1)/0.1)*0.9;
          const EW = 52, EH = 27*blink;
          ctx.save(); ctx.globalCompositeOperation = 'lighter';
          const eg = ctx.createRadialGradient(cx,cy,8,cx,cy,100);
          eg.addColorStop(0,'rgba(255,60,20,'+(0.5+0.25*pulse+0.3*flash)+')'); eg.addColorStop(1,'rgba(255,40,10,0)');
          ctx.fillStyle = eg; ctx.beginPath(); ctx.arc(cx,cy,100,0,TAU2); ctx.fill();
          ctx.restore();
          ctx.save();
          ctx.beginPath(); ctx.moveTo(cx-EW,cy); ctx.quadraticCurveTo(cx,cy-2*EH,cx+EW,cy); ctx.quadraticCurveTo(cx,cy+2*EH,cx-EW,cy); ctx.closePath();
          ctx.clip();
          const sg = ctx.createRadialGradient(cx,cy,4,cx,cy,EW);
          sg.addColorStop(0,'#fff0a0'); sg.addColorStop(0.55,'#ff9a2a'); sg.addColorStop(1,'#7a0a06');
          ctx.fillStyle = sg; ctx.fillRect(cx-EW,cy-EH*2,EW*2,EH*4);
          ctx.strokeStyle = 'rgba(150,10,10,0.8)'; ctx.lineWidth = 1.2;
          for (let k=0;k<12;k++){
            const a = k*TAU2/12 + 0.2;
            ctx.beginPath(); ctx.moveTo(cx+Math.cos(a)*EW*0.98, cy+Math.sin(a)*EH*1.5);
            ctx.lineTo(ipx+Math.cos(a)*22, ipy+Math.sin(a)*22); ctx.stroke();
          }
          const ig = ctx.createRadialGradient(ipx,ipy,3,ipx,ipy,21);
          ig.addColorStop(0,'#ffd23a'); ig.addColorStop(0.6,'#ff5a10'); ig.addColorStop(1,'#4a0000');
          ctx.fillStyle = ig; ctx.beginPath(); ctx.arc(ipx,ipy,21,0,TAU2); ctx.fill();
          ctx.fillStyle = '#000'; ctx.beginPath(); ctx.ellipse(ipx,ipy,4.5+2.5*pulse,18,0,0,TAU2); ctx.fill();
          ctx.fillStyle = 'rgba(255,255,255,0.75)'; ctx.beginPath(); ctx.arc(ipx-7,ipy-8,2.6,0,TAU2); ctx.fill();
          ctx.restore();
          ctx.strokeStyle = '#050205'; ctx.lineWidth = 4; ctx.lineJoin = 'round';
          ctx.beginPath(); ctx.moveTo(cx-EW,cy); ctx.quadraticCurveTo(cx,cy-2*EH,cx+EW,cy); ctx.quadraticCurveTo(cx,cy+2*EH,cx-EW,cy); ctx.closePath(); ctx.stroke();
        }

        // embers and ash rising off the cursed wheel
        ctx.save(); ctx.globalCompositeOperation = 'lighter';
        for (let i=0;i<16;i++){
          const life = ((tNow*0.11 + i*0.137) % 1);
          const ex2 = cx + Math.sin(i*7.3 + tNow*0.6)*RR*(0.55+0.55*((i*37)%10)/10);
          const ey2 = cy + RR*0.9 - life*RR*2.3;
          ctx.fillStyle = 'rgba(255,'+(70+((i*53)%90))+',30,'+(0.75*(1-life))+')';
          ctx.beginPath(); ctx.arc(ex2, ey2, 1.6+((i*11)%3), 0, TAU2); ctx.fill();
        }
        ctx.restore();

        ctx.fillStyle = 'rgba(255,110,100,0.92)';
        ctx.font = '600 12px Segoe UI, Arial'; ctx.textAlign = 'center';
        ctx.shadowColor = 'rgba(0,0,0,0.9)'; ctx.shadowBlur = 4;
        ctx.fillText('SECTOR GATE', cx, 92);
        ctx.shadowBlur = 0;
      } else {
        // shattered chakra — black iron shards, bone chips and blood-red glints (fixed positions, no flicker)
        for (let i=0;i<28;i++){
          const s1 = Math.sin(i*12.9898)*43758.5453, r1 = s1-Math.floor(s1);
          const s2 = Math.sin(i*78.233)*12345.6789, r2 = s2-Math.floor(s2);
          ctx.save(); ctx.translate(cx-210+r1*420, -6+r2*54); ctx.rotate((r1-0.5)*2.4);
          ctx.fillStyle = i%4===0 ? '#e8dcc0' : (i%4===1 ? '#2a2830' : (i%4===2 ? '#14121a' : '#6a6a78'));
          ctx.beginPath(); ctx.moveTo(-15,6); ctx.lineTo(0,-11-r2*7); ctx.lineTo(17,6); ctx.closePath(); ctx.fill();
          if (i%5===0){ ctx.fillStyle = '#c01818'; ctx.beginPath(); ctx.arc(0,1,2.6,0,TAU2); ctx.fill(); }
          ctx.restore();
        }
      }
      ctx.restore();
    }

    // the Gothic gate eye's Skull Chain (telegraph line, whip out, reel back)
    if (gateChain && gate && !gate.broken) drawGateChain();

    // slow smoke drifting off the guardian, drawn behind its body
    if (boss && boss.hp > 0 && boss.smoke && boss.smoke.length){
      ctx.save();
      for (const p of boss.smoke){
        const t2 = Math.min(1, p.age/p.life);
        const fade = Math.sin(t2*Math.PI);
        const px = boss.x+p.ox, py = boss.y+p.oy;
        // hot ember core near the base, cooling to dark smoke as it rises
        const emberStrength = Math.max(0, 1 - t2*1.6);
        if (emberStrength > 0){
          ctx.fillStyle = 'rgba(255,110,30,'+(0.35*fade*emberStrength)+')';
          ctx.shadowColor = 'rgba(255,90,20,0.9)'; ctx.shadowBlur = 10*emberStrength;
          ctx.beginPath();
          ctx.arc(px, py, p.rad*0.5*(0.7+t2*0.6), 0, Math.PI*2);
          ctx.fill();
          ctx.shadowBlur = 0;
        }
        ctx.fillStyle = 'rgba(35,30,32,'+(0.4*fade)+')';
        ctx.beginPath();
        ctx.arc(px, py, p.rad*(0.7+t2*0.6), 0, Math.PI*2);
        ctx.fill();
      }
      ctx.restore();
    }

    // boss — a colossal danav (demon-giant) guarding the gate
    if (boss && boss.hp > 0){
      ctx.save();
      if (boss.entering){
        // v121: cracked pit the guardian climbs out of — body is clipped at the ground line so it truly rises from below
        const cy0 = bossClipY(boss);
        const pitA = 1 - Math.max(0, Math.min(1, (boss.enterT - (BOSS_ENTRANCE.riseStart + BOSS_ENTRANCE.riseDur))/0.7));
        ctx.save();
        ctx.translate(boss.x, cy0); ctx.scale(1, 0.28); ctx.globalAlpha = pitA;
        const pitG = ctx.createRadialGradient(0,0,4,0,0,boss.r*1.25);
        pitG.addColorStop(0,'rgba(0,0,0,0.95)'); pitG.addColorStop(0.55,'rgba(90,10,12,0.75)'); pitG.addColorStop(1,'rgba(90,10,12,0)');
        ctx.fillStyle = pitG; ctx.beginPath(); ctx.arc(0,0,boss.r*1.25,0,Math.PI*2); ctx.fill();
        ctx.restore();
        ctx.beginPath();
        ctx.rect(boss.x - boss.r*4, boss.y - boss.r*6, boss.r*8, cy0 - (boss.y - boss.r*6));
        ctx.clip();
      }
      ctx.translate(boss.x, boss.y);
      const r = boss.r;
      const flash = boss.hitFlash > 0;
      const bskin = BOSS_SKINS[(boss.skin||0) % BOSS_SKINS.length];
      const bodyCol = flash ? '#ffffff' : bskin.bodyCol;
      const rimCol = bskin.rimCol;

      if (WARDEN.ready && (boss.skin||0) === 0){
        // colossal presence: dark ground shadow at its feet + a pulsing crimson aura (fiercer once berserk)
        {
          const tA = performance.now()/1000;
          ctx.save();
          ctx.fillStyle = 'rgba(0,0,0,0.5)';
          ctx.beginPath(); ctx.ellipse(0, r*2.18, r*1.7, r*0.36, 0, 0, Math.PI*2); ctx.fill();
          const aBase = boss.raged ? 0.22 : 0.10, aPulse = boss.raged ? 0.12 : 0.06;
          const ag = ctx.createRadialGradient(0, -r*0.1, r*0.4, 0, -r*0.1, r*2.7);
          ag.addColorStop(0, 'rgba(255,40,30,'+(aBase + aPulse*Math.sin(tA*(boss.raged?5:2.4)))+')');
          ag.addColorStop(1, 'rgba(255,40,30,0)');
          ctx.fillStyle = ag;
          ctx.beginPath(); ctx.arc(0, -r*0.1, r*2.7, 0, Math.PI*2); ctx.fill();
          ctx.restore();
        }
        // Gothic City gate guardian: the Crimson Warden knight replaces the danav body
        drawWarden(ctx, r, flash);
        // COBRA FANG telegraph — the chest gem flares with a growing warning ring right
        // before the serpent shaft erupts from it
        if (boss.cobraState === 'telegraph'){
          const cgx = 0, cgy = -r*0.565;
          const ctPulse = 0.5+0.5*Math.sin(performance.now()/55);
          ctx.save();
          ctx.globalCompositeOperation = 'lighter';
          ctx.strokeStyle = 'rgba(255,20,40,'+(0.35+0.45*ctPulse)+')';
          ctx.lineWidth = 4;
          ctx.shadowColor = 'rgba(255,20,40,0.9)'; ctx.shadowBlur = 16;
          ctx.beginPath(); ctx.arc(cgx, cgy, 14+ctPulse*26, 0, Math.PI*2); ctx.stroke();
          ctx.restore();
        }
      } else {
      // whip-like barbed tail with a bone spike at the tip
      ctx.strokeStyle = rimCol; ctx.lineWidth = r*0.13;
      ctx.beginPath();
      ctx.moveTo(0, r*0.4);
      const tailSwing = Math.sin(performance.now()/500)*r*0.55;
      ctx.quadraticCurveTo(r*0.65+tailSwing, r*1.2, r*0.35+tailSwing, r*1.9);
      ctx.stroke();
      ctx.fillStyle = '#e8e2d8';
      ctx.save(); ctx.translate(r*0.35+tailSwing, r*1.9);
      ctx.beginPath(); ctx.moveTo(-r*0.06,-r*0.05); ctx.lineTo(r*0.06,-r*0.05); ctx.lineTo(0,r*0.24); ctx.closePath(); ctx.fill();
      ctx.restore();

      // jagged bone-armor skirt draped from the waist — hides the legs, spiked hem
      ctx.fillStyle = '#050505';
      ctx.beginPath();
      ctx.moveTo(-r*0.7, r*0.14);
      ctx.lineTo(r*0.7, r*0.14);
      ctx.quadraticCurveTo(r*0.95, r*0.65, r*1.15, r*1.5);
      ctx.lineTo(r*0.78, r*1.2);
      ctx.lineTo(r*0.5, r*1.65);
      ctx.lineTo(r*0.22, r*1.15);
      ctx.lineTo(0, r*1.6);
      ctx.lineTo(-r*0.22, r*1.15);
      ctx.lineTo(-r*0.5, r*1.65);
      ctx.lineTo(-r*0.78, r*1.2);
      ctx.lineTo(-r*1.15, r*1.5);
      ctx.quadraticCurveTo(-r*0.95, r*0.65, -r*0.7, r*0.14);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = rimCol; ctx.lineWidth = 2.2;
      ctx.shadowColor = rimCol; ctx.shadowBlur = flash ? 4 : 12;
      ctx.stroke();
      ctx.shadowBlur = 0;
      // curved rib-bone spikes jutting from the skirt/hips
      ctx.fillStyle = '#d8cdb8';
      [-1,1].forEach(function(side){
        ctx.beginPath();
        ctx.moveTo(side*r*0.68, r*0.2);
        ctx.quadraticCurveTo(side*r*1.15, r*0.35, side*r*1.05, r*0.85);
        ctx.quadraticCurveTo(side*r*0.85, r*0.5, side*r*0.6, r*0.42);
        ctx.closePath(); ctx.fill();
      });
      // glowing crack lines in the armor
      ctx.strokeStyle = 'rgba(255,255,255,0.08)'; ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(-r*0.3, r*0.22); ctx.lineTo(-r*0.42, r*1.35);
      ctx.moveTo(r*0.3, r*0.22); ctx.lineTo(r*0.42, r*1.35);
      ctx.moveTo(0, r*0.22); ctx.lineTo(0, r*1.5);
      ctx.stroke();

      // massive hunched torso — broader and taller than before, real "boss" bulk
      ctx.beginPath();
      ctx.moveTo(-r*1.05, r*0.22);
      ctx.quadraticCurveTo(-r*1.35, -r*0.6, -r*0.5, -r*1.15);
      ctx.quadraticCurveTo(0, -r*1.4, r*0.5, -r*1.15);
      ctx.quadraticCurveTo(r*1.35, -r*0.6, r*1.05, r*0.22);
      ctx.quadraticCurveTo(0, r*0.48, -r*1.05, r*0.22);
      ctx.closePath();
      ctx.fillStyle = bodyCol; ctx.fill();
      ctx.strokeStyle = rimCol; ctx.lineWidth = 4;
      ctx.shadowColor = rimCol; ctx.shadowBlur = flash ? 4 : 20;
      ctx.stroke();
      ctx.shadowBlur = 0;

      // exposed ribcage plates guarding the chest core — reads as an armored, undead titan
      ctx.strokeStyle = 'rgba(20,10,8,0.8)'; ctx.lineWidth = r*0.05;
      ctx.beginPath();
      for (let rb=-2; rb<=2; rb++){
        const ry = -r*0.55 + rb*r*0.13;
        ctx.moveTo(-r*0.55, ry);
        ctx.quadraticCurveTo(0, ry+r*0.1, r*0.55, ry);
      }
      ctx.stroke();

      // jagged bone spikes running up the spine, over the shoulders
      ctx.fillStyle = '#e8e2d8';
      for (let sp=0; sp<4; sp++){
        const sy = -r*0.15 - sp*r*0.28;
        const sw = r*(0.16 - sp*0.015);
        ctx.beginPath();
        ctx.moveTo(-sw*0.5, sy); ctx.lineTo(sw*0.5, sy); ctx.lineTo(0, sy - r*0.32); ctx.closePath(); ctx.fill();
      }

      // colossal bat wings, spread wide with jagged bone claws at every strut tip
      function drawGuardianWing(sign){
        ctx.save();
        ctx.translate(sign*r*0.85, -r*0.75);
        ctx.scale(sign,1);
        const flap = Math.sin(performance.now()/500)*0.07;
        ctx.rotate(flap);
        ctx.beginPath();
        ctx.moveTo(0,0);
        ctx.quadraticCurveTo(r*0.7,-r*1.25, r*2.05,-r*1.1);
        ctx.quadraticCurveTo(r*1.6,-r*0.5, r*1.9,-r*0.05);
        ctx.quadraticCurveTo(r*1.25,-r*0.02, r*1.25,r*0.42);
        ctx.quadraticCurveTo(r*0.78,r*0.16, r*0.58,r*0.4);
        ctx.quadraticCurveTo(r*0.35,r*0.03, r*0.15,r*0.16);
        ctx.quadraticCurveTo(r*0.1,r*0.03, 0,0);
        ctx.closePath();
        ctx.fillStyle = flash ? 'rgba(255,255,255,0.85)' : 'rgba(18,4,9,0.94)';
        ctx.fill();
        ctx.strokeStyle = rimCol; ctx.lineWidth = 3;
        ctx.shadowColor = rimCol; ctx.shadowBlur = 16;
        ctx.stroke();
        ctx.shadowBlur = 0;
        // wing finger struts, each tipped with a bone claw hook
        const tips = [[r*2.05,-r*1.1],[r*1.9,-r*0.05],[r*1.25,r*0.42],[r*0.58,r*0.4]];
        ctx.strokeStyle = 'rgba(0,0,0,0.5)'; ctx.lineWidth = 1.6;
        ctx.beginPath();
        tips.forEach(function(pt){ ctx.moveTo(0,0); ctx.lineTo(pt[0],pt[1]); });
        ctx.stroke();
        ctx.fillStyle = '#e8e2d8';
        tips.forEach(function(pt){
          const ang = Math.atan2(pt[1],pt[0]);
          ctx.save(); ctx.translate(pt[0],pt[1]); ctx.rotate(ang);
          ctx.beginPath(); ctx.moveTo(0,-r*0.05); ctx.lineTo(r*0.16,0); ctx.lineTo(0,r*0.05); ctx.closePath(); ctx.fill();
          ctx.restore();
        });
        ctx.restore();
      }
      drawGuardianWing(-1);
      drawGuardianWing(1);

      // molten energy veins cracking across the torso
      ctx.strokeStyle = 'rgba(255,180,60,0.9)'; ctx.lineWidth = 2.4;
      ctx.shadowColor='rgba(255,150,50,0.95)'; ctx.shadowBlur=8;
      ctx.beginPath();
      ctx.moveTo(-r*0.5,-r*0.65); ctx.lineTo(-r*0.12,-r*0.15); ctx.lineTo(-r*0.42,r*0.18);
      ctx.moveTo(r*0.55,-r*0.75); ctx.lineTo(r*0.18,-r*0.25); ctx.lineTo(r*0.48,r*0.12);
      ctx.moveTo(0,-r*0.9); ctx.lineTo(0,-r*0.6);
      ctx.stroke();
      ctx.shadowBlur=0;

      // glowing exposed heart-core (weak point / power source), caged by curved bone ribs, pulses
      const pulse = 0.75+Math.sin(performance.now()/220)*0.25;
      ctx.fillStyle = `rgba(255,180,60,${0.55*pulse+0.3})`;
      ctx.shadowColor='rgba(255,160,50,1)'; ctx.shadowBlur=22*pulse;
      ctx.beginPath(); ctx.arc(0,-r*0.25,r*0.2,0,Math.PI*2); ctx.fill();
      ctx.shadowBlur=0;
      ctx.strokeStyle = '#d8cdb8'; ctx.lineWidth = r*0.035;
      [-1,1].forEach(function(side){
        ctx.beginPath();
        ctx.moveTo(side*r*0.06,-r*0.44); ctx.quadraticCurveTo(side*r*0.34,-r*0.25,side*r*0.06,-r*0.02);
        ctx.stroke();
      });

      // ridged abdominal muscle lines below the chest core
      ctx.strokeStyle = 'rgba(0,0,0,0.35)'; ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(-r*0.32,-r*0.02); ctx.lineTo(r*0.32,-r*0.02);
      ctx.moveTo(-r*0.26,r*0.14); ctx.lineTo(r*0.26,r*0.14);
      ctx.moveTo(0,-r*0.05); ctx.lineTo(0,r*0.2);
      ctx.stroke();

      // massive shoulders + arms, thick with bone-spiked forearms and four-claw hands
      ctx.fillStyle = bodyCol; ctx.strokeStyle = rimCol; ctx.lineWidth=3;
      const armSwing = Math.sin(performance.now()/450)*r*0.08;
      [-1,1].forEach(function(side){
        ctx.save(); ctx.translate(side*r*1.12,-r*0.4); ctx.rotate(side*0.38-side*armSwing*0.02);
        ctx.fillStyle = bodyCol;
        ctx.fillRect(-r*0.2,0,r*0.4,r*1.15); ctx.strokeRect(-r*0.2,0,r*0.4,r*1.15);
        // forearm spike
        ctx.fillStyle = '#e8e2d8';
        ctx.beginPath(); ctx.moveTo(side*r*0.2,r*0.5); ctx.lineTo(side*r*0.2+side*r*0.22,r*0.6); ctx.lineTo(side*r*0.2,r*0.72); ctx.closePath(); ctx.fill();
        // four-claw hand
        for(let c2=-2;c2<=1;c2++){ ctx.beginPath(); ctx.moveTo(c2*r*0.11-r*0.02, r*1.15); ctx.lineTo(c2*r*0.11+r*0.06, r*1.15); ctx.lineTo(c2*r*0.1+r*0.02, r*1.45); ctx.closePath(); ctx.fill(); }
        ctx.restore();
      });

      // colossal head with a crown of curved horns and a gaunt, skeletal face
      ctx.fillStyle = bodyCol;
      ctx.beginPath(); ctx.arc(0,-r*1.3,r*0.52,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle = rimCol; ctx.lineWidth=3;
      ctx.shadowColor=rimCol; ctx.shadowBlur=14; ctx.stroke(); ctx.shadowBlur=0;
      // brow ridge + deep sunken cheeks
      ctx.fillStyle = 'rgba(0,0,0,0.45)';
      ctx.beginPath(); ctx.ellipse(0,-r*1.42,r*0.44,r*0.13,0,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(-r*0.28,-r*1.18,r*0.12,r*0.18,0,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(r*0.28,-r*1.18,r*0.12,r*0.18,0,0,Math.PI*2); ctx.fill();
      // central crown horn, rising straight up like a monarch's spike
      ctx.fillStyle = '#241209';
      ctx.beginPath();
      ctx.moveTo(-r*0.12,-r*1.78); ctx.quadraticCurveTo(0,-r*2.6,r*0.12,-r*1.78);
      ctx.closePath(); ctx.fill();
      // pair of great curved horns sweeping up and outward, bigger and more twisted
      ctx.beginPath();
      ctx.moveTo(-r*0.38,-r*1.58);
      ctx.quadraticCurveTo(-r*1.05,-r*1.95,-r*0.75,-r*2.5);
      ctx.quadraticCurveTo(-r*0.6,-r*2.0,-r*0.16,-r*1.7);
      ctx.closePath(); ctx.fill();
      ctx.beginPath();
      ctx.moveTo(r*0.38,-r*1.58);
      ctx.quadraticCurveTo(r*1.05,-r*1.95,r*0.75,-r*2.5);
      ctx.quadraticCurveTo(r*0.6,-r*2.0,r*0.16,-r*1.7);
      ctx.closePath(); ctx.fill();
      // a second, smaller pair of horns flanking the outer ones — a full demon crown
      ctx.fillStyle = '#180b06';
      ctx.beginPath();
      ctx.moveTo(-r*0.58,-r*1.48); ctx.quadraticCurveTo(-r*1.32,-r*1.62,-r*1.08,-r*2.15); ctx.quadraticCurveTo(-r*0.98,-r*1.68,-r*0.65,-r*1.58);
      ctx.closePath(); ctx.fill();
      ctx.beginPath();
      ctx.moveTo(r*0.58,-r*1.48); ctx.quadraticCurveTo(r*1.32,-r*1.62,r*1.08,-r*2.15); ctx.quadraticCurveTo(r*0.98,-r*1.68,r*0.65,-r*1.58);
      ctx.closePath(); ctx.fill();
      // three glowing eyes — an extra brow-eye above the two main ones, more alien and wrong
      ctx.fillStyle = '#ff1a1a';
      ctx.shadowColor='rgba(255,20,20,1)'; ctx.shadowBlur=20;
      ctx.beginPath(); ctx.arc(-r*0.19,-r*1.33,r*0.1,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(r*0.19,-r*1.33,r*0.1,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(0,-r*1.56,r*0.065,0,Math.PI*2); ctx.fill();
      ctx.shadowBlur=0;
      // wide fanged mouth with jutting tusks and a jagged row of teeth across the open jaw
      ctx.fillStyle = '#0e0606';
      ctx.beginPath(); ctx.ellipse(0,-r*1.12,r*0.27,r*0.12,0,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#d8c98a';
      for(let ti=-3; ti<=3; ti++){
        const ttx = ti*r*0.07;
        const tth = (ti%2===0) ? r*0.1 : r*0.07;
        ctx.beginPath(); ctx.moveTo(ttx-r*0.028,-r*1.17); ctx.lineTo(ttx,-r*1.17+tth); ctx.lineTo(ttx+r*0.028,-r*1.17); ctx.closePath(); ctx.fill();
      }
      // lower tusks curling up outside the jaw
      ctx.beginPath(); ctx.moveTo(-r*0.24,-r*1.05); ctx.quadraticCurveTo(-r*0.34,-r*0.9,-r*0.2,-r*0.82); ctx.lineTo(-r*0.17,-r*0.98); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(r*0.24,-r*1.05); ctx.quadraticCurveTo(r*0.34,-r*0.9,r*0.2,-r*0.82); ctx.lineTo(r*0.17,-r*0.98); ctx.closePath(); ctx.fill();
      } // end danav body (skins 1-4)
