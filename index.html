<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Battle Drop</title>
<!-- v125: Add-to-Home-Screen / PWA support -->
<meta name="theme-color" content="#03060a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Battle Drop">
<script>
(function(){
  // Icon draw (canvas) — koi alag image file nahi chahiye
  function makeIcon(size){
    var c=document.createElement('canvas'); c.width=c.height=size; var x=c.getContext('2d');
    var g=x.createRadialGradient(size/2,size*0.42,size*0.05,size/2,size/2,size*0.75);
    g.addColorStop(0,'#0e2a3a'); g.addColorStop(1,'#03060a');
    x.fillStyle=g; x.fillRect(0,0,size,size);
    x.strokeStyle='#19e6ff'; x.lineWidth=size*0.03; x.shadowColor='#19e6ff'; x.shadowBlur=size*0.06;
    x.beginPath(); x.arc(size/2,size/2,size*0.36,0,Math.PI*2); x.stroke();
    x.beginPath(); x.moveTo(size*0.5,size*0.18); x.lineTo(size*0.5,size*0.82); x.moveTo(size*0.18,size*0.5); x.lineTo(size*0.82,size*0.5); x.stroke();
    x.shadowBlur=size*0.05; x.fillStyle='#ff3a2a';
    x.beginPath(); x.arc(size/2,size/2,size*0.07,0,Math.PI*2); x.fill();
    x.shadowBlur=0; x.fillStyle='#e8f8ff'; x.font='bold '+Math.round(size*0.13)+'px Arial'; x.textAlign='center';
    x.fillText('BATTLE DROP',size/2,size*0.93);
    return c.toDataURL('image/png');
  }
  try{
    var i180=makeIcon(180), i192=makeIcon(192), i512=makeIcon(512);
    var l=document.createElement('link'); l.rel='apple-touch-icon'; l.href=i180; document.head.appendChild(l);
    var f=document.createElement('link'); f.rel='icon'; f.href=i192; document.head.appendChild(f);
    var base=location.href.split('#')[0].split('?')[0];
    var man={name:'Battle Drop',short_name:'Battle Drop',start_url:base,scope:base.replace(/[^\/]*$/,''),display:'fullscreen',
      background_color:'#03060a',theme_color:'#03060a',
      icons:[{src:i192,sizes:'192x192',type:'image/png',purpose:'any maskable'},{src:i512,sizes:'512x512',type:'image/png',purpose:'any maskable'}]};
    var m=document.createElement('link'); m.rel='manifest';
    m.href=URL.createObjectURL(new Blob([JSON.stringify(man)],{type:'application/manifest+json'}));
    document.head.appendChild(m);
  }catch(e){}
  // Offline support: sw.js file same folder mein ho tabhi register hoga (https ya localhost pe)
  if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost')){
    window.addEventListener('load',function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
  }
})();
</script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; user-select:none; -webkit-user-select:none; touch-action:none; }
  html, body { width:100%; height:100%; overflow:hidden; background:#03060a; font-family:'Segoe UI', Arial, sans-serif; }
  #gameContainer { position:relative; width:100%; height:100%; }
  canvas { position:absolute; top:0; left:0; width:100%; height:100%; display:block; }

  #scanlines {
    position:absolute; top:0; left:0; width:100%; height:100%; z-index:2; pointer-events:none;
    background:repeating-linear-gradient(rgba(0,0,0,0) 0px, rgba(0,0,0,0) 2px, rgba(0,255,255,0.025) 3px, rgba(0,0,0,0) 4px);
    mix-blend-mode:overlay;
  }
  #vignette {
    position:absolute; top:0; left:0; width:100%; height:100%; z-index:2; pointer-events:none;
    background:radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,5,15,0.65) 100%);
    box-shadow: inset 0 0 0 1px rgba(0,255,255,0.04);
  }

  /* Compact bottom HUD — HP, score, mute — centered between the shield and knife buttons */
  #bottomHud {
    position:absolute; left:calc(50% - 33px); transform:translateX(-50%); bottom:34px; width:78px; z-index:12;
    display:none; flex-direction:column; align-items:stretch; gap:6px;
    pointer-events:none; background:rgba(6,14,22,0.5); border:1px solid rgba(80,220,255,0.3);
    border-radius:7px; padding:10px 4px; backdrop-filter: blur(4px);
    box-shadow:0 0 8px rgba(60,200,255,0.12);
  }
  
  /* HP Only Display - centered */
  #hpOnlyContainer {
    position:absolute; left:50%; bottom:34px; z-index:12;
    transform:translateX(-50%); display:flex; align-items:center; justify-content:center; gap:3px;
    pointer-events:none; padding:6px 10px; background:rgba(6,14,22,0.5);
    border:1px solid rgba(80,220,255,0.3); border-radius:7px;
    backdrop-filter: blur(4px); box-shadow:0 0 8px rgba(60,200,255,0.12);
    margin:0 auto;
  }
  #hpOnlyBar { width:70px; height:8px; }

  /* Player name tag — fixed HUD label just under the centered HP pill,
     independent of the officer sprite so it always reads the same way */
  #playerNameTag {
    position:absolute; left:50%; bottom:14px; z-index:12;
    transform:translateX(-50%); pointer-events:none;
    font:bold 9px Segoe UI, Arial; letter-spacing:1px; color:#eaf2ff;
    background:rgba(8,14,10,0.75); border:1px solid rgba(255,214,110,0.6);
    border-radius:4px; padding:2px 8px; text-shadow:0 0 2px rgba(0,0,0,0.9);
    white-space:nowrap;
  }
  
  /* Best Score Flash Card */
  #bestScoreFlash {
    position:absolute; top:50%; left:50%; transform:translate(-50%, -50%);
    z-index:18; display:none; padding:24px 40px; background:rgba(6,14,22,0.85);
    border:2px solid rgba(255,215,110,0.6); border-radius:12px;
    text-align:center; backdrop-filter: blur(6px);
    box-shadow:0 0 40px rgba(255,215,110,0.4);
  }
  #bestScoreFlash h3 {
    color:#ffd76e; font-size:28px; font-weight:800; letter-spacing:2px;
    text-shadow:0 0 16px rgba(255,190,60,0.85); margin-bottom:16px;
    animation:bestFlash 0.6s ease-out;
  }
  #bestScoreFlash .score-value {
    color:#00eaff; font-size:44px; font-weight:800;
    text-shadow:0 0 20px rgba(0,234,255,0.8); margin-bottom:20px;
    animation:scoreScale 0.5s ease-out;
  }
  #bestScoreFlash .ok-btn {
    background:linear-gradient(135deg,#ffd76e,#ffb54a); color:#03060a;
    border:none; padding:12px 32px; font-size:16px; font-weight:800;
    border-radius:25px; cursor:pointer; pointer-events:auto;

    transition:all 0.2s;
  }
  #bestScoreFlash .ok-btn:active { transform:scale(0.95); }
  @keyframes bestFlash { 
    0%{ opacity:0; transform:scale(0.8); } 
    50%{ opacity:1; transform:scale(1.05); } 
    100%{ opacity:1; transform:scale(1); } 
  }
  @keyframes scoreScale { 
    0%{ opacity:0; transform:scale(0.5); } 
    100%{ opacity:1; transform:scale(1); } 
  }
  
  #hpRow { display:flex; align-items:center; gap:5px; }
  #muteBtn {
    pointer-events:auto; flex-shrink:0;
    background:rgba(10,14,20,0.6); border:1px solid rgba(255,255,255,0.15);
    border-radius:6px; width:17px; height:17px; color:#eaf2ff; font-size:9px;

  #pauseBtn {
    position:absolute; left:14px; top:14px; z-index:15; pointer-events:auto;

    border-radius:8px; width:38px; height:38px; color:#eaf2ff; font-size:16px;
    display:flex; align-items:center; justify-content:center;

  #pausedLabel {
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);

  #healthBarBg { flex:1; height:6px; background:rgba(255,255,255,0.08); border-radius:5px; overflow:hidden; border:1px solid rgba(255,70,70,0.4); box-shadow:0 0 5px rgba(255,40,40,0.25); }
  #healthBarFill { height:100%; width:100%; background:linear-gradient(90deg,#ff1f3d,#ff7a54); box-shadow:0 0 6px rgba(255,30,50,0.85); transition:width 0.15s ease; }
  #scoreRow { display:flex; flex-direction:column; gap:1px; }
  #scoreBox { font-size:9px; font-weight:700; color:#eaf9ff; text-shadow:0 0 5px rgba(0,234,255,0.5); white-space:nowrap; }
  #waveBox { font-size:6.5px; opacity:0.9; letter-spacing:0.5px; color:#7CFFEB; white-space:nowrap; }
  #bestRow { display:flex; justify-content:flex-start; }
  #bestBox { font-size:7px; font-weight:700; letter-spacing:0.4px; color:#ffd76e; text-shadow:0 0 5px rgba(255,190,60,0.5); white-space:nowrap; }
  #newBestBadge {

  }
  @keyframes bestPulse { 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.08); } }

  #bossBarWrap {
    position:absolute; top:56px; left:50%; transform:translateX(-50%);
    width:280px; z-index:8; pointer-events:none; text-align:center;
  }
  #bossBarWrap { display:none !important; } /* replaced by the small pill drawn above the guardian's head */
  #bossName { color:#ff6ec7; font-size:12px; font-weight:700; letter-spacing:1.5px; margin-bottom:3px; text-shadow:0 0 8px rgba(255,60,150,0.9); }
  #bossHpBg { height:13px; background:rgba(255,255,255,0.08); border:1px solid rgba(255,90,150,0.5); border-radius:7px; overflow:hidden; box-shadow:0 0 10px rgba(255,60,150,0.3); }

  /* Joystick */
  #joystickZone {
    position:absolute; left:0; bottom:0; width:45%; height:55%; z-index:10;
  }
  #joyBase {
    position:absolute; width:110px; height:110px; border-radius:50%;
    background:rgba(255,255,255,0.08); border:2px solid rgba(255,255,255,0.25);
    display:none; align-items:center; justify-content:center;
  }
  #joyStick {
    position:absolute; width:50px; height:50px; border-radius:50%;
    background:rgba(120,200,255,0.55); border:2px solid rgba(255,255,255,0.6);

  /* Fire button */
  #fireZone {
    position:absolute; right:0; bottom:0; width:45%; height:55%; z-index:10;

  #knifeBtn {

  #knifeBtn .kfCount { font-size:6.5px; font-weight:700; margin-top:1px; }
  #knifeBtn.active { transform:scale(0.92); box-shadow:0 0 28px rgba(255,40,60,0.95); }
  #knifeBtn.depleted { opacity:0.35; }

  /* Overlays */
  .overlay {
    position:absolute; top:0; left:0; width:100%; height:100%;
    background:#070911; display:flex; flex-direction:column;
    align-items:center; justify-content:center; z-index:50; text-align:center; padding:24px;
  }
  .hidden { display:none !important; }
  .overlay h1 { color:#7CFFEB; font-size:36px; letter-spacing:3px; margin-bottom:8px; text-shadow:0 0 24px rgba(0,234,255,0.8); }
  .overlay h2 { color:#ff6ec7; font-size:30px; margin-bottom:6px; text-shadow:0 0 18px rgba(255,60,150,0.7); }
  .overlay p { color:#b8d4e4; font-size:15px; margin-bottom:24px; max-width:340px; line-height:1.5; }
  .btn {
    background:linear-gradient(135deg,#00eaff,#2f6fe0); color:#00131a; border:none;
    padding:16px 42px; font-size:18px; font-weight:800; border-radius:30px;
    letter-spacing:1px; box-shadow:0 0 26px rgba(0,234,255,0.55); pointer-events:auto;
  }
  .btn:active { transform:scale(0.96); }
  /* v134: start screen = just the title + Play, sized to fit both portrait and landscape */
  #startOverlay h1 { font-size:clamp(26px, min(8vw, 13vh), 52px); margin-bottom:clamp(18px, 6vh, 34px); line-height:1.15; }
  #startOverlay .btn { padding:clamp(12px, 3.4vh, 18px) clamp(38px, 8vw, 64px); font-size:clamp(17px, 3.6vh, 22px); }
  #finalStats { color:#eaf9ff; font-size:16px; margin-bottom:26px; }
  #finalStats span { color:#00eaff; font-weight:700; }

<body>
<div id="gameContainer">
  <canvas id="game"></canvas>
  <div id="scanlines"></div>

  <button id="pauseBtn" aria-label="Pause game">⏸</button>

  <div id="bossBarWrap" class="hidden">
    <div id="bossName">GATE GUARDIAN</div>
    <div id="bossHpBg"><div id="bossHpFill"></div></div>
  </div>

  <div id="bottomHud">
    <div id="hpRow">
      <button id="muteBtn" aria-label="Toggle sound">🔊</button>
      <div id="healthBarBg"><div id="healthBarFill"></div></div>
    </div>
    <div id="scoreRow">
      <div id="scoreBox">SCORE 0</div>
      <div id="waveBox">GOTHIC CITY · ZONE 1</div>
    </div>
    <div id="bestRow"><div id="bestBox">BEST 0</div></div>
  </div>

  <!-- Centered HP Only Display -->
  <div id="hpOnlyContainer">
    <div id="healthBarBg" style="width:70px; height:8px;"><div id="healthBarFill" style="width:100%;"></div></div>
  </div>
  <div id="playerNameTag">MAJOR RUDRA</div>


  <!-- Best Score Flash Card -->
  <div id="bestScoreFlash">
    <h3>🏆 BEST SCORE 🏆</h3>
    <div class="score-value" id="bestScoreValue">0</div>
    <button class="ok-btn" id="bestScoreOkBtn">OK</button>
  </div>

  <div id="joystickZone">
    <div id="joyBase"><div id="joyStick"></div></div>
  </div>
  <div id="fireZone">
    <div id="fireBtn">FIRE</div>
  </div>
  <button id="shieldBtn">SHIELD</button>
  <button id="chakraBtn" class="hidden" aria-label="Fire chakra">
    <svg viewBox="0 0 40 40">
      <circle cx="20" cy="20" r="16" fill="none" stroke="#2a1a00" stroke-width="2.6"/>
      <line x1="4" y1="20" x2="36" y2="20" stroke="#2a1a00" stroke-width="2.6"/>
      <line x1="12" y1="6.14" x2="28" y2="33.86" stroke="#2a1a00" stroke-width="2.6"/>
      <line x1="28" y1="6.14" x2="12" y2="33.86" stroke="#2a1a00" stroke-width="2.6"/>
      <circle cx="20" cy="20" r="5" fill="#2a1a00"/>
    </svg>
  </button>
  <button id="knifeBtn">🔪 KNIFE<span class="kfCount">2000</span></button>

  <div id="startOverlay" class="overlay">
    <h1>Go for the Mission</h1>
    <button class="btn" id="startBtn">Play</button>
  </div>

  <div id="gameOverOverlay" class="overlay hidden">
    <h2>YOU WERE ELIMINATED</h2>
    <div id="newBestBadge" class="hidden">🏆 NEW BEST SCORE!</div>
    <div id="finalStats">Score: <span id="finalScore">0</span> &nbsp;|&nbsp; Reached: <span id="finalWave">Gothic City Zone 1</span></div>
    <button class="btn" id="restartBtn">DROP AGAIN</button>
  </div>
</div>


<script>
(function(){
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  let W, H, DPR;
  // wide-angle camera: everything drawn in world space is scaled down by ZOOM so the officer
  // can see much further left/right (and up/down) instead of just the road straight ahead.
  // VW/VH are the actual world-unit width/height that fits on screen at that zoom level —
  // every camera-boundary / visible-range calculation below uses VW/VH (not the raw screen
  // pixel W/H) so the extra peripheral view actually gets populated with road, trees, gates,
  // enemies etc. instead of being culled away as "off-screen".
  // v126: LANDSCAPE FIX — zoom is no longer a fixed 0.55. On a short (landscape) screen the world height that fits
  // (H/ZOOM) was only ~700 units, so the cobra's head, the gates and the guardians were cut off at the top. Now ZOOM
  // adapts to the screen height: normal play keeps at least VH_NORMAL world-units of height in view, and while a tall
  // encounter is on screen (cobra / gate / guardian) it eases out to at least VH_TALL. Portrait phones are unchanged (0.55).
  const ZOOM_MAX = 0.55, VH_NORMAL = 560, VH_TALL = 1000; // v129: normal play back to the original size (v126-128 zoomed out too far and made everything tiny)
  let ZOOM = ZOOM_MAX;
  let zoomTall = false;
  // how much bigger the officer (and his shield/knife rings) is drawn relative to the
  // zoomed-out world — 1/ZOOM would restore his exact pre-wide-angle size; a bit less than
  // that keeps him large but not oversized against the (also enlarged) buildings
  let PLAYER_SIZE_MULT = (1/ZOOM) * 0.82;
  function zoomTarget(){ return Math.min(ZOOM_MAX, H / (zoomTall ? VH_TALL : VH_NORMAL)); }
  // officer keeps roughly the same on-screen size (softened a little when zoomed out further so he doesn't dwarf the enemies)
  function applyPlayerSize(){ PLAYER_SIZE_MULT = 0.82 * Math.pow(ZOOM/ZOOM_MAX, 0.3) / ZOOM; }
  let psm = PLAYER_SIZE_MULT; // v119: live officer size — grows a little while the view is pulled back so he stays easy to see
  let VW, VH;
  let viewZoom = ZOOM; // v119: live zoom — equals ZOOM normally; pulls back a little only while the gate is 'grounded' and the officer retreats far

  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    ZOOM = zoomTarget(); applyPlayerSize(); viewZoom = ZOOM; psm = PLAYER_SIZE_MULT; // v126: re-fit zoom on rotate/resize
    VW = W / viewZoom; VH = H / viewZoom;
    canvas.width = W * DPR; canvas.height = H * DPR;
    canvas.style.width = W+'px'; canvas.style.height = H+'px';
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------- Sound Engine (synthesized, no audio files needed) ----------
  const SFX = (function(){
    let ctx = null;
    let muted = false;

    function ensureCtx(){
      if (!ctx){
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        ctx = new AC();
      }
      if (ctx.state === 'suspended') ctx.resume();
      return ctx;
    }

    function tone(freq, dur, type, vol, freqEnd, delay){
      if (muted) return;
      const c = ensureCtx(); if (!c) return;
      delay = delay || 0;
      const now = c.currentTime + delay;
      const osc = c.createOscillator();
      osc.type = type || 'sine';
      osc.frequency.setValueAtTime(freq, now);
      if (freqEnd != null) osc.frequency.exponentialRampToValueAtTime(Math.max(freqEnd,1), now+dur);
      const g = c.createGain();
      g.gain.setValueAtTime(vol, now);
      g.gain.exponentialRampToValueAtTime(0.001, now+dur);
      osc.connect(g); g.connect(c.destination);
      osc.start(now); osc.stop(now+dur+0.02);
    }

    function noiseBurst(dur, vol, filterFreq, delay, freqEnd){
      if (muted) return;
      const c = ensureCtx(); if (!c) return;
      delay = delay || 0;
      const now = c.currentTime + delay;
      const size = Math.max(1, Math.floor(c.sampleRate * dur));
      const buffer = c.createBuffer(1, size, c.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i=0;i<size;i++) data[i] = (Math.random()*2-1) * Math.pow(1 - i/size, 0.7);
      const src = c.createBufferSource();
      src.buffer = buffer;
      const filter = c.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(filterFreq || 2000, now);
      if (freqEnd != null) filter.frequency.exponentialRampToValueAtTime(Math.max(freqEnd,60), now+dur);
      const g = c.createGain();
      g.gain.setValueAtTime(vol, now);
      g.gain.exponentialRampToValueAtTime(0.001, now+dur);
      src.connect(filter); filter.connect(g); g.connect(c.destination);
      src.start(now);
    }

    // Punchy explosion: sub-bass thump + filtered noise sweep + brief crackle
    function boom(vol, delay){
      if (muted) return;
      const c = ensureCtx(); if (!c) return;
      delay = delay || 0;
      vol = vol == null ? 1 : vol;
      const now = c.currentTime + delay;
      // sub-bass thump (the "punch")
      const thump = c.createOscillator();
      thump.type = 'sine';
      thump.frequency.setValueAtTime(150, now);
      thump.frequency.exponentialRampToValueAtTime(35, now+0.22);
      const thumpGain = c.createGain();
      thumpGain.gain.setValueAtTime(0.55*vol, now);
      thumpGain.gain.exponentialRampToValueAtTime(0.001, now+0.28);
      thump.connect(thumpGain); thumpGain.connect(c.destination);
      thump.start(now); thump.stop(now+0.3);
      // mid crack (attack transient)
      const crack = c.createOscillator();
      crack.type = 'square';
      crack.frequency.setValueAtTime(220, now);
      crack.frequency.exponentialRampToValueAtTime(70, now+0.05);
      const crackGain = c.createGain();
      crackGain.gain.setValueAtTime(0.3*vol, now);
      crackGain.gain.exponentialRampToValueAtTime(0.001, now+0.07);
      crack.connect(crackGain); crackGain.connect(c.destination);
      crack.start(now); crack.stop(now+0.08);
      // noise body (the "burst")
      noiseBurst(0.35, 0.5*vol, 3500, delay, 150);
      // sizzling tail
      noiseBurst(0.5, 0.16*vol, 900, delay+0.03, 200);
    }

    // ---------- Desert tornado audio: a deep, layered roar plus a sustained howling
    // wind loop that runs the whole time it's actively chasing ----------
    let windSrc = null, windGain = null, windFilter = null, windLFO = null;
    let windRumbleOsc = null, windRumbleGain = null;
    function windLoopStart(){
      if (muted || windSrc) return;
      const c = ensureCtx(); if (!c) return;
      const bufSize = c.sampleRate * 2;
      const buffer = c.createBuffer(1, bufSize, c.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i=0;i<bufSize;i++) data[i] = Math.random()*2-1;
      windSrc = c.createBufferSource();
      windSrc.buffer = buffer; windSrc.loop = true;
      windFilter = c.createBiquadFilter();
      windFilter.type = 'bandpass';
      windFilter.frequency.value = 300;
      windFilter.Q.value = 0.8;
      windGain = c.createGain();
      windGain.gain.setValueAtTime(0.0001, c.currentTime);
      windGain.gain.exponentialRampToValueAtTime(0.5, c.currentTime+0.7);
      windLFO = c.createOscillator();
      windLFO.frequency.value = 0.5;
      const lfoGain = c.createGain(); lfoGain.gain.value = 150;
      windLFO.connect(lfoGain); lfoGain.connect(windFilter.frequency);
      windLFO.start();
      windSrc.connect(windFilter); windFilter.connect(windGain); windGain.connect(c.destination);
      windSrc.start();
      // deep rumbling drone underneath the wind hiss, for real weight/power
      windRumbleOsc = c.createOscillator();
      windRumbleOsc.type = 'sawtooth';
      windRumbleOsc.frequency.value = 42;
      const rumbleFilter = c.createBiquadFilter();
      rumbleFilter.type = 'lowpass'; rumbleFilter.frequency.value = 130;
      windRumbleGain = c.createGain();
      windRumbleGain.gain.setValueAtTime(0.0001, c.currentTime);
      windRumbleGain.gain.exponentialRampToValueAtTime(0.3, c.currentTime+0.9);
      windRumbleOsc.connect(rumbleFilter); rumbleFilter.connect(windRumbleGain); windRumbleGain.connect(c.destination);
      windRumbleOsc.start();
    }
    function windLoopStop(){
      if (!windSrc) return;
      const c = ensureCtx();
      const now = c ? c.currentTime : 0;
      try {
        windGain.gain.cancelScheduledValues(now);
        windGain.gain.setValueAtTime(Math.max(0.001,windGain.gain.value), now);
        windGain.gain.exponentialRampToValueAtTime(0.001, now+0.45);
        windRumbleGain.gain.cancelScheduledValues(now);
        windRumbleGain.gain.setValueAtTime(Math.max(0.001,windRumbleGain.gain.value), now);
        windRumbleGain.gain.exponentialRampToValueAtTime(0.001, now+0.45);
      } catch(e){}
      const srcRef = windSrc, lfoRef = windLFO, rumbleRef = windRumbleOsc;
      setTimeout(function(){
        try{srcRef.stop();}catch(e){}
        try{lfoRef.stop();}catch(e){}
        try{rumbleRef.stop();}catch(e){}
      }, 500);
      windSrc = null; windFilter = null; windGain = null; windLFO = null;
      windRumbleOsc = null; windRumbleGain = null;
    }
    function tornadoRoar(vol){
      if (muted) return;
      vol = vol == null ? 1 : vol;
      const c = ensureCtx(); if (!c) return;
      const now = c.currentTime;
      // distorted sub-bass core — the "power" of the beast, driven through a tanh shaper
      const sub = c.createOscillator();
      sub.type = 'sawtooth';
      sub.frequency.setValueAtTime(95, now);
      sub.frequency.exponentialRampToValueAtTime(24, now+1.3);
      const shaper = c.createWaveShaper();
      const curve = new Float32Array(256);
      for (let i=0;i<256;i++){ const x = i/128-1; curve[i] = Math.tanh(x*4.2); }
      shaper.curve = curve;
      const subGain = c.createGain();
      subGain.gain.setValueAtTime(0.001, now);
      subGain.gain.exponentialRampToValueAtTime(0.75*vol, now+0.08);
      subGain.gain.exponentialRampToValueAtTime(0.001, now+1.3);
      sub.connect(shaper); shaper.connect(subGain); subGain.connect(c.destination);
      sub.start(now); sub.stop(now+1.35);
      // growling mid layer with a fast wobble for a beastly, unstable snarl
      const growl = c.createOscillator();
      growl.type = 'sawtooth';
      growl.frequency.setValueAtTime(150, now);
      growl.frequency.exponentialRampToValueAtTime(58, now+1.0);
      const wobble = c.createOscillator();
      wobble.frequency.value = 7.5;
      const wobbleGain = c.createGain(); wobbleGain.gain.value = 20;
      wobble.connect(wobbleGain); wobbleGain.connect(growl.frequency);
      wobble.start(now); wobble.stop(now+1.0);
      const growlFilter = c.createBiquadFilter();
      growlFilter.type = 'lowpass'; growlFilter.frequency.value = 550;
      const growlGain = c.createGain();
      growlGain.gain.setValueAtTime(0.001, now);
      growlGain.gain.exponentialRampToValueAtTime(0.5*vol, now+0.1);
      growlGain.gain.exponentialRampToValueAtTime(0.001, now+1.0);
      growl.connect(growlFilter); growlFilter.connect(growlGain); growlGain.connect(c.destination);
      growl.start(now); growl.stop(now+1.05);
      // roaring wind/noise sweep — the whoosh, plus a bit of high crackle on top
      noiseBurst(1.1, 0.65*vol, 2600, 0, 200);
      noiseBurst(0.6, 0.38*vol, 1400, 0.05, 300);
      noiseBurst(0.3, 0.22*vol, 4200, 0.02, 900);
      // a couple of weighty low thumps to seat the power
      const thump = c.createOscillator();
      thump.type = 'sine';
      thump.frequency.setValueAtTime(70, now);
      thump.frequency.exponentialRampToValueAtTime(28, now+0.3);
      const thumpGain = c.createGain();
      thumpGain.gain.setValueAtTime(0.55*vol, now);
      thumpGain.gain.exponentialRampToValueAtTime(0.001, now+0.35);
      thump.connect(thumpGain); thumpGain.connect(c.destination);
      thump.start(now); thump.stop(now+0.4);
    }

    // ---------- Desert gunship rotor: discrete percussive blade thumps ("dag dag dag"),
    // timed to match the reference clip's rotor rate (~14 thumps/sec), each thump = a low
    // body knock plus a sharp higher blade-slap crack, over a quiet engine drone ----------
    let heliEngineOsc = null, heliEngineGain = null, heliInterval = null;
    function heliThump(){
      const c = ensureCtx(); if (!c || muted) return;
      const t = c.currentTime;
      const o1 = c.createOscillator();
      o1.type = 'triangle';
      o1.frequency.setValueAtTime(58, t);
      o1.frequency.exponentialRampToValueAtTime(38, t+0.05);
      const g1 = c.createGain();
      g1.gain.setValueAtTime(0.38, t);
      g1.gain.exponentialRampToValueAtTime(0.001, t+0.09);
      o1.connect(g1); g1.connect(c.destination);
      o1.start(t); o1.stop(t+0.1);
      const o2 = c.createOscillator();
      o2.type = 'square';
      o2.frequency.setValueAtTime(175, t);
      const g2 = c.createGain();
      g2.gain.setValueAtTime(0.11, t);
      g2.gain.exponentialRampToValueAtTime(0.001, t+0.035);
      o2.connect(g2); g2.connect(c.destination);
      o2.start(t); o2.stop(t+0.04);
    }
    function heliRotorStart(){
      if (muted || heliInterval) return;
      const c = ensureCtx(); if (!c) return;
      heliThump();
      heliInterval = setInterval(heliThump, 70); // ~14/sec, matches the reference clip's rotor thump rate
      heliEngineOsc = c.createOscillator();
      heliEngineOsc.type = 'sawtooth';
      heliEngineOsc.frequency.value = 44;
      heliEngineGain = c.createGain();
      heliEngineGain.gain.setValueAtTime(0.0001, c.currentTime);
      heliEngineGain.gain.exponentialRampToValueAtTime(0.07, c.currentTime+0.5);
      heliEngineOsc.connect(heliEngineGain); heliEngineGain.connect(c.destination);
      heliEngineOsc.start();
    }
    function heliRotorStop(){
      if (!heliInterval && !heliEngineOsc) return;
      if (heliInterval){ clearInterval(heliInterval); heliInterval = null; }
      const c = ensureCtx();
      const now = c ? c.currentTime : 0;
      try {
        heliEngineGain.gain.cancelScheduledValues(now);
        heliEngineGain.gain.setValueAtTime(Math.max(0.001,heliEngineGain.gain.value), now);
        heliEngineGain.gain.exponentialRampToValueAtTime(0.001, now+0.3);
      } catch(e){}
      const engRef = heliEngineOsc;
      setTimeout(function(){ try{engRef.stop();}catch(e){} }, 350);
      heliEngineOsc = null; heliEngineGain = null;
    }

    return {
      unlock(){ ensureCtx(); },
      toggleMuted(){ muted = !muted; return muted; },
      isMuted(){ return muted; },
      windLoopStart, windLoopStop, tornadoRoar, boom, heliRotorStart, heliRotorStop,
      shoot(weapon){
        if (weapon === 'shotgun'){ tone(140,0.12,'square',0.22,55); noiseBurst(0.1,0.22,2200); }
        else if (weapon === 'smg'){ tone(300,0.05,'square',0.12,150); }
        else if (weapon === 'rifle'){ tone(400,0.07,'sawtooth',0.18,130); }
        else if (weapon === 'missile'){ tone(110,0.22,'sawtooth',0.32,45); noiseBurst(0.22,0.24,1800,0,300); }
        else if (weapon === 'rocket'){ tone(100,0.26,'sawtooth',0.36,40); noiseBurst(0.26,0.3,1600,0,260); }
        else if (weapon === 'burst13'){
          // Heavier rapid-fire crack: a short low-end pop underneath the snap gives each
          // of the 13 rounds real body, so a held trigger reads as "dan dan dan dan"
          // gunfire instead of a thin zap.
          tone(85,0.045,'sine',0.22,45);
          tone(300,0.055,'square',0.16,130);
          noiseBurst(0.055,0.13,2800,0,700);
        }
        else { tone(340,0.08,'square',0.18,140); }
      },
      hit(){ noiseBurst(0.07,0.16,3200,0,1200); },
      kill(tough){ boom(tough ? 1.35 : 1); },
      arrowWhoosh(){
        // fiery arrow launch — a fast descending whoosh with a bit of crackle riding it
        noiseBurst(0.22, 0.15, 3200, 0, 700);
        tone(650, 0.16, 'sine', 0.06, 180);
      },
      arrowBreak(){ boom(0.55); }, // small punchy blast when a shot arrow is destroyed mid-air
      hurt(){ tone(160,0.18,'sawtooth',0.26,55); noiseBurst(0.15,0.18,800); },
      enemyShoot(){ tone(190,0.06,'square',0.09,90); },
      pickup(){ tone(520,0.08,'sine',0.2,900); tone(720,0.1,'sine',0.18,1100,0.06); },
      waveStart(){ tone(200,0.14,'sine',0.15,420); tone(200,0.14,'sine',0.15,420,0.12); },
      gameOver(){ tone(300,0.3,'sawtooth',0.2,80); tone(200,0.4,'sawtooth',0.18,50,0.15); },
      click(){ tone(600,0.05,'sine',0.15,800); },
      megaBoom(){
        // huge layered blast for the tank's final destruction — two staggered booms plus a
        // deep sub-bass rumble tail, much louder/heavier than a regular kill()
        boom(1.9);
        boom(1.1, 0.09);
        tone(42, 1.0, 'sine', 0.55, 18, 0.03);
      },
      roar(delay){
        // deep guttural rumble to give the taunt weight and menace
        delay = delay || 0;
        tone(85,0.55,'sawtooth',0.4,32,delay);
        tone(55,0.65,'sine',0.32,22,delay+0.04);
        noiseBurst(0.45,0.28,650,delay,140);
      },
      demonLaugh(){
        // menacing "ha-ha-ha-ha" — built from oscillators (no recorded voice available):
        // a low guttural pulse plus a dry noise chuff on each syllable, pitch dipping every hit
        for (let i=0;i<4;i++){
          const t = i*0.17;
          tone(130 - i*8, 0.12, 'sawtooth', 0.36, 65, t);
          tone(80 - i*5, 0.14, 'sine', 0.24, 40, t+0.015);
          noiseBurst(0.09, 0.18, 900, t, 250);
        }
      },
      giantLaugh(pitch, delay){
        // solid, heavy "HA-HA-HA-HA-HA" for a giant's landing — five booming syllables, each with a
        // gutter-growl body that drops in pitch, a chesty square-wave edge, sub-bass weight and a
        // breathy "h" chuff, then a long hard exhale rumble. pitch < 1 = deeper (bigger) giant.
        pitch = pitch || 1; delay = delay || 0;
        for (let i=0;i<5;i++){
          const t = delay + i*0.24, f = (118 - i*7)*pitch;
          tone(f, 0.2, 'sawtooth', 0.5, f*0.5, t);
          tone(f*2.02, 0.16, 'square', 0.16, f*1.1, t);
          tone(f*0.5, 0.26, 'sine', 0.42, f*0.3, t+0.01);
          noiseBurst(0.13, 0.24, 1100, t, 300);
        }
        tone(70*pitch, 0.6, 'sawtooth', 0.3, 30, delay + 5*0.24);
        noiseBurst(0.4, 0.2, 700, delay + 5*0.24, 150);
      },
      groundCrack(){
        // earth splitting open: a deep rolling sub-bass rumble under a dry, crackling
        // noise burst that stutters like rock fracturing — sustained a bit longer than a
        // regular boom() so it reads as the ground itself tearing, not a single hit
        tone(48, 1.3, 'sine', 0.5, 24);
        tone(70, 0.9, 'sawtooth', 0.28, 30, 0.05);
        noiseBurst(0.5, 0.32, 1400, 0, 200);
        for (let i=0;i<5;i++){
          noiseBurst(0.08, 0.14, 2600, 0.08 + i*0.11, 500);
        }
      },
      cobraHiss(){
        // loud snake hiss for the cobra's attack telegraph — two layered bandpass-noise
        // bands (a bright top "sss" + a rounder mid rasp) instead of one flat filtered
        // sweep, so it reads as an organic exhale rather than pure static, plus a real
        // delay/feedback echo tail so it audibly repeats and fades over ~1.5-2s instead
        // of cutting off dead
        if (muted) return;
        const c = ensureCtx(); if (!c) return;
        const now = c.currentTime;
        const dur = 0.9;
        const size = Math.floor(c.sampleRate * dur);
        const buffer = c.createBuffer(1, size, c.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i=0;i<size;i++) data[i] = Math.random()*2-1;

        const master = c.createGain();
        master.gain.setValueAtTime(1, now);
        master.connect(c.destination);

        // echo send — delay + feedback loop with a lowpass in the loop so each repeat
        // is a touch darker/softer than the last, the way a real hiss trails off
        // echoing down a corridor
        const delay = c.createDelay(1.0);
        delay.delayTime.value = 0.17;
        const feedback = c.createGain();
        feedback.gain.value = 0.45;
        const echoFilter = c.createBiquadFilter();
        echoFilter.type = 'lowpass';
        echoFilter.frequency.value = 3000;
        const echoSend = c.createGain();
        echoSend.gain.value = 0.5;
        delay.connect(echoFilter); echoFilter.connect(feedback); feedback.connect(delay);
        delay.connect(master);

        function layer(bandFreq, q, vol, atk, hold, rel){
          const src = c.createBufferSource();
          src.buffer = buffer;
          const filt = c.createBiquadFilter();
          filt.type = 'bandpass';
          filt.frequency.setValueAtTime(bandFreq, now);
          filt.frequency.exponentialRampToValueAtTime(bandFreq*0.55, now+dur);
          filt.Q.value = q;
          const g = c.createGain();
          g.gain.setValueAtTime(0.0001, now);
          g.gain.exponentialRampToValueAtTime(vol, now+atk);
          g.gain.setValueAtTime(vol, now+atk+hold);
          g.gain.exponentialRampToValueAtTime(0.001, now+atk+hold+rel);
          src.connect(filt); filt.connect(g);
          g.connect(master);   // dry
          g.connect(echoSend); // send to the echo loop
          echoSend.connect(delay);
          src.start(now);
        }
        layer(5400, 1.1, 0.8, 0.05, 0.35, 0.5); // bright top "sss"
        layer(2600, 2.0, 0.5, 0.08, 0.3, 0.45);  // rounder mid rasp, gives it body
        // low guttural growl underneath (kept out of the echo loop so the tail stays clean)
        tone(90, 0.7, 'sawtooth', 0.3, 45, 0);
        tone(58, 0.6, 'sine', 0.24, 30, 0.05);
      }
    };
  })();

  // ---------- Boss voice line (uses the browser's built-in speech synthesis — no audio files needed) ----------
  function speakTaunt(text){
    if (SFX.isMuted()) return;
    SFX.roar(); // deep rumble under the voice for extra weight/scare
    if (!('speechSynthesis' in window)) return;
    try {
      speechSynthesis.cancel(); // don't let taunts stack/overlap
      const u = new SpeechSynthesisUtterance(text);
      u.pitch = 0.05;   // as low as it goes = huge menacing giant voice
      u.rate = 0.72;    // slow, heavy, threatening delivery
      u.volume = 1;     // max volume (device/system volume still applies on top)
      const voices = speechSynthesis.getVoices();
      if (voices && voices.length){
        const deep = voices.find(v => /male|david|mark|daniel|fred|google uk english male/i.test(v.name));
        if (deep) u.voice = deep;
      }
      speechSynthesis.speak(u);
    } catch(e){ /* speech synthesis unavailable — silently skip */ }
  }

  // Both little giants growl the same threat back-to-back (two roars + two queued speech
  // lines) the instant they plant themselves on the road, so it reads as both demons
  // speaking, not just one.
  function speakGiantsTaunt(text){
    if (SFX.isMuted()) return;
    SFX.roar(0);
    SFX.roar(0.5);
    if (!('speechSynthesis' in window)) return;
    try {
      speechSynthesis.cancel(); // don't let this stack with any earlier taunt
      const voices = speechSynthesis.getVoices();
      const deep = voices && voices.length ? voices.find(v => /male|david|mark|daniel|fred|google uk english male/i.test(v.name)) : null;
      for (let i=0;i<2;i++){
        const u = new SpeechSynthesisUtterance(text);
        u.pitch = 0.05 + i*0.05; // slightly different pitch per giant so they don't sound identical
        u.rate = 0.72;
        u.volume = 1;
        if (deep) u.voice = deep;
        speechSynthesis.speak(u); // queues after the first, so they speak one after another
      }
    } catch(e){ /* speech synthesis unavailable — silently skip */ }
  }

  const muteBtn = document.getElementById('muteBtn');
  muteBtn.addEventListener('click', function(){
    SFX.unlock();
    const isMuted = SFX.toggleMuted();
    muteBtn.textContent = isMuted ? '🔇' : '🔊';
  });

  // ---------- World / Zones ----------
  const WORLD = { w: 900, h: 999999 }; // corridor width; height is endless (we scroll upward forever)
  const camera = { x:0, y:0 };
  let camInit = false; // first-frame snap flag so camera doesn't ease in from origin
  // fadeCamY tracks where the camera WOULD be if it only ever followed the officer normally —
  // i.e. without the extra upward lift added so a tall gate/boss stays in frame. The depth-haze
  // math (horizon line, "how far away does this look") uses this instead of the real camera.y,
  // so pulling the camera up to fit a tall guardian/gate no longer drags nearby buildings into
  // the haze zone and makes them look faded/blurry — they were never actually far away.
  let fadeCamY = 0;
  let camLookFrac = 0.5; // where the officer sits on screen, 0=left edge .. 1=right edge; eases toward a side based on walk direction so more road is visible ahead in that direction (lets you spot enemies coming with enough distance)
  const LOOK_FRAC_RIGHT = 0.14; // screen fraction (0=left edge,1=right edge) while walking right
  const LOOK_FRAC_LEFT  = 0.86; // screen fraction while walking left

  // ---------- Juice: screen shake, hit-stop, damage numbers, kill-streak ----------
  const shake = { t:0, dur:0.001, mag:0 };
  function addShake(mag, dur){
    // keep the strongest active shake rather than overwriting a big one with a small one
    if (mag >= shake.mag || shake.t <= 0){ shake.mag = mag; }
    shake.t = Math.max(shake.t, dur);
    shake.dur = Math.max(shake.dur, dur);
  }
  let hitStop = 0;
  function triggerHitStop(dur){ hitStop = Math.max(hitStop, dur); }

  let floatTexts = [];
  function addFloatText(x, y, text, color, size){
    floatTexts.push({ x, y, text, color: color||'#fff', size: size||14, vy:-46, life:0.7, maxLife:0.7 });
  }

  let comboCount = 0;

  // Stamps the Warden centred on the boss origin. r = boss radius. Head sits where the old danav
  // head was (y ≈ -1.3r) so the fire-breath mouth, dragon heads and camera framing all still line up.
  function drawWarden(c, r, flash){
    const H = r*4.2, W = H/2, s = H/800;
    const x0 = -W/2, y0 = -r*1.3 - 110*s;
    const t = performance.now()/1000;
    const footY = y0 + 772*s;
    c.save();
    c.translate(0, footY);
    c.rotate(Math.sin(t*0.9)*0.010);          // slow menacing sway
    c.scale(1, 1 + Math.sin(t*1.7)*0.010);     // breathing
    c.translate(0, -footY);
    c.shadowColor = 'rgba(255,40,30,0.9)';
    c.shadowBlur = 24; // constant glow — no pulse-down on every hit
    const PADH = HEAD_PAD*s;
    c.drawImage(WARDEN.img, x0, y0 - PADH, W, H + PADH);
    c.shadowBlur = 0;
    if (flash){
      c.globalAlpha = 0.16; // faint hit tint only — was 0.85, which strobed white under rapid fire
      c.drawImage(WARDEN.white, x0, y0 - PADH, W, H + PADH);
      c.globalAlpha = 1;
    } else {
      const pulse = 0.55 + 0.45*Math.sin(t*3.2);
      c.globalCompositeOperation = 'lighter';
      const glow = function(gx, gy, gr, a){
        const px = x0 + gx*s, py = y0 + gy*s;
        const g = c.createRadialGradient(px, py, 0, px, py, gr*s);
        g.addColorStop(0, 'rgba(255,90,60,'+a+')');
        g.addColorStop(1, 'rgba(255,40,30,0)');
        c.fillStyle = g; c.beginPath(); c.arc(px, py, gr*s, 0, Math.PI*2); c.fill();
      };

      { const ey = 176 + (114-176)*HEAD_K; glow(200 + (188-200)*HEAD_K, ey, 26*HEAD_K, 0.7); glow(200 + (212-200)*HEAD_K, ey, 26*HEAD_K, 0.7); } // eyes
      for (let i=0; i<5; i++){ const k = i/4; glow(112 - 88*k, 500 + 280*k, 34, 0.16 + 0.14*pulse); } // blade
      c.globalCompositeOperation = 'source-over';
    }
    c.restore();
  }
  // ---------- v116: Cursed Chakra gate art (dark, horrifying) ----------
  // Blackened blood-tipped blade wheel, skull-studded iron ring, a gaping ring of fangs and (drawn

  // bone skull (optionally horned) — used on the wheel ring, the pedestal and the pillar crowns
  function drawSkull(c, x, y, r, rot, horned){
    const TAU = Math.PI*2;
    c.save(); c.translate(x,y); c.rotate(rot);

      c.fillStyle = '#2a2830'; c.strokeStyle = '#050308'; c.lineWidth = 0.8;

        c.beginPath();
        c.moveTo(sd*r*0.55,-r*0.6);
        c.quadraticCurveTo(sd*r*1.5,-r*0.7, sd*r*1.25,-r*1.7);
        c.quadraticCurveTo(sd*r*1.05,-r*0.95, sd*r*0.25,-r*0.85);
        c.closePath(); c.fill(); c.stroke();

    }
    const bg = c.createRadialGradient(-r*0.3,-r*0.4,r*0.1, 0,0,r*1.2);
    bg.addColorStop(0,'#f2ead2'); bg.addColorStop(1,'#8a7a58');
    c.fillStyle = bg; c.strokeStyle = '#1a1008'; c.lineWidth = Math.max(0.6, r*0.08);
    c.beginPath(); c.ellipse(0,-r*0.12,r,r*0.95,0,0,TAU); c.fill(); c.stroke();
    c.beginPath(); c.moveTo(-r*0.55,r*0.5); c.lineTo(-r*0.5,r*1.05); c.lineTo(r*0.5,r*1.05); c.lineTo(r*0.55,r*0.5); c.closePath(); c.fill(); c.stroke();
    c.lineWidth = Math.max(0.5, r*0.06);
    for (let k=-2;k<=2;k++){ c.beginPath(); c.moveTo(k*r*0.2,r*0.62); c.lineTo(k*r*0.2,r*1.05); c.stroke(); }
    c.fillStyle = '#080204';
    c.beginPath(); c.arc(-r*0.4,-r*0.08,r*0.3,0,TAU); c.fill();
    c.beginPath(); c.arc( r*0.4,-r*0.08,r*0.3,0,TAU); c.fill();
    c.beginPath(); c.moveTo(0,r*0.15); c.lineTo(-r*0.13,r*0.44); c.lineTo(r*0.13,r*0.44); c.closePath(); c.fill();
    c.fillStyle = '#ff2a1a';
    c.beginPath(); c.arc(-r*0.4,-r*0.08,r*0.11,0,TAU); c.fill();
    c.beginPath(); c.arc( r*0.4,-r*0.08,r*0.11,0,TAU); c.fill();
    c.restore();
  }

  // ---------- Gothic gate eye — the SKULL CHAIN ----------
  // Once the Gothic gate is active, its watching eye lashes out with a long black iron chain strung with
  // burning-eyed skulls and tipped with a horned, jaw-open skull hook. The eye flares and a thin red line
  // marks the target (telegraph), the chain then whips out at the officer, and — hit or miss — reels
  // back into the eye (reverse). A hit is 25 damage (4 hits kill a 100-HP officer), cuts straight
  // through the shield, and the hook drags the officer a short way toward the gate as it retracts.
  const CHAIN_DMG = 25;
  let gateChain = null; // { phase:'idle'|'telegraph'|'extend'|'retract', cd, t, ang, len, maxLen, hooked, pulled }
  function chainOrigin(){ return { x: WORLD.w/2, y: gateY - 180*gateVisScale }; } // the eye in the wheel's hub
  function segDist(px, py, ax, ay, bx, by){
    const dx = bx-ax, dy = by-ay, l2 = dx*dx + dy*dy;
    let t = l2 ? ((px-ax)*dx + (py-ay)*dy)/l2 : 0; t = Math.max(0, Math.min(1, t));
    return Math.hypot(px-(ax+dx*t), py-(ay+dy*t));
  }
  function updateGateChain(dt){
    const o = chainOrigin();
    if (!gateChain) gateChain = { phase:'idle', cd:1.8, t:0, ang:0, len:0, maxLen:0, hooked:false, pulled:0 };
    const C = gateChain;
    if (C.phase === 'idle'){
      C.cd -= dt;
      if (C.cd <= 0){
        C.phase = 'telegraph'; C.t = 0.9;
        C.ang = Math.atan2(player.y-o.y, player.x-o.x);
        SFX.enemyShoot();
      }
    } else if (C.phase === 'telegraph'){
      C.t -= dt;
      if (C.t > 0.25) C.ang = Math.atan2(player.y-o.y, player.x-o.x); // tracks him, then locks — that last beat is the dodge window
      if (C.t <= 0){
        C.phase = 'extend'; C.len = 0; C.hooked = false; C.pulled = 0;
        C.maxLen = Math.hypot(player.x-o.x, player.y-o.y) + 260; // always reaches all the way to him, however far back he is — fully visible, no more clipping short
        SFX.boom(0.35); addShake(5, 0.15);
      }
    } else if (C.phase === 'extend'){
      const prev = C.len;
      C.len += 1250*dt; // slightly slower whip-out
      const ax = o.x + Math.cos(C.ang)*prev, ay = o.y + Math.sin(C.ang)*prev;
      const bx = o.x + Math.cos(C.ang)*C.len, by = o.y + Math.sin(C.ang)*C.len;
      if (!C.hooked && segDist(player.x, player.y, ax, ay, bx, by) < player.r + 18){
        C.hooked = true; C.phase = 'retract';
        player.hp -= CHAIN_DMG;
        addParticles(player.x, player.y, '#ff4444', 16);
        addParticles(player.x, player.y, '#ffcf8a', 8);
        addFloatText(player.x, player.y-30, '-'+CHAIN_DMG, '#ff5555', 17);
        SFX.hurt(); addShake(12, 0.3);
        if (player.hp <= 0){ player.hp = 0; endGame(); return 'dead'; }
      } else if (C.len >= C.maxLen){
        C.phase = 'retract';
      }
    } else if (C.phase === 'retract'){
      const step = 1000*dt; // slightly slower reel-back
      C.len -= step;
      if (C.hooked && C.pulled < 280){
        const pull = Math.min(step, 280 - C.pulled);
        C.pulled += pull;
        player.x -= Math.cos(C.ang)*pull;
        player.y = Math.max(player.y - Math.sin(C.ang)*pull, gateY + player.r + 200); // never dragged through the giants' line
      }
      if (C.len <= 0){
        C.phase = 'idle'; C.len = 0; C.hooked = false;
        C.cd = 2.6 + Math.random()*1.4;
      }
    }
    return null;
  }
  function drawGateChain(){
    const C = gateChain;
    if (!C || C.phase === 'idle') return;
    const o = chainOrigin(), tNow = performance.now()/1000, TAU = Math.PI*2;
    const ux = Math.cos(C.ang), uy = Math.sin(C.ang), px = -uy, py = ux;
    if (C.phase === 'telegraph'){
      const k = 1 - Math.max(0, C.t)/0.9; // 0 -> 1 as the strike nears
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      const eg = ctx.createRadialGradient(o.x, o.y, 6, o.x, o.y, 150);
      eg.addColorStop(0, 'rgba(255,80,40,'+(0.35+0.5*k)+')'); eg.addColorStop(1, 'rgba(255,40,10,0)');
      ctx.fillStyle = eg; ctx.beginPath(); ctx.arc(o.x, o.y, 150, 0, TAU); ctx.fill();
      const dist = Math.hypot(player.x-o.x, player.y-o.y) + 120;
      ctx.strokeStyle = 'rgba(255,50,40,'+(0.18+0.5*k)*(0.6+0.4*Math.sin(tNow*40))+')'; ctx.lineWidth = 2 + 3*k;
      ctx.setLineDash([16, 10]);
      ctx.beginPath(); ctx.moveTo(o.x, o.y); ctx.lineTo(o.x+ux*dist, o.y+uy*dist); ctx.stroke();
      ctx.restore();
      return;
    }
    const L = C.len; if (L < 8) return;
    const hx = o.x + ux*L, hy = o.y + uy*L;
    ctx.save();
    // heat trail behind the whip
    ctx.globalCompositeOperation = 'lighter';
    ctx.strokeStyle = 'rgba(255,60,40,0.20)'; ctx.lineWidth = 16; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(o.x, o.y); ctx.lineTo(hx, hy); ctx.stroke();
    ctx.globalCompositeOperation = 'source-over';
    const step = 24, n = Math.floor(L/step), swayAmp = C.phase === 'extend' ? 4 : 8;
    for (let i=1;i<=n;i++){
      const d = i*step;
      const sway = Math.sin(i*0.7 + tNow*9) * swayAmp * Math.min(1, d/220);
      const x = o.x + ux*d + px*sway, y = o.y + uy*d + py*sway;
      if (i % 5 === 0){
        drawSkull(ctx, x, y, 10, tNow*3 + i, false); // a burning-eyed skull every fifth link
      } else {
        ctx.save(); ctx.translate(x, y); ctx.rotate(C.ang);
        const rx = i % 2 ? 13 : 9, ry = i % 2 ? 7 : 4.5;

  // ---------- Desert gate: a huge sci-fi ring portal (black-bronze armour, amber-gold neon) ----------
  // Same family as the reference portal art — concentric armoured rings with glowing neon arcs, a
  // dark hollow centre, stepped side buttresses and a control-console base — recoloured for the
  // sands (bronze metal, molten gold/amber light, a hot red slit in the console) and much larger

  const DESERT_GATE_W = 900, DESERT_GATE_H = 800, DESERT_GATE_TOP = -730; // baked canvas size + its top edge (gate-local y)
  const DESERT_GATE_CY = -330, DESERT_GATE_R = 330;                       // ring centre / outer radius (gate-local)
  let desertGateFrame = null, desertGateInner = null;
  function buildDesertGateFrame(){
    const cv = document.createElement('canvas'); cv.width = DESERT_GATE_W; cv.height = DESERT_GATE_H;
    const c = cv.getContext('2d'); const TAU = Math.PI*2;
    const cx = 450, cy = DESERT_GATE_CY - DESERT_GATE_TOP; // ring centre inside the baked canvas
    const GOLD = '#ffb426', HOT = '#ff7a1a', PALE = '#ffe9a0';
    function annulus(r0, r1, a0, a1, g0, g1){
      const gr = c.createLinearGradient(cx-r1, cy-r1, cx+r1, cy+r1);
      gr.addColorStop(0,g0); gr.addColorStop(1,g1);
      c.fillStyle = gr;
      c.beginPath(); c.arc(cx,cy,r1,a0,a1); c.arc(cx,cy,r0,a1,a0,true); c.closePath(); c.fill();
      c.strokeStyle = '#050403'; c.lineWidth = 2; c.stroke();

    function neon(r, w, a0, a1, col){
      c.save(); c.lineCap = 'round';
      c.shadowColor = col; c.shadowBlur = 18; c.strokeStyle = col; c.globalAlpha = 0.55; c.lineWidth = w*2.2;
      c.beginPath(); c.arc(cx,cy,r,a0,a1); c.stroke();
      c.globalAlpha = 1; c.shadowBlur = 8; c.lineWidth = w; c.strokeStyle = col;
      c.beginPath(); c.arc(cx,cy,r,a0,a1); c.stroke();
      c.shadowBlur = 0; c.strokeStyle = PALE; c.lineWidth = Math.max(1, w*0.32);
      c.beginPath(); c.arc(cx,cy,r,a0,a1); c.stroke();

    }
    // --- side buttresses (behind the ring) ---
    for (const s of [-1,1]){
      const g = c.createLinearGradient(cx+s*200, 0, cx+s*440, 0);
      g.addColorStop(0,'#3a3024'); g.addColorStop(1,'#0d0a07');
      c.fillStyle = g; c.strokeStyle = '#050403'; c.lineWidth = 2;
      c.beginPath();
      c.moveTo(cx+s*225, cy+230); c.lineTo(cx+s*352, cy+128); c.lineTo(cx+s*425, cy+250);
      c.lineTo(cx+s*440, cy+310); c.lineTo(cx+s*440, 700); c.lineTo(cx+s*200, 700); c.closePath();
      c.fill(); c.stroke();
      // stepped armour ledges
      for (let k=0;k<4;k++){
        const yy = cy+250 + k*ms(k);
        c.fillStyle = k%2 ? '#1a140d' : '#2b2218';
        c.beginPath(); c.moveTo(cx+s*(250+k*30), yy); c.lineTo(cx+s*(430), yy); c.lineTo(cx+s*430, yy+30); c.lineTo(cx+s*(240+k*26), yy+30); c.closePath(); c.fill(); c.stroke();
        c.fillStyle = GOLD; c.fillRect(Math.min(cx+s*(250+k*30), cx+s*430)+ (s>0?4:0), yy+2, 26, 2);
      }
      // glowing outer slope edge
      c.save(); c.strokeStyle = HOT; c.shadowColor = HOT; c.shadowBlur = 10; c.lineWidth = 3; c.lineCap='round';
      c.beginPath(); c.moveTo(cx+s*352, cy+128); c.lineTo(cx+s*425, cy+250); c.lineTo(cx+s*440, cy+310); c.lineTo(cx+s*440, 690); c.stroke();
      c.restore();
    }
    function ms(k){ return 34; }
    // --- outer armoured ring ---
    annulus(296, 332, 0, TAU, '#4a3b2a', '#0f0b07');
    for (let i=0;i<48;i++){ // panel seams
      const a = i*TAU/48;
      c.strokeStyle = 'rgba(0,0,0,0.75)'; c.lineWidth = 2;
      c.beginPath(); c.moveTo(cx+Math.cos(a)*298, cy+Math.sin(a)*298); c.lineTo(cx+Math.cos(a)*331, cy+Math.sin(a)*331); c.stroke();
    }
    // segmented middle band
    for (let i=0;i<14;i++){

      annulus(232, 292, a0, a1, i%2 ? '#33291d' : '#43362a', i%2 ? '#0e0a06' : '#171009');

    neon(313, 6, Math.PI*1.06, Math.PI*1.94, GOLD);
    neon(313, 4, Math.PI*0.08, Math.PI*0.3, GOLD);
    neon(313, 4, Math.PI*0.7,  Math.PI*0.92, GOLD);
    neon(277, 7, Math.PI*1.14, Math.PI*1.86, HOT);
    neon(277, 5, Math.PI*0.0,  Math.PI*0.2, HOT);
    neon(277, 5, Math.PI*0.8,  Math.PI*1.0, HOT);
    neon(252, 4, Math.PI*1.2,  Math.PI*1.8, GOLD);
    neon(252, 3, Math.PI*0.05, Math.PI*0.34, GOLD);

    // mechanical plates + indicator lights on the middle band
    for (let i=0;i<28;i++){
      const a = (i+0.5)*TAU/28;
      c.save(); c.translate(cx+Math.cos(a)*212, cy+Math.sin(a)*212); c.rotate(a+Math.PI/2);
      c.fillStyle = '#120d08'; c.strokeStyle = '#000'; c.lineWidth = 1.5;
      c.fillRect(-13,-9,26,18); c.strokeRect(-13,-9,26,18);
      c.fillStyle = 'rgba(255,190,80,0.25)'; c.fillRect(-13,-9,26,3);
      if (i%3===0){ c.fillStyle = HOT; c.shadowColor = HOT; c.shadowBlur = 6; c.fillRect(-3,-1,6,3); }
      c.restore();
    }
    // side vents (fine radial slits)
    c.strokeStyle = 'rgba(255,160,50,0.55)'; c.lineWidth = 1.5;
    for (const base of [0, Math.PI]){
      for (let k=-6;k<=6;k++){
        const a = base + k*0.045;
        c.beginPath(); c.moveTo(cx+Math.cos(a)*236, cy+Math.sin(a)*236); c.lineTo(cx+Math.cos(a)*256, cy+Math.sin(a)*256); c.stroke();
      }
    }
    // inner fixed collar
    annulus(196, 228, 0, TAU, '#3b2f22', '#0b0806');
    neon(200, 3, 0, TAU, HOT);
    // top crest
    const tg = c.createLinearGradient(cx-24,0,cx+24,0);
    tg.addColorStop(0,'#0e0a07'); tg.addColorStop(0.5,'#4a3b2a'); tg.addColorStop(1,'#0e0a07');
    c.fillStyle = tg; c.strokeStyle = '#050403'; c.lineWidth = 2;
    c.beginPath(); c.moveTo(cx-26, cy-R2()+8); c.lineTo(cx-20, cy-R2()-38); c.lineTo(cx+20, cy-R2()-38); c.lineTo(cx+26, cy-R2()+8); c.closePath(); c.fill(); c.stroke();
    c.fillStyle = GOLD; c.shadowColor = GOLD; c.shadowBlur = 8;
    for (let k=0;k<4;k++) c.fillRect(cx-3, cy-R2()-30+k*12, 6, 5);
    c.shadowBlur = 0;
    function R2(){ return DESERT_GATE_R; }
    // --- base: slab, step, and control console with a hot red slit ---
    const slabG = c.createLinearGradient(0,690,0,800);
    slabG.addColorStop(0,'#3a3024'); slabG.addColorStop(0.5,'#14100b'); slabG.addColorStop(1,'#050403');
    c.fillStyle = slabG; c.strokeStyle = '#000'; c.lineWidth = 2;
    c.fillRect(cx-440, 736, 880, 64); c.strokeRect(cx-440, 736, 880, 64);
    c.fillRect(cx-330, 696, 660, 42); c.strokeRect(cx-330, 696, 660, 42);
    c.save(); c.shadowColor = GOLD; c.shadowBlur = 10; c.fillStyle = GOLD;
    c.fillRect(cx-430, 738, 860, 3); c.fillRect(cx-320, 698, 640, 3);
    c.restore();
    c.fillStyle = '#100c08'; c.fillRect(cx-120, 606, 240, 92); c.strokeRect(cx-120, 606, 240, 92);
    c.fillStyle = '#2a2016'; c.fillRect(cx-120, 606, 240, 10);
    c.save(); c.fillStyle = '#ff3a1a'; c.shadowColor = '#ff3a1a'; c.shadowBlur = 12;
    c.fillRect(cx-22, 640, 44, 12);
    c.fillStyle = GOLD; c.shadowColor = GOLD;
    for (let k=0;k<5;k++){ c.fillRect(cx-96+k*10, 668, 6, 14); c.fillRect(cx+50+k*10, 668, 6, 14); }
    c.restore();
    return cv;
  }
  function buildDesertGateInner(){
    const S = 480, cv = document.createElement('canvas'); cv.width = S; cv.height = S;

  function buildChakraGateCanvas(){
    const SC = 3, TAU = Math.PI*2;
    const cv = document.createElement('canvas');
    cv.width = cv.height = CHAKRA_HALF*2*SC;
    const c = cv.getContext('2d');
    c.scale(SC, SC); c.translate(CHAKRA_HALF, CHAKRA_HALF);
    let sd = 11; function rnd(){ sd = (sd*16807)%2147483647; return sd/2147483647; }

    // blood-tipped iron blades
    function bladeRing(n, baseR, tipR, halfW, phase, hook, shrink){
      for (let i=0;i<n;i++){
        const tip = tipR - (shrink ? shrink(i) : 0);
        c.save(); c.rotate(phase + i*TAU/n);
        const gl = c.createLinearGradient(baseR-8,0,tipR,0);
        gl.addColorStop(0,'#1c1a22'); gl.addColorStop(0.5,'#6a6a78'); gl.addColorStop(0.8,'#c4c4d0'); gl.addColorStop(0.88,'#a01020'); gl.addColorStop(1,'#ff3030');
        const gd = c.createLinearGradient(baseR-8,0,tipR,0);
        gd.addColorStop(0,'#08070c'); gd.addColorStop(0.5,'#2a2830'); gd.addColorStop(0.8,'#6a6a76'); gd.addColorStop(0.88,'#600a12'); gd.addColorStop(1,'#c01818');
        c.fillStyle = gl; c.beginPath(); c.moveTo(baseR-8,0); c.lineTo(baseR,-halfW); c.lineTo(tip,hook); c.closePath(); c.fill();
        c.fillStyle = gd; c.beginPath(); c.moveTo(baseR-8,0); c.lineTo(baseR, halfW); c.lineTo(tip,hook); c.closePath(); c.fill();
        c.strokeStyle = '#050308'; c.lineWidth = 1;
        c.beginPath(); c.moveTo(baseR,-halfW); c.lineTo(tip,hook); c.lineTo(baseR,halfW); c.stroke();
        c.restore();

    }
    bladeRing(24, 116, 138, 8, TAU/48, 3);
    bladeRing(24, 116, CHAKRA_R, 15, 0, 7, function(i){ return i%3===0 ? 0 : (i%3===1 ? 9 : 18); });

    c.fillStyle = '#07040a'; c.beginPath(); c.arc(0,0,90,0,TAU); c.fill();

    // the maw: two rows of inward-pointing fangs
    function fangs(n, baseR, tipR, w, phase){
      for (let i=0;i<n;i++){
        c.save(); c.rotate(phase + i*TAU/n);
        const fg = c.createLinearGradient(baseR,0,tipR,0);
        fg.addColorStop(0,'#4a3c28'); fg.addColorStop(0.45,'#e8dcc0'); fg.addColorStop(0.8,'#efe6cc'); fg.addColorStop(1,'#b01018');
        c.fillStyle = fg; c.beginPath(); c.moveTo(baseR,-w); c.lineTo(tipR,0); c.lineTo(baseR,w); c.closePath(); c.fill();

    fangs(24, 86, 70, 5, TAU/48);
    fangs(24, 86, 54, 9, 0);

    // blood-dark hub disk with glowing veins (the live eye sits on top of this)
    const hd = c.createRadialGradient(0,0,4,0,0,54);
    hd.addColorStop(0,'#5a0a0e'); hd.addColorStop(1,'#0a0204');
    c.fillStyle = hd; c.beginPath(); c.arc(0,0,54,0,TAU); c.fill();
    c.strokeStyle = '#c01818'; c.lineWidth = 1.4; c.shadowColor = '#ff2a1a'; c.shadowBlur = 5;
    for (let k=0;k<14;k++){
      let a = k*TAU/14 + rnd()*0.2, r0 = 24;
      c.beginPath(); c.moveTo(Math.cos(a)*r0, Math.sin(a)*r0);
      for (let s=0;s<4;s++){ r0 += 7; a += (rnd()-0.5)*0.22; c.lineTo(Math.cos(a)*r0, Math.sin(a)*r0); }
      c.stroke();
    }
    c.shadowBlur = 0;
    c.strokeStyle = '#5a5a68'; c.lineWidth = 2.5; c.beginPath(); c.arc(0,0,55,0,TAU); c.stroke();

    // blackened iron ring
    let g = c.createRadialGradient(0,0,86,0,0,122);
    g.addColorStop(0,'#0a080e'); g.addColorStop(0.2,'#2c2a34'); g.addColorStop(0.5,'#14121a'); g.addColorStop(0.85,'#2a2830'); g.addColorStop(1,'#08060a');
    c.fillStyle = g; c.beginPath(); c.arc(0,0,122,0,TAU); c.arc(0,0,86,0,TAU,true); c.fill('evenodd');
    c.strokeStyle = '#6a6a78'; c.lineWidth = 2.2;
    c.beginPath(); c.arc(0,0,121,0,TAU); c.stroke();
    c.beginPath(); c.arc(0,0,87,0,TAU); c.stroke();
    c.strokeStyle = '#6a0a12'; c.lineWidth = 1.2;

    c.beginPath(); c.arc(0,0,89.5,0,TAU); c.stroke();
    // rivets
    for (let i=0;i<60;i++){
      const a = i*TAU/60;
      c.fillStyle = '#4a4a56'; c.beginPath(); c.arc(Math.cos(a)*121.5*0.96, Math.sin(a)*121.5*0.96, 1.5, 0, TAU); c.fill();
      c.beginPath(); c.arc(Math.cos(a)*91, Math.sin(a)*91, 1.5, 0, TAU); c.fill();
    }
    // 20 skulls (4 big horned ones at the compass points) with glowing red runes between

      const a = i*TAU/20, px = Math.cos(a)*104, py = Math.sin(a)*104;
      if (i%5===0) drawSkull(c, px, py, 10.5, a+Math.PI/2, true);

    }

    c.strokeStyle = '#ff3a20'; c.lineWidth = 1.3; c.shadowColor = '#ff2a1a'; c.shadowBlur = 5;
    for (let k=0;k<9;k++){
      let a = rnd()*TAU, r0 = 88 + rnd()*6;
      c.beginPath(); c.moveTo(Math.cos(a)*r0, Math.sin(a)*r0);

  function genGroundDecor(theme, topY, bottomY){
    groundDecor = [];
    const isForest = theme.decorShape === 'tree';
    // extra margin on both sides so the forest still has tree cover now that players can
    // wander left/right past the old corridor edge — no more hard limit on that movement
    // v127: LANDSCAPE — the screen shows a much wider strip of world (up to ~1300*W/H units), so the decor band must
    // be wider too or the far left/right of the screen is empty. Portrait keeps the old 500.
    const wideView = (typeof W === 'number' && typeof H === 'number' && W > H*1.1);
    const margin = wideView ? Math.max(500, Math.ceil((1300*W/H - WORLD.w)/2) + 250) : 500;
    const spanW = WORLD.w + margin*2;
    // Keep a clear dirt "road" down the middle so the corridor reads like a real forest track —
    // NO decor is ever allowed to land inside the road's width, not even occasionally.
    const laneHalf = WORLD.w * 0.25;
    const cx = WORLD.w/2;

    if (isForest){
      // ---- Trees: placed one at a time with a real minimum gap between trunks, and kept a ----
      // clear buffer off the road, so there's always room to step off the path and weave
      // between trunks instead of hitting a wall of them right at the tree-line.
      const treeCount = Math.round(105 * (spanW / WORLD.w)); // noticeably fewer & spaced further apart than before
      const placed = []; // {x,y,r} of trees placed so far, for spacing checks
      const MIN_GAP = 78; // real clear gap kept between trunk edges on top of their own radii
      const TREE_LANE_BUFFER = 55; // extra clear walking room right off the road before the first trunks start
      for (let i=0; i<treeCount; i++){
        let x, y, r, edgeBias, ok = false, attempts = 0;
        while (!ok && attempts < 6){
          attempts++;
          x = Math.random()*spanW - margin;
          if (Math.abs(x-cx) < laneHalf+TREE_LANE_BUFFER){
            x = x < cx ? cx - laneHalf - TREE_LANE_BUFFER - Math.random()*(WORLD.w/2-laneHalf+margin) : cx + laneHalf + TREE_LANE_BUFFER + Math.random()*(WORLD.w/2-laneHalf+margin);
          }
          edgeBias = Math.min(1, Math.abs(x-cx)/(WORLD.w/2+margin)); // bigger, denser near tree-line
          r = 45+Math.random()*55+edgeBias*35; // taller/bigger trees than before
          y = topY + Math.random()*(bottomY-topY);
          ok = true;
          for (const p of placed){
            const dx = x-p.x, dy = y-p.y;
            const need = r*0.55 + p.r*0.55 + MIN_GAP;
            if (dx*dx + dy*dy < need*need){ ok = false; break; }
          }
        }
        // mix of tree kinds so the forest doesn't look like one repeated tree
        const roll = Math.random();
        const treeKind = roll < 0.42 ? 'leafy' : roll < 0.68 ? 'pine' : roll < 0.87 ? 'autumn' : 'palm';
        let c = theme.decor, cLight = theme.decorLight || theme.decor, trunk = theme.trunk || '#3b2a1a';
        if (treeKind === 'pine'){ c = '#25462c'; cLight = '#3f6d46'; trunk = '#40301e'; }
        else if (treeKind === 'autumn'){ c = '#c9772f'; cLight = '#e8a94f'; }
        else if (treeKind === 'palm'){ c = '#4f9a4a'; cLight = '#79c162'; trunk = '#8a6a3a'; }
        const heightMult = 1.2 + Math.random()*0.35; // extra vertical stretch on the canopy only — taller silhouette, same trunk
        // Tall, thin bare-wood trunk: a real clear stretch of plain wood above the ground,
        // well past the officer's own height, before any leaves/branches begin — but still
        // short enough that the canopy stays visually attached to its own trunk on screen.
        const trunkH = 100 + r*0.55 + Math.random()*20;
        const visualReach = trunkH + r*1.7*heightMult; // how high the canopy top reaches above the ground point — used for draw-order safety margin
        groundDecor.push({
          x, y, r, c, cLight, trunk, shape: 'tree', treeKind, heightMult, trunkH, visualReach,
          flip: Math.random()<0.5,
          sway: Math.random()*Math.PI*2,
          depth: 0.75+Math.random()*0.5
        });
        placed.push({x, y, r});
      }

      // ---- Undergrowth: bushes and grass, always placed together in small natural clumps ----
      // (never scattered as lone single sprigs) so it reads as real forest floor cover.
      const clusterCount = Math.round(65 * (spanW / WORLD.w));
      for (let i=0; i<clusterCount; i++){
        let ccx = Math.random()*spanW - margin;
        if (Math.abs(ccx-cx) < laneHalf){
          ccx = ccx < cx ? cx - laneHalf - Math.random()*(WORLD.w/2-laneHalf+margin) : cx + laneHalf + Math.random()*(WORLD.w/2-laneHalf+margin);
        }
        const ccy = topY + Math.random()*(bottomY-topY);
        const clumpSize = 3 + Math.floor(Math.random()*4); // 3-6 pieces per clump
        for (let j=0; j<clumpSize; j++){
          const ang = Math.random()*Math.PI*2;
          const dist = Math.random()*36;
          const isGrass = Math.random() < 0.5;
          groundDecor.push({
            x: ccx + Math.cos(ang)*dist,
            y: ccy + Math.sin(ang)*dist*0.6, // flattened spread so the clump sits grounded, not scattered vertically
            r: isGrass ? 4+Math.random()*5 : 6+Math.random()*8,
            c: theme.decor, cLight: theme.decorLight || theme.decor, trunk: theme.trunk || '#3b2a1a',
            shape: isGrass ? 'grass' : 'bush',
            treeKind: null,
            flip: Math.random()<0.5,
            sway: Math.random()*Math.PI*2,
            depth: 0.75+Math.random()*0.5
          });
        }
      }
    } else if (theme.decorShape === 'building'){
      // ---- Gothic City: blocky buildings of real varied width, height and colour, spaced ----
      // with a minimum gap so silhouettes read as distinct structures, not a solid wall.
      const buildingCount = Math.round(44 * (spanW / WORLD.w) * Math.max(1, (bottomY-topY)/3000)); // fewer, less densely packed buildings — scaled up for the long v119 Gothic run so the skyline stays as dense per metre
      const placed = [];
      const MIN_GAP = wideView ? 400 : 40; // wider gaps so the skyline reads as spaced-out buildings, not a packed wall (v127: much wider in landscape)
      const palette = theme.buildingColors || [theme.decor];
      const windowPalette = theme.windowColors || ['rgba(255,210,120,0.5)'];
      const BUILD_LANE_BUFFER = 90;
      const BUILD_ROAD_GAP = 430; // v128 (landscape, was 200 in v127): clear ground kept between the road edge and a building's nearest wall
      const maxTries = wideView ? 40 : 6;
      const buildingTarget = wideView ? Math.round(buildingCount*0.8) : buildingCount; // v128: fewer buildings on wide screens (more of the world is visible at once)
      for (let i=0; i<buildingTarget; i++){
        let x, y, r, ok = false, attempts = 0;
        while (!ok && attempts < maxTries){
          attempts++;
          if (wideView){
            // pick the size first, then keep the whole building (not just its centre) well clear of the road
            const side = Math.random() < 0.5 ? -1 : 1;
            r = 20 + Math.random()*54;
            const minOff = laneHalf + BUILD_ROAD_GAP + r*0.7;
            x = cx + side*(minOff + Math.random()*(WORLD.w/2 + margin - minOff));
            if (x < cx - WORLD.w/2 - margin || x > cx + WORLD.w/2 + margin){ ok = false; continue; }
            r += Math.min(1, Math.abs(x-cx)/(WORLD.w/2+margin))*26;
          } else {
            x = Math.random()*spanW - margin;
            if (Math.abs(x-cx) < laneHalf+BUILD_LANE_BUFFER){
              x = x < cx ? cx - laneHalf - BUILD_LANE_BUFFER - Math.random()*(WORLD.w/2-laneHalf+margin) : cx + laneHalf + BUILD_LANE_BUFFER + Math.random()*(WORLD.w/2-laneHalf+margin);
            }
            const edgeBias = Math.min(1, Math.abs(x-cx)/(WORLD.w/2+margin));
            r = 20 + Math.random()*54 + edgeBias*26; // small row-houses up to wide gothic halls
          }
          y = topY + Math.random()*(bottomY-topY);
          ok = true;
          for (const p of placed){
            const dx = x-p.x, dy = y-p.y;

          }
        }
        if (wideView && !ok) continue; // v127: no room found — skip it rather than crowd the road or its neighbours
        const heightMult = 2.6 + Math.random()*3.0; // taller city block so buildings stay proportionate to the officer's restored (larger) size
        const hasRoofProp = Math.random() < 0.3;

    } else {

      const count = Math.round(220 * (spanW / WORLD.w));
      for (let i=0; i<count; i++){

          x: x,

  }

    };
    
    // COBRA CLEARS BUILDINGS — the serpent's rise levels the ENTIRE city — every single building

  // Mirror Guardian — appears the instant the cobra rises, hidden out in a plain, open
  // stretch straight to the right — no trees or buildings there, just flat ground — placed
  // exactly as far out as the officer covers running right for MIRROR_TRAVEL_SECONDS at
  // full speed, so it's a real, steady 40-second run to find it. Fires beams at the
  // officer and must be broken with 100 rounds of ordinary gunfire before it yields the chakra.
  const MIRROR_TRAVEL_SECONDS = 18;
  function spawnMirror(){
    mirror = {
      x: cobra.x + player.speed * MIRROR_TRAVEL_SECONDS, y: cobra.y - 40, r: 175,
      hits: 0, hitsNeeded: MIRROR_HITS_NEEDED,
      hitFlash: 0, spin: 0, beamCd: 2.6 + Math.random()
    };
    mirrorBeams = [];
  }

  // ---------- Mirror arena lock ----------
  // Once the officer arrives at the mirror, the view snaps into a fixed showdown frame: the mirror
  // sits in the far RIGHT corner of the screen and the officer is held in a narrow strip along the
  // far LEFT edge. He cannot advance toward the mirror (so he can't reach the chakra) until it has
  // been shot to pieces — only then does `mirror` become null and the lock is gone.
  const MIRROR_SCREEN_Y = 0.62; // mirror centre, as a fraction down the screen (0 = top) — below the dark horizon band
  function mirrorScreenX(){ return VW - mirror.r*0.76 - 24; }          // mirror centre, from the left screen edge
  function mirrorBandL(){ return mirror.x - (mirrorScreenX() - VW*0.05); } // officer's left limit (world x)
  function mirrorBandR(){ return mirror.x - (mirrorScreenX() - VW*0.13); } // officer's right limit (world x)
  function applyMirrorLock(dt){
    if (!mirror) return;
    if (!mirror.locked && player.x >= mirrorBandL()){
      mirror.locked = true;
      showBanner('🪞 MIRROR GUARDIAN', 'Shatter it from here — you cannot go any closer!', 2.6);
      addShake(6, 0.25);
    }
    if (!mirror.locked) return;
    // the officer can never go FORWARD past this line (toward the mirror / chakra) — but he is
    // free to retreat backward (left / down) as far as he likes
    player.x = Math.min(mirrorBandR(), player.x);
    // ...and can't climb past the mirror's level either (forward/up); pulled back smoothly, not snapped
    const yMin = mirror.y - VH*0.38;
    if (player.y < yMin) player.y = Math.min(yMin, player.y + 900*dt);
  }

  // ---------- Cherry Club — the mirror's melee weapon ----------
  // A glowing cherry-red club rises out of the mirror's centre, swings round to face the officer,
  // telegraphs a red strike lane, then lunges down it and sinks back into the mirror. No shield can
  // stop it: the 1st hit wounds badly, the 2nd hit is death. Sidestep out of the red lane to live.
  const CLUB_LEN = 210; // v111: was 300 — smaller club
  const CLUB_CHAIN = 1;  // v113: back to ONE strike per round (the 6-strike chain was a misread) — chain code kept, set >1 to re-enable
  const CLUB_KILL_HITS = 6; // v113: the officer dies on the 6th club hit (was 2)
  const CLUB_CHAIN_GAP = 0.3; // short breather between the attacks in a chain
  function updateMirrorClub(dt){
    if (!mirror){ mirrorClub = null; clubHits = 0; return false; }
    if (!mirror.locked) return false; // only wakes once the showdown frame has begun
    if (!mirrorClub){
      mirrorClub = { state:'cooldown', t: 1.6, angle: Math.PI, bx: mirror.x, by: mirror.y, scale: 0,
                     travel: 0, P: 0, L: CLUB_LEN, hitDone: false, chainLeft: CLUB_CHAIN - 1 };
    }
    const mc = mirrorClub;
    const toPlayerAng = Math.atan2(player.y - mirror.y, player.x - mirror.x);
    if (mc.state === 'cooldown'){
      mc.scale = Math.max(0, mc.scale - dt*3);
      mc.bx = mirror.x; mc.by = mirror.y;
      mc.t -= dt;
      if (mc.t <= 0 && Math.hypot(player.x-mirror.x, player.y-mirror.y) < Math.max(1300, VW*1.3)){ // v130: range scales with the view width (in landscape the officer sits > 1300 units away, so the club never launched)
        // v109: no emerge / aim phase any more — the club lunges straight out of the mirror
        const dist0 = Math.hypot(player.x-mirror.x, player.y-mirror.y);
        mc.angle = toPlayerAng;
        mc.P = Math.max(200, dist0 - mc.L + 260);
        mc.scale = 1; mc.travel = 0; mc.hitDone = false;
        mc.state = 'strike';
        addParticles(mirror.x, mirror.y, '#ff2a4a', 22);
        addShake(6, 0.2);
        SFX.enemyShoot();
        if (mc.chainLeft === CLUB_CHAIN - 1) showBanner('CHERRY CLUB', 'Dodge the swing — 6 hits kill!', 0.9); // banner only on the first of the chain
      }
    } else if (mc.state === 'emerge'){
      // rises out of the mirror's centre while swinging round to face the officer
      mc.bx = mirror.x; mc.by = mirror.y;
      mc.t -= dt;
      mc.scale = Math.min(1, 1 - Math.pow(Math.max(0, mc.t)/0.7, 2));
      let da = toPlayerAng - mc.angle; da = Math.atan2(Math.sin(da), Math.cos(da));
      mc.angle += da * Math.min(1, dt*9);
      if (mc.t <= 0){
        mc.state = 'aim'; mc.t = 0.55; mc.scale = 1;
        const dist = Math.hypot(player.x-mirror.x, player.y-mirror.y);
        mc.angle = toPlayerAng;                        // lane locks here — this is what you dodge
        mc.P = Math.max(200, dist - mc.L + 260);       // how far the club travels along the lane
        showBanner('CHERRY CLUB', 'Dodge the swing — 6 hits kill!', 0.9);
      }
    } else if (mc.state === 'aim'){
      mc.t -= dt;
      if (mc.t <= 0){ mc.state = 'strike'; mc.travel = 0; mc.hitDone = false; SFX.enemyShoot(); addShake(6, 0.2); }
    } else if (mc.state === 'strike'){
      const step = Math.max(900, mc.P/1.8)*dt; // v130: faster club — at least 900/s, and never takes longer than ~1.8s to cross even on wide/landscape screens (was a flat 550/s)
      mc.travel += step;
      mc.bx = mirror.x + Math.cos(mc.angle)*mc.travel;
      mc.by = mirror.y + Math.sin(mc.angle)*mc.travel;
      const hx = mc.bx + Math.cos(mc.angle)*mc.L, hy = mc.by + Math.sin(mc.angle)*mc.L;
      if (Math.random() < 0.8) addParticles(hx, hy, '#ff2a4a', 2);
      if (!mc.hitDone){
        // distance from the officer to the club's whole length (handle -> head)
        const sx = hx - mc.bx, sy = hy - mc.by;
        const tt = Math.max(0, Math.min(1, ((player.x-mc.bx)*sx + (player.y-mc.by)*sy) / (sx*sx + sy*sy)));
        const cx = mc.bx + sx*tt, cy = mc.by + sy*tt;
        if (Math.hypot(player.x-cx, player.y-cy) < 22 + player.r*1.6){
          mc.hitDone = true;
          clubHits++;
          addParticles(player.x, player.y, '#ff2a4a', 28);
          addParticles(player.x, player.y, '#ffb3bf', 12);
          SFX.hurt(); addShake(18, 0.45); triggerHitStop(0.1);
          if (clubHits >= CLUB_KILL_HITS){
            addFloatText(player.x, player.y-34, 'CHERRY CLUB — FATAL!', '#ff2a4a', 20);
            player.hp = 0; endGame(); return true;
          }
          const dmg = Math.min(40, Math.max(0, player.hp - 1)); // the first hit wounds but can't kill by itself
          player.hp -= dmg;
          addFloatText(player.x, player.y-34, 'CLUB HIT '+clubHits+'/'+CLUB_KILL_HITS, '#ff2a4a', 18);
          showBanner('CLUB HIT!', (CLUB_KILL_HITS-clubHits)+' more hit'+((CLUB_KILL_HITS-clubHits)===1?'':'s')+' and you are dead — dodge the swing!', 1.6);
        }
      }
      if (mc.travel >= mc.P){
        mc.scale = 0; mc.state = 'cooldown';
        if (mc.chainLeft > 0){ mc.chainLeft--; mc.t = CLUB_CHAIN_GAP; }          // next attack of the chain
        else { mc.chainLeft = CLUB_CHAIN - 1; mc.t = 1.6 + Math.random()*0.9; } // chain done -> long cooldown
      }
    }
    return false;
  }

  function spawnEnemy(){
    const theme = currentTheme();
    // spawn ahead (above) the player, occasionally flanking from the sides
    const ahead = Math.random() < 0.82;
    let x, y;
    if (ahead){

      y = player.y - (260 + Math.random()*520);

    y = Math.max(gateY+40, y);
    // steer clear of the cobra's own footprint — its hood/body is tall and wide, so a spawn

    // Everywhere else around it is still fair game.
    if (cobra){
      const exMinY = cobra.y - 900, exMaxY = cobra.y + 100, exHalfW = 260;
      if (y > exMinY && y < exMaxY && Math.abs(x - cobra.x) < exHalfW){

        x = pushLeft ? Math.max(30, cobra.x - exHalfW - 40) : Math.min(WORLD.w-30, cobra.x + exHalfW + 40);
      }
    }
    const tough = Math.random() < Math.min(0.1 + wave*0.03, 0.42);
    const hidden = Math.random() < 0.55; // ambush: concealed until player is close
    // Disc Thrower — a rare, very deadly enemy that hurls a white shield-breaking disc.
    // It shatters the shield outright on a block instead of just bouncing off it.
    const discThrower = tough && zoneNum >= 1 && Math.random() < 0.22;
    enemies.push({
      x, y, r: discThrower ? 21 : (tough?20:14),
      hp: tough ? 60 + wave*9 : 24 + wave*5,
      maxHp: tough ? 60 + wave*9 : 24 + wave*5,

      revealR: 210 + (tough?40:0)
    });
  }

  // Elite Officer Squad — five enemy soldiers dressed like the army officer himself (black
  // uniform, red boots, red helmet, white gun), planted on the road well before the little
  // giants so the player fights a human squad first, not just demons.
  // Spawns one wave of `count` enemy officers in a line blocking the road just ahead of
  // wherever the player currently is (works for the first squad AND every later wave, so
  // the 100-officer total keeps meeting the player as they push through the demon/giants).
  // Squad roles — cycled through so any wave size gets a mix instead of one flat line:
  // flankLeft/flankRight box the road in from both sides, front holds the road ahead,
  // rear sneaks in behind the officer (pincer), holdCover plants at the roadside, stays
  // concealed like an ambusher, and doesn't rush in once revealed — it holds its ground
  // and fires from range instead of charging.
  const ELITE_ROLES = ['flankLeft','flankRight','front','rear','holdCover'];
  function spawnEliteWave(count, y){
    if (y === undefined) y = player.y - (340 + Math.random()*160);
    // engagement order — shuffled so it isn't always the same role that moves first —
    // each officer holds its spawn spot completely still and silent until its turn comes
    // up, so the squad commits one at a time instead of the whole wave charging together.
    const engageOrder = [];
    for (let i=0;i<count;i++) engageOrder.push(i);
    for (let i=engageOrder.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      const tmp = engageOrder[i]; engageOrder[i] = engageOrder[j]; engageOrder[j] = tmp;
    }
    for (let i=0;i<count;i++){
      const role = ELITE_ROLES[i % ELITE_ROLES.length];
      let x, ey = y, hidden = false, holdPosition = false;
      if (role === 'flankLeft'){
        x = WORLD.w/2 - (200 + Math.random()*140);
      } else if (role === 'flankRight'){
        x = WORLD.w/2 + (200 + Math.random()*140);
      } else if (role === 'front'){
        x = WORLD.w/2 + (Math.random()*90-45);
        ey = y - (60 + Math.random()*80); // further up the road, ahead of the rest
      } else if (role === 'rear'){
        x = WORLD.w/2 + (Math.random()*90-45);
        ey = player.y + (180 + Math.random()*120); // spawns behind the officer — pincer
      } else { // holdCover
        x = WORLD.w/2 + (i%2===0 ? -1 : 1)*(160 + Math.random()*100);
        hidden = true; holdPosition = true;
      }
      x = Math.max(50, Math.min(WORLD.w-50, x));
      const turn = engageOrder[i];
      enemies.push({
        x, y: ey, r: 17,
        hp: 450, maxHp: 450, // takes exactly 25 hits from the starting pistol (18 dmg each)
        speed: 70, dmg: 12,
        color: '#0d0d0d', tint: currentTheme().enemyTint,
        atkCd: 0, rangedCd: 0, muzzleFlash: 0, // fires the instant it's in range — no warm-up delay
        tough: true, discThrower: false, hidden: hidden, revealR: 240,
        eliteOfficer: true, role: role, holdPosition: holdPosition,
        engageDelay: turn * (1.1 + Math.random()*0.5) // stands frozen at its spot until this expires
      });
    }
  }
