      if (!consumed && tornado && b.weapon === 'diamondArrow' && desertFight.state === 1 && desertFight.breakerPhase){
        const dist = Math.hypot(tornado.x - b.x, tornado.y - b.y);
        if (dist < 200){
          tornado.arrowHits = (tornado.arrowHits || 0) + 1;
          addParticles(b.x, b.y, '#00ffff', 30);
          addFloatText(tornado.x, tornado.y - 40, 'ARROW ' + Math.min(tornado.arrowHits, tornadoHitsNeeded) + '/' + tornadoHitsNeeded, '#00ffff', 16);
          addShake(6, 0.2);
          SFX.hit();
          consumed = true;
          if (tornado.arrowHits >= tornadoHitsNeeded){
            SFX.boom(1.2);
            SFX.windLoopStop();
            addParticles(tornado.x, tornado.y, '#00eaff', 50);
            addFloatText(tornado.x, tornado.y, 'TORNADO DESTROYED!', '#00ffff', 20);
            showBanner('✨ बवंडर खत्म!', 'अब गेट तोड़ दो!', 2.0);
            tornado = null;
            tornadoTimer = Infinity;
            desertFight.state = 2; // arrow kill instantly clears the breaker line — no more waiting on the timer
            weaponAmmo.diamondArrow = 0;
            if (player.weapon === 'diamondArrow') autoSwitchWeapon();
          }
        }
      }

      // vs gate — while the sealed gothic gate stands, bullets slam into the stone;
      // break it down and the guardian is revealed right behind it
      // GATE CAN ONLY BREAK AFTER LITTLE GIANTS AND DEMON HAVE ACTUALLY SPAWNED AND BEEN
      // DEFEATED — littleGiantsSpawned is required too, not just an empty littleGiants array,
      // otherwise the gate could be shot down during the 20s window before they even appear
      // (that empty-array-before-spawn gap was the bug that let the gate break too early)
      if (!consumed && gate && gate.active && !gate.broken && gameState === 'zone' && littleGiantsSpawned && littleGiants.length === 0 && !demon && !(desertFight.state === 1 && desertFight.breakerPhase)){ // v123: the desert gate stays sealed until the tornado is destroyed
        const gateIsDesert = currentTheme().name === 'DESERT'; // the Desert's ring-portal gate is much bigger
        const gateHalfW = (gateIsDesert ? 340 : 220)*gateVisScale, gateReach = (gateIsDesert ? 690 : 400)*gateVisScale;
        if (b.y <= gateY + 72 && b.y >= gateY - gateReach && b.x > WORLD.w/2 - gateHalfW && b.x < WORLD.w/2 + gateHalfW){ // v115: bigger royal chakra
          const gateHit = (b.weapon === 'burst13') ? 1 : 5; // burst gun: 1000 bullets, every other weapon: 200 bullets
          gate.hp -= gateHit;
          gate.flashUntil = performance.now() + 90; // brief red flash on the chakra
          addParticles(b.x, gateY, '#ff3a2a', 5);
          addFloatText(b.x, gateY-10, '-'+gateHit, '#ff6a5a', 12);
          SFX.hit();
          consumed = true;
          if (gate.hp <= 0){
            gate.hp = 0;
            gate.broken = true;
            addParticles(WORLD.w/2, gateY-180, '#ff3a2a', 60);
            addParticles(WORLD.w/2, gateY-20, '#8a1010', 22);
            addShake(14, 0.35);
            SFX.kill(true);
            showBanner('GATE BROKEN!', 'The guardian is revealed...', 1.4);
            SFX.windLoopStop();
            tornado = null; tornadoTimer = Infinity;
            if (currentTheme().name === 'DESERT') spawnTornado(true); // a tornado tears through the broken gate — Desert zone only
            gameState = 'gateOpening';
            gateBreakTimer = 1.6;
            gateOpeningT = 0; // v121: start of the proper guardian entrance sequence
          }
        }
      }

      // vs boss
      if (!consumed && boss && boss.hp > 0 && !boss.entering && !b.hitBoss){
        const db = Math.hypot(boss.x-b.x, boss.y-b.y);
        if (db < boss.r + b.r){
          boss.hp -= b.dmg;
          boss.hitFlash = boss.warden ? 0.035 : 0.08;
          addParticles(b.x,b.y,'#ffdd66',4);
          addFloatText(b.x, b.y-8, '-'+Math.round(b.dmg), '#ff9ecf', 13);
          addShake(2.2, 0.07);
          SFX.hit();
          if (!b.pierce){ consumed = true; }
          else { b.hitBoss = true; b.pierce--; if (b.pierce <= 0) consumed = true; }
          if (boss.hp <= 0){
            boss.hp = 0;
            addParticles(boss.x,boss.y,'#ffb347',40);
            score += 200 + difficulty()*50;
            SFX.kill(true);
            addShake(16, 0.4);
            triggerHitStop(0.09);
            breakGate();
          }
        }
      }

      // vs fire demon (planted on the road between the two little giants) — a fixed 50-hit
      // count destroys it, whatever weapon lands the shots; the 50th triggers a huge blast
      if (!consumed && demon){
        const gt = demon;
        if (!(b._hitSet && b._hitSet.has(gt))){
          const dgt = Math.hypot(gt.x-b.x, gt.y-b.y);
          if (!gt.isDescending && dgt < gt.r + b.r){
            gt.hits = (gt.hits||0) + 1;
            gt.hitFlash = 0.08;
            addParticles(b.x,b.y,'#ff8a3d',5);
            addFloatText(b.x, b.y-8, gt.hits+'/'+gt.maxHits, '#ff8a3d', 13);
            SFX.hit();
            if (gt.hits >= gt.maxHits){
              addParticles(gt.x,gt.y,'#ff8a3d',44);
              addParticles(gt.x,gt.y,'#ff2e2e',30);
              addFloatText(gt.x, gt.y-40, 'DEMON BANISHED!', '#ff8a3d', 20);
              score += 300 + difficulty()*30;
              SFX.megaBoom();
              addShake(22, 0.55);
              triggerHitStop(0.14);
              demon = null;
              if (littleGiants.length === 0) showBanner('GIANTS DOWN', 'The road ahead is clear!', 1.6);
            }
            if (!b.pierce){ consumed = true; }
            else {
              if (!b._hitSet) b._hitSet = new Set();
              b._hitSet.add(gt);
              b.pierce--;
              if (b.pierce <= 0) consumed = true;
            }
          }
        }
      }

      if (!consumed){
        for (let j=littleGiants.length-1;j>=0;j--){
          const g = littleGiants[j];
          if (b._hitSet && b._hitSet.has(g)) continue;
          const dg = Math.hypot(g.x-b.x, g.y-b.y);
          if (!g.isDescending && dg < g.r + b.r){
            const isRocket = rocketAdopted;
            const dealt = (g.armored && !isRocket) ? Math.max(1, Math.round(b.dmg*0.12)) : Math.round(b.dmg);
            g.hp -= dealt;
            g.hitFlash = 0.08;
            addParticles(b.x,b.y, isRocket ? '#ff5a2e' : '#ffdd66', isRocket ? 9 : 5);
            addFloatText(b.x, b.y-8, '-'+dealt+((g.armored && !isRocket) ? ' (resisted)' : ''), isRocket ? '#ff8a4c' : '#ff9ecf', isRocket ? 15 : 13);
            if (g.armored && !isRocket && !armorWarnShown){
              armorWarnShown = true;
              showBanner('THEIR HIDE RESISTS!', 'Only the Big Rocket can truly wound them.', 2.2);
            }
            SFX.hit();
            if (g.hp <= 0){
              g.hp = 0;
              addParticles(g.x,g.y,'#a86bd1',30);
              score += 150 + difficulty()*25;
              SFX.kill(true);
              addShake(9, 0.2);
              triggerHitStop(0.06);
              littleGiants.splice(j,1);
              if (littleGiants.length === 0 && !demon){
                showBanner('GIANTS DOWN', 'The road ahead is clear!', 1.6);
              }
            }
            if (!b.pierce){ consumed = true; }
            else {
              if (!b._hitSet) b._hitSet = new Set();
              b._hitSet.add(g);
              b.pierce--;
              if (b.pierce <= 0) consumed = true;
            }
            break;
          }
        }
      }

      // vs mirror guardian — any gunfire counts toward the 100 hits needed to shatter it;
      // shattering it drops the golden chakra the officer needs to actually kill the cobra.
      // The 13-pellet burst gun fires so many rounds per trigger pull that it was shredding
      // the mirror in just ~8 shots — so its pellets count for less: 1000 of its bullets to
      // break the mirror, same as every other weapon needing 100.
      if (!consumed && mirror){
        const dm = Math.hypot(mirror.x-b.x, mirror.y-b.y);
        if (dm < mirror.r + b.r){
          const mirrorInc = (b.weapon === 'burst13') ? (MIRROR_HITS_NEEDED/1000) : 1;
          mirror.hits += mirrorInc;
          mirror.hitFlash = 0.08;
          addParticles(b.x,b.y,'#d8f6ff',5);
          addFloatText(b.x, b.y-8, Math.min(Math.ceil(mirror.hits), mirror.hitsNeeded)+'/'+mirror.hitsNeeded, '#d8f6ff', 13);
          SFX.hit();
          if (!b.pierce){ consumed = true; }
          else { b.pierce--; if (b.pierce <= 0) consumed = true; }
          if (mirror.hits >= mirror.hitsNeeded - 0.0001){
            addParticles(mirror.x,mirror.y,'#d8f6ff',40);
            addParticles(mirror.x,mirror.y,'#ffd76e',30);
            addFloatText(mirror.x, mirror.y-60, 'MIRROR SHATTERED!', '#d8f6ff', 20);
            SFX.kill(true);
            addShake(16, 0.4);
            triggerHitStop(0.1);
            chakraOrb = { x: mirror.x, y: mirror.y, r: 20, bob: 0, spin: 0 };
            mirror = null;
            mirrorBeams = [];
            mirrorClub = null; clubHits = 0; // the club vanishes with the mirror
            showBanner('⚡ GOLDEN CHAKRA', 'Carry it back — only the chakra can end the cobra!', 2.6);
          }
        }
      }

      // vs incoming fiery arrows from the hidden archer — the officer can shoot them out
      // of the air before they land; a solid hit destroys the arrow outright
      if (!consumed){
        for (let k=enemyBullets.length-1; k>=0; k--){
          const eb = enemyBullets[k];
          if (eb.shape !== 'fspear') continue;
          const da = Math.hypot(eb.x-b.x, eb.y-b.y);
          if (da < eb.r + b.r + 4){
            addParticles(eb.x, eb.y, '#ffb52b', 12);
            addParticles(eb.x, eb.y, '#ff5a1f', 8);
            addFloatText(eb.x, eb.y-10, 'ARROW SHOT!', '#ffd76e', 12);
            SFX.arrowBreak();
            enemyBullets.splice(k,1);
            if (!b.pierce){ consumed = true; }
            else { b.pierce--; if (b.pierce <= 0) consumed = true; }
            break;
          }
        }
      }

      // vs black cobra (bursts from the road once the little giants fall) — its scales
      // resist ordinary gunfire; only the golden chakra deals full damage
      if (!consumed && cobra && cobra.state === 'active'){
        const cb = cobra;
        if (!(b._hitSet && b._hitSet.has(cb))){
          const dc = Math.hypot(cb.x-b.x, cb.y-b.y);
          if (dc < cb.r + b.r){
            const isChakra = b.weapon === 'chakra';
            if (isChakra){
              // exactly 3 chakra hits end the cobra, however much hp it nominally has —
              // each hit knocks off a clean third so the hp bar reads 2/3, 1/3, dead
              cb.chakraHits = (cb.chakraHits || 0) + 1;
              cb.hp = Math.max(0, Math.round(cb.maxHp * (1 - cb.chakraHits/3)));
              cb.hitFlash = 0.08;
              addParticles(b.x,b.y,'#3dff6e',5);
              addFloatText(b.x, b.y-8, '-'+Math.round(b.dmg), '#ffd76e', 13);
              SFX.hit();
            } else {
              // fully immune to anything but the chakra — sparks off its scales, zero damage
              addParticles(b.x,b.y,'#cfd4da',3);
              addFloatText(b.x, b.y-8, 'IMMUNE', '#7CFFA0', 12);
              SFX.hit();
              if (!cobraArmorWarnShown){
                cobraArmorWarnShown = true;
                showBanner('ITS SCALES RESIST!', 'Only the golden chakra can truly wound it.', 2.4);
              }
            }
            if (cb.hp <= 0){
              cb.hp = 0;
              addParticles(cb.x,cb.y,'#111318',26);
              addParticles(cb.x,cb.y,'#3dff6e',24);
              addFloatText(cb.x, cb.y-60, 'COBRA SLAIN!', '#3dff6e', 20);
              score += 260 + difficulty()*35;
              SFX.kill(true);
              addShake(16, 0.4);
              triggerHitStop(0.1);
              cobra = null;
              cobraDelayTimer = 20; // 20 seconds of the officer advancing/fighting regular enemies before the little giants show up
              // job done — the chakra has no more purpose, so it disappears completely:
              // button hidden, weapon forgotten, ammo cleared, back to plain bullets
              chakraBtn.classList.add('hidden');
              chakraBtn.classList.remove('active','depleted');
              const chakraIdx = unlockedWeapons.indexOf('chakra');
              if (chakraIdx !== -1) unlockedWeapons.splice(chakraIdx, 1);
              weaponAmmo.chakra = 0;
              if (player.weapon === 'chakra') player.weapon = 'pistol';
              showBanner('COBRA DOWN', 'The road to the gate is clear!', 1.6);
            }
            if (!b.pierce){ consumed = true; }
            else {
              if (!b._hitSet) b._hitSet = new Set();
              b._hitSet.add(cb);
              b.pierce--;
              if (b.pierce <= 0) consumed = true;
            }
          }
        }
      }

      if (!consumed && !demon){ // v121: force-hidden enemies can't be hit while the middle giant lives
        for (let j=enemies.length-1;j>=0;j--){
          const e = enemies[j];
          if (b._hitSet && b._hitSet.has(e)) continue;
          const d = Math.hypot(e.x-b.x, e.y-b.y);
          if (d < e.r + b.r){
            e.hidden = false;
            e.hp -= b.dmg;
            addParticles(b.x,b.y, '#ffdd66', 4);
            addFloatText(b.x, b.y-8, '-'+Math.round(b.dmg), '#ffe27a', e.tough?14:12);
            if (e.hp <= 0){
              addParticles(e.x,e.y, e.color, 14);
              enemies.splice(j,1);
              score += e.tough ? 30 : 10;
              SFX.kill(e.tough);
              addShake(e.tough ? 6 : 3, e.tough ? 0.15 : 0.08);
              if (e.tough) triggerHitStop(0.045);
              comboCount++;
              comboTimer = 1.6;
              if (comboCount >= 2){
                addFloatText(player.x, player.y-70, 'x'+comboCount+' KILL!', '#ff6ec7', 19);
              }
            } else {
              SFX.hit();
            }
            if (!b.pierce){ consumed = true; }
            else {
              if (!b._hitSet) b._hitSet = new Set();
              b._hitSet.add(e);
              b.pierce--;
              if (b.pierce <= 0) consumed = true;
            }
            break;
          }
        }
      }
      if (consumed){ bullets.splice(i,1); }
    }

    // enemies
    eliteGlobalFireCd -= dt; // shared turn timer so officers fire one at a time, not as a volley
    for (let i=enemies.length-1;i>=0;i--){
      if (demon) break; // v121: FORCE HIDE — every enemy stays frozen, silent and unseen until the middle giant (fire demon) is dead
      const e = enemies[i];
      const dx = player.x - e.x, dy = player.y - e.y;
      const d = Math.hypot(dx,dy) || 1;

      // concealed ambush enemies stay put and invisible-ish until the player gets close
      if (e.hidden){
        if (d < e.revealR){ e.hidden = false; SFX.enemyShoot(); }
        continue;
      }

      // squad hasn't committed this officer yet — it stands frozen at its spot, doesn't
      // move and doesn't fire, until its turn in the engagement order comes up, so the
      // whole wave doesn't charge in as one mob.
      if (e.eliteOfficer && e.engageDelay > 0){
        e.engageDelay -= dt;
        continue;
      }

      // holdCover officers plant themselves on the road and don't rush in — they only
      // close the gap a little once the player is already fairly close, otherwise they
      // hold ground and fight at range like a soldier using cover.
      if (!(e.holdPosition && d > 300)){
        e.x += (dx/d)*e.speed*dt;
        e.y += (dy/d)*e.speed*dt;
      }

      // separation — nudge apart from any other nearby enemy so a whole wave doesn't
      // collapse into one overlapping stack while everyone beelines for the same player
      // position (each is still cheap since only a handful of enemies are alive at once).
      let sepX = 0, sepY = 0;
      for (let k=0;k<enemies.length;k++){
        if (k===i) continue;
        const o = enemies[k];
        if (o.hidden) continue;
        const ox = e.x-o.x, oy = e.y-o.y;
        const od = Math.hypot(ox,oy) || 0.001;
        const minD = e.r + o.r + 16;
        if (od < minD){
          sepX += (ox/od) * (minD-od);
          sepY += (oy/od) * (minD-od);
        }
      }
      e.x += sepX*dt*2.4;
      e.y += sepY*dt*2.4;

      e.walkPhase = (e.walkPhase||0) + dt*8;
      e.atkCd -= dt;
      if (d < e.r + player.r + 6 && e.atkCd <= 0){
        e.atkCd = 0.7;
        player.hp -= e.dmg;
        addParticles(player.x,player.y,'#ff5555',8);
        addFloatText(player.x, player.y-30, '-'+e.dmg, '#ff5555', 13);
        SFX.hurt();
        addShake(4, 0.1);
        if (player.hp <= 0){ player.hp = 0; endGame(); return; }
      }

      // ranged firing (enemies shoot at player from a distance)
      e.rangedCd -= dt;
      if (e.muzzleFlash > 0) e.muzzleFlash -= dt;
      if (d < 520 && e.rangedCd <= 0){
        if (e.discThrower){
          // WHITE DISC — very deadly: shatters the shield outright if it's up, and hits hard if not
          e.rangedCd = 2.2 + Math.random()*0.6;
          e.muzzleFlash = 0.12;
          SFX.enemyShoot();
          enemyBullets.push({
            x: e.x + (dx/d)*e.r, y: e.y + (dy/d)*e.r,
            vx: (dx/d)*300, vy: (dy/d)*300,
            dmg: 42, r: 10, color:'#ffffff', life: 2.4, shape:'disc', shieldBreaker:true, spin: 0
          });
          showBanner('DISC INCOMING', 'A white disc will shatter your shield!', 1.2);
        } else if (e.eliteOfficer){
          // one officer fires at a time (eliteGlobalFireCd gates every officer at once) —
          // damage tuned so the officer drops the player in exactly 10 hits (100/10)
          if (eliteGlobalFireCd <= 0){
            e.rangedCd = 0.5 + Math.random()*0.3;
            eliteGlobalFireCd = 0.3 + Math.random()*0.2; // pause before the next officer's turn
            e.muzzleFlash = 0.08;
            SFX.enemyShoot();
            enemyBullets.push({
              x: e.x + (dx/d)*e.r, y: e.y + (dy/d)*e.r,
              vx: (dx/d)*360, vy: (dy/d)*360,
              dmg: 10, r: 4.5, color: '#f0f0f0', life: 1.8
            });
          }
          // else: not this officer's turn yet — rangedCd is left at 0 so it fires the
          // instant the shared turn cooldown clears, instead of waiting a full reload
        } else {
          e.rangedCd = e.tough ? 1.5 + Math.random()*0.5 : 1.0 + Math.random()*0.4;
          e.muzzleFlash = 0.08;
          SFX.enemyShoot();
          const spd = e.tough ? 260 : 320;
          enemyBullets.push({
            x: e.x + (dx/d)*e.r, y: e.y + (dy/d)*e.r,
            vx: (dx/d)*spd, vy: (dy/d)*spd,
            dmg: e.tough ? 11 : 6, r: 4,
            color: e.tough ? '#ff6b6b' : '#ffa66b', life: 1.8
          });
        }
      }
    }

    // little-giant mini-bosses guarding the road — melee (knife/club) up close, ranged
    // (spear/arrow/fireball/poisonous snake) at range, each telegraphed before it lands
    for (let i=littleGiants.length-1;i>=0;i--){
      const g = littleGiants[i];
      if (g.hitFlash > 0) g.hitFlash -= dt;
      
      // DESCENT ANIMATION — slowly lower from sky with easing
      if (g.isDescending && g.descendTimer < g.descendDuration){
        g.descendTimer += dt;
        const progress = g.descendTimer / g.descendDuration;
        // ease-out cubic for natural heavy landing feel
        // gentle ease-in-out (smoothstep): drifts down slowly, barely moving at the very start and end
        const easeProgress = progress >= 1 ? 1 : progress*progress*(3 - 2*progress);
        g.y = g.startY + (g.targetY - g.startY) * easeProgress;
        
        // landing impact — lightning flash + screen shake + particles
        if (progress >= 1.0){
          g.isDescending = false;
          // solid "HA HA HA HA HA" as this little giant slams down (each one a slightly different pitch)
          SFX.giantLaugh(i === 0 ? 1.0 : 1.15, i === 0 ? 0.3 : 0);
          // LIGHTNING STRIKE
          for (let lightning = 0; lightning < 4; lightning++){
            lightningBolts.push({
              startX: g.x + (Math.random()-0.5)*60,
              startY: g.y - 800,
              endX: g.x + (Math.random()-0.5)*40,
              endY: g.y - 200,
              life: 0.15 + Math.random()*0.1,
              maxLife: 0.25,
              width: 4 + Math.random()*3
            });
          }
          // screen shake on impact
          addShake(20, 0.5);
          // impact particles
          addParticles(g.x, g.y, '#ffff00', 40);
          addParticles(g.x, g.y, '#ffffff', 25);
          SFX.boom(0.6);
        }
      }
      
      const gdx = player.x - g.x, gdy = player.y - g.y;
      const gd = Math.hypot(gdx,gdy) || 1;
      g.faceDir = gdx < 0 ? -1 : 1;
      const meleeRange = g.r + player.r + 55;
      
      // HELICOPTER THREAT LOGIC: if helicopter is flying close, push giant back
      if (heli){
        const heliDist = Math.hypot(heli.x - g.x, heli.y - g.y);
        const threatRange = 200; // if heli is within this range, giant feels threatened
        if (heliDist < threatRange){
          // push giant away from helicopter's position
          const pushDir = Math.atan2(g.y - heli.y, g.x - heli.x);
          const pushForce = (1 - heliDist/threatRange) * 280 * dt; // stronger the closer helicopter is
          g.x += Math.cos(pushDir) * pushForce;
          g.y += Math.sin(pushDir) * pushForce;
        }
      }

      if (g.telegraph > 0){ // v119: giants now attack (ranged only) while still coming down from the sky
        // wound up and holding still so the attack reads clearly before it lands
        g.telegraph -= dt;
        if (g.pendingAttack === 'sword'){
          // the blade catches the light long before it swings — the officer senses it and
          // instinctively strafes clear on his own, no input needed, but he isn't guaranteed safe
          if (!g.swordDodgeDir) g.swordDodgeDir = (Math.random()<0.5 ? -1 : 1);
          player.x += g.swordDodgeDir * 185 * dt;
        }
        if (g.telegraph <= 0){
          const atk = g.pendingAttack;
          g.pendingAttack = null;
          g.swordDodgeDir = 0;
          if (atk === 'club'){
            if (gd < meleeRange + 20){
              player.hp -= 30;
              addParticles(player.x, player.y, '#ff5555', 12);
              addFloatText(player.x, player.y-30, '-30', '#ff5555', 15);
              SFX.hurt(); addShake(8, 0.2);
              if (player.hp <= 0){ player.hp = 0; endGame(); return; }
            }
          } else if (atk === 'knife'){
            if (gd < meleeRange){
              player.hp -= 17;
              addParticles(player.x, player.y, '#ff5555', 7);
              addFloatText(player.x, player.y-30, '-17', '#ff5555', 13);
              SFX.hurt(); addShake(3, 0.09);
              if (player.hp <= 0){ player.hp = 0; endGame(); return; }
            }
          } else if (atk === 'sword'){
            // shining sword — a clean melee hit is instant death; no shield can stop a blade
            const gdNow = Math.hypot(player.x-g.x, player.y-g.y);
            if (gdNow < meleeRange + 30){
              addParticles(player.x, player.y, '#fff6c9', 28);
              addFloatText(player.x, player.y-30, 'SHINING SWORD!', '#fff6c9', 20);
              SFX.hurt(); addShake(18, 0.45); triggerHitStop(0.1);
              player.hp = 0; endGame(); return;
            }
          } else if (atk === 'spear'){
            SFX.enemyShoot();
            enemyBullets.push({ x:g.x+(gdx/gd)*g.r, y:g.y+(gdy/gd)*g.r, vx:(gdx/gd)*440, vy:(gdy/gd)*440, dmg:32, r:7, color:'#ffe27a', life:2.2, shape:'gspear' });
          } else if (atk === 'arrow'){
            SFX.enemyShoot();
            // red sparking arrow — regular hit damage, but every hit (blocked by shield or not)
            // counts toward the 4-hit death tally
            enemyBullets.push({ x:g.x+(gdx/gd)*g.r, y:g.y+(gdy/gd)*g.r, vx:(gdx/gd)*540, vy:(gdy/gd)*540, dmg:19, r:5, color:'#ff2a2a', life:1.8, shape:'garrow', redSpark:true, sparkCd:0 });
          } else if (atk === 'fireball'){
            SFX.enemyShoot();
            enemyBullets.push({ x:g.x+(gdx/gd)*g.r, y:g.y+(gdy/gd)*g.r, vx:(gdx/gd)*240, vy:(gdy/gd)*240, dmg:25, r:11, color:'#ff7a3d', life:2.6, shape:'fireball', burns:true });
          } else if (atk === 'snake'){
            SFX.enemyShoot();
            enemyBullets.push({ x:g.x+(gdx/gd)*g.r, y:g.y+(gdy/gd)*g.r, vx:(gdx/gd)*170, vy:(gdy/gd)*170, dmg:13, r:8, color:'#5fdc6a', life:3.4, shape:'snake', poisons:true, wiggle:Math.random()*Math.PI*2 });
          }
          // shots fired from high up in the sky must live long enough to actually reach the officer
          if (g.isDescending && (atk==='spear'||atk==='arrow'||atk==='fireball'||atk==='snake')){
            const eb = enemyBullets[enemyBullets.length-1];
            if (eb) eb.life = Math.max(eb.life, gd/Math.max(1,Math.hypot(eb.vx,eb.vy)) + 0.8);
          }
        }
      } else {
        g.atkCd -= dt;
        g.idle = (g.idle||0) + dt;
        // static — the demons plant themselves on the road and never give chase; they only
        // fight with melee if the officer walks into range himself
        if (g.atkCd <= 0){
          const inMelee = !g.isDescending && gd < meleeRange + 10; // airborne giants never melee
          const pool = inMelee ? ['knife','knife','club','sword'] : ['spear','arrow','fireball','snake'];
          g.pendingAttack = pool[Math.floor(Math.random()*pool.length)];
          g.telegraph = g.pendingAttack === 'sword' ? 1.0 : (g.pendingAttack === 'club' ? 0.85 : (g.pendingAttack === 'knife' ? 0.4 : 0.6));
          g.atkCd = inMelee ? 1.6 + Math.random()*0.6 : 2.0 + Math.random()*0.8;
        }
      }
    }

    // fire demon — parked on the road between the two little giants. Only the mouth attack is
    // live now (the eye-beam fire has been removed per request) — a heavier, unblockable
    // fireball breath that has to be dodged.
    if (demon){
      if (demon.hitFlash > 0) demon.hitFlash -= dt;
      
      // DEMON DESCENT ANIMATION
      if (demon.isDescending && demon.descendTimer < demon.descendDuration){
        demon.descendTimer += dt;
        const progress = demon.descendTimer / demon.descendDuration;
        const easeProgress = progress >= 1 ? 1 : progress*progress*(3 - 2*progress);
        demon.y = demon.startY + (demon.targetY - demon.startY) * easeProgress;
        
        // landing impact — major lightning display + massive screen shake
        if (progress >= 1.0){
          demon.isDescending = false;
          // the middle giant's landing laugh — deepest and biggest of the three
          SFX.giantLaugh(0.72, 0.15);
          // MASSIVE LIGHTNING STORM
          for (let lightning = 0; lightning < 8; lightning++){
            lightningBolts.push({
              startX: demon.x + (Math.random()-0.5)*150,
              startY: demon.y - 1000,
              endX: demon.x + (Math.random()-0.5)*100,
              endY: demon.y - 150,
              life: 0.2 + Math.random()*0.15,
              maxLife: 0.35,
              width: 6 + Math.random()*4
            });
          }
          // MASSIVE screen shake on demon impact
          addShake(35, 0.8);
          // massive impact particles
          addParticles(demon.x, demon.y, '#ffcc00', 60);
          addParticles(demon.x, demon.y, '#ffffff', 40);
          SFX.boom(1.2);
        }
      }
      
      demon.idle += dt;
      const tdx = player.x - demon.x, tdy = player.y - demon.y;
      demon.turretAngle = Math.atan2(tdy,tdx);
      // the demon always stands upright on the road (no turret-style body rotation)
      function demonLocalToWorld(lx, ly){
        return { x: demon.x + lx, y: demon.y + ly };
      }
      // mouth sits at a fixed local height above the demon's centre — matches where it's
      // actually drawn on the head in the draw pass below
      const mouthLocalY = -demon.r*1.15;

      // mouth — deadly fire-breath bolt on a slower cycle, ignores the shield entirely
      if (demon.mouthTelegraph > 0){ // v119: the demon breathes fire on the officer while still descending too
        demon.mouthTelegraph -= dt;
        if (demon.mouthT < demon.mouthTelegraph) demon.mouthT = demon.mouthTelegraph + 0.25; // winds the mouth open through the whole telegraph
        if (demon.mouthTelegraph <= 0){
          SFX.enemyShoot();
          demon.mouthT = 0.4;
          const mouthPos = demonLocalToWorld(0, mouthLocalY);
          const mx = mouthPos.x, my = mouthPos.y;
          const bdx = player.x-mx, bdy = player.y-my;
          const bd = Math.hypot(bdx,bdy) || 1;
          enemyBullets.push({
            x: mx, y: my, vx: (bdx/bd)*470, vy: (bdy/bd)*470,
            dmg: 48, r: 17, color:'#ff3b1f', life: 2.6, shape:'demonbreath', unblockable:true, burns: demon.skin !== 1,
            blue: demon.skin === 1
          });
          if (demon.isDescending){ const eb = enemyBullets[enemyBullets.length-1]; eb.life = Math.max(eb.life, bd/470 + 0.8); } // long fall from the sky — keep the breath alive until it reaches the officer
          addShake(6, 0.18);
        }
      } else {
        demon.mouthCd -= dt;
        if (demon.mouthCd <= 0){
          demon.mouthCd = 2.1 + Math.random()*0.9; // fires noticeably more often now
          demon.mouthTelegraph = 0.65; // longer wind-up — it can't be blocked, so it must be dodgeable
        }
      }
      if (demon.mouthTelegraph <= 0 && demon.mouthT > 0) demon.mouthT -= dt;
    }

    // black cobra — bursts from a crack in the road once the little giants fall, then rears
    // up and breathes green poisonous fire at the officer until it's brought down
    if (cobra){
      if (cobra.hitFlash > 0) cobra.hitFlash -= dt;
      cobra.sway += dt;
      cobra.crackReveal = Math.min(1, cobra.crackReveal + dt/0.7);
      if (cobra.state === 'rising'){
        cobra.riseT += dt;
        if (cobra.riseT >= cobra.riseDur){
          cobra.state = 'active';
          showBanner('BLACK COBRA', 'Green fire spews from its jaws!', 1.8);
        }
      } else if (cobra.state === 'active'){
        cobra.hoodT = Math.min(1, cobra.hoodT + dt*1.5);
        
        // Helper function to get exact mouth position
        const getMouthPos = () => {
          // Mouth center position - account for cobra's position and scaling
          const S = cobra.r/105;
          const headWave = Math.sin(cobra.sway*0.9) * 0.045;
          
          // Horizontal: slight sway with head movement
          const mx = cobra.x + S*40*Math.sin(headWave);
          
          // Vertical: directly at the mouth position (local y = -650)
          const my = cobra.y - S*COBRA_HEIGHT_SCALE*630;
          
          return {mx, my};
        };
        
        // ATTACK MODE 0: GREEN POISON PROJECTILE
        if (cobra.attackMode === 0){
          if (cobra.mouthTelegraph > 0){
            cobra.mouthTelegraph -= dt;
            if (cobra.mouthT < cobra.mouthTelegraph) cobra.mouthT = cobra.mouthTelegraph + 0.25;
            if (cobra.mouthTelegraph <= 0){
              SFX.enemyShoot();
              cobra.mouthT = 0.45;
              const {mx, my} = getMouthPos();
              const bdx = player.x-mx, bdy = player.y-my;
              const bd = Math.hypot(bdx,bdy) || 1;
              enemyBullets.push({
                x: mx, y: my, vx:(bdx/bd)*440, vy:(bdy/bd)*440,
                dmg: 19, r: 24, color:'#2dff5e', life: 2.6, shape:'demonbreath',
                poison: true, unblockable: true, poisons: true, solidPoison: true
              });
              addShake(6, 0.16);
              cobra.attackMode = 1; // next: flame stream
            }
          } else {
            cobra.mouthCd -= dt;
            if (cobra.mouthCd <= 0){
              cobra.mouthCd = 1.9 + Math.random()*0.9;
              cobra.mouthTelegraph = 0.6;
              if (Math.abs(player.x - cobra.x) < cobra.r*3.2) SFX.cobraHiss();
            }
          }
          if (cobra.mouthTelegraph <= 0 && cobra.mouthT > 0) cobra.mouthT -= dt;
        }
        
        // ATTACK MODE 1: RED FLAME STREAM (proper mouth position)
        else if (cobra.attackMode === 1){
          if (cobra.mouthTelegraph > 0){
            cobra.mouthTelegraph -= dt;
            if (cobra.mouthT < cobra.mouthTelegraph) cobra.mouthT = cobra.mouthTelegraph + 0.25;
            if (cobra.mouthTelegraph <= 0){
              SFX.enemyShoot();
              cobra.flameStreamActive = true;
              cobra.flameStreamTimer = cobra.flameStreamDuration;
              cobra.flameStreamCd = 0;
              cobra.mouthT = cobra.flameStreamDuration + 0.2;
            }
          } else if (cobra.flameStreamActive){
            cobra.flameStreamTimer -= dt;
            cobra.flameStreamCd -= dt;
            
            const {mx, my} = getMouthPos();
            
            if (cobra.flameStreamCd <= 0){
              const bdx = player.x - mx, bdy = player.y - my;
              const bd = Math.hypot(bdx, bdy) || 1;
              enemyBullets.push({
                x: mx, y: my, vx: (bdx/bd)*550, vy: (bdy/bd)*550,
                dmg: 8, r: 18, color: '#ff6633', life: 1.2, shape: 'fireball',
                burns: true, flaming: true, fromCobraFire: true
              });
              addParticles(mx, my, '#ff8844', 3);
              cobra.flameStreamCd = 0.05;
            }
            
            if (cobra.flameStreamTimer <= 0){
              cobra.flameStreamActive = false;
              cobra.attackMode = 0; // back to projectile — burn attack now triggers after 3 actual fire hits, not on a timer
              cobra.mouthCd = 2.0;
            }
          } else {
            cobra.mouthCd -= dt;
            if (cobra.mouthCd <= 0){
              cobra.mouthCd = 3.0;
              cobra.mouthTelegraph = 0.7;
              if (Math.abs(player.x - cobra.x) < cobra.r*3.2) SFX.cobraHiss();
            }
          }
          if (cobra.mouthTelegraph <= 0 && cobra.mouthT > 0) cobra.mouthT -= dt;
        }
        
        
        // BURN EFFECT: Officer is burning
        if (cobra.burnAttackActive){
          cobra.burnAttackTimer -= dt;
          player.burnTimer = Math.max(player.burnTimer, cobra.burnAttackTimer + 0.1);
          
          // Continuous massive fire particles — spread across the whole body (head/torso/legs), not one spot
          if (cobra.burnAttackTimer > 0){
            addParticles(player.x + (Math.random()-0.5)*30, player.y - 26 + (Math.random()-0.5)*10, '#ffaa00', 2); // head
            addParticles(player.x + (Math.random()-0.5)*36, player.y - 4 + (Math.random()-0.5)*14, '#ff6633', 2);  // torso
            addParticles(player.x + (Math.random()-0.5)*30, player.y + 20 + (Math.random()-0.5)*10, '#ff6633', 2); // legs
            addFloatText(player.x, player.y-50, Math.ceil(cobra.burnAttackTimer)+'s', '#ff6633', 18);
          }
          
          // DEATH AT 0 SECONDS
          if (cobra.burnAttackTimer <= 0){
            cobra.burnAttackActive = false;
            player.hp = 0;
            endGame();
            showBanner('💀 INCINERATED', 'Officer consumed by flames!', 2.0);
            addParticles(player.x, player.y, '#ff6633', 50);
            SFX.hurt();
          }
        }
      }
    }

    // mirror guardian — sits far off the edge of the road, spinning slowly and firing
    // silver beams once the officer is actually close enough to have found it; beams lock
    // onto wherever he's standing (telegraphed, so he can move off it). Any gunfire chips
    // away at its 100-hit break count.
    if (mirror){
      // fixed mount — no wall behind it any more
      if (mirror.hitFlash > 0) mirror.hitFlash -= dt;
      const distToMirror = Math.hypot(mirror.x-player.x, mirror.y-player.y);
      if (distToMirror < (mirror.locked ? Math.max(1200, VW*1.2) : 650)){ // v130: same landscape fix for the silver beams
        mirror.beamCd -= dt;
        if (mirror.beamCd <= 0){
          mirror.beamCd = 2.4 + Math.random()*1.3;
          mirrorBeams.push({ bx: mirror.x, by: mirror.y, timer: 0.6, firing: false, tx:0, ty:0 });
          SFX.enemyShoot();
        }
      }
      // hidden spearman opens fire the instant the officer actually heads off the road
      // toward the mirror (steps right past the normal lane), not only once it's broken
      if (!chakraAmbush && player.x > WORLD.w/2 + 225){
        chakraAmbush = { cd: 0.9 };
        showBanner('⚠ HIDDEN ARCHERS!', 'Flaming arrows incoming from the front — shoot them down!', 2.4);
      }
    }
    if (updateMirrorClub(dt)) return; // fatal club hit
    for (let i=mirrorBeams.length-1; i>=0; i--){
      const mb = mirrorBeams[i];
      if (!mb.firing){
        mb.timer -= dt;
        if (mb.timer <= 0){
          mb.firing = true;
          mb.tx = player.x; mb.ty = player.y; // locked to where he was standing when the telegraph ended
          mb.px = mb.bx; mb.py = mb.by; // the beam now actually flies out from the mirror
          const d = Math.hypot(mb.tx-mb.bx, mb.ty-mb.by) || 1;
          const beamSpeed = 1600;
          mb.vx = (mb.tx-mb.bx)/d * beamSpeed;
          mb.vy = (mb.ty-mb.by)/d * beamSpeed;
          mb.travelLeft = d / beamSpeed + 0.15; // small overshoot so it still connects if he barely dodges
        }
      } else {
        mb.px += mb.vx*dt; mb.py += mb.vy*dt; mb.travelLeft -= dt;
        if (!mb.hit){
          const dHit = Math.hypot(mb.px-player.x, mb.py-player.y);
          if (dHit < player.r + 16){
            mb.hit = true;
            if (player.shieldActive){
              addParticles(player.x, player.y, '#7CFC9E', 14);
              addShake(6, 0.16);
            } else {
              player.hp -= 16;
              addParticles(player.x, player.y, '#dfefff', 18);
              addFloatText(player.x, player.y-30, '-16', '#cdeeff', 15);
              SFX.hurt();
              addShake(9, 0.2);
              if (player.hp <= 0){ player.hp = 0; endGame(); return; }
            }
          }
        }
        if (mb.travelLeft <= 0) mirrorBeams.splice(i,1);
      }
    }

    // boss behavior (giant gate guardian with a few "super power" attacks)
    if (boss && boss.hp > 0 && !boss.entering){ // v121: silent and passive while it is still climbing out
      if (boss.hitFlash > 0) boss.hitFlash -= dt;
      if (boss.muzzleFlash > 0) boss.muzzleFlash -= dt;
      const rate = boss.rate || 1, pw = boss.pow || 1;
      const wl = boss.weaponLevel + (boss.warden ? 1 : 0); // the Warden starts one weapon tier ahead

      // WEAPON ESCALATION — the giant only fights with its guns at first (weapon 1); as its
      // health drops it unlocks one more weapon at a time, up to all 7, growing deadlier.
      {
        const hpFrac = boss.hp / boss.maxHp;
        let lvl = 1;
        if (hpFrac <= 6/7) lvl = 2;
        if (hpFrac <= 5/7) lvl = 3;
        if (hpFrac <= 4/7) lvl = 4;
        if (hpFrac <= 3/7) lvl = 5;
        if (hpFrac <= 2/7) lvl = 6;
        if (hpFrac <= 1/7) lvl = 7;
        if (lvl > boss.weaponLevel){
          boss.weaponLevel = lvl;
          showBanner('GUARDIAN ENRAGED', 'Weapon ' + lvl + ' unleashed!', 1.6);
          addShake(8, 0.2);
        }
        // BLOODLUST — below 40% hp the Warden goes berserk: everything comes even faster
        if (boss.warden && !boss.raged && hpFrac <= 0.4){
          boss.raged = true;
          boss.rate = 1.8;
          boss.vx *= 1.25;
          showBanner('☠ BLOODLUST', 'The Warden is berserk — no mercy!', 2.0);
          addShake(14, 0.5);
          speakTaunt('Die');
        }
      }

      // slow smoke drifting off the guardian's frame
      boss.smokeCd -= dt;
      if (boss.smokeCd <= 0){
        boss.smokeCd = 0.22;
        boss.smoke.push({
          ox: (Math.random()-0.5)*boss.r*1.6,
          oy: -boss.r*0.3 + Math.random()*20,
          rad: 6+Math.random()*10,
          speed: 14+Math.random()*10,
          drift: (Math.random()-0.5)*6,
          age: 0, life: 2.2+Math.random()*1.0
        });
      }
      for (let si=boss.smoke.length-1; si>=0; si--){
        const p = boss.smoke[si];
        p.age += dt;
        p.oy -= p.speed*dt;
        p.ox += p.drift*dt;
        if (p.age >= p.life) boss.smoke.splice(si,1);
      }

      if (boss.chargeState === 'idle'){
        // drift side to side tracking the player, guarding the gate line
        const targetX = Math.max(boss.r+20, Math.min(WORLD.w-boss.r-20, player.x));
        boss.x += Math.sign(targetX-boss.x) * Math.min(Math.abs(targetX-boss.x), boss.vx*dt);
        boss.y = (boss.homeY !== undefined ? boss.homeY : gateY - 260) + Math.sin(performance.now()/900)*14;
        // HEAVY FOOTFALLS — while the Warden walks, every step thumps the ground
        if (boss.warden && Math.abs(targetX-boss.x) > 6){
          boss.stompCd = (boss.stompCd||0) - dt;
          if (boss.stompCd <= 0){
            boss.stompCd = 0.7;
            addShake(3.5, 0.14);
            const footY = boss.homeY + boss.r*2.17;
            addParticles(boss.x - boss.r*0.3, footY, '#4a3c3c', 5);
            addParticles(boss.x + boss.r*0.3, footY, '#4a3c3c', 5);
          }
        }

        boss.burstCd -= dt*rate; boss.waveCd -= dt*rate;
        if (boss.burstCd <= 0 && boss.weaponLevel >= 1){
          boss.burstCd = 2.0 - Math.min(difficulty()*0.05, 1.0);
          boss.muzzleFlash = 0.15;
          SFX.enemyShoot();
          const shots = boss.warden ? 22 : 14;
          if (boss.warden) boss.burstRot = (boss.burstRot||0) + 0.21; // ring turns each volley so the gaps shift
          const burstOff = boss.burstRot || 0;
          for (let s=0;s<shots;s++){
            const a = (Math.PI*2/shots)*s + burstOff;
            enemyBullets.push({
              x: boss.x, y: boss.y, vx: Math.cos(a)*(boss.warden?300:260), vy: Math.sin(a)*(boss.warden?300:260),
              dmg: Math.round(14*pw), r: boss.warden ? 9 : 7, color:'#ff5577', life: 2.2
            });
          }

          // CRIMSON BLADE WAVE — the Warden's own signature: a wide fan of blood-red cuts hurled
          // from the greatsword straight at the officer (dodge sideways, or the shield eats them)
          if (boss.warden && boss.waveCd <= 0){
            boss.waveCd = 3.6 + Math.random()*1.2;
            const baseW = Math.atan2(player.y-boss.y, player.x-boss.x);
            const nW = boss.raged ? 11 : 7;
            for (let w=0; w<nW; w++){
              const aw = baseW + (w-(nW-1)/2)*0.17;
              enemyBullets.push({
                x: boss.x, y: boss.y - boss.r*0.2, vx: Math.cos(aw)*400, vy: Math.sin(aw)*400,
                dmg: Math.round(18*pw), r: 12, color:'#ff2233', life: 2.4
              });
            }
            showBanner('BLADE WAVE', 'Crimson cuts incoming — sidestep!', 0.9);
            addShake(6, 0.15);
          }
        }

        // heavy cannon shot — WEAPON 2, slow but hard-hitting, aimed straight at the player
        boss.cannonCd -= dt*rate;
        if (boss.cannonCd <= 0 && wl >= 2){
          boss.cannonCd = 4 - Math.min(difficulty()*0.08, 1.6);
          boss.muzzleFlash = 0.22;
          SFX.enemyShoot();
          const dxc = player.x-boss.x, dyc = player.y-boss.y;
          const dc = Math.hypot(dxc,dyc)||1;
          const nC = boss.warden ? 3 : 1;
          const baseC = Math.atan2(dyc,dxc);
          for (let ci=0; ci<nC; ci++){
            const ca = baseC + (ci-(nC-1)/2)*0.2;
            enemyBullets.push({
              x: boss.x, y: boss.y, vx: Math.cos(ca)*300, vy: Math.sin(ca)*300,
              dmg: Math.round((34 + difficulty()*3)*pw), r: boss.warden ? 17 : 14, color:'#b366ff', life: 3
            });
          }
          addShake(3, 0.1);
        }

        // WEAPON THROW — WEAPON 3: the giant physically hurls a spinning axe at the officer
        boss.axeCd -= dt*rate;
        if (boss.axeCd <= 0 && wl >= 3){
          boss.axeCd = 3.4 - Math.min(difficulty()*0.06, 1.4);
          const dxa = player.x-boss.x, dya = player.y-boss.y;
          const da = Math.hypot(dxa,dya)||1;
          enemyBullets.push({
            x: boss.x, y: boss.y - boss.r*0.3, vx:(dxa/da)*360, vy:(dya/da)*360,
            dmg: Math.round((30 + difficulty()*3)*pw), r: boss.warden ? 22 : 16, color:'#cfd4da', life: 2.4, shape:'axe', spin: 0
          });
          showBanner('WEAPON THROW', 'Giant axe incoming — dodge it!', 1.0);
          SFX.enemyShoot();
        }

        // triple missile volley — WEAPON 4: a spread of fast homing-style rockets
        boss.missileCd -= dt*rate;
        if (boss.missileCd <= 0 && wl >= 4){
          boss.missileCd = 5.5 - Math.min(difficulty()*0.08, 2.5);
          boss.muzzleFlash = 0.3;
          SFX.enemyShoot();
          const dxm = player.x-boss.x, dym = player.y-boss.y;
          const baseA = Math.atan2(dym,dxm);
          const spreadShots = boss.warden ? 5 : 3;
          for (let s=0;s<spreadShots;s++){
            const a = baseA + (s-(spreadShots-1)/2)*0.22;
            enemyBullets.push({
              x: boss.x, y: boss.y, vx: Math.cos(a)*340, vy: Math.sin(a)*340,
              dmg: Math.round((26 + difficulty()*2)*pw), r: 10, color:'#ff9933', life: 2.6
            });
          }
          addShake(4, 0.12);
        }

        // TITAN GROUND SLAM — WEAPON 5: a pounding shockwave ring that expands outward
        // from the guardian and must be dodged, not shot down.
        boss.slamCd -= dt*rate;
        if (boss.slamCd <= 0 && wl >= 5){
          boss.slamCd = 6.5 - Math.min(difficulty()*0.1, 3);
          shockwaves.push({ x: boss.x, y: boss.y, r: boss.r*0.6, maxR: boss.warden ? 460 : 340, speed: boss.warden ? 520 : 460, dmg: Math.round((30 + difficulty()*2)*pw), hitPlayer: false });
          showBanner('TITAN SLAM', 'Get clear of the shockwave!', 1.1);
          addShake(10, 0.3);
          SFX.kill(false);
        }

        // WEAPON 6 — the charging rush attack
        boss.chargeCd -= dt*rate;
        if (boss.chargeCd <= 0 && wl >= 6){
          boss.chargeState = 'telegraph'; boss.chargeTimer = 0.6;
          showBanner('GUARDIAN', 'I WILL DESTROY YOU!', 1.1);
          speakTaunt('I will destroy you');
        }

        // FIRE BREATH — WEAPON 7, the giant's deadliest gun-based weapon: ONE large sparking
        // fireball spat from its mouth, locked onto where the player was standing. It punches
        // straight through shields — the only escape is to physically move out of its path.
        if (boss.fireState === 'idle'){
          boss.fireCd -= dt*rate;
          if (boss.fireCd <= 0 && wl >= 7){
            boss.fireState = 'telegraph';
            boss.fireTimer = 1.0;
            const dxf = player.x-boss.x, dyf = player.y-(boss.y-boss.r*1.0);
            boss.fireAngle = Math.atan2(dyf,dxf);
            showBanner('FIRE BREATH', "Shield won't save you — MOVE NOW!", 1.3);
            speakTaunt('Burn');
          }
        } else if (boss.fireState === 'telegraph'){
          boss.fireTimer -= dt;
          if (boss.fireTimer <= 0){
            boss.fireState = 'breathing';
            const mx = boss.x + Math.cos(boss.fireAngle)*boss.r*0.15;
            const my = (boss.y-boss.r*1.0) + Math.sin(boss.fireAngle)*boss.r*0.15;
            boss.fireBall = {
              x: mx, y: my,
              vx: Math.cos(boss.fireAngle)*520, vy: Math.sin(boss.fireAngle)*520,
              r: 24, dist: 0, hit: false
            };
            addShake(7, 0.22);
            SFX.enemyShoot();
          }
        } else if (boss.fireState === 'breathing'){
          const fb = boss.fireBall;
          if (fb){
            fb.x += fb.vx*dt; fb.y += fb.vy*dt;
            fb.dist += Math.hypot(fb.vx*dt, fb.vy*dt);
            // sparks trailing off the single fireball as it flies — this is the "sparking" look
            if (Math.random() < 0.9){
              fireGouts.push({
                x: fb.x + (Math.random()-0.5)*fb.r, y: fb.y + (Math.random()-0.5)*fb.r,
                vx: -fb.vx*0.12 + (Math.random()-0.5)*80, vy: -fb.vy*0.12 + (Math.random()-0.5)*80,
                wob: Math.random()*Math.PI*2,
                size: 5+Math.random()*8,
                life: 0.2+Math.random()*0.2, maxLife: 0.4,
                color: Math.random()<0.5 ? '#ffcf5a' : '#ff7a1f'
              });
            }
            if (!fb.hit){
              const dP = Math.hypot(player.x-fb.x, player.y-fb.y);
              if (dP < fb.r+player.r){
                fb.hit = true;
                // ignores the shield entirely — dodging is the only defense
                const fbDmg = Math.round(34*pw);
                player.hp -= fbDmg;
                player.burnTimer = 0.5;
                addParticles(fb.x,fb.y,'#ff7a1f',26);
                addParticles(fb.x,fb.y,'#ffcf5a',14);
                addFloatText(player.x, player.y-30, '-'+fbDmg, '#ffb347', 16);
                SFX.hurt();
                addShake(10, 0.25);
                triggerHitStop(0.05);
                if (player.hp <= 0){ player.hp=0; endGame(); return; }
              }
            }
            if (fb.hit || fb.dist > FIRE_BREATH_RANGE){
              if (fb.dist > FIRE_BREATH_RANGE && !fb.hit){ addParticles(fb.x,fb.y,'#ff7a1f',10); }
              boss.fireBall = null;
              boss.fireState = 'idle';
              boss.fireCd = 8.5 - Math.min(difficulty()*0.1, 3.5);
            }
          } else {
            boss.fireState = 'idle';
            boss.fireCd = 8.5 - Math.min(difficulty()*0.1, 3.5);
          }
        }

        // COBRA FANG — Crimson Warden's signature kill move: a long serpentine shaft of
        // cherry-red fire erupts from the glowing chest gem and lashes out at the officer.
        // Ignores the shield entirely; six clean hits are lethal.
        if (boss.warden){
          if (boss.cobraState === 'idle'){
            boss.cobraCd -= dt*rate;
            if (boss.cobraCd <= 0 && wl >= 4){
              boss.cobraState = 'telegraph';
              boss.cobraTimer = 0.9;
              boss.cobraHit = false;
              showBanner('☠ COBRA FANG', 'A serpent of fire is coiling — RUN!', 1.3);
              speakTaunt('Taste my venom');
            }
          } else if (boss.cobraState === 'telegraph'){
            boss.cobraTimer -= dt;
            if (boss.cobraTimer <= 0){
              const originX = boss.x, originY = boss.y - boss.r*0.565; // the chest gem
              boss.cobraOX = originX; boss.cobraOY = originY;
              boss.cobraAngle = Math.atan2(player.y-originY, player.x-originX);
              boss.cobraMaxLen = Math.hypot(player.x-originX, player.y-originY) + 260; // overshoot so backing off doesn't cheat it
              boss.cobraLen = 0;
              boss.cobraState = 'extend';
              boss.cobraTimer = 0.22; // fast whip-out, like a striking snake
              addShake(9, 0.25);
              SFX.enemyShoot();
            }
          } else if (boss.cobraState === 'extend'){
            boss.cobraTimer -= dt;
            boss.cobraPhase += dt*10;
            boss.cobraLen = boss.cobraMaxLen * (1 - Math.max(0, boss.cobraTimer)/0.22);
            checkCobraHit();
            if (boss.cobraTimer <= 0){ boss.cobraState = 'hold'; boss.cobraTimer = 0.55; }
          } else if (boss.cobraState === 'hold'){
            boss.cobraTimer -= dt;
            boss.cobraPhase += dt*10;
            checkCobraHit();
            if (boss.cobraTimer <= 0){ boss.cobraState = 'retract'; boss.cobraTimer = 0.3; }
          } else if (boss.cobraState === 'retract'){
            boss.cobraTimer -= dt;
            boss.cobraPhase += dt*10;
            boss.cobraLen = boss.cobraMaxLen * Math.max(0, boss.cobraTimer/0.3);
            if (boss.cobraTimer <= 0){
              boss.cobraState = 'idle';
              boss.cobraCd = 8.5 - Math.min(difficulty()*0.08, 3);
            }
          }
        }

        // FIVE-HEADED DRAGON BREATH — the giant's deadliest, last-resort weapon. Five
        // draconic heads erupt from its back and unleash a fanned wall of fire, but it
        // ONLY awakens once the guardian's own life is running out.
        if (boss.hp <= boss.maxHp*0.3){
          if (boss.ultimateState === 'ready'){
            boss.ultimateState = 'telegraph';
            boss.ultimateTimer = 1.3;
            showBanner('🐉 DEADLY DRAGON', 'It will shatter your shield — dodge it!', 1.8);
            speakTaunt('You will burn with me');
            addShake(6, 0.2);
          } else if (boss.ultimateState === 'telegraph'){
            boss.ultimateTimer -= dt;
            if (boss.ultimateTimer <= 0){
              boss.ultimateState = 'breathing';
              const dxu = player.x-boss.x, dyu = player.y-(boss.y-boss.r*1.2);
              const baseA = Math.atan2(dyu,dxu);
              boss.dragonBalls = [];
              for (let hIdx=0; hIdx<5; hIdx++){
                const off = (hIdx-2)*0.26; // fan spread across the 5 dragon heads
                const a = baseA + off;
                boss.dragonBalls.push({
                  x: boss.x + Math.cos(a)*boss.r*0.5, y: (boss.y-boss.r*1.2) + Math.sin(a)*boss.r*0.5,
                  vx: Math.cos(a)*480, vy: Math.sin(a)*480, r: 20, dist: 0, hit: false
                });
              }
              addShake(14, 0.35);
              SFX.enemyShoot();
            }
          } else if (boss.ultimateState === 'breathing'){
            let alive = false;
            for (let bi=boss.dragonBalls.length-1; bi>=0; bi--){
              const fb = boss.dragonBalls[bi];
              fb.x += fb.vx*dt; fb.y += fb.vy*dt;
              fb.dist += Math.hypot(fb.vx*dt, fb.vy*dt);
              if (Math.random() < 0.85){
                fireGouts.push({
                  x: fb.x+(Math.random()-0.5)*fb.r, y: fb.y+(Math.random()-0.5)*fb.r,
                  vx: -fb.vx*0.12+(Math.random()-0.5)*80, vy: -fb.vy*0.12+(Math.random()-0.5)*80,
                  wob: Math.random()*Math.PI*2, size: 5+Math.random()*7,
                  life: 0.2+Math.random()*0.2, maxLife: 0.4,
                  color: Math.random()<0.5 ? '#ff2e6b' : '#ff7a1f'
                });
              }
              if (!fb.hit){
                const dP = Math.hypot(player.x-fb.x, player.y-fb.y);
                if (dP < fb.r+player.r){
                  fb.hit = true;
                  if (player.shieldActive){
                    // the deadly dragon is the ONE thing that can shatter the shield outright
                    breakShield();
                    addParticles(fb.x,fb.y,'#ffffff',16);
                  } else {
                    const dgDmg = Math.round(22*pw);
                    player.hp -= dgDmg;
                    player.burnTimer = 0.5;
                    addParticles(fb.x,fb.y,'#ff2e6b',20);
                    addFloatText(player.x, player.y-30, '-'+dgDmg, '#ff6ec7', 16);
                    SFX.hurt(); addShake(8, 0.2); triggerHitStop(0.04);
                    if (player.hp <= 0){ player.hp=0; endGame(); return; }
                  }
                }
              }
              if (fb.hit || fb.dist > FIRE_BREATH_RANGE){
                boss.dragonBalls.splice(bi,1);
              } else {
                alive = true;
              }
            }
            if (!alive){
              boss.ultimateState = 'cooldown';
              boss.ultimateCd = 9 - Math.min(difficulty()*0.1, 3);
            }
          } else if (boss.ultimateState === 'cooldown'){
            boss.ultimateCd -= dt;
            if (boss.ultimateCd <= 0) boss.ultimateState = 'ready';
          }
        }
      } else if (boss.chargeState === 'telegraph'){
        boss.chargeTimer -= dt;
        if (boss.chargeTimer <= 0){
          const dx = player.x-boss.x, dy = player.y-boss.y;
          const d = Math.hypot(dx,dy)||1;
          boss.chargeVX = (dx/d)*620; boss.chargeVY = (dy/d)*620;
          boss.chargeState = 'dashing'; boss.chargeTimer = 0.55;
          boss.dashHit = false;
        }
      } else if (boss.chargeState === 'dashing'){
        boss.x += boss.chargeVX*dt; boss.y += boss.chargeVY*dt;
        boss.x = Math.max(boss.r, Math.min(WORLD.w-boss.r, boss.x));
        boss.chargeTimer -= dt;
        const dHit = Math.hypot(player.x-boss.x, player.y-boss.y);
        if (dHit < boss.r+player.r && !boss.dashHit){
          boss.dashHit = true;
          if (player.shieldActive){
            // face-to-face: the shield stops the charge cold and bounces the guardian back
            addParticles(player.x,player.y,'#eaffff',24);
            addFloatText((player.x+boss.x)/2, (player.y+boss.y)/2-20, 'BLOCKED!', '#7CFFEB', 21);
            addShake(15, 0.32);
            triggerHitStop(0.08);
            SFX.kill(false);
            player.shieldEnergy = Math.max(0, player.shieldEnergy - 26);
            const nx = (boss.x-player.x)/(dHit||1), ny = (boss.y-player.y)/(dHit||1);
            boss.x = player.x + nx*(boss.r+player.r+8);
            boss.y = player.y + ny*(boss.r+player.r+8);
            boss.chargeState = 'idle';
            boss.chargeCd = 3.0 + Math.random()*1;
          } else {
            player.hp -= boss.dmg;
            addParticles(player.x,player.y,'#ff5555',10);
            addFloatText(player.x, player.y-30, '-'+boss.dmg, '#ff5555', 15);
            SFX.hurt();
            addShake(10, 0.22);
            triggerHitStop(0.04);
            if (player.hp <= 0){ player.hp=0; endGame(); return; }
          }
        }
        if (boss.chargeState === 'dashing' && boss.chargeTimer <= 0){ boss.chargeState = 'idle'; boss.chargeCd = 4.5 + Math.random()*1.5; }
      }

      // keep the guardian confined to the black arena — it can never cross south past the
      // gate line into the red-stone threshold or the officer's approach area, even mid-charge
      boss.y = Math.min(boss.y, gateY - 40);
    }

    // enemy bullets vs player (and shield)
    for (let i=enemyBullets.length-1;i>=0;i--){
      const b = enemyBullets[i];
      if (b.shape === 'snake'){
        // slithers toward the player with a wavy side-to-side wiggle rather than flying dead straight
        b.wiggle += dt*9;
        const perpAng = Math.atan2(b.vy,b.vx) + Math.PI/2;
        const wob = Math.sin(b.wiggle)*70;
        b.x += b.vx*dt + Math.cos(perpAng)*wob*dt;
        b.y += b.vy*dt + Math.sin(perpAng)*wob*dt;
      } else {
        b.x += b.vx*dt; b.y += b.vy*dt;
      }
      b.life -= dt;
      if (b.shape === 'axe' || b.shape === 'disc') b.spin += dt*16; // tumbling/spinning rotation while it flies
      if (b.shape === 'gspear' || b.shape === 'garrow') b.spin = Math.atan2(b.vy,b.vx); // orient along flight path
      if (b.redSpark){
        // trailing red sparks while the arrow flies, so it reads as electrified/dangerous
        b.sparkCd = (b.sparkCd||0) - dt;
        if (b.sparkCd <= 0){ b.sparkCd = 0.025; addParticles(b.x, b.y, '#ff3344', 1); }
      }
      if (b.shape === 'fspear'){
        // fiery arrow from the hidden ambusher — flies dead straight, nose pointed the way
        // it's actually travelling, while spinning fast around its own long axis (like a
        // real arrow's flight spin) rather than tumbling flat. Trails fire the whole way.
        b.spin = Math.atan2(b.vy,b.vx);
        b.roll = (b.roll||0) + dt*22;
        b.flameCd = (b.flameCd||0) - dt;
        if (b.flameCd <= 0){
          b.flameCd = 0.02;
          addParticles(b.x, b.y, Math.random()<0.5 ? '#ff8a2f' : '#ffd76e', 1);
        }
      }
      if (b.shape === 'demonbreath' && b.poison && !b.solidPoison){
        // the cobra's poison fire breaks apart into small flying chunks as it travels,
        // same as the giant's fire breath — real breaking flame, not a solid beam
        if (Math.random() < 0.85){
          fireGouts.push({
            x: b.x + (Math.random()-0.5)*b.r, y: b.y + (Math.random()-0.5)*b.r,
            vx: -b.vx*0.12 + (Math.random()-0.5)*80, vy: -b.vy*0.12 + (Math.random()-0.5)*80,
            wob: Math.random()*Math.PI*2, size: 5+Math.random()*7,
            life: 0.2+Math.random()*0.2, maxLife: 0.4,
            color: Math.random()<0.5 ? '#3dff6e' : '#a8ff00'
          });
        }
      }
      if (b.life <= 0){ enemyBullets.splice(i,1); continue; }
      const distP = Math.hypot(player.x-b.x, player.y-b.y);
      if (player.shieldActive && !b.unblockable && distP < player.r*SHIELD_RADIUS_MULT){
        if (b.shieldBreaker){
          enemyBullets.splice(i,1);
          breakShield();
          continue;
        }
        if (b.redSpark){
          // shield blocks the damage but NOT the spark — it still counts toward the 4-hit tally
          enemyBullets.splice(i,1);
          addParticles(b.x,b.y,'#ff3344',10);
          player.redArrowHits = (player.redArrowHits||0) + 1;
          addFloatText(player.x, player.y-30, 'ARROW '+player.redArrowHits+'/'+RED_ARROW_DEATH_HITS, '#ff3344', 14);
          SFX.hurt(); addShake(4, 0.1);
          if (player.redArrowHits >= RED_ARROW_DEATH_HITS){
            addParticles(player.x, player.y, '#ff2a2a', 32);
            addFloatText(player.x, player.y-30, 'PIERCED THROUGH SHIELD!', '#ff2a2a', 20);
            SFX.hurt(); addShake(18, 0.45); triggerHitStop(0.1);
            player.hp = 0; endGame(); return;
          }
          continue;
        }
        addParticles(b.x,b.y,'#7CFC9E',6);
        enemyBullets.splice(i,1);
        continue;
      }
      if (distP < player.r + b.r){
        player.hp -= b.dmg;
        addParticles(player.x,player.y,'#ff5555',6);
        addFloatText(player.x, player.y-30, '-'+b.dmg, '#ff5555', 12);
        SFX.hurt();
        addShake(2.5, 0.07);
        if (b.burns) player.burnTimer = 0.6;
        if (b.poisons){ player.poisonTimer = 3.0; player.poisonTickCd = 0.001; }
        // 3rd time the cobra's actual fire lands on the officer — whole body ignites, 3s to death
        if (b.fromCobraFire && cobra && !cobra.burnAttackActive){
          cobra.fireHitCount = (cobra.fireHitCount||0) + 1;
          addFloatText(player.x, player.y-42, 'FIRE HIT '+cobra.fireHitCount+'/3', '#ff8844', 14);
          if (cobra.fireHitCount >= 3){
            cobra.fireHitCount = 0;
            cobra.burnAttackActive = true;
            cobra.burnAttackTimer = 3.0; // 3 seconds to death!
            cobra.flameStreamActive = false;
            addShake(14, 0.4);
            showBanner('🔥 INFERNO!', 'Officer ignites — 3 seconds!', 2.5);
            addParticles(player.x, player.y, '#ff6633', 30);
            addParticles(player.x, player.y, '#ffaa00', 20);
          }
        }
        if (b.redSpark){
          player.redArrowHits = (player.redArrowHits||0) + 1;
          addFloatText(player.x, player.y-48, 'ARROW '+player.redArrowHits+'/'+RED_ARROW_DEATH_HITS, '#ff3344', 13);
          if (player.redArrowHits >= RED_ARROW_DEATH_HITS){
            enemyBullets.splice(i,1);
            addParticles(player.x, player.y, '#ff2a2a', 32);
            addFloatText(player.x, player.y-30, 'PIERCED THROUGH!', '#ff2a2a', 20);
            SFX.hurt(); addShake(18, 0.45); triggerHitStop(0.1);
            player.hp = 0; endGame(); return;
          }
        }
        enemyBullets.splice(i,1);
        if (player.hp <= 0){ player.hp = 0; endGame(); return; }
      }
    }

    // air-strike missiles (telegraph -> fall -> blast; overshield blocks the blast entirely)
    for (let i=airStrikes.length-1;i>=0;i--){
      const s = airStrikes[i];
      if (s.state === 'telegraph'){
        s.timer -= dt;
        if (s.timer <= 0){
          s.state = 'falling';
          s.missileY = s.groundY - 620;
        }
      } else if (s.state === 'falling'){
        s.missileY += s.fallSpeed*dt;
        if (s.missileY >= s.groundY){
          s.exploded = true;
          addParticles(s.x, s.groundY, '#ffcf7a', 26);
          addParticles(s.x, s.groundY, '#ff5533', 18);
          SFX.kill(true);
          const dP = Math.hypot(player.x-s.x, player.y-s.groundY);
          if (dP < s.blastR){
            if (player.shieldActive){
              addParticles(player.x,player.y,'#7CFC9E',14);
              addShake(6, 0.15);
            } else {
              player.hp -= 26;
              addParticles(player.x,player.y,'#ff5555',10);
              addFloatText(player.x, player.y-30, '-26', '#ff5555', 15);
              SFX.hurt();
              addShake(12, 0.28);
              triggerHitStop(0.05);
              if (player.hp <= 0){ player.hp = 0; endGame(); return; }
            }
          } else {
            addShake(8, 0.18);
          }
          s.state = 'done';
        }
      } else {
        airStrikes.splice(i,1);
      }
    }

    // shockwaves (Titan Ground Slam) — expanding ring, damages the player once if caught in its band
    for (let i=shockwaves.length-1;i>=0;i--){
      const s = shockwaves[i];
      s.r += s.speed*dt;
      if (!s.hitPlayer){
        const ds = Math.hypot(player.x-s.x, player.y-s.y);
        if (Math.abs(ds - s.r) < 22){
          s.hitPlayer = true;
          if (player.shieldActive){
            addFloatText(player.x, player.y-30, 'BLOCKED!', '#7CFFEB', 16);
            player.shieldEnergy = Math.max(0, player.shieldEnergy - 22);
          } else {
            player.hp -= s.dmg;
            addParticles(player.x,player.y,'#ff5555',10);
            addFloatText(player.x, player.y-30, '-'+Math.round(s.dmg), '#ff5555', 15);
            SFX.hurt();
            addShake(9, 0.2);
            if (player.hp <= 0){ player.hp = 0; endGame(); return; }
          }
        }
      }
      if (s.r > s.maxR) shockwaves.splice(i,1);
    }

    // crates
    for (let i=crates.length-1;i>=0;i--){
      const c = crates[i];
      const d = Math.hypot(c.x-player.x, c.y-player.y);
      if (d < c.r + player.r + 6){
        player.weapon = c.weapon;
        if (!unlockedWeapons.includes(c.weapon)) unlockedWeapons.push(c.weapon);
        weaponAmmo[c.weapon] = AMMO_MAX[c.weapon];
        addParticles(c.x,c.y, c.neon ? '#29e0ff' : '#7CFC7C', c.neon ? 26 : 16);
        if (c.neon) addShake(6, 0.2);
        crates.splice(i,1);
        SFX.pickup();
      }
    }

    // healing bottles — instant full heal on touch
    for (let i=hpPacks.length-1;i>=0;i--){
      const hpk = hpPacks[i];
      hpk.bob += dt*4;
      const d = Math.hypot(hpk.x-player.x, hpk.y-player.y);
      if (d < hpk.r + player.r + 6){
        player.hp = player.maxHp;
        addFloatText(player.x, player.y-70, 'HP FULL!', '#7CFC7C', 18);
        addParticles(hpk.x,hpk.y,'#ff5577',22);
        hpPacks.splice(i,1);
        SFX.pickup();
      }
    }

    // hidden weapon bunkers — walk up to claim; grants the bunker's weapon fully loaded plus a score bonus
    for (let i=bunkers.length-1;i>=0;i--){
      const bk = bunkers[i];
      const d = Math.hypot(bk.x-player.x, bk.y-player.y);
      if (d < bk.r + player.r + 10){
        player.weapon = bk.weapon;
        if (!unlockedWeapons.includes(bk.weapon)) unlockedWeapons.push(bk.weapon);
        weaponAmmo[bk.weapon] = AMMO_MAX[bk.weapon];
        score += 150;
        addFloatText(player.x, player.y-70, 'BUNKER CLAIMED! +150', '#ffd166', 18);
        addParticles(bk.x,bk.y,'#ffd166',26);
        bunkers.splice(i,1);
        SFX.pickup();
      }
    }

    // guarded ammo depots — walk up to claim; refills every unlocked weapon's ammo plus a score bonus
    for (let i=depots.length-1;i>=0;i--){
      const dp = depots[i];
      const d = Math.hypot(dp.x-player.x, dp.y-player.y);
      if (d < dp.r + player.r + 10){
        unlockedWeapons.forEach(function(w){ weaponAmmo[w] = AMMO_MAX[w]; });
        player.knifeCharges = player.maxKnifeCharges;
        score += 100;
        addFloatText(player.x, player.y-70, 'DEPOT CLAIMED! +100', '#7CFFEB', 18);
        addParticles(dp.x,dp.y,'#7CFFEB',26);
        depots.splice(i,1);
        SFX.pickup();
      }
    }

    // golden chakra — dropped once the mirror shatters; walk up to adopt it fully loaded
    // and carry it back to finish the cobra, the only thing its scales don't resist
    if (chakraOrb){
      chakraOrb.bob += dt*4; chakraOrb.spin += dt*2.4;
      const dch = Math.hypot(chakraOrb.x-player.x, chakraOrb.y-player.y);
      if (dch < chakraOrb.r + player.r + 10){
        if (unlockedWeapons.indexOf('chakra') === -1) unlockedWeapons.push('chakra');
        weaponAmmo.chakra = AMMO_MAX.chakra;
        // deliberately NOT switching player.weapon to 'chakra' here — the officer keeps
        // firing his regular bullets on the main fire button while carrying the chakra
        // back; the chakra itself only comes out from the dedicated chakraBtn
        chakraBtn.classList.remove('hidden');
        updateChakraBtn();
        addFloatText(player.x, player.y-70, 'CHAKRA ADOPTED!', '#ffd76e', 18);
        addParticles(chakraOrb.x, chakraOrb.y, '#ffd76e', 34);
        addParticles(chakraOrb.x, chakraOrb.y, '#7CFFEB', 24);
        addShake(10, 0.3);
        SFX.pickup();
        chakraOrb = null;
        chakraAmbush = null; // hidden spearman goes quiet once the chakra is safely adopted
      }
    }

    // hidden spearman ambush — starts the moment the officer heads right toward the mirror
    // and keeps throwing flaming spears at him for the entire trip (fighting the mirror,
    // then carrying the chakra back); never rendered as a sprite, only the spears themselves
    // are visible, so it reads as an unseen attacker. Stops once the chakra is safely adopted.
    if (chakraAmbush && (mirror || chakraOrb)){
      chakraAmbush.cd -= dt;
      if (chakraAmbush.cd <= 0){
        chakraAmbush.cd = 1.7 + Math.random()*1.1; // a bit longer between volleys since 3 arrows fly out together
        // three arrows launch together, dead straight and parallel, all spawning just off
        // the right edge of the screen so they visibly emerge from the right side — no fan,
        // no convergence angle, just three level shots flying straight left
        const originX = camera.x + VW + 60;
        const rowOffsets = [-46, 0, 46];
        for (let k=0; k<rowOffsets.length; k++){
          const originY = player.y + rowOffsets[k];
          enemyBullets.push({
            x: originX, y: originY,
            vx: -460, vy: 0,
            dmg: 30, r: 8, color: '#ff5a1f', life: 3.0, shape: 'fspear', burns: true, spin: 0, roll: 0
          });
          SFX.arrowWhoosh();
        }
      }
    }

    // particles
    for (let i=particles.length-1;i>=0;i--){
      const p = particles[i];
      p.x += p.vx*dt; p.y += p.vy*dt; p.vx *= 0.9; p.vy*=0.9; p.life -= dt;
      if (p.life <= 0) particles.splice(i,1);
    }

    // lightning bolts — update life timers
    for (let i=lightningBolts.length-1;i>=0;i--){
      lightningBolts[i].life -= dt;
      if (lightningBolts[i].life <= 0) lightningBolts.splice(i,1);
    }

    // fire gouts — flying fire chunks from the giant's breath; they wobble and gutter out as they fly
    for (let i=fireGouts.length-1;i>=0;i--){
      const g = fireGouts[i];
      g.wob += dt*10;
      g.x += g.vx*dt + Math.sin(g.wob)*46*dt;
      g.y += g.vy*dt + Math.cos(g.wob*0.6)*30*dt;
      g.vx *= 0.9; g.vy *= 0.9;
      g.life -= dt;
      if (g.life <= 0) fireGouts.splice(i,1);
    }

    // zone state machine (including postCobraVictory for the 20-second victory phase)
    if (gameState === 'zone' || gameState === 'postCobraVictory'){
      // unlimited continuous hostile spawning — increased density and pace
      // (paused once the two little-giant demons are guarding the road AND the officer
      // already has the Big Rocket, so the focused fight has no distractions. Until the
      // rocket is adopted, spawning keeps going even with the giants up — those regular
      // hostiles are the only source of score, so the officer has to retreat and fight
      // them to earn the 300 needed before the giants become winnable.)
      // DURING postCobraVictory: max enemies and spawn rate are INCREASED for pure action-packed finale
      const inVictoryPhase = gameState === 'postCobraVictory';
      // enemies still spawn normally from other directions during the cobra fight — only its
      // own spot (right behind/around its hood+body) is kept clear, in spawnEnemy() below
      if (!demon && (littleGiants.length === 0 || !rocketAdopted || inVictoryPhase)){ // v121: no new hostiles while the middle giant lives
        spawnTimer -= dt;
        // early-run grace ramp — the very first ~14s of a fresh run cap enemies lower and
        // space out spawns more, so a new/young player isn't swarmed in the opening seconds;
        // eases up to the normal curve after that (only matters early in zone 1)
        const rampT = Math.min(1, runTime / EARLY_RAMP_SECONDS);
        // VICTORY PHASE BOOST: during postCobraVictory, ramp up to max enemies instantly and spawn faster
        const inDesertFight = false; // disabled - desert sequence now has normal enemy spawns
        const baseMaxActive = (inVictoryPhase || inDesertFight) ? 48 : Math.min(16 + Math.floor(difficulty()*1.4), 34);
        const maxActive = Math.round(6 + (baseMaxActive - 6) * ((inVictoryPhase || inDesertFight) ? 1 : rampT));
        const baseInterval = Math.max(0.16, 0.62 - difficulty()*0.03);
        const spawnInterval = (inVictoryPhase || inDesertFight) ? baseInterval * 0.5 : (baseInterval + (1 - rampT) * 0.55); // 2x spawn rate during victory
        if (spawnTimer <= 0 && enemies.length < maxActive){
          spawnEnemy();
          spawnTimer = spawnInterval;
        }
      }
      crateTimer -= dt;
      // v107: gun boxes were dropping every 14-22s with no cap and never despawning, so they piled up.
      // Now: slower timer (32-48s) and at most 2 regular gun boxes lying on the map at once.
      if (crateTimer <= 0){
        if (crates.filter(function(c){ return !c.neon; }).length < 2) spawnCrate();
        crateTimer = 32 + Math.random()*16;
      }
      bunkerTimer -= dt;
      if (bunkerTimer <= 0 && bunkers.length < 1){ spawnBunker(); bunkerTimer = 45 + Math.random()*25; }
      depotTimer -= dt;
      if (depotTimer <= 0 && depots.length < 1){ spawnDepot(); depotTimer = 50 + Math.random()*25; }
      if (zoneNum >= AIRSTRIKE_START_ZONE){
        airStrikeTimer -= dt;
        if (airStrikeTimer <= 0){
          spawnAirStrike();
          airStrikeTimer = (Math.max(1.8, 4.2 - difficulty()*0.1) + Math.random()*1.4);
        }
      }
      // enemy officer squad plants itself on the road first, well before the little giants,
      // then keeps sending fresh waves of 5-10 (up to 100 total per zone) as the player
      // pushes on through the fire demon and little-giant gauntlet, one wave at a time so the
      // road never gets swarmed by more hostiles than a single wave at once.
      if (demon){
        // v121: elite squad / waves also held back until the middle giant is dead
      } else if (!eliteSquadSpawned && player.y <= gateY + ELITE_SQUAD_TRIGGER){
        eliteSquadSpawned = true;
        eliteOfficersSpawnedTotal += 5;
        spawnEliteSquad();
      } else if (eliteSquadSpawned && eliteOfficersSpawnedTotal < ELITE_TOTAL_TARGET &&
                 gameState === 'play' && player.y > gateY - 50){
        const aliveElite = enemies.some(function(e){ return e.eliteOfficer; });
        if (!aliveElite){
          const remaining = ELITE_TOTAL_TARGET - eliteOfficersSpawnedTotal;
          const n = Math.min(remaining, ELITE_WAVE_MIN + Math.floor(Math.random()*(ELITE_WAVE_MAX-ELITE_WAVE_MIN+1)));
          spawnEliteWave(n);
          eliteOfficersSpawnedTotal += n;
        }
      }

      // INVISIBLE BREAKER LINE — officer unknowingly crosses this line and triggers cobra awakening
      // The breaker is positioned before the gate; when officer steps on it, earth cracks and cobra rises
      if (!cobraBreacherTriggered && player.y <= gateY + COBRA_BREAKER_LINE){
        cobraBreacherTriggered = true;
        cobraSpawned = true;
        if (currentTheme().name === 'GOTHIC CITY'){
          spawnCobra(); // triggers earth crack, shake, and cobra rise immediately
        }
      }

      // little giants plant themselves on the road 20 seconds AFTER the cobra is defeated —
      // the officer spends that window still advancing up the road and fighting regular enemies
      if (cobraSpawned && !cobra && cobraDelayTimer > 0){
        cobraDelayTimer -= dt;
      }
      if (!littleGiantsSpawned && cobraSpawned && !cobra && cobraDelayTimer <= 0){
        littleGiantsSpawned = true;
        spawnLittleGiants();
      }

      // reached the gate -> it must be shot down before the giant guardian is revealed
      // (blocked until both little giants, the middle fire demon, AND the cobra encounter are cleared —
      // littleGiantsSpawned is required so the gate can't activate during the 20s gap before they
      // even appear on the road, which is when it used to slip through)
      // DESERT: Post-cobra 20-second fight, then gate/wall appear grounded, then 10-second breaker phase with tornado
      if (gameState === 'zone' && desertFight.state < 2 && littleGiantsSpawned && littleGiants.length === 0 && !demon && cobraSpawned && !cobra){
        if (desertFight.state === 0){
          desertFight.state = 1; desertFight.t = DESERT_FIGHT_SECONDS; desertFight.lastCall = DESERT_FIGHT_SECONDS; desertFight.breakerPhase = false;
          showBanner('🌪 5 सेकंड में बवंडर!', 'दैत्य गिर गए — तैयार रहो!', 2.2);
          SFX.demonLaugh();
        } else if (desertFight.state === 1 && !desertFight.breakerPhase){
          // Regular 20-second post-cobra fight (no pond here — the pond/diamond-arrow
          // sub-quest happens later, once the tornado is actually chasing the officer)
          desertFight.t -= dt;
          if (desertFight.t <= desertFight.lastCall - 5 && desertFight.t > 0.5){
            desertFight.lastCall -= 5;
            showBanner('⏱ ' + Math.ceil(desertFight.t) + ' SECONDS', 'Keep fighting!', 0.9);
          }
          if (desertFight.t <= 0){
            // Gate and wall appear GROUNDED
            desertFight.breakerPhase = true;
            desertFight.t = BREAKER_FIGHT_SECONDS;
            desertFight.lastCall = BREAKER_FIGHT_SECONDS;
            desertFight.tornadoChaseT = 0; desertFight.pondSpawned = false; // fresh pond quest for the breaker phase
            breakerLineY = gateY + 200; // invisible barrier in front of gate
            gate.hidden = false; gate.revealAt = performance.now();
            addShake(22, 0.9);
            addParticles(WORLD.w/2, gateY, '#ffcf5a', 60);
            addParticles(WORLD.w/2, gateY-120, '#ff8a3d', 40);
            SFX.boom(1.0);
            // (banner is shown right after the tornado spawns, below)
            // Spawn tornado immediately for breaker phase (or top up an existing one's life —
            // this is the breaker-phase tornado, so it needs to last through the 25s flee,
            // the pond dive, and the trip back to the gate)
            if (currentTheme().name === 'DESERT'){
              if (!tornado) spawnTornado(false, 1); // v123: spawns on the officer's RIGHT so he flees LEFT
              if (tornado) tornado.life = 9999;     // it must not expire before the arrow fight
              tornadoTimer = Infinity; // don't spawn another
              showBanner('🌪 गेट प्रकट! बवंडर आ रहा है', 'दाईं ओर से — 25 सेकंड बाएँ भागो!', 3.0);
            }
          }
        } else if (desertFight.state === 1 && desertFight.breakerPhase){
          // v123: tornado phase — the tornado hunts the officer (he flees LEFT). After ~25s of being chased a HUGE
          // pond opens up on the left; walking into it starts the 8s vertical dive (startUnderwater), the diamond
          // arrow waits on the seabed's right side, and killing the tornado (3 arrow hits, see the bullet code)
          // clears desertFight.state to 2. The timer is only a silent safety-net fallback.
          desertFight.t -= dt;
