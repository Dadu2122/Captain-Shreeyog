  // ---------- Desert tornado (see declaration above) ----------
  function spawnTornado(atGate, forcedSide){
    let sx, sy;
    if (atGate){
      // torn straight through the broken gate itself, right where it just fell
      sx = WORLD.w/2;
      sy = gateY - 260;
    } else {
      const side = forcedSide || (Math.random() < 0.5 ? -1 : 1);
      sx = Math.max(70, Math.min(WORLD.w-70, player.x + side*(480 + Math.random()*260)));
      sy = player.y - (560 + Math.random()*300); // rises far ahead, still distant
    }
    tornado = {
      x: sx, y: sy, vx: 0, vy: 0,
      state: 'telegraph', timer: 1.8,

      r: 170,

      spin: 0,
      phaseT: 0,
      lockX: 0, lockY: 0,
      cracks: null, crackReveal: 0,
      blastParticles: [], shockR: 0, flash: 0,
      forced: !!atGate // keeps updating outside the Desert zone / outside 'zone' state
    };
    if (atGate){
      showBanner('🌪 A TORNADO TEARS THROUGH THE GATE!', 'Run!', 2.0);
    } else {

    }

  // jagged crack lines radiating outward from the point the tornado struck — same idea as
  // a real earthquake fissure: irregular segments, not a straight line
  function generateTornadoCracks(cx, cy){
    const cracks = [];
    const n = 9;
    for (let i=0;i<n;i++){
      const baseAngle = (i/n)*Math.PI*2 + (Math.random()-0.5)*0.5;
      const totalLen = 110 + Math.random()*190;
      const segs = 12;
      const pts = [{x:cx,y:cy}];
      let ang = baseAngle, r = 0;
      for (let s=1;s<=segs;s++){
        ang += (Math.random()-0.5)*0.45;
        r += totalLen/segs;
        pts.push({ x: cx+Math.cos(ang)*r, y: cy+Math.sin(ang)*r*0.6 });
      }
      cracks.push(pts);
    }
    return cracks;
  }

  // One continuous 0..1 progress value spanning the blast + swallow states together (2.4s
  // total), so the funnel and the officer sink into the earth at exactly the same rate
  // instead of the funnel vanishing first and the officer fading separately afterward.
  const TORNADO_COLLAPSE_DUR = 2.4;
  const TORNADO_FUNNEL_H = 820; // funnel height (reduced — base/bottom radius is set separately by the width formula and stays untouched)

  function tornadoCollapseFrac(T){
    if (T.state === 'blast') return Math.min(1, T.phaseT/TORNADO_COLLAPSE_DUR);
    if (T.state === 'swallow') return Math.min(1, (0.4 + T.phaseT)/TORNADO_COLLAPSE_DUR);
    return 0;
  }

  function updateTornado(dt){
    if (tornado && tornado.forced){
      // a gate-triggered tornado runs its course regardless of zone theme or gameState
    } else if (currentTheme().name !== 'DESERT' || gameState !== 'zone'){
      SFX.windLoopStop(); tornado = null; tornadoTimer = Infinity; return;
    }
    if (!tornado){
      tornadoTimer -= dt;
      if (tornadoTimer <= 0 && desertFight.state === 1 && desertFight.breakerPhase) spawnTornado(); // v124: safety — only after giants are dead + 5s countdown
      return;
    }
    tornado.spin += dt * 3.4;
    if (tornado.state === 'telegraph'){
      tornado.timer -= dt;
      if (tornado.timer <= 0){
        tornado.state = 'chasing';
        showBanner('🌪 प्रचंड तूफ़ान!', 'भागो — यह हर दिशा में तुम्हारा पीछा करेगा!', 2.2);
        SFX.tornadoRoar(1);
        SFX.windLoopStart();
      }
      return;
    }
    if (tornado.state === 'chasing'){
      if (tornado.paused) return; // officer is safely diving into the pond — tornado holds off
      // once the diamond arrow is adopted, the tornado stops hunting the officer and instead
      // parks itself just in front of the gate — that's where the final arrow fight happens
      // v123: once the arrow is adopted the tornado hovers in front of the gate; when the officer comes
      // back within range it attacks again — that is the final arrow fight
      const arrowAdopted = !!(diamondArrow && diamondArrow.found);
      if (arrowAdopted && !tornado.engaged && Math.hypot(player.x-tornado.x, player.y-tornado.y) < 900){
        tornado.engaged = true;
        showBanner('🌪 बवंडर ने फिर हमला किया!', 'हीरे के तीर से 3 वार करो!', 2.0);
        SFX.tornadoRoar(1);
      }
      const hunting = !arrowAdopted || !!tornado.engaged;
      const targetX = hunting ? player.x : WORLD.w/2;
      const targetY = hunting ? player.y : (gateY + 260);
      const dx = targetX - tornado.x, dy = targetY - tornado.y;
      const dist = Math.hypot(dx, dy) || 1;
      const spd = tornado.speed * (tornado.engaged ? 0.72 : 1); // a bit slower on the return attack so the officer can line up his arrows
      const desiredVX = (dx/dist) * spd;
      const desiredVY = (dy/dist) * spd;
      // turning lag — it homes in on its target but can't snap-turn, so a sharp dodge
      // buys real distance instead of the tornado tracking perfectly
      tornado.vx += (desiredVX - tornado.vx) * Math.min(1, dt*1.8);
      tornado.vy += (desiredVY - tornado.vy) * Math.min(1, dt*1.8);
      tornado.x += tornado.vx * dt;
      tornado.y += tornado.vy * dt;
      if (!hunting){
        // arrived in front of the gate — settle into a gentle hover instead of overshooting
        if (dist < 60){ tornado.vx *= 0.9; tornado.vy *= 0.9; }
      } else if (dist < 95){
        if (desertFight.breakerPhase){
          // pond-hunt window — a touch here is a near miss, not a death: knockback + a
          // little damage, the officer scrambles free and keeps running. This keeps the
          // chase state unbroken so the 25s pond timer isn't reset by a graze.
          const pushA = Math.atan2(player.y-tornado.y, player.x-tornado.x) || 0;
          player.x += Math.cos(pushA)*220;
          player.y += Math.sin(pushA)*220;
          player.hp = Math.max(1, player.hp - 8);
          addShake(10, 0.3);
          showBanner('बवंडर की चपेट में!', 'भागते रहो!', 1.0);
          SFX.hurt();
        } else {
          // caught — sucked in and spun inside the vortex for 4 seconds before the ground
          // finally cracks open and swallows him (this only happens to the earlier, optional
          // tornado encounter before the breaker phase even starts)
          tornado.state = 'spin';
          tornado.phaseT = 0;
          tornado.lockX = tornado.x; tornado.lockY = tornado.y;
          tornado.vx = 0; tornado.vy = 0;
          tornado.spinOrbitStart = Math.atan2(player.y-tornado.lockY, player.x-tornado.lockX);
          addShake(14, 0.4);
          showBanner('बवंडर ने पकड़ लिया!', 'तूफ़ान में घूम रहे हो...', 1.6);
          SFX.hurt();
          SFX.tornadoRoar(1);
          return;
        }
      }
      tornado.life -= dt;
      if (tornado.life <= 0){
        SFX.windLoopStop();
        tornado = null;
        tornadoTimer = Infinity; // v124: never a random re-spawn
      }
      return;
    }
    if (tornado.state === 'spin'){
      tornado.phaseT += dt;
      const spinT = Math.min(1, tornado.phaseT/4.0);
      // tight orbit right at the officer's own position — he reads as caught INSIDE the
      // swirling core (not standing beside it), and spirals down to dead-center by the end
      const orbitR = 34 * (1 - spinT*0.95);
      const orbitAngle = tornado.spinOrbitStart + tornado.spin*2.6;
      player.x = tornado.lockX + Math.cos(orbitAngle)*orbitR;
      player.y = tornado.lockY + Math.sin(orbitAngle)*orbitR*0.55;
      if (tornado.phaseT > 4.0){
        tornado.state = 'crack';
        tornado.phaseT = 0;
        tornado.cracks = generateTornadoCracks(tornado.lockX, tornado.lockY);
        tornado.crackReveal = 0;
        addShake(10, 0.4);
        showBanner('अब कोई बचाव नहीं!', 'धरती फटने लगी...', 1.3);
        SFX.windLoopStop();
      }
      return;
    }
    if (tornado.state === 'crack'){
      tornado.phaseT += dt;
      tornado.crackReveal = Math.min(1, tornado.phaseT/1.1);
      addShake(3 + tornado.crackReveal*10, 0.15);
      if (tornado.phaseT > 1.1){
        tornado.state = 'blast';
        tornado.phaseT = 0;
        tornado.flash = 1.5;
        tornado.shockR = 0;
        tornado.blastParticles = [];
        for (let i=0;i<44;i++){
          const ang = Math.random()*Math.PI*2;
          const spd = 120 + Math.random()*260;
          tornado.blastParticles.push({
            x: tornado.lockX, y: tornado.lockY,
            vx: Math.cos(ang)*spd, vy: Math.sin(ang)*spd*0.6 - 80 - Math.random()*100,
            life: 1, size: 2 + Math.random()*5
          });
        }
        addShake(30, 0.5);
        SFX.boom(1.1);
        SFX.tornadoRoar(0.7);
        showBanner('विस्फोट!', 'बवंडर सीधा धरती में समा गया!', 1.3);
      }
      return;
    }
    if (tornado.state === 'blast'){
      tornado.phaseT += dt;
      tornado.shockR += 620*dt;
      tornado.flash = Math.max(0, tornado.flash - dt*2.4);
      for (const p of tornado.blastParticles){
        p.vy += 420*dt; p.x += p.vx*dt; p.y += p.vy*dt; p.life -= dt*0.9;
      }
      if (tornado.phaseT > 0.4){
        tornado.state = 'swallow';
        tornado.phaseT = 0;
      }
      return;
    }
    if (tornado.state === 'swallow'){
      tornado.phaseT += dt;
      const pdx = tornado.lockX - player.x, pdy = tornado.lockY - player.y;
      player.x += pdx * Math.min(1, dt*4);
      player.y += pdy * Math.min(1, dt*4);
      if (tornado.phaseT > 2.0 && player.hp > 0){
        player.hp = 0;
        endGame();
        tornado = null;
      }
    }
  }

  // ---------- v123: Desert pond dive ----------
  // After the giants fall, a tornado hunts the officer (he flees LEFT). After ~25s of being chased a HUGE,
  // realistic pond opens up on the left. Walking into it starts an 8-second straight vertical sink into a
  // fully underwater scene (nothing of the desert is drawn any more), he lands on the seabed and walks right to
  // the glowing Diamond Arrow, adopts it, rises back to the desert, returns to the gate — the tornado attacks
  // again there and 3 diamond-arrow hits destroy it.
  const uwHash = function(i){ const s = Math.sin(i*127.1 + 311.7)*43758.5453; return s - Math.floor(s); };
  function uwFloorY(x){ return UW_FLOOR + 14*Math.sin(x/170) + 8*Math.sin(x/61 + 1.7); }

  function pondEdgeR(th){ return 1 + 0.055*Math.sin(3*th+1.3) + 0.04*Math.sin(5*th+0.4) + 0.025*Math.sin(9*th+2.1); }
  function pondPath(k){
    ctx.beginPath();
    for (let i=0;i<=72;i++){
      const th = i/72*Math.PI*2, r = pondEdgeR(th)*k;
      const px = pond.x + Math.cos(th)*pond.rx*r, py = pond.y + Math.sin(th)*pond.ry*r;
      if (i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
    }
    ctx.closePath();
  }
  // the big desert pond — drawn on the ground layer (under every entity)
  function drawPond(){
    if (!pond) return;
    const a = pond.fade == null ? 1 : pond.fade;
    if (a <= 0) return;
    if (pond.x + pond.rx*1.35 < camera.x || pond.x - pond.rx*1.35 > camera.x + VW ||
        pond.y + pond.ry*1.35 < camera.y || pond.y - pond.ry*1.35 > camera.y + VH) return;
    const T = performance.now()/1000;
    ctx.save();
    ctx.globalAlpha = a;
    // wet sand halo around the shore
    pondPath(1.24); ctx.fillStyle = 'rgba(122,90,44,0.5)'; ctx.fill();
    pondPath(1.12); ctx.fillStyle = 'rgba(86,62,30,0.78)'; ctx.fill();
    // water body — deep blue centre fading to bright shallow turquoise at the shore
    const g = ctx.createRadialGradient(pond.x, pond.y - pond.ry*0.1, pond.rx*0.04, pond.x, pond.y, pond.rx*1.08);
    g.addColorStop(0, '#062f5c'); g.addColorStop(0.35, '#0c5f92'); g.addColorStop(0.7, '#1d9bb8'); g.addColorStop(1, '#8fe3d4');
    pondPath(1.0); ctx.fillStyle = g; ctx.fill();
    // everything below is clipped to the water
    ctx.save();
    pondPath(1.0); ctx.clip();
    // depth rings
    ctx.strokeStyle = 'rgba(3,30,60,0.22)'; ctx.lineWidth = 10;
    for (let k=0.78;k>0.2;k-=0.2){ pondPath(k); ctx.stroke(); }
    // sky reflection — lighter wash over the upper-left, sliding slowly
    const rg = ctx.createLinearGradient(pond.x - pond.rx, pond.y - pond.ry, pond.x + pond.rx*0.4, pond.y + pond.ry*0.6);
    rg.addColorStop(0, 'rgba(255,236,180,0.30)'); rg.addColorStop(0.5, 'rgba(255,236,180,0.06)'); rg.addColorStop(1, 'rgba(255,236,180,0)');
    ctx.fillStyle = rg; ctx.fillRect(pond.x - pond.rx*1.3, pond.y - pond.ry*1.3, pond.rx*2.6, pond.ry*2.6);
    // rolling light streaks
    ctx.strokeStyle = 'rgba(255,255,255,0.22)'; ctx.lineWidth = 3; ctx.lineCap = 'round';
    for (let i=0;i<26;i++){
      const bx = pond.x + (uwHash(i)-0.5)*pond.rx*1.9 + Math.sin(T*0.5 + i)*18;
      const by = pond.y + (uwHash(i+40)-0.5)*pond.ry*1.7;
      const len = 20 + uwHash(i+80)*46;
      ctx.globalAlpha = a*(0.35 + 0.65*Math.abs(Math.sin(T*0.9 + i*1.7)));
      ctx.beginPath(); ctx.moveTo(bx-len, by); ctx.quadraticCurveTo(bx, by - 5 - Math.sin(T*1.3+i)*4, bx+len, by); ctx.stroke();
    }
    ctx.globalAlpha = a;
    // expanding ripples
    for (let j=0;j<4;j++){
      const ph = (T*0.22 + j/4) % 1;
      const rcx = pond.x + Math.cos(j*2.3+1)*pond.rx*0.34, rcy = pond.y + Math.sin(j*2.3+1)*pond.ry*0.3;
      ctx.strokeStyle = 'rgba(230,252,255,' + ((1-ph)*0.32).toFixed(3) + ')'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.ellipse(rcx, rcy, 20 + ph*pond.rx*0.34, 10 + ph*pond.ry*0.34, 0, 0, Math.PI*2); ctx.stroke();
    }
    ctx.restore();
    // foam line where water meets the sand
    pondPath(1.0); ctx.strokeStyle = 'rgba(240,255,250,0.6)'; ctx.lineWidth = 4; ctx.stroke();
    pondPath(1.035); ctx.strokeStyle = 'rgba(240,255,250,0.22)'; ctx.lineWidth = 8; ctx.stroke();
    // pebbles round the rim
    for (let i=0;i<54;i++){
      const th = uwHash(i)*Math.PI*2, k = 1.08 + uwHash(i+50)*0.26, sz = 5 + uwHash(i+90)*13;
      const px = pond.x + Math.cos(th)*pond.rx*pondEdgeR(th)*k, py = pond.y + Math.sin(th)*pond.ry*pondEdgeR(th)*k;
      ctx.fillStyle = uwHash(i+7) < 0.5 ? '#6f6250' : '#8a7a62';
      ctx.beginPath(); ctx.ellipse(px, py, sz, sz*0.66, th, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.18)';
      ctx.beginPath(); ctx.ellipse(px - sz*0.25, py - sz*0.25, sz*0.4, sz*0.22, th, 0, Math.PI*2); ctx.fill();
    }
    // reeds swaying at the shore
    ctx.lineCap = 'round';
    for (let i=0;i<18;i++){
      const th = uwHash(i+200)*Math.PI*2, k = 1.03 + uwHash(i+230)*0.1;
      const px = pond.x + Math.cos(th)*pond.rx*pondEdgeR(th)*k, py = pond.y + Math.sin(th)*pond.ry*pondEdgeR(th)*k;
      for (let b=0;b<5;b++){
        const h = 38 + uwHash(i*7+b)*46, sway = Math.sin(T*1.5 + i + b*0.7)*7;
        ctx.strokeStyle = b%2 ? '#5f7a34' : '#7d9a45'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(px + (b-2)*5, py); ctx.quadraticCurveTo(px + (b-2)*6 + sway*0.5, py - h*0.6, px + (b-2)*9 + sway, py - h); ctx.stroke();
      }
    }
    ctx.restore();
  }

  function startUnderwater(){
    if (uw || !pond) return;
    pond.used = true;
    if (tornado) tornado.paused = true;
    SFX.windLoopStop();
    SFX.boom(0.35);
    const cx = UW_W*0.24;
    uw = {
      phase: 'sink', t: 0, cx: cx, y0: 240, y1: uwFloorY(cx) - 34,
      bubbles: [], bubbleCd: 0, riseFromY: 0,
      saved: { viewZoom: viewZoom, psm: psm }
    };
    if (!diamondArrow) diamondArrow = { x: UW_ARROW_X, y: 0, found: false, r: 25 };
    viewZoom = ZOOM; psm = PLAYER_SIZE_MULT; VW = W/viewZoom; VH = H/viewZoom;
    shake.t = 0;
    player.x = cx; player.y = uw.y0; player.crouch = 0; player.tilt = 0; player.dir = Math.PI/2;
    showBanner('🌊 पानी में कूद पड़े!', '8 सेकंड तक सीधे नीचे डूबते जाओ...', 2.6);
  }

  function endUnderwater(){
    if (!uw) return;
    const s = uw.saved;
    uw = null;
    viewZoom = s.viewZoom; psm = s.psm; VW = W/viewZoom; VH = H/viewZoom;
    // surfaces on the gate side of the pond, back out on the desert sand
    player.x = pond.x + pond.rx*0.9;
    player.y = Math.max(pond.y - pond.ry*0.3, (breakerLineY > 0 ? breakerLineY + 90 : gateY + 300));
    player.crouch = 0; player.tilt = 0;
    camInit = false; // snap the camera straight back onto the officer
    shake.t = 0;
    if (tornado){
      tornado.paused = false;
      tornado.life = 9999;
      if (tornado.state === 'chasing') SFX.windLoopStart();
    }
    addShake(6, 0.25);
    showBanner('🏜 सतह पर वापस!', 'तीर लेकर गेट की ओर लौटो — बवंडर वहीं है', 2.6);
  }

  function updateUnderwater(dt){
    const U = uw;
    U.t += dt;
    if (banner.timer > 0) banner.timer = Math.max(0, banner.timer - dt);
    player.crouch = 0; player.idleTimer = 0; player.recoil = 0;
    const T = performance.now()/1000;
    const clamp = function(v,a,b){ return Math.max(a, Math.min(b, v)); };
    const bubble = function(x,y,big){
      if (U.bubbles.length > 140) return;
      U.bubbles.push({ x: x, y: y, r: (big?4:2) + Math.random()*(big?7:4), vy: -(70 + Math.random()*110), ph: Math.random()*6.28, life: 0 });
    };

    if (U.phase === 'sink'){
      // straight down, no steering: 8 seconds, easing gently into the seabed
      const s = Math.min(1, U.t/UW_SINK_TIME);
      const e = 0.62*s + 0.38*(1 - (1-s)*(1-s));
      player.x = U.cx + Math.sin(U.t*1.4)*10;
      player.y = U.y0 + (U.y1 - U.y0)*e;
      player.dir = Math.PI/2; player.tilt = 0; player.walkCycle += dt*2.5;
      U.bubbleCd -= dt;
      if (U.bubbleCd <= 0){ U.bubbleCd = 0.07; bubble(player.x + (Math.random()-0.5)*26, player.y - 40, Math.random()<0.3); }
      if (s >= 1){
        U.phase = 'bottom'; U.t = 0;
        player.y = U.y1;
        addShake(5, 0.25);
        SFX.hit();
        showBanner('🌊 तल पर पहुँच गए!', 'दाईं तरफ़ हीरे का तीर है — चलकर उठाओ', 2.8);
      }
    } else if (U.phase === 'bottom'){
      if (joy.mag > 0.08){
        const sp = player.speed*0.8;
        player.x += joy.dx*joy.mag*sp*dt;
        player.y += joy.dy*joy.mag*sp*0.35*dt;
        player.dir = joy.dx >= 0 ? 0 : Math.PI;
        player.moveDir = player.dir;
        player.walkCycle += dt*11*joy.mag;
        player.tilt += (Math.min(1, joy.mag) - player.tilt)*Math.min(1, dt*6);
        U.bubbleCd -= dt;
        if (U.bubbleCd <= 0){ U.bubbleCd = 0.22; bubble(player.x + (Math.random()-0.5)*20, player.y - 46, false); }
      } else {
        player.tilt += (0 - player.tilt)*Math.min(1, dt*6);
        U.bubbleCd -= dt;
        if (U.bubbleCd <= 0){ U.bubbleCd = 0.9; bubble(player.x + (Math.random()-0.5)*14, player.y - 46, false); }
      }
      player.x = clamp(player.x, 140, UW_W - 140);
      const fy = uwFloorY(player.x);
      player.y = clamp(player.y, fy - 96, fy - 30);
      // ambient vents on the floor
      if (Math.random() < dt*3){ const vx = Math.random()<0.5 ? 1250 : 1780; bubble(vx + (Math.random()-0.5)*16, uwFloorY(vx) - 4, false); }
      // adopt the diamond arrow
      const ax = UW_ARROW_X, ay = uwFloorY(UW_ARROW_X) - 110;
      if (diamondArrow && !diamondArrow.found && Math.hypot(player.x - ax, player.y - ay) < 120){
        diamondArrow.found = true;
        player.weapon = 'diamondArrow';
        if (!unlockedWeapons.includes('diamondArrow')) unlockedWeapons.push('diamondArrow');
        weaponAmmo.diamondArrow = Infinity; // never run dry — but only 3 hits destroy the tornado
        for (let i=0;i<16;i++) bubble(ax + (Math.random()-0.5)*80, ay + (Math.random()-0.5)*60, true);
        SFX.unlock(); SFX.pickup();
        showBanner('✨ हीरे का तीर अपनाया!', 'अब ऊपर चलो — बवंडर पर 3 तीर', 2.4);
        U.phase = 'rise'; U.t = 0; U.riseFromY = player.y;
      }
    } else { // 'rise'
      const s = Math.min(1, U.t/UW_RISE_TIME);
      const e = s*s*(3 - 2*s);
      player.y = U.riseFromY + (110 - U.riseFromY)*e;
      player.dir = Math.PI/2; player.tilt = 0; player.walkCycle += dt*2.5;
      U.bubbleCd -= dt;
      if (U.bubbleCd <= 0){ U.bubbleCd = 0.05; bubble(player.x + (Math.random()-0.5)*30, player.y + 20, Math.random()<0.4); }
      if (U.t >= UW_RISE_TIME + 0.4){ endUnderwater(); return; }
    }

    // bubbles drift up and wobble
    for (let i=U.bubbles.length-1;i>=0;i--){
      const b = U.bubbles[i];
      b.life += dt; b.y += b.vy*dt; b.x += Math.sin(b.ph + b.life*4)*22*dt;
      if (b.y < 0 || b.life > 9) U.bubbles.splice(i,1);
    }
    // camera follows the officer (no easing needed — his own motion is already smooth)
    const frac = clamp(player.y/UW_FLOOR, 0, 1);
    camera.x = VW >= UW_W ? (UW_W - VW)/2 : clamp(player.x - VW/2, 0, UW_W - VW);
    camera.y = Math.max(0, player.y - VH*(0.38 + 0.30*frac*frac));
    fadeCamY = camera.y; camInit = true;
  }

  // full-screen underwater colour grade (screen space) — no text, the game keeps on-screen banners off
  function drawUnderwaterHUD(){
    ctx.save();
    ctx.fillStyle = 'rgba(8,70,130,0.16)'; ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }

  // the solid underwater world (world-space, drawn instead of the desert)
  function drawUnderwaterScene(){
    const U = uw, T = performance.now()/1000;
    const cx0 = camera.x - 30, cy0 = camera.y - 30, cw = VW + 60, ch = VH + 60;
    const inX = function(x, m){ return x > cx0 - m && x < cx0 + cw + m; };
    // water column — pale turquoise at the surface down to near-black at the seabed
    const g = ctx.createLinearGradient(0, 0, 0, UW_FLOOR + 320);
    g.addColorStop(0, '#9be9f2'); g.addColorStop(0.05, '#44bfdc'); g.addColorStop(0.28, '#1a88b6');
    g.addColorStop(0.58, '#0b4d7f'); g.addColorStop(0.86, '#062b50'); g.addColorStop(1, '#031830');
    ctx.fillStyle = g; ctx.fillRect(cx0, cy0, cw, ch);

    // the surface seen from below — only while it's actually in frame
    if (cy0 < 220){
      const wave = function(x){ return 6*Math.sin(x/70 + T*1.6) + 4*Math.sin(x/33 - T*2.1); };
      ctx.beginPath(); ctx.moveTo(cx0, cy0 - 40);
      for (let x=cx0; x<=cx0+cw+30; x+=30) ctx.lineTo(x, wave(x));
      ctx.lineTo(cx0 + cw + 30, cy0 - 40); ctx.closePath();
      ctx.fillStyle = 'rgba(232,252,255,0.96)'; ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.95)'; ctx.lineWidth = 5;
      ctx.beginPath();
      for (let x=cx0; x<=cx0+cw+30; x+=30){ if (x===cx0) ctx.moveTo(x, wave(x)); else ctx.lineTo(x, wave(x)); }
      ctx.stroke();
      ctx.strokeStyle = 'rgba(190,245,255,0.5)'; ctx.lineWidth = 3;
      ctx.beginPath();
      for (let x=cx0; x<=cx0+cw+30; x+=30){ const y = 26 + wave(x+90)*0.8; if (x===cx0) ctx.moveTo(x, y); else ctx.lineTo(x, y); }
      ctx.stroke();
    }

    // god-rays slanting down from the surface
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (let i=0;i<9;i++){
      const bx = 200 + i*330 + Math.sin(T*0.25 + i*1.7)*70, wt = 50 + (i%3)*30;
      if (bx + wt + 420 < cx0 || bx > cx0 + cw) continue;
      const rg = ctx.createLinearGradient(0, 0, 0, 1900);
      rg.addColorStop(0, 'rgba(190,250,255,0.24)'); rg.addColorStop(1, 'rgba(190,250,255,0)');
      ctx.fillStyle = rg;
      ctx.beginPath(); ctx.moveTo(bx, 0); ctx.lineTo(bx + wt, 0); ctx.lineTo(bx + wt + 420, 1900); ctx.lineTo(bx + 300, 1900); ctx.closePath(); ctx.fill();
    }
    ctx.restore();

    // far rock spires (silhouettes)
    for (let i=0;i<10;i++){
      const x = 150 + i*280 + uwHash(i)*90, h = 260 + uwHash(i+3)*380, w = 120 + uwHash(i+6)*140;
      if (!inX(x, w)) continue;
      ctx.fillStyle = 'rgba(4,34,66,0.72)';
      ctx.beginPath(); ctx.moveTo(x - w/2, UW_FLOOR + 60); ctx.lineTo(x - w*0.18, UW_FLOOR - h*0.7); ctx.lineTo(x + w*0.02, UW_FLOOR - h);
      ctx.lineTo(x + w*0.25, UW_FLOOR - h*0.6); ctx.lineTo(x + w/2, UW_FLOOR + 60); ctx.closePath(); ctx.fill();
    }

    // drifting particles (marine snow)
    for (let i=0;i<110;i++){
      const bx = uwHash(i)*UW_W, by = uwHash(i+200)*UW_FLOOR;
      const x = ((bx + T*(8 + uwHash(i+9)*10) + Math.sin(T*0.6 + i)*20) % UW_W + UW_W) % UW_W;
      const y = (((by - T*(6 + uwHash(i+4)*10)) % UW_FLOOR) + UW_FLOOR) % UW_FLOOR;
      if (x < cx0 || x > cx0 + cw || y < cy0 || y > cy0 + ch) continue;
      ctx.fillStyle = 'rgba(220,250,255,' + (0.18 + uwHash(i+11)*0.28).toFixed(2) + ')';
      ctx.beginPath(); ctx.arc(x, y, 1.2 + uwHash(i+13)*2, 0, Math.PI*2); ctx.fill();
    }

    // schools of fish
    const schools = [
      { y: 520, sp: 120, dir: 1, col: '#ffd166', n: 9, sz: 16 },
      { y: 1100, sp: 90, dir: -1, col: '#7ee0ff', n: 12, sz: 13 },
      { y: 1720, sp: 70, dir: 1, col: '#ff8f8f', n: 8, sz: 18 },
      { y: 2150, sp: 100, dir: -1, col: '#b9ffb0', n: 10, sz: 12 }
    ];
    schools.forEach(function(sc, si){
      for (let k=0;k<sc.n;k++){
        const phase = uwHash(k + si*20);
        const u = (T*sc.sp + phase*(UW_W + 600) + k*30) % (UW_W + 600);
        const x = sc.dir > 0 ? u - 300 : UW_W + 300 - u;
        const y = sc.y + Math.sin(T*1.3 + k)*30 + (uwHash(k+7+si*3) - 0.5)*160;
        if (x < cx0 - 40 || x > cx0 + cw + 40 || y < cy0 - 40 || y > cy0 + ch + 40) continue;
        ctx.save(); ctx.translate(x, y); ctx.scale(sc.dir, 1);
        ctx.fillStyle = sc.col;
        ctx.beginPath(); ctx.ellipse(0, 0, sc.sz, sc.sz*0.45, 0, 0, Math.PI*2); ctx.fill();
        const tail = Math.sin(T*9 + k)*sc.sz*0.3;
        ctx.beginPath(); ctx.moveTo(-sc.sz*0.8, 0); ctx.lineTo(-sc.sz*1.5, -sc.sz*0.5 + tail); ctx.lineTo(-sc.sz*1.5, sc.sz*0.5 + tail); ctx.closePath(); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.85)'; ctx.beginPath(); ctx.arc(sc.sz*0.55, -sc.sz*0.1, sc.sz*0.13, 0, Math.PI*2); ctx.fill();
        ctx.restore();
      }
    });

    // seabed
    const x0 = Math.floor(cx0/40)*40;
    ctx.beginPath();
    for (let x=x0; x<=cx0+cw+40; x+=40){ if (x===x0) ctx.moveTo(x, uwFloorY(x)); else ctx.lineTo(x, uwFloorY(x)); }
    ctx.lineTo(cx0 + cw + 40, cy0 + ch + 500); ctx.lineTo(x0, cy0 + ch + 500); ctx.closePath();
    const fg = ctx.createLinearGradient(0, UW_FLOOR - 20, 0, UW_FLOOR + 520);
    fg.addColorStop(0, '#a8925a'); fg.addColorStop(0.35, '#6b5a30'); fg.addColorStop(1, '#231c0e');
    ctx.fillStyle = fg; ctx.fill();
    // sand ripples
    ctx.strokeStyle = 'rgba(255,240,190,0.16)'; ctx.lineWidth = 3;
    for (let j=1;j<=4;j++){
      ctx.beginPath();
      for (let x=x0; x<=cx0+cw+40; x+=40){ const y = uwFloorY(x) + j*34 + 6*Math.sin(x/45 + j); if (x===x0) ctx.moveTo(x, y); else ctx.lineTo(x, y); }
      ctx.stroke();
    }

    // boulders
    for (let i=0;i<24;i++){
      const x = 100 + i*105 + uwHash(i)*60, r = 24 + uwHash(i+40)*58;
      if (!inX(x, r*1.5)) continue;
      const y = uwFloorY(x) + 6;
      const rgr = ctx.createRadialGradient(x - r*0.3, y - r*0.5, r*0.1, x, y - r*0.2, r*1.2);
      rgr.addColorStop(0, '#6b7c86'); rgr.addColorStop(1, '#1f2c34');
      ctx.fillStyle = rgr; ctx.beginPath(); ctx.ellipse(x, y - r*0.2, r, r*0.62, 0, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = 'rgba(190,230,255,0.16)'; ctx.beginPath(); ctx.ellipse(x - r*0.3, y - r*0.5, r*0.35, r*0.16, -0.3, 0, Math.PI*2); ctx.fill();
    }
    // coral clumps
    ctx.lineCap = 'round';
    for (let i=0;i<16;i++){
      const x = 220 + i*150 + uwHash(i+70)*70;
      if (!inX(x, 120)) continue;
      const y = uwFloorY(x) + 4;
      const col = ['#ff6f91', '#ff9671', '#ffc75f', '#c56cf0'][i % 4];
      ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = 9;
      for (let b=0;b<6;b++){
        const ang = -2.4 + b*0.3, len = 40 + uwHash(i*9+b)*62;
        const ex = x + Math.cos(ang)*len, ey = y + Math.sin(ang)*len;
        ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(ex, ey); ctx.stroke();
        ctx.beginPath(); ctx.arc(ex, ey, 7, 0, Math.PI*2); ctx.fill();
      }
    }
    // kelp swaying in the current
    for (let i=0;i<32;i++){
      const x = 60 + i*82 + uwHash(i+120)*40;
      if (!inX(x, 120)) continue;
      const hgt = 220 + uwHash(i+150)*300, fy = uwFloorY(x) + 6;
      let px = x, py = fy;
      for (let s=1;s<=9;s++){
        const ny = fy - hgt*s/9, nx = x + Math.sin(T*1.1 + i + s*0.6)*s*7;
        ctx.strokeStyle = (i%2) ? '#1f7a4a' : '#2f9d5f'; ctx.lineWidth = Math.max(3, 13 - s*1.1);
        ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(nx, ny); ctx.stroke();
        px = nx; py = ny;
      }
    }

    // the sunken shrine around the Diamond Arrow
    const ax = UW_ARROW_X, fy = uwFloorY(ax);
    if (inX(ax, 400)){
      const pill = function(px, w, h, broken){
        const pg = ctx.createLinearGradient(px, 0, px + w, 0);
        pg.addColorStop(0, '#59666e'); pg.addColorStop(0.5, '#87979f'); pg.addColorStop(1, '#3d4950');
        ctx.fillStyle = pg;
        ctx.beginPath(); ctx.moveTo(px, fy + 8); ctx.lineTo(px, fy - h);
        if (broken){ ctx.lineTo(px + w*0.3, fy - h - 26); ctx.lineTo(px + w*0.55, fy - h + 14); ctx.lineTo(px + w, fy - h - 10); } else { ctx.lineTo(px + w, fy - h); }
        ctx.lineTo(px + w, fy + 8); ctx.closePath(); ctx.fill();
        ctx.fillStyle = 'rgba(47,157,95,0.35)'; ctx.fillRect(px, fy - h*0.45, w, h*0.45);
      };
      pill(ax - 290, 58, 250, true);
      pill(ax + 240, 58, 150, true);
      // pedestal
      ctx.fillStyle = '#4c5a63';
      ctx.beginPath(); ctx.moveTo(ax - 96, fy + 8); ctx.lineTo(ax - 72, fy - 36); ctx.lineTo(ax + 72, fy - 36); ctx.lineTo(ax + 96, fy + 8); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#7d8e96'; ctx.fillRect(ax - 84, fy - 50, 168, 16);
      if (diamondArrow && !diamondArrow.found){
        const pulse = 0.5 + 0.5*Math.sin(T*3);
        ctx.strokeStyle = 'rgba(0,255,255,' + (0.4 + 0.4*pulse).toFixed(2) + ')'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.ellipse(ax, fy - 50, 60, 12, 0, 0, Math.PI*2); ctx.stroke();
        ctx.beginPath(); ctx.ellipse(ax, fy - 50, 36, 7, 0, 0, Math.PI*2); ctx.stroke();
      }
    }

    // THE DIAMOND ARROW
    if (diamondArrow && !diamondArrow.found){
      const by = fy - 128 + Math.sin(T*2)*10;
      // light beam rising from it
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      const bg = ctx.createLinearGradient(0, by - 800, 0, by + 40);
      bg.addColorStop(0, 'rgba(0,255,255,0)'); bg.addColorStop(1, 'rgba(0,255,255,0.32)');
      ctx.fillStyle = bg; ctx.fillRect(ax - 42, by - 800, 84, 840);
      const halo = ctx.createRadialGradient(ax, by, 4, ax, by, 170);
      halo.addColorStop(0, 'rgba(160,255,255,0.65)'); halo.addColorStop(1, 'rgba(0,200,255,0)');
      ctx.fillStyle = halo; ctx.beginPath(); ctx.arc(ax, by, 170, 0, Math.PI*2); ctx.fill();
      ctx.restore();
      ctx.save(); ctx.translate(ax, by); ctx.scale(1.25, 1.25);
      ctx.shadowColor = '#00ffff'; ctx.shadowBlur = 40;
      // shaft + fletching
      ctx.fillStyle = '#48e6f0'; ctx.fillRect(-7, 10, 14, 92);
      ctx.beginPath(); ctx.moveTo(-7, 84); ctx.lineTo(-26, 112); ctx.lineTo(-7, 100); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(7, 84); ctx.lineTo(26, 112); ctx.lineTo(7, 100); ctx.closePath(); ctx.fill();
      // faceted diamond head
      ctx.fillStyle = '#b8ffff';
      ctx.beginPath(); ctx.moveTo(0, -92); ctx.lineTo(-40, -28); ctx.lineTo(0, 24); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#22d3ee';
      ctx.beginPath(); ctx.moveTo(0, -92); ctx.lineTo(40, -28); ctx.lineTo(0, 24); ctx.closePath(); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.moveTo(0, -92); ctx.lineTo(40, -28); ctx.lineTo(0, 24); ctx.lineTo(-40, -28); ctx.closePath(); ctx.stroke();
      ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(-40, -28); ctx.lineTo(40, -28); ctx.moveTo(0, -92); ctx.lineTo(0, 24); ctx.stroke();
      ctx.restore();
      // orbiting sparkles
      ctx.fillStyle = '#eaffff';
      for (let k=0;k<6;k++){
        const a = T*1.2 + k*1.047, sx = ax + Math.cos(a)*100, sy = by + Math.sin(a)*78, s = 5 + 5*Math.abs(Math.sin(T*3 + k));
        ctx.beginPath(); ctx.moveTo(sx, sy - s*1.6); ctx.lineTo(sx + s*0.4, sy - s*0.4); ctx.lineTo(sx + s*1.6, sy); ctx.lineTo(sx + s*0.4, sy + s*0.4);
        ctx.lineTo(sx, sy + s*1.6); ctx.lineTo(sx - s*0.4, sy + s*0.4); ctx.lineTo(sx - s*1.6, sy); ctx.lineTo(sx - s*0.4, sy - s*0.4); ctx.closePath(); ctx.fill();
      }
      // pointer chevrons at the right edge while the arrow is still off-screen
      if (U.phase === 'bottom' && ax > camera.x + VW - 140){
        const hx = camera.x + VW - 80, hy = Math.max(camera.y + 220, Math.min(camera.y + VH - 220, by));
        const pa = 0.4 + 0.6*Math.abs(Math.sin(T*4));
        ctx.strokeStyle = 'rgba(120,255,255,' + pa.toFixed(2) + ')'; ctx.lineWidth = 8; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
        for (let c=0;c<3;c++){
          const ox = hx - 60 + c*30;
          ctx.beginPath(); ctx.moveTo(ox, hy - 26); ctx.lineTo(ox + 24, hy); ctx.lineTo(ox, hy + 26); ctx.stroke();
        }
      }
    }

    // bubbles
    ctx.lineWidth = 1.6;
    for (const b of U.bubbles){
      ctx.strokeStyle = 'rgba(225,250,255,0.75)'; ctx.fillStyle = 'rgba(200,240,255,0.14)';
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI*2); ctx.fill(); ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,0.7)';
      ctx.beginPath(); ctx.arc(b.x - b.r*0.35, b.y - b.r*0.35, Math.max(1, b.r*0.22), 0, Math.PI*2); ctx.fill();
    }

    // depth vignette
    const vx = camera.x + VW/2, vy = camera.y + VH/2;
    const vg = ctx.createRadialGradient(vx, vy, Math.min(VW, VH)*0.32, vx, vy, Math.max(VW, VH)*0.78);
    vg.addColorStop(0, 'rgba(2,10,25,0)'); vg.addColorStop(1, 'rgba(2,10,25,0.6)');
    ctx.fillStyle = vg; ctx.fillRect(cx0, cy0, cw, ch);

    // white splash as he hits the water, white-out as he breaks the surface again
    let flash = 0;
    if (U.phase === 'sink' && U.t < 1.0) flash = (1 - U.t)*0.85;
    else if (U.phase === 'rise' && U.t > 2.0) flash = Math.min(1, (U.t - 2.0)/1.0);
    if (flash > 0){ ctx.fillStyle = 'rgba(235,252,255,' + flash.toFixed(3) + ')'; ctx.fillRect(cx0, cy0, cw, ch); }
  }

  // ---------- Desert gunship (see declaration above) ----------
  function spawnHeli(){
    const side = Math.random() < 0.5 ? -1 : 1;
    const hasGiants = littleGiants.length > 0;
    // helicopter stays MUCH LONGER when giants are present — continuous pressure
    const baseLife = hasGiants ? (22 + Math.random()*8) : (16 + Math.random()*6);
    heli = {
      x: player.x + side*420, y: player.y - 620,
      state: 'approach',
      burstCd: 0.6 + Math.random()*0.3, // even faster when giants present
      burstLeft: 0,
      shotCd: 0,
      rotor: 0,
      facing: -side, // nose points back toward where the officer is
      life: baseLife,
      attackPhase: 0, // 0: hover, 1: strafe left, 2: strafe right, 3: fly high, 4: dive-by
      phaseTimer: 0,
      aggressiveness: (hasGiants ? 1.8 : 1) + difficulty()*0.4, // 80% more aggressive with giants around
      switchSpeed: hasGiants ? 1.5 : 2.5 // change attack patterns faster
    };
    SFX.heliRotorStart();
    showBanner('⚠ हेलिकॉप्टर हमला!', 'ऊपर से गोलियों की बरसात होगी!', 1.8);
  }
  function updateHeli(dt){
    // HELICOPTER THREAT ENHANCEMENT: spawn faster when little giants are up, stay longer, attack harder
    if (!heli){
      if (gameState === 'zone' || gameState === 'postCobraVictory'){
        heliTimer -= dt;
        // if little giants are present, helicopter spawns MUCH more frequently (constant threat)
        const hasGiants = littleGiants.length > 0;
        const baseSpawnRate = hasGiants ? (6 + Math.random()*4) : (18 + Math.random()*10);
        if (heliTimer <= 0) {
          spawnHeli();
          heliTimer = baseSpawnRate;
        }
      }
      return;
    }
    heli.rotor += dt*40;
    heli.life -= dt;
    heli.phaseTimer += dt;
    
    // Dynamic attack patterns — switch faster when more aggressive
    const phaseInterval = heli.switchSpeed + Math.random()*1.5;
    if (heli.phaseTimer >= phaseInterval){
      heli.phaseTimer = 0;
      heli.attackPhase = Math.floor(Math.random()*5);
    }
    
    // Calculate target position based on attack phase
    let targetX, targetY;
    const playerCenterX = player.x;
    const playerCenterY = player.y;
    const range = 150 * heli.aggressiveness;
    
    switch(heli.attackPhase){
      case 0: // hover above — baseline
        targetX = playerCenterX + (Math.sin(heli.phaseTimer*1.2)*80)*heli.aggressiveness;
        targetY = playerCenterY - 560;
        break;
      case 1: // aggressive left strafe
        targetX = playerCenterX - range;
        targetY = playerCenterY - 480;
        heli.facing = -1;
        break;
      case 2: // aggressive right strafe
        targetX = playerCenterX + range;
        targetY = playerCenterY - 480;
        heli.facing = 1;
        break;
      case 3: // climb high for barrage
        targetX = playerCenterX + (Math.random()-0.5)*200;
        targetY = playerCenterY - 720;
        break;
      case 4: // diving attack run
        targetX = playerCenterX + (Math.random()-0.5)*160;
        targetY = playerCenterY - 380;
        break;
    }
    
    // Smoother movement — faster easing for more responsive helicopter
    const easeX = Math.min(1, dt*2.2 * heli.aggressiveness);
    const easeY = Math.min(1, dt*2.2 * heli.aggressiveness);
    heli.x += (targetX - heli.x) * easeX;
    heli.y += (targetY - heli.y) * easeY;
    
    if (heli.life <= 0){
      SFX.heliRotorStop();
      heli = null;
      heliTimer = 18 + Math.random()*10; // spawn faster
      return;
    }
    
    // Increased fire rate and randomness for more aggression
    heli.burstCd -= dt;
    if (heli.burstCd <= 0 && heli.burstLeft <= 0){
      const hasGiants = littleGiants.length > 0;
      // MUCH more shots when giants are present
      heli.burstLeft = (hasGiants ? 14 : 10) + Math.floor(Math.random()*(hasGiants ? 6 : 5));
      heli.burstCd = (hasGiants ? 0.9 : 1.2) + Math.random()*0.6;
      heli.shotCd = 0;
    }
    if (heli.burstLeft > 0){
      heli.shotCd -= dt;
      if (heli.shotCd <= 0){
        heli.shotCd = 0.055; // even faster fire rate now
        heli.burstLeft--;
        // MORE SPREAD — unpredictable fire patterns, harder to dodge
        const hasGiants = littleGiants.length > 0;
        const spreadMult = hasGiants ? 1.5 : 1; // 50% more spread when giants fighting
        const spreadX = (Math.random()-0.5)*120 * heli.aggressiveness * spreadMult;
        const spreadY = (Math.random()-0.5)*80 * heli.aggressiveness * spreadMult;
        const tdx = (playerCenterX + spreadX) - heli.x;
        const tdy = (playerCenterY + spreadY) - (heli.y+30);
        const td = Math.hypot(tdx,tdy) || 1;
        enemyBullets.push({
          x: heli.x, y: heli.y+30,
          vx: (tdx/td)*700, vy: (tdy/td)*700, // even faster bullets
          dmg: hasGiants ? 8 : 7, r: 4, color: '#ffe27a', life: 1.6, shape: 'mgtracer'
        });
        addParticles(heli.x, heli.y+30, '#ffd76e', 2);
        SFX.shoot('smg');
      }
    }
  }

  // ---------- Giant arena floor (seeded rock/crack texture, generated once per boss fight) ----------
  function genArenaFloor(){
    const top = gateY - 120;
    const bottom = zoneStartY + 250;
    const blotches = [];
    const cellW = 130, cellH = 130;
    for (let gy = top; gy < bottom; gy += cellH){
      for (let gx = 0; gx < WORLD.w; gx += cellW){
        const seed = Math.sin(gx*12.9898 + gy*0.5137 + zoneNum*3.71) * 43758.5453;
        const rnd = seed - Math.floor(seed); // deterministic 0..1, stable across frames
        if (rnd < 0.5) continue; // sparse, uneven coverage
        const jx = Math.max(20, Math.min(WORLD.w-20, gx + cellW*0.5 + (rnd-0.5)*cellW*0.8));
        const jy = gy + cellH*0.5 + (((rnd*7)%1)-0.5)*cellH*0.8;
        blotches.push({ x: jx, y: jy, r: 46 + rnd*76, shade: 0.35 + rnd*0.45 });
      }
    }
    const redStones = [];
    for (let i=0; i<26; i++){
      const seed = Math.sin(i*91.7 + zoneNum*3.1) * 43758.5453;
      const rnd = seed - Math.floor(seed);
      const rx = Math.max(30, Math.min(WORLD.w-30, WORLD.w*rnd));
      const ry = gateY + 10 + ((rnd*13)%1)*200;
      redStones.push({ x: rx, y: ry, r: 10+rnd*22, rot: rnd*Math.PI*2, shade: 0.3+rnd*0.5 });
    }
    arenaFloor = { top, bottom, blotches, redStones };
  }

  // ---------- Boss (Giant Gate Guardian) ----------
  const BOSS_CLEAR_RADIUS = 1500; // world units around the guardian inside which buildings disappear
  function spawnBoss(){
    const d = difficulty();
    // Gothic City guardian (Crimson Warden, skin 0) is the colossal, extra-formidable version:
    // ~1.9x bigger, ~2.2x HP, harder hitting, slow but heavy-footed and quicker on every
    // cooldown. Its feet stay planted on the same line as before, so it grows upward.
    const isWarden = (zoneNum % BOSS_SKINS.length) === 0;
    const bossR = (82 + Math.min(d*1.8, 28)) * (isWarden ? 1.9 : 1);
    const bossHp = (2050 + d*450) * (isWarden ? 2.2 : 1);
    boss = {
      warden: isWarden,
      rate: isWarden ? 1.4 : 1,   // cooldown drain multiplier — attacks come faster
      pow:  isWarden ? 1.3 : 1,   // damage multiplier on every attack
      homeY: isWarden ? gateY - 70 - 2.17*bossR : gateY - 260, // hover line (feet stay ~gateY-70)
      waveCd: 2.6, raged: false,
      x: WORLD.w/2, y: isWarden ? gateY - 70 - 2.17*bossR : gateY - 190, r: bossR,
      hp: bossHp, maxHp: bossHp,
      dmg: (46 + d*4) * (isWarden ? 1.3 : 1),
      vx: (95 + d*5) * (isWarden ? 1.0 : 1), // heavier = ponderous on its feet, but hits harder,
      skin: zoneNum % BOSS_SKINS.length,
      burstCd: 1.7, cannonCd: 2.6, chargeCd: 3.6, missileCd: 4.4, slamCd: 3.0, axeCd: 2.2,
      weaponLevel: 1, // starts with only its guns; unlocks weapons 2-7 one at a time as it takes damage
      chargeState: 'idle', chargeTimer: 0,
      chargeVX: 0, chargeVY: 0, dashHit: false,
      hitFlash: 0, muzzleFlash: 0,
      fireCd: 4.5, fireState: 'idle', fireTimer: 0, fireAngle: 0, fireTickCd: 0, fireBall: null,
      // COBRA FANG — Crimson Warden only: a long serpentine cherry-red fire shaft erupts from
      // the glowing chest gem and lashes at the officer. Devastating — ignores the shield.
      cobraCd: isWarden ? 5.5 : Infinity, cobraState: 'idle', cobraTimer: 0, cobraAngle: 0,
      cobraOX: 0, cobraOY: 0, cobraLen: 0, cobraMaxLen: 0, cobraPhase: 0, cobraHit: false,
      // FIVE-HEADED DRAGON — last-resort ultimate, only erupts once the guardian is close to death
      ultimateState: 'ready', ultimateTimer: 0, ultimateCd: 0, dragonBalls: [],
      smoke: [], smokeCd: 0 // slow rising smoke drifting off the guardian's frame
    };
    // v121: PROPER ENTRANCE — the guardian starts buried below the ground line and climbs out of a
    // cracked pit while the arena is already in place. Untouchable and silent until it stands tall.
    boss.entering = true; boss.enterT = 0; boss.riseCd = 0; boss.riseSfx = false;
    boss.riseDepth = (boss.warden ? 2.17 : 1.6)*boss.r + 2.5*boss.r; // deep enough that its whole body (horns included) starts under the floor
    boss.x = WORLD.w/2;
    boss.y = boss.homeY + boss.riseDepth;
    // The guardian's arrival wipes the city blocks out of its radius: every building within reach
    // fades away so it stands in the open.
    // A building's silhouette isn't just its ground point — tall towers reach far above their
    // base — so we measure to the closest point of the *whole building body* (rooftop down to
    // base), not just its foundation, or a tall-but-distant tower's top could still poke into
    // the cleared radius.
    {
      const cx = boss.x, cy = boss.y + boss.r*0.6, nowT = performance.now();
      for (const d of groundDecor){
        if (d.shape !== 'building') continue;
        const bodyH = d.r*1.8*(d.heightMult||1);
        const topY = d.y - bodyH - d.r*0.5; // rooftop, plus slack for antenna/cap props
        const closestY = Math.max(topY, Math.min(d.y, cy)); // clamp cy onto the building's vertical span
        if (Math.hypot(d.x-cx, closestY-cy) < BOSS_CLEAR_RADIUS) d.vanishT0 = nowT - 1000; // v121: already gone — the swap happens behind the blackout
      }
    }
    genArenaFloor();
    // v121: clean, solid arena — stray hostiles and bullets are wiped while the screen is black
    enemies = []; enemyBullets = []; airStrikes = [];
    // (gameState stays 'gateOpening' until the guardian has fully risen — see finishBossEntrance)
    // arm the officer for the giant fight — missile, spear and chakra all come online with full ammo
    ['missile','spear','chakra'].forEach(function(w){
      if (!unlockedWeapons.includes(w)) unlockedWeapons.push(w);
      weaponAmmo[w] = AMMO_MAX[w];
    });
    document.getElementById('bossBarWrap').classList.remove('hidden');
    document.getElementById('bossName').textContent = currentTheme().name + ' · ' + BOSS_SKINS[boss.skin].name;
  }

  // v121: guardian entrance — climbs out of a cracked pit, dust and tremors all the way up
  function bossClipY(b){ return b.homeY + (b.warden ? 2.17 : 1.6)*b.r; } // world-y of the guardian's feet once fully risen (= the ground line it emerges through)
  function updateBossEntrance(dt){
    const b = boss;
    if (!b || !b.entering) return;
    b.enterT += dt;
    const k = Math.max(0, Math.min(1, (b.enterT - BOSS_ENTRANCE.riseStart)/BOSS_ENTRANCE.riseDur));
    const e = 1 - Math.pow(1-k, 3); // fast heave, slow settle
    b.y = b.homeY + (1-e)*b.riseDepth;
    if (!b.riseSfx && b.enterT >= BOSS_ENTRANCE.riseStart){
      b.riseSfx = true;
      SFX.waveStart();
      addShake(9, 0.5);
    }
    if (k > 0 && k < 1){
      b.riseCd -= dt;
      if (b.riseCd <= 0){
        b.riseCd = 0.11;
        const gy = bossClipY(b);
        addShake(5, 0.14);
        addParticles(b.x + (Math.random()-0.5)*b.r*1.6, gy, '#4a3c3c', 4);
        addParticles(b.x + (Math.random()-0.5)*b.r*1.2, gy, '#ff5a2e', 2);
      }
    }
    if (b.enterT >= BOSS_ENTRANCE.total) finishBossEntrance();
  }
  function finishBossEntrance(){
    const b = boss;
    b.entering = false;
    b.y = b.homeY;
    gameState = 'boss';
    showBanner(b.warden ? '☠ CRIMSON WARDEN' : '☠ COLOSSAL GUARDIAN', 'I WILL DESTROY YOU!', 2.4);
    speakTaunt('I will destroy you');
    addShake(b.warden ? 18 : 12, 0.7); // the ground shudders as the colossus plants its feet
    addParticles(b.x, bossClipY(b), '#4a3c3c', 30);
  }

  function breakGate(){
    // the gate giant is dead — go straight to the next zone (Desert), no extra timer phase
    gameState = 'gateBreak';
    gateBreakTimer = 1.6;

  // COBRA FANG helpers — sample the serpentine centerline of the Warden's chest-beam attack
  // and check it against the officer. Kept as free functions (not tied to the update-loop
  // scope) so both the physics tick and the renderer can call them.
  function cobraShaftPoints(){
    const originX = boss.cobraOX, originY = boss.cobraOY, ang = boss.cobraAngle;
    const dirX = Math.cos(ang), dirY = Math.sin(ang);
    const perpX = -dirY, perpY = dirX;
    const len = boss.cobraLen;
    const N = 16;
    const pts = [];
    for (let i=0; i<=N; i++){
      const sdist = (i/N) * len;
      const taper = Math.min(1, sdist/60); // smooth anchor near the chest — no wild whip right at the base
      const amp = 34 * taper;
      const off = Math.sin(sdist*0.045 - boss.cobraPhase) * amp;
      pts.push({ x: originX + dirX*sdist + perpX*off, y: originY + dirY*sdist + perpY*off });
    }
    return pts;
  }
  const COBRA_FANG_HITS_TO_KILL = 6; // Cobra Fang (chest gem) hits needed to kill a full-health officer
  function checkCobraHit(){
    if (boss.cobraHit) return;
    const pts = cobraShaftPoints();
    const hitR = 20 + player.r;
    for (const p of pts){
      if (Math.hypot(p.x-player.x, p.y-player.y) < hitR){
        boss.cobraHit = true;
        const dmg = Math.ceil(player.maxHp / COBRA_FANG_HITS_TO_KILL); // v119: exactly 6 clean hits from full health kill the officer (shield is ignored)
        player.hp -= dmg;
        player.burnTimer = 0.6;
        addParticles(player.x, player.y, '#ff1a3d', 30);
        addParticles(player.x, player.y, '#ff8ab0', 16);
        addFloatText(player.x, player.y-30, '-'+dmg, '#ff3355', 18);
        SFX.hurt();
        addShake(12, 0.3);
        triggerHitStop(0.06);
        if (player.hp <= 0){ player.hp = 0; endGame(); return; }
        break;
      }
    }
  }

    // after 20 seconds of post-cobra fighting, finally break the gate and advance
    gameState = 'gateBreak';
    gateBreakTimer = 1.6;

  function addParticles(x,y,color,count){
    for(let i=0;i<count;i++){
      const a = Math.random()*Math.PI*2;
      const sp = 60+Math.random()*140;
      particles.push({x,y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, life:0.4+Math.random()*0.3, color});
    }
  }

  // matches the gun-drawing geometry exactly, so bullets spawn at the true muzzle tip
  function getMuzzleLocalOffset(weapon, r, recoil){
    let barrelLen = r*1.2;
    if (weapon === 'pistol') barrelLen = r*1.5;
    else if (weapon === 'smg') barrelLen = r*0.95;
    else if (weapon === 'shotgun') barrelLen = r*1.05;
    else if (weapon === 'rifle') barrelLen = r*1.5;
    else if (weapon === 'missile') barrelLen = r*1.15;
    else if (weapon === 'spear') barrelLen = r*1.9;
    else if (weapon === 'chakra') barrelLen = r*0.6;
    const barrelH = (weapon === 'shotgun' || weapon === 'missile') ? r*0.26 : r*0.15;
    const rx = r*0.1 - recoil;
    return { x: rx + barrelLen + r*0.1, y: -r*0.2 + barrelH/2 };
  }
  // player draw order is translate -> scale(1, HEIGHT_MULT) -> translate(lean/crouch offset) -> [gun-only] rotate(dir),
  // so undo that same chain here or the spawn point drifts off the barrel whenever the officer leans, crouches, or aims
  function muzzleWorldPos(p){
    const off = getMuzzleLocalOffset(p.weapon, p.r, p.recoil);
    const kneelF = Math.min(1, p.crouch);
    const proneF = Math.max(0, p.crouch - 1);
    const leanX = (p.tilt||0) * p.r * 0.14;
    const leanY = kneelF * p.r * 0.24 + proneF * p.r * 0.5;
    // body no longer rotates to face aim/movement — only the gun swivels, and its local +x axis
    // is already the "0 degrees = aim right" reference, so it rotates by p.dir directly
    const a = p.dir;
    const cosA = Math.cos(a), sinA = Math.sin(a);
    const gx = off.x*cosA - off.y*sinA;
    const gy = off.x*sinA + off.y*cosA;
    const lx = gx + leanX;
    const ly = (gy + leanY) * PLAYER_HEIGHT_MULT;
    return { x: p.x + lx, y: p.y + ly };
  }

  // Spawns a single round for a staggered rapid-fire weapon (e.g. burst13's 13-round burst).
  // pelletIndex/pelletCount let a fan-pattern weapon (fanSpreadStep) place each round on its
  // spot in the fan (index 0 = dead center, then alternating left/right) and its rainbow hue,
  // exactly as if the whole fan had spawned at once — it's just spread out over time now so
  // it reads as a continuous "dan dan dan dan" stream of gunfire instead of one flat noise.
  function spawnBurstBullet(wpn, aimAngle, aimingAtGiant, weaponName, playSound, pelletIndex, pelletCount){
    const muzzle = muzzleWorldPos(player);
    let a, color = wpn.color;
    if (wpn.fanSpreadStep){
      const side = pelletIndex % 2 === 0 ? -1 : 1;
      const step = Math.ceil(pelletIndex/2);
      const offset = pelletIndex === 0 ? 0 : side * step * wpn.fanSpreadStep;
      a = aimAngle + offset;
      if (wpn.rainbow && pelletCount > 1){
        const hue = Math.round((pelletIndex/(pelletCount-1))*270);
        color = `hsl(${hue},100%,55%)`;
      }
    } else {
      const spread = (Math.random()-0.5)*2*(wpn.spread||0);
      a = aimAngle + spread;
    }
    bullets.push({
      x: muzzle.x, y: muzzle.y,
      vx: Math.cos(a)*wpn.speed, vy: Math.sin(a)*wpn.speed,
      dmg: aimingAtGiant ? Math.max(wpn.dmg, 46) : wpn.dmg,
      r: aimingAtGiant ? 9 : wpn.bulletR,
      color: aimingAtGiant ? '#ff5a2e' : color,
      life: PLAYER_BULLET_LIFE,
      pierce: aimingAtGiant ? 1 : (wpn.pierce || 0),
      shape: aimingAtGiant ? 'rocket' : (wpn.shape || 'bolt'), spin: 0, weapon: weaponName
    });
    player.recoil = player.r*0.32;
    if (playSound) SFX.shoot(aimingAtGiant ? 'rocket' : weaponName);
  }

  // ---------- Input: Joystick ----------
  const joyBase = document.getElementById('joyBase');
  const joyStick = document.getElementById('joyStick');
  const joystickZone = document.getElementById('joystickZone');
  let joy = { active:false, id:null, baseX:0, baseY:0, dx:0, dy:0, mag:0 };
  const JOY_RADIUS = 55;

  function joyStart(id, x, y){
    joy.active = true; joy.id = id; joy.baseX = x; joy.baseY = y; joy.dx=0; joy.dy=0; joy.mag=0;
    joyBase.style.display='flex';
    joyBase.style.left = (x-55)+'px';
    joyBase.style.top = (y-55)+'px';
    joyStick.style.left='30px'; joyStick.style.top='30px';
  }
  function joyMove(x, y){
    let dx = x - joy.baseX, dy = y - joy.baseY;
    const dist = Math.hypot(dx,dy);
    const clamped = Math.min(dist, JOY_RADIUS);
    const ang = Math.atan2(dy,dx);
    const sx = Math.cos(ang)*clamped, sy = Math.sin(ang)*clamped;
    joyStick.style.left = (30+sx)+'px';
    joyStick.style.top = (30+sy)+'px';
    joy.dx = dist===0?0:Math.cos(ang); joy.dy = dist===0?0:Math.sin(ang);
    joy.mag = clamped/JOY_RADIUS;
  }
  function joyEnd(){
    joy.active=false; joy.id=null; joy.dx=0; joy.dy=0; joy.mag=0;
    joyBase.style.display='none';
  }

  joystickZone.addEventListener('touchstart', function(e){
    e.preventDefault();
    if (joy.active) return;
    const t = e.changedTouches[0];
    joyStart(t.identifier, t.clientX, t.clientY);
  }, {passive:false});
  joystickZone.addEventListener('touchmove', function(e){
    e.preventDefault();
    for (const t of e.changedTouches){
      if (t.identifier === joy.id) joyMove(t.clientX, t.clientY);
    }
  }, {passive:false});
  window.addEventListener('touchend', function(e){
    for (const t of e.changedTouches){
      if (t.identifier === joy.id) joyEnd();
    }
  });
  window.addEventListener('touchcancel', function(e){
    for (const t of e.changedTouches){
      if (t.identifier === joy.id) joyEnd();
    }
  });

  // Mouse fallback (desktop testing)
  let mouseJoyActive = false;
  joystickZone.addEventListener('mousedown', function(e){
    mouseJoyActive = true; joyStart('mouse', e.clientX, e.clientY);
  });
  window.addEventListener('mousemove', function(e){
    if (mouseJoyActive) joyMove(e.clientX, e.clientY);
  });
  window.addEventListener('mouseup', function(){
    if (mouseJoyActive){ mouseJoyActive=false; joyEnd(); }
  });

  // ---------- Input: Fire ----------

  // ---------- Input: Chakra Blast ----------

  // ---------- Aiming ----------
  // Auto-aim toward nearest enemy; fallback to facing movement direction.
  function findNearestEnemy(){
    // v123: while the diamond arrow is equipped, the auto-aim locks onto the tornado (arrows are only for it)
    if (player.weapon === 'diamondArrow' && tornado && tornado.state === 'chasing'){
      return { x: tornado.x, y: tornado.y, r: tornado.r, hp: 1, hidden: false, isTornado: true };
    }
    let best = null, bestD = Infinity;
    for (const e of (demon ? [] : enemies)){ // v121: enemies are force-hidden until the middle giant (fire demon) is dead
      if (e.hidden) continue; // don't auto-aim at concealed ambushers
      const d = (e.x-player.x)*(e.x-player.x) + (e.y-player.y)*(e.y-player.y);
      if (d < bestD){ bestD = d; best = e; }
    }
    for (const g of littleGiants){
      const d = (g.x-player.x)*(g.x-player.x) + (g.y-player.y)*(g.y-player.y);
      if (d < bestD){ bestD = d; best = g; }
    }
    if (!best && boss && boss.hp > 0 && !boss.entering){
      return boss;
    }
    return best;
  }

  // Trees automatically slide out of the officer's way as he walks into them — the forest
  // parts around him instead of blocking him, and each tree eases back into its spot once
  // he's moved on. Only trees within PATH_RADIUS of him are nudged; everything else stays put.
  const TREE_PATH_RADIUS = 74;  // how close the officer needs to be before a tree starts moving aside
  const TREE_PATH_PUSH = 50;    // how far a tree can slide away at most
  function updateTreePathClearing(dt){
    for (const d of groundDecor){
      if (d.shape !== 'tree') continue;
      const dx = d.x - player.x, dy = d.y - player.y;
      const dist = Math.hypot(dx, dy);
      let targetX = 0, targetY = 0;
      if (dist < TREE_PATH_RADIUS && dist > 0.001){
        const strength = (TREE_PATH_RADIUS - dist) / TREE_PATH_RADIUS; // closer officer = bigger push
        targetX = (dx/dist) * TREE_PATH_PUSH * strength;
        targetY = (dy/dist) * TREE_PATH_PUSH * strength;
      }
      d.offX = (d.offX||0) + (targetX - (d.offX||0)) * Math.min(1, dt*7);
      d.offY = (d.offY||0) + (targetY - (d.offY||0)) * Math.min(1, dt*7);
    }
  }

  // ---------- v119: GATE STAYS GROUNDED ----------
  // From the moment the cobra falls until the gate is broken, the gate's base is pinned to the ground
  // on screen. It can only ever settle LOWER (as the officer walks up to it) — it never rises again
  // when the officer steps back. The officer is free to go any distance in any direction: instead of
  // scrolling the camera back (which is what made the gate lift), the view simply pulls back
  // (zooms out) around the gate's base just enough to keep the officer on screen, then eases back in.
  const GATE_GROUND_MIN_ZOOM = 0.55;   // furthest pull-back of the view (fraction of normal zoom) — was 0.36, too aggressive a pull-back made the officer feel sluggish when retreating. The GATE itself is drawn at constant on-screen size (gateVisScale). 1.0 = no pull-back at all
  const GATE_GROUND_SAFE_Y   = 0.88;   // officer is kept above this fraction of the screen height (clear of the HP bar / buttons)
  const GATE_GROUND_MAX_FRAC = 0.70;   // gate base never pinned lower than this fraction down the screen
  const gateGround = { on:false, frac:0, k:1 };
  let gateVisScale = 1;
  function updateGateGroundCam(dt){
    const G = gateGround;
    // v126: adaptive zoom — pull the view out (smoothly) while a tall encounter is on screen
    zoomTall = !!cobra || gameState === 'gateOpening' || gameState === 'boss' || !!mirror || !!(gate && gate.active && !gate.broken); // v129: gate only once it's active/close (was: whenever visible)
    {
      const zt = zoomTarget();
      if (Math.abs(zt - ZOOM) > 0.0005){
        ZOOM += (zt - ZOOM) * Math.min(1, 1 - Math.pow(0.03, dt));
        if (Math.abs(zt - ZOOM) < 0.0008) ZOOM = zt;
        applyPlayerSize();
      }
    }
    const VH0 = H / ZOOM;
    const phase = gate && !gate.broken && !gate.hidden && gameState === 'zone' && cobraSpawned && !cobra && !(mirror && mirror.locked);
    if (phase && !G.on){
      const f = (gateY - camera.y) / VH; // where the gate's base sits on screen right now
      if (f >= 0.05){ G.on = true; G.frac = Math.min(f, GATE_GROUND_MAX_FRAC); }
    }
    if (!phase) G.on = false;
    if (G.on){
      // where the normal camera would put the gate base (at normal zoom) — the pin only ever moves down to follow that
      const d = Math.max(1, player.y - gateY);
      let fNat = 0.78 - d / VH0; // PLAYER_SCREEN_Y_FRAC
      if (gate.active) fNat = Math.max(fNat, (gateTopHeight() + 34) / VH0);
      fNat = Math.min(fNat, GATE_GROUND_MAX_FRAC);
      if (fNat > G.frac) G.frac += (fNat - G.frac) * (1 - Math.pow(0.002, dt));
      // pull back just enough to keep the officer on screen — instantly outward, gently back inward
      const room = Math.max(0.05, GATE_GROUND_SAFE_Y - G.frac);
      const kNeed = Math.max(GATE_GROUND_MIN_ZOOM, Math.min(1, VH0 * room / d));
      if (kNeed < G.k) G.k = kNeed; else G.k += (kNeed - G.k) * (1 - Math.pow(0.05, dt));
      viewZoom = ZOOM * G.k; VW = W / viewZoom; VH = H / viewZoom;
      let cy = gateY - G.frac * VH;                      // gate base stays exactly where it is on screen
      cy = Math.max(cy, player.y - VH * 0.94);           // last resort only (beyond max pull-back)
      camera.y = cy; fadeCamY = cy;
    } else if (G.k < 1){
      G.k += (1 - G.k) * (1 - Math.pow(0.02, dt));
      if (1 - G.k < 0.002) G.k = 1;
      viewZoom = ZOOM * G.k; VW = W / viewZoom; VH = H / viewZoom;
    }
    viewZoom = ZOOM * G.k; VW = W / viewZoom; VH = H / viewZoom; // v126: keep live zoom in sync with the adaptive base zoom
    psm = PLAYER_SIZE_MULT / G.k; // fully cancel the extra pull-back for the officer's own sprite (was ^0.6 — a partial cancel, which is why he looked like he was shrinking)
    gateVisScale = 1 / G.k; // gate is drawn/hit-tested this much bigger in world units, so it keeps the SAME size on screen while the view pulls back
  }

  // ---------- Update ----------
  function update(dt){
    runTime += dt;
    if (banner.timer > 0) banner.timer = Math.max(0, banner.timer - dt);
    updateHPDisplay(); // sync centered HP bar

    // movement — plain drag control; left/right is now unbounded (no forest edge limit),
    // only forward/backward is still fenced (can't drift past zone start or past the gate)
    if (joy.mag > 0.08 && !(tornado && (tornado.state === 'spin' || tornado.state === 'crack' || tornado.state === 'blast' || tornado.state === 'swallow'))){
      const moveMult = player.entangleTimer > 0 ? 0.4 : 1; // cobra tail coil slows the officer down while it's wrapped around him
      player.x += joy.dx * joy.mag * player.speed * moveMult * dt;
      player.y += joy.dy * joy.mag * player.speed * moveMult * dt;
      player.moveDir = Math.atan2(joy.dy, joy.dx); // stored only — the aim smoother below owns player.dir, so movement no longer snaps it and fights the auto-aim every frame (that fight was the gun-vibration bug)
    }
    updateTreePathClearing(dt); // the forest parts around the officer instead of blocking him
    player.y = Math.min(player.y, zoneStartY + 150); // full freedom to retreat all the way back — the camera (below) handles keeping him visible, not a movement cap
    applyMirrorLock(dt); // mirror showdown: officer held on the far left until the mirror breaks
    if (gameState === 'zone' || gameState === 'gateOpening' || gameState === 'postCobraVictory'){
      // (this hold no longer applies once gameState === 'boss' — previously it kept pinning
      // the officer at gateY+player.r+200 for the whole boss fight, so he could never actually
      // walk forward toward the guardian; now the hold only exists before the fight starts)
      // the two little giants physically bar the road — the officer cannot push past that
      // line while either one still stands, so there is no way around killing them. The
      // the two little giants physically bar the road — the officer cannot push past that
      // line while either one still stands, so there is no way around killing them. Once
      // they're down, the officer is free to keep advancing and fighting the regular
      // hostiles all the way up toward the gate for the cobra's delay stretch — the gate
      // itself just stays inactive (see cobraSpawned check below) so there's nothing to
      // open yet. Only once the cobra actually rises does the road get held again, right
      // in front of it, for that fight.
      // cobra-fight wall: a fixed line at the ground, gateY+460 — it never turns on/off based
      // on mirror/chakra state anymore (that toggling was the bug: the instant the chakra was
      // picked up, the wall would snap back on and yank the officer south in one frame). Instead
      // it simply has no effect until he's actually close to the cobra (radius check) — so the
      // long trip out to the mirror, and walking the dropped chakra back, is always unobstructed,
      // and the hold only ever grips him gently as he nears the cobra to fight it, never a jump.
      const nearCobra = cobra && Math.hypot(player.x-cobra.x, player.y-cobra.y) < 700;
      const giantWall = (littleGiants.length > 0 || demon) ? gateY + 190 : (nearCobra ? gateY + 460 : -Infinity);
      player.y = Math.max(player.y, gateY + player.r + 200, giantWall);
      // Breaker line - can't cross until gate is broken (desertFight.state === 2 OR gate.broken)
      if (breakerLineY > 0 && !gate.broken && desertFight.state === 1 && desertFight.breakerPhase){
        player.y = Math.max(player.y, breakerLineY + 80);
      }
    }
    updateTornado(dt); // runs every frame (not just 'zone') so a gate-triggered tornado still chases/catches the officer during gateOpening/boss
    updateHeli(dt);

    // walk animation (legs swing while moving)
    if (joy.mag > 0.08){ player.walkCycle += dt*11*joy.mag; }
    // recoil recovery
    if (player.recoil > 0) player.recoil = Math.max(0, player.recoil - dt*player.r*3.5);

    // human feel: stand still a moment and the officer settles into a relaxed crouch/sit;
    // move and he leans forward into the stride like real weight shifting when walking/skating
    const moving = joy.mag > 0.08;
    player.idleTimer = moving ? 0 : player.idleTimer + dt;
    // 0 = standing/walking, 1 = kneel on one knee, 2 = full prone — the officer settles
    // deeper into a real firing position the longer he holds still
    let crouchTarget = 0;
    if (!moving){
      if (player.idleTimer > 2.4) crouchTarget = 2;
      else if (player.idleTimer > 0.6) crouchTarget = 1;
    }
    player.crouch += (crouchTarget - player.crouch) * Math.min(1, dt*3.2);
    const tiltTarget = moving ? Math.min(1, joy.mag) : 0;
    player.tilt += (tiltTarget - player.tilt) * Math.min(1, dt*6);
    // v131: walking left/right makes the officer a little taller (smoothly eased in/out)
    const sideTarget = moving ? Math.min(1, Math.abs(joy.dx) * Math.min(1, joy.mag)) : 0;
    player.sideStretch = (player.sideStretch || 0) + (sideTarget - (player.sideStretch || 0)) * Math.min(1, dt*7);

    // dust/leaf kick-up behind the boots while moving at pace — a real "skating" trail, not a static sprite
    player.dustCd -= dt;
    if (moving && player.dustCd <= 0){
      player.dustCd = 0.05;
      const backA = player.dir + Math.PI;
      const theme = currentTheme();
      const dustColor = theme.decorShape === 'tree' ? 'rgba(120,95,60,0.5)' : 'rgba(200,200,200,0.4)';
      particles.push({
        x: player.x + Math.cos(backA)*player.r*0.9 + (Math.random()-0.5)*8,
        y: player.y + Math.sin(backA)*player.r*0.9 + (Math.random()-0.5)*8,
        vx: Math.cos(backA)*30 + (Math.random()-0.5)*20,
        vy: Math.sin(backA)*30 + (Math.random()-0.5)*20,
        life: 0.35+Math.random()*0.2, color: dustColor
      });
    }

    // poisonous-snake venom — ticks small damage every half second while it's active
    if (player.poisonTimer > 0){
      player.poisonTimer -= dt;
      player.poisonTickCd -= dt;
      if (player.poisonTickCd <= 0){
        player.poisonTickCd = 0.5;
        player.hp -= 3;
        addFloatText(player.x, player.y-30, '-3', '#7CFF7C', 11);
        SFX.hurt();
        if (player.hp <= 0){ player.hp = 0; endGame(); return; }
      }
    }

    // cobra tail coil — just slows movement down while it counts down, no damage of its own
    if (player.entangleTimer > 0) player.entangleTimer -= dt;

    // fire-breath burn — while the timer is up, small flames keep rising off the player
    if (player.burnTimer > 0){
      player.burnTimer -= dt;
      if (Math.random() < 0.6){
        particles.push({
          x: player.x + (Math.random()-0.5)*player.r*1.2,
          y: player.y + (Math.random()-0.5)*player.r*1.2,
          vx: (Math.random()-0.5)*30, vy: -40-Math.random()*50,
          life: 0.25+Math.random()*0.2,
          color: Math.random()<0.5 ? '#ff7a1f' : '#ffcf5a'
        });
      }
    }

    // shield stays on once toggled — no energy drain — until it's physically shattered.
    // once shattered it stays offline until the score climbs 500 points past that moment.
    // safety net: once the cobra is gone the chakra button must never be visible
    if (cobraSpawned && !cobra && !chakraBtn.classList.contains('hidden')){
      chakraBtn.classList.add('hidden');
      chakraBtn.classList.remove('active','depleted');
    }

    if (player.shieldBroken && score >= player.shieldReactivateScore){
      player.shieldBroken = false;
      player.shieldActive = true;
      shieldBtn.classList.remove('depleted');
      shieldBtn.classList.add('active');
      showBanner('SHIELD RESTORED', 'Shield is back online!', 1.6);
      SFX.waveStart();
    }

    // Knife Ring — the instant it's switched on, it throws real knives at the nearest enemies, repeating on a timer
    if (player.knifeActive){
      if (player.knifeCharges <= 0){
        player.knifeActive = false;
        knifeBtn.classList.remove('active');
      } else {
        player.knifeTickCd -= dt;
        if (player.knifeTickCd <= 0){
          player.knifeTickCd = KNIFE_TICK_RATE;
          const ringR = player.r * KNIFE_RING_RADIUS_MULT;
          // pick the nearest enemies anywhere on the map, closest first — no minimum distance required
          const targets = (demon ? [] : enemies).concat(littleGiants.filter(function(g){return !g.isDescending;})).sort(function(a,b){
            return Math.hypot(a.x-player.x,a.y-player.y) - Math.hypot(b.x-player.x,b.y-player.y);
          }).slice(0, KNIFE_MAX_TARGETS_PER_TICK);
          if (boss && boss.hp > 0 && !boss.entering && targets.length < KNIFE_MAX_TARGETS_PER_TICK) targets.push(boss);
          const fireCount = Math.min(targets.length, player.knifeCharges);
          for (let ti=0; ti<fireCount; ti++){
            const t = targets[ti];
            const ang = Math.atan2(t.y-player.y, t.x-player.x);
            knives.push({
              x: player.x + Math.cos(ang)*ringR, y: player.y + Math.sin(ang)*ringR,
              vx: Math.cos(ang)*KNIFE_SPEED, vy: Math.sin(ang)*KNIFE_SPEED,
              dmg: KNIFE_DMG, life: 2.2, spin: 0
            });
            player.knifeCharges--;
          }
          updateKnifeCountLabel();
          if (player.knifeCharges <= 0){
            player.knifeActive = false;
            knifeBtn.classList.remove('active');
            knifeBtn.classList.add('depleted');
          }
        }
      }
    }
    // flying knives — travel in a straight line and strike whatever they reach
    for (let i=knives.length-1;i>=0;i--){
      const kn = knives[i];
      kn.x += kn.vx*dt; kn.y += kn.vy*dt; kn.life -= dt; kn.spin += dt*26;
      if (kn.life <= 0){ knives.splice(i,1); continue; }
      let hit = false;
      if (boss && boss.hp > 0 && !boss.entering){
        if (Math.hypot(boss.x-kn.x, boss.y-kn.y) < boss.r + 6){
          boss.hp -= kn.dmg;
          boss.hitFlash = boss.warden ? 0.035 : 0.08;
          addParticles(kn.x,kn.y,'#ff3344',5);
          addFloatText(kn.x, kn.y-8, '-'+kn.dmg, '#ff5566', 13);
          hit = true;
          if (boss.hp <= 0){
            boss.hp = 0;
            addParticles(boss.x,boss.y,'#ffb347',40);
            score += 200 + difficulty()*50;
            SFX.kill(true);
            breakGate();
          }
        }
      }
      if (!hit){
        for (let j=littleGiants.length-1;j>=0;j--){
          const g = littleGiants[j];
          if (!g.isDescending && Math.hypot(g.x-kn.x, g.y-kn.y) < g.r + 6){
            const armored = g.armored && !rocketAdopted; // once the Big Rocket is adopted, it empowers every strike against them
            const dealt = armored ? Math.max(1, Math.round(kn.dmg*0.12)) : kn.dmg;
            g.hp -= dealt;
            g.hitFlash = 0.08;
            addParticles(kn.x,kn.y,'#ff3344',5);
            addFloatText(kn.x, kn.y-8, '-'+dealt+(armored?' (resisted)':''), armored?'#8a8a95':'#ff5566', 13);
            if (g.hp <= 0){
              g.hp = 0;
              addParticles(g.x,g.y,'#a86bd1',30);
              score += 150 + difficulty()*25;
              SFX.kill(true);
              littleGiants.splice(j,1);
              if (littleGiants.length === 0 && !demon) showBanner('GIANTS DOWN', 'The road ahead is clear!', 1.6);
            }
            hit = true;
            break;
          }
        }
      }
      if (!hit && cobra && cobra.state === 'active'){
        if (Math.hypot(cobra.x-kn.x, cobra.y-kn.y) < cobra.r + 6){
          // knife ring is never the chakra — bounces off harmlessly, same as any other gunfire
          addParticles(kn.x,kn.y,'#cfd4da',3);
          addFloatText(kn.x, kn.y-8, 'IMMUNE', '#7CFFA0', 12);
          hit = true;
        }
      }
      if (!hit && !demon){ // v121: force-hidden enemies can't be hit while the middle giant lives
        for (let j=enemies.length-1;j>=0;j--){
          const e = enemies[j];
          if (Math.hypot(e.x-kn.x, e.y-kn.y) < e.r + 6){
            e.hidden = false;
            e.hp -= kn.dmg;
            addParticles(kn.x,kn.y,'#ff3344',5);
            addFloatText(kn.x, kn.y-8, '-'+kn.dmg, '#ff5566', e.tough?14:12);
            if (e.hp <= 0){
              addParticles(e.x,e.y, e.color, 14);
              enemies.splice(j,1);
              score += e.tough ? 30 : 10;
              SFX.kill(e.tough);
              comboCount++; comboTimer = 1.6;
            }
            hit = true;
            break;
          }
        }
      }
      if (hit) knives.splice(i,1);
    }
    
    // refill the knife pool once the player crosses the next 1000-point milestone
    if (score >= nextKnifeUnlockScore){
      player.knifeCharges = player.maxKnifeCharges;
      updateKnifeCountLabel();
      knifeBtn.classList.remove('depleted');
      nextKnifeUnlockScore += 1000;
      showBanner('KNIFE RING READY', '100 knives reloaded!', 1.4);
    }

    // drop a healing bottle every 500 points — picking it up fills HP back to full instantly
    if (score >= nextHpDropScore){
      spawnHpPack();
      nextHpDropScore += 500;
    }

    // neon blue burst-ammo box — once per stage, drops the instant score crosses 550
    // within this zone (resets every new zone in startZone)
    if (!neonBoxSpawnedThisZone && score >= NEON_BOX_SCORE){
      neonBoxSpawnedThisZone = true;
      spawnNeonBox();
    }

    // Big Rocket — the army officer auto-adopts it the instant score crosses 300;
    // from then on, the gun auto-channels the rocket whenever aimed at a little giant
    if (!rocketAdopted && score >= ROCKET_ADOPT_SCORE){
      rocketAdopted = true;
      addParticles(player.x, player.y, '#ff8a4c', 30); // big celebratory burst — a milestone should FEEL big
      addShake(9, 0.3);
      SFX.pickup();
      // if this happens mid-giant-fight, the road clears now — the officer has earned
      // the distraction-free showdown that used to be forced from the start
      if (littleGiants.length > 0){
        enemies = [];
      }
    }

    // aim: while the joystick is actively steering, the gun follows that direction exactly
    // (full manual control — left/right/up/down/back, whatever he points) with no auto-aim
    // override. Only once the stick is released (idle/free) does it fall back to auto-aiming
    // at the nearest enemy. This is still the only place that writes player.dir.
    const target = findNearestEnemy();
    const steering = joy.mag > 0.08;
    if (steering){
      player.dir = player.moveDir; // full manual, zero-lag — gun points exactly where the stick is pushed, every direction including straight up, no smoothing to fight against
    } else {
      const targetAngle = target ? Math.atan2(target.y-player.y, target.x-player.x) : player.dir;
      let diff = targetAngle - player.dir;
      diff = Math.atan2(Math.sin(diff), Math.cos(diff)); // shortest turn direction
      player.dir += diff * Math.min(1, dt*12); // auto-aim only: real turn-to-face swivel, not a snap
    }
    const aimAngle = player.dir;

    // firing
    player.fireCooldown -= dt;
    const wpn = WEAPONS[player.weapon];
    // once the Big Rocket is adopted, the officer's own gun auto-channels it the instant he's
    // locked onto a little giant — no manual switching needed, and it does nothing to anyone else
    const aimingAtGiant = rocketAdopted && target && littleGiants.indexOf(target) !== -1;
    if (firing && player.fireCooldown <= 0 && !player.pendingBurst){
      player.fireCooldown = wpn.rate;
      player.recoil = player.r*0.32;
      if (player.weapon !== 'pistol'){
        weaponAmmo[player.weapon] = Math.max(0, weaponAmmo[player.weapon] - 1);
        if (weaponAmmo[player.weapon] <= 0) autoSwitchWeapon();
      }
      const pelletCount = wpn.pellets || 1;
      if (wpn.burstStagger && pelletCount > 1){
        // staggered rapid-fire burst (burst13): fire round 0 (dead center) immediately,
        // then queue the remaining 12 to pop one at a time — each with its own crack —
        // so the whole 13-round burst reads as "dan dan dan dan" instead of one flat noise.
        spawnBurstBullet(wpn, aimAngle, aimingAtGiant, player.weapon, true, 0, pelletCount);
        player.pendingBurst = {
          weapon: player.weapon, angle: aimAngle, aimingAtGiant,
          nextIndex: 1, shotsLeft: pelletCount - 1, timer: wpn.burstStagger, pelletCount
        };
      } else if (wpn.fanSpreadStep){
        // rainbow fan burst fallback: all pellets spawn in the same instant, one dead-center
        // and the rest fanning out symmetrically left/right, each a different rainbow hue —
        // pellet 0 = center, odd indices step left, even indices step right.
        SFX.shoot(aimingAtGiant ? 'rocket' : player.weapon);
        const muzzle = muzzleWorldPos(player);
        for (let p=0; p<pelletCount; p++){
          const side = p % 2 === 0 ? -1 : 1; // alternate left/right, p=0 stays center (side unused)
          const step = Math.ceil(p/2);
          const offset = p === 0 ? 0 : side * step * wpn.fanSpreadStep;
          const a = aimAngle + offset;
          const hue = wpn.rainbow ? Math.round((p/(pelletCount-1))*270) : null;
          bullets.push({
            x: muzzle.x, y: muzzle.y,
            vx: Math.cos(a)*wpn.speed, vy: Math.sin(a)*wpn.speed,
            dmg: aimingAtGiant ? Math.max(wpn.dmg, 46) : wpn.dmg,
            r: aimingAtGiant ? 9 : wpn.bulletR,
            color: aimingAtGiant ? '#ff5a2e' : (hue !== null ? `hsl(${hue},100%,55%)` : wpn.color),
            life: PLAYER_BULLET_LIFE,
            pierce: aimingAtGiant ? 1 : (wpn.pierce || 0),
            shape: aimingAtGiant ? 'rocket' : (wpn.shape || 'bolt'), spin: 0, weapon: player.weapon
          });
        }
      } else {
        SFX.shoot(aimingAtGiant ? 'rocket' : player.weapon);
        const muzzle = muzzleWorldPos(player);
        for (let p=0; p<pelletCount; p++){
          const spread = (Math.random()-0.5)*2*wpn.spread;
          const a = aimAngle + spread;
          bullets.push({
            x: muzzle.x, y: muzzle.y,
            vx: Math.cos(a)*wpn.speed, vy: Math.sin(a)*wpn.speed,
            dmg: aimingAtGiant ? Math.max(wpn.dmg, 46) : wpn.dmg,
            r: aimingAtGiant ? 9 : wpn.bulletR,
            color: aimingAtGiant ? '#ff5a2e' : wpn.color,
            life: PLAYER_BULLET_LIFE,
            pierce: aimingAtGiant ? 1 : (wpn.pierce || 0),
            shape: aimingAtGiant ? 'rocket' : (wpn.shape || 'bolt'), spin: 0, weapon: player.weapon
          });
        }
      }
    }

    // staggered burst in flight (e.g. burst13) — pops one needle bolt at a time, with its
    // own crack of sound each round, until the full 13-round burst has emptied out
    if (player.pendingBurst){
      const pb = player.pendingBurst;
      pb.timer -= dt;
      if (pb.timer <= 0){
        const wpnB = WEAPONS[pb.weapon];
        spawnBurstBullet(wpnB, pb.angle, pb.aimingAtGiant, pb.weapon, true, pb.nextIndex, pb.pelletCount);
        pb.nextIndex++;
        pb.shotsLeft--;
        if (pb.shotsLeft <= 0) player.pendingBurst = null;
        else pb.timer += wpnB.burstStagger;
      }
    }

    // bullets
    for (let i=bullets.length-1;i>=0;i--){
      const b = bullets[i];
      b.x += b.vx*dt; b.y += b.vy*dt; b.life -= dt; b.spin = (b.spin||0) + dt*22;
      if (b.life <= 0){ bullets.splice(i,1); continue; }
      // full-screen range: a round keeps flying (left/right/up/down alike) until it leaves the visible screen
      if (camInit && (b.x < camera.x - BULLET_CULL_MARGIN || b.x > camera.x + VW + BULLET_CULL_MARGIN ||
                      b.y < camera.y - BULLET_CULL_MARGIN || b.y > camera.y + VH + BULLET_CULL_MARGIN)){
        bullets.splice(i,1); continue;
      }
      let consumed = false;

      // Diamond arrow vs tornado — exactly 3 arrow hits destroy it (breaker phase)
